<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4컷 그림 팝업 뷰어</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .modal-backdrop {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    /* 말풍선 말꼬리 스타일 */
    .bubble-tail-bottom-left::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 24px;
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid white;
    }
    .bubble-tail-bottom-left::before {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 23px;
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-top: 12px solid #334155;
    }
    .bubble-tail-bottom-right::after {
      content: '';
      position: absolute;
      bottom: -9px;
      right: 24px;
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid white;
    }
    .bubble-tail-bottom-right::before {
      content: '';
      position: absolute;
      bottom: -12px;
      right: 23px;
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-top: 12px solid #334155;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- 헤더 영역 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500 text-white flex items-center justify-center font-bold text-xl shadow-sm">
          🎨
        </div>
        <div>
          <h1 class="text-xl font-extrabold text-slate-800 tracking-tight">상황별 대화 그림 뷰어</h1>

        </div>
      </div>

          <span>💬</span>
          <span id="allBubblesBtnText">모든 말풍선 숨기기</span>
        </button>

        <!-- 전체 4컷 이미지 불러오기 -->
        <label for="imageUploadInput" class="cursor-pointer inline-flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold px-3.5 py-2 rounded-xl transition-colors border border-slate-200">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>

        </label>
        <input type="file" id="imageUploadInput" accept="image/*" class="hidden">
      </div>
    </div>
  </header>

    <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-3xl p-5 mb-8 shadow-sm">
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-amber-500 text-white flex items-center justify-center text-2xl shadow">
            💬
          </div>
          <div>
            <h2 class="text-base font-bold text-slate-800">그림 속 말풍선 대사 & 개별 제어</h2>
            <p class="text-xs text-slate-600 mt-0.5">
              각 그림 안쪽에 말풍선이 들어가 있습니다. <strong>'💬 말풍선'</strong> 버튼으로 말풍선을 없앴다가 다시 나타나게 할 수 있으며, <strong>내 그림으로 교체해도 말풍선 기능은 그대로 유지</strong>됩니다.
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- 4개 그림 그리드 (2 x 2 배치) -->

    </div>
  </main>

        </div>

        <!-- 이전 버튼 -->
        <button id="modalPrevBtn" class="absolute left-3 sm:left-5 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/90 hover:bg-white text-slate-800 shadow-lg flex items-center justify-center transition-all transform hover:scale-105 active:scale-95 focus:outline-none z-20" aria-label="이전 그림">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>

        <!-- 다음 버튼 -->

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>

        <div class="flex items-center gap-2 text-xs text-slate-500">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
          <span>상단 <strong>'말풍선 끄기/켜기'</strong> 버튼으로 그림 속 대사를 토글할 수 있습니다.</span>

        <div class="flex items-center gap-2 shrink-0">

            </svg>
            <span>소리로 듣기</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- 토스트 알림창 -->

    알림 메시지

    function showToast(msg) {
      toastMessage.innerText = msg;
      toastMessage.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toastMessage.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    // 줄바꿈이 적용된 말풍선 HTML 태그 생성 함수
    function createBubbleHtml(panel, isVisible, isModal = false) {
      const formattedText = panel.dialogue.replace(/\n/g, '<br>');
      const alignClass = panel.bubbleAlign === 'right' ? 'self-end' : 'self-start';
      const textSizeClass = isModal ? 'text-sm sm:text-base' : 'text-xs sm:text-sm';
      const maxWidthClass = isModal ? 'max-w-[85%]' : 'max-w-[88%]';

      return `
        <div class="speech-bubble-overlay absolute top-3 sm:top-4 inset-x-3 sm:inset-x-4 z-20 flex flex-col pointer-events-none transition-all duration-300 ${isVisible ? 'opacity-100 scale-100' : 'opacity-0 scale-95 pointer-events-none'}">
          <div class="${alignClass} ${maxWidthClass} relative bg-white/95 backdrop-blur border-2 border-slate-700 rounded-2xl px-3.5 py-2.5 shadow-xl ${panel.tailPosition}">
            <p class="${textSizeClass} font-bold text-slate-800 leading-snug break-keep">
              ${formattedText}
            </p>
          </div>
        </div>
      `;
    }

    // 각 번호에 파일 적용 함수
    function assignImageToPanel(idx, file) {
      if (!file || !file.type.startsWith('image/')) {
        showToast('이미지 파일만 업로드할 수 있습니다.');
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        customCroppedImages[idx] = e.target.result;
        renderCards();
        if (!imageModal.classList.contains('hidden') && currentIndex === idx) {
          updateModalContent();
        }
        showToast(`${idx + 1}번 그림에 새 이미지가 적용되었습니다! (말풍선 유지됨)`);
      };
      reader.readAsDataURL(file);
    }

    // 특정 카드의 말풍선 토글 함수
    function toggleBubble(idx) {
      bubbleVisibility[idx] = !bubbleVisibility[idx];
      renderCards();
      if (!imageModal.classList.contains('hidden') && currentIndex === idx) {
        updateModalContent();
      }
      showToast(`${idx + 1}번 말풍선이 ${bubbleVisibility[idx] ? '표시' : '숨김'} 처리되었습니다.`);
    }

    // 전체 말풍선 일괄 토글
    function toggleAllBubbles() {
      const anyVisible = bubbleVisibility.some(v => v);
      const targetState = !anyVisible; // 하나라도 켜져 있으면 모두 끔, 모두 꺼져있으면 모두 켬
      bubbleVisibility = bubbleVisibility.map(() => targetState);
      
      allBubblesBtnText.innerText = targetState ? '모든 말풍선 숨기기' : '모든 말풍선 보이기';
      renderCards();
      if (!imageModal.classList.contains('hidden')) {
        updateModalContent();
      }
      showToast(targetState ? '모든 말풍선을 켰습니다.' : '모든 말풍선을 숨겼습니다.');
    }

    // 메인 그리드 카드 렌더링
    function renderCards() {
      cardContainer.innerHTML = '';

      comicPanels.forEach((panel, idx) => {
        const isBubbleOn = bubbleVisibility[idx];
        const card = document.createElement('div');
        card.className = 'group bg-white rounded-3xl border border-slate-200 shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col relative';

        // 배경 비주얼 (사용자 이미지 또는 기본 그래픽)
        const backgroundVisual = customCroppedImages[idx]
          ? `<div class="relative w-full h-full bg-slate-900/5 flex items-center justify-center p-2 overflow-hidden">
               <img src="${customCroppedImages[idx]}" alt="${panel.title}" class="max-w-full max-h-full object-contain drop-shadow-sm group-hover:scale-105 transition-transform duration-300">
             </div>`
          : panel.renderBackground();

        card.innerHTML = `
          <!-- 상단 그림 영역 (안에 말풍선 오버레이 탑재) -->
          <div class="h-64 sm:h-72 w-full p-3 bg-slate-50 border-b border-slate-100 flex items-center justify-center relative select-none">
            <div class="w-full h-full rounded-2xl overflow-hidden shadow-sm relative thumbnail-trigger cursor-pointer">
              <!-- 그림 본체 -->
              ${backgroundVisual}

              <!-- 그림 속 말풍선 (토글 가능) -->
              ${createBubbleHtml(panel, isBubbleOn, false)}

              <!-- 우하단 번호 배지 -->
              <span class="absolute bottom-3 right-3 w-8 h-8 rounded-full bg-emerald-600 text-white font-black flex items-center justify-center text-sm shadow z-20 pointer-events-none">
                ${panel.id}
              </span>

              <!-- 돋보기 오버레이 -->
              <div class="absolute inset-0 bg-slate-900/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center z-10">
                <div class="bg-white/95 text-slate-800 px-4 py-2 rounded-full font-bold text-xs shadow-xl flex items-center gap-2 transform translate-y-2 group-hover:translate-y-0 transition-transform">
                  <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"></path>
                  </svg>
                  <span>클릭하여 확대</span>
                </div>
              </div>
            </div>
          </div>

          <!-- 하단 컨트롤 영역 -->
          <div class="p-4 sm:p-5 flex items-center justify-between gap-3 bg-white">
            <div class="thumbnail-trigger cursor-pointer flex-1">
              <div class="flex items-center gap-2">
                <span class="w-6 h-6 rounded-full bg-emerald-600 text-white text-xs font-bold flex items-center justify-center">
                  ${panel.id}
                </span>
                <span class="font-bold text-slate-800 text-base group-hover:text-amber-600 transition-colors">
                  ${panel.title}
                </span>
              </div>
              <p class="text-xs text-slate-500 mt-0.5 line-clamp-1">${panel.speaker}</p>
            </div>

            <!-- 버튼 모음: [말풍선 끄기/켜기], [파일 넣기], [확대] -->
            <div class="flex items-center gap-1.5 shrink-0">
              <!-- 말풍선 토글 버튼 -->
              <button class="toggle-bubble-btn px-2.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1 border ${
                isBubbleOn 
                  ? 'bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-300' 
                  : 'bg-slate-100 hover:bg-slate-200 text-slate-500 border-slate-200'
              }">
                <span>💬</span>
                <span>${isBubbleOn ? '말풍선 숨기기' : '말풍선 보이기'}</span>
              </button>

              <!-- 개별 파일 넣기 -->
              <label for="fileInput_${idx}" class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 p-2 rounded-xl text-xs font-bold transition-all border border-slate-200" title="${panel.id}번에 내 그림 넣기">
                <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
              </label>
              <input type="file" id="fileInput_${idx}" accept="image/*" class="hidden">

              <!-- 확대 버튼 -->
              <button class="thumbnail-trigger bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded-xl text-xs font-bold transition-colors shadow-sm" title="크게 보기">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
              </button>
            </div>
          </div>
        `;

        // 확대 모달 열기 이벤트
        card.querySelectorAll('.thumbnail-trigger').forEach(el => {
          el.addEventListener('click', () => openModal(idx));
        });

        // 말풍선 토글 버튼 이벤트
        const toggleBtn = card.querySelector('.toggle-bubble-btn');
        toggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleBubble(idx);
        });

        // 파일 인풋 체인지 이벤트
        const fileInput = card.querySelector(`#fileInput_${idx}`);
        fileInput.addEventListener('change', (e) => {
          if (e.target.files && e.target.files[0]) {
            assignImageToPanel(idx, e.target.files[0]);
          }
        });

        // 카드 드래그 앤 드롭 지원
        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          card.classList.add('ring-4', 'ring-amber-400');
        });
        card.addEventListener('dragleave', () => {
          card.classList.remove('ring-4', 'ring-amber-400');
        });
        card.addEventListener('drop', (e) => {
          e.preventDefault();
          card.classList.remove('ring-4', 'ring-amber-400');
          if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            assignImageToPanel(idx, e.dataTransfer.files[0]);
          }
        });

        cardContainer.appendChild(card);
      });
    }

    // 모달 팝업 열기
    function openModal(index) {
      currentIndex = index;
      updateModalContent();
      imageModal.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
    }

    // 모달 팝업 닫기
    function closeModal() {
      imageModal.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
    }

    // 모달 내부 컨텐츠 갱신
    function updateModalContent() {
      const panel = comicPanels[currentIndex];
      const isBubbleOn = bubbleVisibility[currentIndex];

      modalNumberBadge.innerText = panel.id;
      modalTitle.innerText = panel.title;
      modalSpeaker.innerText = panel.speaker;

      // 모달 상단 토글 버튼 텍스트 변경
      modalToggleBubbleText.innerText = isBubbleOn ? '말풍선 끄기' : '말풍선 켜기';

      // 큰 이미지 및 말풍선 렌더링
      const backgroundVisual = customCroppedImages[currentIndex]
        ? `<img src="${customCroppedImages[currentIndex]}" alt="${panel.title}" class="max-w-full max-h-[55vh] object-contain rounded-2xl shadow-xl border border-slate-200 bg-white">`
        : `<div class="w-full h-full max-w-md aspect-[4/3] rounded-2xl overflow-hidden shadow-md">${panel.renderBackground()}</div>`;

      modalImageContainer.innerHTML = `
        <div class="relative w-full h-full flex items-center justify-center">
          ${backgroundVisual}
          ${createBubbleHtml(panel, isBubbleOn, true)}
        </div>
      `;
    }

    // 팝업 내부 말풍선 토글 버튼 이벤트
    modalToggleBubbleBtn.addEventListener('click', () => {
      toggleBubble(currentIndex);
    });

    // 이전/다음 버튼
    function showPrevPanel() {
      currentIndex = (currentIndex - 1 + comicPanels.length) % comicPanels.length;
      updateModalContent();
    }
    function showNextPanel() {
      currentIndex = (currentIndex + 1) % comicPanels.length;
      updateModalContent();
    }

    // 팝업 내에서 그림 즉시 교체
    modalSingleFileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        assignImageToPanel(currentIndex, e.target.files[0]);
      }
    });

    // TTS 음성 읽기
    function playSpeech() {
      if (!('speechSynthesis' in window)) {
        showToast('이 브라우저는 음성 읽기를 지원하지 않습니다.');
        return;
      }
      window.speechSynthesis.cancel();
      const textToRead = comicPanels[currentIndex].dialogue;
      const utterance = new SpeechSynthesisUtterance(textToRead);
      utterance.lang = 'ko-KR';
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    // 2x2 분할 슬라이서 (상단 4컷 원본 업로드용)
    function processImageSource(imgSrc) {
      const img = new Image();
      img.onload = function() {
        const w = img.width;
        const h = img.height;
        const halfW = w / 2;
        const halfH = h / 2;

        const quadrants = [
          { x: 0, y: 0, w: halfW, h: halfH },
          { x: halfW, y: 0, w: halfW, h: halfH },
          { x: 0, y: halfH, w: halfW, h: halfH },
          { x: halfW, y: halfH, w: halfW, h: halfH }
        ];

        quadrants.forEach((q, i) => {
          const canvas = document.createElement('canvas');
          canvas.width = q.w;
          canvas.height = q.h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, q.x, q.y, q.w, q.h, 0, 0, q.w, q.h);
          customCroppedImages[i] = canvas.toDataURL('image/png');
        });

        renderCards();
        showToast('4컷 그림이 분할되어 적용되었습니다. (말풍선 유지됨)');
      };
      img.src = imgSrc;
    }

    imageUploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => processImageSource(event.target.result);
      reader.readAsDataURL(file);
    });

    // 로컬 국어남자.png 파일 우선 감지
    function tryLoadDefaultImages() {
      const p1Candidates = ['국어남자.png', '하늘.png'];
      p1Candidates.forEach((path) => {
        const testImg = new Image();
        testImg.onload = function() {
          customCroppedImages[0] = path;
          renderCards();
        };
        testImg.src = path;
      });
    }

    // 이벤트 리스너 연결
    toggleAllBubblesBtn.addEventListener('click', toggleAllBubbles);
    modalCloseBtn.addEventListener('click', closeModal);
    modalPrevBtn.addEventListener('click', showPrevPanel);
    modalNextBtn.addEventListener('click', showNextPanel);
    ttsButton.addEventListener('click', playSpeech);

    imageModal.addEventListener('click', (e) => {
      if (e.target === imageModal) closeModal();
    });

    window.addEventListener('keydown', (e) => {
      if (imageModal.classList.contains('hidden')) return;
      if (e.key === 'Escape') closeModal();
      else if (e.key === 'ArrowLeft') showPrevPanel();
      else if (e.key === 'ArrowRight') showNextPanel();
    });

    // 초기 실행
    renderCards();
    tryLoadDefaultImages();
  </script>
</body>
</html>
