<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>편경 소리 · 노랫말 바꾸기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f4f6;color:#252125;font-family:Arial,'Malgun Gothic',sans-serif}.sheet{max-width:900px;margin:24px auto;background:white;padding:32px;border-radius:16px}h1{font-size:24px;margin:0 0 12px}.intro{margin:0 0 24px;line-height:1.6}.pair{display:grid;grid-template-columns:85px 1fr;margin:12px 0 18px;align-items:center}.label{font-size:14px;text-align:center}.line{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));border:2px solid #333;min-height:48px}.original{background:#f1dfe5;border-bottom:0}.cell{min-width:0;display:flex;align-items:center;justify-content:center;border-right:1px dashed #aaa;font-size:29px;font-weight:600}.cell:nth-child(3n){border-right:2px solid #333}.cell:last-child{border-right:0}.changed .cell{padding:0}input{width:100%;height:46px;border:0;background:transparent;text-align:center;font:inherit;font-weight:400;outline:0;border-radius:0}input:focus{background:#fff3c8;box-shadow:inset 0 0 0 2px #ba842a}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}button{border:0;border-radius:8px;padding:12px 18px;font-size:16px;cursor:pointer;background:#68435a;color:white}button.secondary{background:#eee7eb;color:#332b30}.status{font-size:13px;color:#70636c;align-self:center}.footer{font-size:13px;color:#756974}@media(max-width:600px){.sheet{margin:0;padding:20px 10px;border-radius:0}h1{font-size:20px}.pair{grid-template-columns:58px 1fr}.label{font-size:12px}.cell{font-size:22px}.line{min-height:40px}input{height:38px}}@media print{@page{size:A4;margin:15mm}body{background:white}.sheet{padding:0;margin:0;border-radius:0;max-width:none}.toolbar,.footer{display:none}.pair{break-inside:avoid;margin-bottom:14px}.original{print-color-adjust:exact;-webkit-print-color-adjust:exact}input{height:40px}.line{min-height:42px}.cell{font-size:25px}}
</style></head><body><main class="sheet"><h1>◉ 전래동요 ‘편경 소리’를 듣고 노랫말을 바꿔 봅시다.</h1><p class="intro">‘바꾼 가사’ 칸에 새로운 노랫말을 한 글자씩 써 보세요.</p><div class="toolbar"><button class="secondary" id="clear">다시 쓰기</button><span class="status" id="status" aria-live="polite"></span></div><section id="lyrics" aria-label="노랫말 바꾸기 활동지"></section><p class="footer">입력한 가사는 이 브라우저에 자동으로 저장됩니다.</p></main><script>
const lines=[['편','','경','소','리','','들','어','','봐','',''],['디','','리','디','리','','동','','','동','',''],['편','','경','소','리','','찾','아','','봐','',''],['디','','리','디','리','','동','','','동','',''],['편','','경','소','리','','내','볼','','까','',''],['디','','리','디','리','','동','','','동','',''],['딩','','','딩','','','울','려','','라','',''],['동','','','동','','','울','려','','라','','']];
const key='pyeongyeong-lyrics-v1';let saved=[];try{saved=JSON.parse(localStorage.getItem(key)||'[]')}catch{}const container=document.getElementById('lyrics');
lines.forEach((row,r)=>{const pair=document.createElement('div');pair.className='pair';const label=document.createElement('div');label.className='label';label.textContent='원래 가사';pair.append(label);const original=document.createElement('div');original.className='line original';row.forEach(letter=>{const cell=document.createElement('div');cell.className='cell';cell.textContent=letter;original.append(cell)});pair.append(original);const label2=document.createElement('div');label2.className='label';label2.textContent='바꾼 가사';pair.append(label2);const changed=document.createElement('div');changed.className='line changed';row.forEach((_,c)=>{const cell=document.createElement('div');cell.className='cell';const input=document.createElement('input');input.type='text';input.maxLength=1;input.autocomplete='off';input.setAttribute('aria-label',`${r+1}번째 줄 ${c+1}번째 칸`);const fixed=(r===0||r===2||r===4||(r>=6&&c>=6));input.value=fixed?row[c]:(typeof saved[r*12+c]==='string'?saved[r*12+c]:'');input.addEventListener('input',save);cell.append(input);changed.append(cell)});pair.append(changed);container.append(pair)});
function values(){return Array.from(container.querySelectorAll('input'),x=>x.value)}function save(){try{localStorage.setItem(key,JSON.stringify(values()));document.getElementById('status').textContent='자동 저장됨'}catch{document.getElementById('status').textContent='자동 저장을 사용할 수 없습니다.'}}
document.getElementById('clear').onclick=()=>{if(!confirm('입력한 가사를 모두 지울까요?'))return;container.querySelectorAll('input').forEach((x,i)=>{const r=Math.floor(i/12),c=i%12;x.value=(r===0||r===2||r===4||(r>=6&&c>=6))?lines[r][c]:''});save()};
</script></body></html>
