let score=BACKUP_SCORE,role=0,mode='solo',bpm=100,playing=false,timer=null,step=0,ctx=null;
const $=id=>document.getElementById(id);
const spm=()=>score.stepsPerMeasure; const total=()=>score.stepsPerMeasure*score.numMeasures;
function bounds(){let v=$('range').value;if(v==='all')return [0,total()];let n=Number(v);return [n*spm(),(n+1)*spm()];}
function buttons(){ $('roles').innerHTML=Array.from({length:5},(_,i)=>`<button data-role="${i}" class="${i===role?'active':''}">${i+1}번 연주자</button>`).join('');document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=+b.dataset.role;buttons();draw()});document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('mode-help').textContent=mode==='solo'?'내 역할 소리만 들으며 리듬을 익혀요.':mode==='backing'?'다른 네 명의 소리를 들으며 내 역할은 직접 연주해요.':'다섯 명의 소리를 모두 들으며 합주해요.';}
function draw(){let [start,end]=bounds(),measure=Math.floor(step/spm());if($('range').value==='all'){start=measure*spm();end=Math.min(start+spm(),total())}let html='';for(let p=0;p<5;p++){html+=`<div class="bar"><div class="name ${p===role?'chosen':''}">${p+1}번 ${p===role?'★':''}</div>`;for(let s=start;s<end;s++){let n=score.grid[p][s]||0;html+=`<div id="cell-${p}-${s}" class="cell ${n?'hit':'rest'} ${p===role?'own':''} ${playing&&s===step?'now':''}" title="${s%spm()+1}번째 칸">${icons[n]||'–'}</div>`}html+='</div>'}$('sheet').innerHTML=html;$('measure-title').textContent=`⑤ 악보 · ${Math.floor(step/spm())+1} / ${score.numMeasures}마디`;$('status').textContent=playing?`연주 중 · ${Math.floor(step/spm())+1}마디, ${step%spm()+1}번째 칸`:`준비 완료 · 총 ${score.numMeasures}마디`}
function tone(n){if(!n)return;if(!ctx)return;let now=ctx.currentTime,osc=ctx.createOscillator(),gain=ctx.createGain();let freqs=[0,900,280,110,650,470,350,220,1500,120,1850,3100];osc.type=n===3||n===7?'triangle':'sine';osc.frequency.setValueAtTime(freqs[n]||440,now);osc.frequency.exponentialRampToValueAtTime(Math.max(60,(freqs[n]||440)*.65),now+.07);gain.gain.setValueAtTime(.001,now);gain.gain.exponentialRampToValueAtTime(.10,now+.005);gain.gain.exponentialRampToValueAtTime(.001,now+.105);osc.connect(gain).connect(ctx.destination);osc.start(now);osc.stop(now+.12)}

function stop(){playing=false;clearInterval(timer);timer=null;$('play').textContent='▶ 연주 시작';draw()}
function start(){if(playing){stop();return}if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();playing=true;$('play').textContent='⏸ 일시 정지';let [a,b]=bounds();if(step<a||step>=b)step=a;tick();if(playing)timer=setInterval(tick,60000/bpm/3)}
function updateRange(){let [a]=bounds();step=a;draw()}
function setup(s){if(!s||!Array.isArray(s.grid)||s.grid.length!==5||!Number.isInteger(s.stepsPerMeasure)||!Number.isInteger(s.numMeasures)||s.grid.some(row=>!Array.isArray(row)||row.length<s.stepsPerMeasure*s.numMeasures))throw Error('악보 형식 오류');stop();score=s;bpm=Number(s.bpm)||100;$('bpm').value=bpm;$('bpm-label').textContent=bpm;$('range').innerHTML='<option value="all">전체 악보</option>'+Array.from({length:s.numMeasures},(_,i)=>`<option value="${i}">${i+1}마디만 반복</option>`).join('');step=0;draw()}
