<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>곱셈표 만들기 & 비밀키워드</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter, Jua, Noto Sans KR, Gowun Dodum -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Noto+Sans+KR:wght@400;600;700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .font-jua {
      font-family: 'Jua', sans-serif;
    }
    
    /* 표 디자인 토큰 */
    .header-col-bg { background-color: #93b5e8; color: #1e293b; }
    .header-row-bg { background-color: #fef08a; color: #1e293b; }
    .diagonal-bg { background-color: #ffffff; }
    .upper-triangle-bg { background-color: #e0ecfb; }
    .lower-triangle-bg { background-color: #fef9c3; }

    /* 숫자 입력창 화살표(스피너) 제거 */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    /* 4단계 구슬 입체 구체 그라디언트 */
    .bead-sphere {
      background: radial-gradient(circle at 32% 32%, #f5d0fe 0%, #d8b4fe 25%, #a855f7 65%, #6b21a8 100%);
      box-shadow: inset 0 2px 3px rgba(255,255,255,0.7), 0 3px 5px rgba(0,0,0,0.25);
    }

    .smooth-transition {
      transition: all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes modalPop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-modal {
      animation: modalPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes softFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.03); }
    }
    .animate-float {
      animation: softFloat 2.4s infinite ease-in-out;
    }

    /* 상장 인쇄용 스타일 */
    @media print {
      body * {
        visibility: hidden;
      }
      #certificate-print-area, #certificate-print-area * {
        visibility: visible;
      }
      #certificate-print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 30px;
        box-shadow: none;
        border: 6px double #d97706;
      }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-sky-50 to-purple-50 min-h-screen text-slate-800 flex flex-col items-center justify-between p-2 sm:p-5 relative overflow-x-hidden">

      ],

      ],

      ],

        { pre: "9단의 답은 (", blank: "9", post: ")씩 커진다." },

    // 3단계 상태 (대칭 짝꿍 찾기)
    let p3TargetR = 4;

    // 4단계 상태 (구슬 교환법칙 모핑)
    let p4NumA = 2;
    let p4NumB = 6;
    let p4Phase = 1;
    let isAnimatingP4 = false;

    // 5단계 상태 (수수께끼)
    let p5CurrentRiddle = null;

    // 6단계 (60초 스피드 챌린지) 상태
    let p6Questions = [];
    let p6IsStarted = false;
    let p6TimerId = null;
    let p6StartTime = 0;
    let p6ElapsedTime = 0;
    let p6IsFinished = false;

    let audioCtx = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    window.addEventListener('pointerdown', () => {
      if (!audioCtx && !isMuted) {
        try { initAudio(); } catch (e) {}
      }
    }, { once: true });

    function toggleSound() {
      isMuted = !isMuted;
      const icon = document.getElementById('sound-icon');
      const label = document.getElementById('sound-label');
      if (isMuted) {
        icon.innerText = '🔇';
        label.innerText = '음소거';
      } else {
        icon.innerText = '🔊';
        label.innerText = '효과음';
        initAudio();
        playSound('correct');
      }
    }

    function playSound(type) {
      if (isMuted) return;
      try {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        if (type === 'correct') {
          const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const st = now + idx * 0.08;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, st);
            gain.gain.setValueAtTime(0.18, st);
            gain.gain.exponentialRampToValueAtTime(0.0001, st + 0.35);
            osc.start(st);
            osc.stop(st + 0.35);
          });
        } else if (type === 'wrong') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(230, now);
          osc.frequency.setValueAtTime(160, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          osc.start(now);
          osc.stop(now + 0.32);
        } else if (type === 'fanfare') {
          const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const st = now + idx * 0.09;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, st);
            gain.gain.setValueAtTime(0.22, st);
            gain.gain.exponentialRampToValueAtTime(0.0001, st + 0.4);
            osc.start(st);
            osc.stop(st + 0.4);
          });
        }
      } catch (e) {
        console.warn('Audio not available:', e);
      }
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#0284c7', '#38bdf8', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6'];

      for (let i = 0; i < 90; i++) {
        particles.push({
          x: canvas.width * 0.5,
          y: canvas.height * 0.35,
          r: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.75) * 16,
          alpha: 1,
          decay: Math.random() * 0.015 + 0.01
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach(p => {
          if (p.alpha > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.38;
            p.alpha -= p.decay;
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        });
        if (active) {
          requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      render();
    }

    function showNoticeModal(message) {
      const modal = document.getElementById('notice-modal');
      const msgEl = document.getElementById('notice-modal-msg');
      if (modal && msgEl) {
        msgEl.innerText = message;
        modal.classList.remove('hidden');
      }
    }

    function closeNoticeModal() {
      const modal = document.getElementById('notice-modal');
      if (modal) modal.classList.add('hidden');
    }

    function openSuccessModal({ title, badge, desc, nextPageNum }) {
      const modal = document.getElementById('success-modal');
      const titleEl = document.getElementById('modal-title');
      const badgeEl = document.getElementById('modal-badge-label');
      const descEl = document.getElementById('modal-desc');
      const nextBtn = document.getElementById('modal-next-btn');

      if (titleEl) titleEl.innerText = title;
      if (badgeEl) badgeEl.innerText = badge;
      if (descEl) descEl.innerText = desc;
      nextTargetPage = nextPageNum;

      if (nextBtn) {
        if (nextTargetPage === 0) {
          nextBtn.innerHTML = '<span>처음 화면으로 돌아가기 🏠</span>';
        } else if (nextTargetPage === 7) {
          nextBtn.innerHTML = '<span>비밀 키워드 열러 가기! 🎁</span>';
        } else {
          nextBtn.innerHTML = `<span>다음 단계로 출발! 🚀</span>`;
        }
      }

      if (modal) modal.classList.remove('hidden');
    }

    function handleModalNextStep() {
      closeModal();
      if (nextTargetPage >= 0) {
        switchPage(nextTargetPage);
      }
    }

    function closeModal() {
      const modal = document.getElementById('success-modal');
      if (modal) modal.classList.add('hidden');
    }

    function registerStudent(name) {
      const trimmed = name ? name.trim() : '';
      if (!trimmed) {
        showNoticeModal('🔒 이름을 입력하거나 명단에서 선택해 주세요!\n이름을 등록해야 다음 단계로 나아갈 수 있습니다.');
        return false;
      }

      const prevStudent = currentStudent;
      currentStudent = trimmed;
      studentTargetSentence = STUDENT_DB[trimmed] || '너는최고야멋져';

      if (prevStudent !== currentStudent) {
        unlockedLetters = {};
      }

      const badge = document.getElementById('header-student-badge');
      const sName = document.getElementById('header-student-name');
      if (badge && sName) {
        badge.classList.remove('hidden');
        sName.innerText = currentStudent;
      }
      updateHeaderLettersTracker();
      return true;
    }

    function awardKeywordLetter(stepNum) {
      if (!currentStudent) {
        currentStudent = '친구';
        studentTargetSentence = '너는최고야멋져';
      }
      const charIndex = stepNum - 1;
      const letter = studentTargetSentence.charAt(charIndex) || '★';
      unlockedLetters[stepNum] = letter;
      updateHeaderLettersTracker();
      return letter;
    }

    function updateHeaderLettersTracker() {
      const countEl = document.getElementById('header-letters-count');
      const count = Object.keys(unlockedLetters).length;
      if (countEl) countEl.innerText = `(${count}/6)`;
    }

    function switchPage(page) {
      if (page > 0 && !currentStudent) {
        showNoticeModal('🔒 이름을 먼저 등록해야 다음 단계로 나아갈 수 있어요!\n표지에서 이름을 입력하거나 명단에서 선택해 주세요.');
        if (currentPage !== 0) {
          switchPage(0);
        } else {
          const inp = document.getElementById('cover-student-input');
          if (inp) inp.focus();
        }
        return;
      }

      if (currentPage === 6 && p6TimerId) {
        clearInterval(p6TimerId);
        p6TimerId = null;
      }

      currentPage = page;

      // 탭 활성화 UI 갱신
      for (let i = 0; i <= 7; i++) {
        const tab = document.getElementById(`tab-${i}`);
        if (tab) {
          if (i === page) {
            tab.className = (i === 6)
              ? 'py-2 px-1 rounded-xl bg-rose-600 text-white shadow-xs font-bold border-2 border-rose-700 cursor-pointer'
              : (i === 7)
              ? 'py-2 px-1 rounded-xl bg-amber-500 text-white shadow-xs font-bold border-2 border-amber-600 cursor-pointer'
              : 'py-2 px-1 rounded-xl bg-indigo-600 text-white shadow-xs font-bold border-2 border-indigo-700 cursor-pointer';
          } else {
            tab.className = (i === 6)
              ? 'py-2 px-1 rounded-xl bg-slate-100 hover:bg-slate-200 text-rose-600 font-bold border-2 border-transparent cursor-pointer'
              : (i === 7)
              ? 'py-2 px-1 rounded-xl bg-slate-100 hover:bg-slate-200 text-amber-600 font-bold border-2 border-transparent cursor-pointer'
              : 'py-2 px-1 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium border-2 border-transparent cursor-pointer';
          }
        }
      }

      const indicator = document.getElementById('page-indicator');
      if (indicator) indicator.innerText = `${page + 1} / 8 단계`;

      const prevBtn = document.getElementById('prev-step-btn');
      const nextBtn = document.getElementById('next-step-btn');
      if (prevBtn) prevBtn.disabled = (page === 0);
      if (nextBtn) nextBtn.disabled = (page === 7);

      if (page === 0) renderCoverPage();
      else if (page === 1) renderPage1View();
      else if (page === 2) renderPage2View();
      else if (page === 3) renderPage3View();
      else if (page === 4) renderPage4View();
      else if (page === 5) renderPage5View();
      else if (page === 6) renderPage6View();
      else if (page === 7) renderPage7View();
    }

    function goPrevPage() {
      if (currentPage > 0) switchPage(currentPage - 1);
    }

    function goNextPage() {
      if (currentPage === 0 && !currentStudent) {
        const inp = document.getElementById('cover-student-input');
        const name = inp ? inp.value.trim() : '';
        if (!name) {
          showNoticeModal('🔒 이름을 먼저 등록해야 다음 단계로 나아갈 수 있어요!\n표지에서 이름을 입력하거나 명단에서 선택해 주세요.');
          if (inp) inp.focus();
          return;
        }
        registerStudent(name);
      }
      if (currentPage < 7) switchPage(currentPage + 1);
    }

    function renderCoverPage() {
      const container = document.getElementById('page-content');
      if (!container) return;

      const studentOptions = Object.keys(STUDENT_DB).map(name => `
        <option value="${name}" ${currentStudent === name ? 'selected' : ''}>${name}</option>
      `).join('');

      const slotsHtml = [1, 2, 3, 4, 5, 6].map(num => {
        const letter = unlockedLetters[num];
        if (letter) {
          return `
            <div class="flex flex-col items-center">
              <span class="text-[10px] text-amber-700 font-bold mb-0.5">${num}단계</span>
              <div class="w-10 h-12 sm:w-12 sm:h-14 rounded-xl bg-gradient-to-b from-amber-200 to-amber-300 border-2 border-amber-400 text-amber-950 font-jua text-xl sm:text-2xl flex items-center justify-center font-bold shadow-xs">
                ${letter}
              </div>
            </div>
          `;

        return `

            <span class="text-[10px] text-slate-400 font-medium mb-0.5">${num}단계</span>
            <div class="w-10 h-12 sm:w-12 sm:h-14 rounded-xl bg-slate-100 border-2 border-slate-200 text-slate-400 font-jua text-sm sm:text-base flex items-center justify-center font-bold shadow-inner">
              ${num}
            </div>

      container.innerHTML = `

            <span>✨</span> <span>초등 수학 · 곱셈표 인터랙티브 마스터 챌린지</span>
          </div>
          
          <h2 class="font-jua text-3xl sm:text-5xl text-slate-900 tracking-tight mb-2 drop-shadow-xs">
            곱셈표 만들기 & 비밀키워드
          </h2>
          
          <p class="font-jua text-slate-700 text-base sm:text-xl mb-4 font-medium">
            각 단계마다 5번 연속 성공하고 6개의 비밀 글자를 모아 보물 키워드를 완성하세요! 🚀
          </p>

          <!-- 학생 이름 등록 카드 -->
          <div class="w-full bg-white rounded-3xl p-5 border-2 border-indigo-400 shadow-sm mb-4 flex flex-col items-center">
            <div class="font-jua text-slate-800 text-base sm:text-lg mb-3 flex items-center gap-2 font-bold">
              <span>👤</span> <span>학생의 이름을 입력하거나 선택해 주세요 (필수):</span>
            </div>
            
            <div class="w-full max-w-md flex items-center gap-2 mb-2">
              <input 
                type="text" 
                id="cover-student-input" 
                value="${currentStudent}" 
                placeholder="이름 입력 (예: 김서아)" 
                class="flex-1 h-12 px-4 rounded-2xl border-2 border-indigo-400 focus:outline-none focus:ring-4 focus:ring-indigo-200 font-jua text-base sm:text-lg text-center bg-indigo-50/30 text-indigo-950 placeholder:text-slate-400"
              />
              <select 
                id="cover-student-select" 
                onchange="onSelectStudent(this.value)" 
                class="h-12 px-3 rounded-2xl border-2 border-slate-300 bg-slate-50 font-jua text-sm sm:text-base text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-300 cursor-pointer"
              >
                <option value="">명단에서 선택 ∨</option>
                ${studentOptions}
              </select>
            </div>
            <p class="font-jua text-xs sm:text-sm text-rose-600 font-bold">
              🔒 표지에 이름을 써야 다음 단계로 나아갈 수 있어요!
            </p>
          </div>

          <!-- 연속 5회 규칙 배너 -->
          <div class="inline-flex items-center justify-center flex-wrap gap-2 px-5 py-2.5 bg-rose-50 border-2 border-rose-200 text-rose-700 rounded-2xl font-jua text-xs sm:text-sm mb-4 shadow-2xs leading-relaxed">
            <span class="font-black text-sm sm:text-base">🚨 [도전 규칙]</span> 
            <span>1~5단계는 <b>연속으로 5번</b> 맞혀야 비밀 글자가 열려요! (틀리면 0개부터 다시 시작!)</span>
          </div>

          <!-- 6글자 슬롯 수집 현황 -->
          <div class="w-full bg-white rounded-2xl p-4 sm:p-5 border-2 border-indigo-300 shadow-xs flex flex-col items-center mb-5">
            <span class="text-xs sm:text-sm font-jua text-slate-600 font-bold mb-3">
              나의 6글자 키워드 수집 현황
            </span>
            <div class="flex items-center justify-center gap-2 sm:gap-3 flex-wrap">
              ${slotsHtml}
            </div>
          </div>

          <!-- 시작 버튼 -->
          <button onclick="handleStartFromCover()" class="py-3.5 px-10 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-jua text-xl sm:text-2xl rounded-2xl shadow-md hover:shadow-lg transition-all active:scale-95 flex items-center gap-2 cursor-pointer">
            <span>🚀 1단계 ◆ 식 맞히기 시작!</span>
          </button>
        </div>
      `;

      const inp = document.getElementById('cover-student-input');
      if (inp) {
        inp.addEventListener('keydown', e => {
          if (e.key === 'Enter') handleStartFromCover();
        });
      }
    }

    function onSelectStudent(val) {
      if (val) {
        const inp = document.getElementById('cover-student-input');
        if (inp) inp.value = val;
        registerStudent(val);
        renderCoverPage();
      }
    }

    function handleStartFromCover() {
      const inp = document.getElementById('cover-student-input');
      const name = inp ? inp.value.trim() : '';
      if (!name) {
        showNoticeModal('🔒 이름을 입력하거나 명단에서 선택해 주세요!\n이름을 등록해야 다음 단계로 나아갈 수 있습니다.');
        if (inp) inp.focus();
        return;
      }
      registerStudent(name);
      switchPage(1);
    }

    function renderPage1View() {
      const container = document.getElementById('page-content');
      if (!container) return;

      container.innerHTML = `
        <div class="w-full flex flex-col items-center">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 w-full max-w-[650px]">
            <div class="flex items-center gap-2">
              <span class="w-3.5 h-3.5 rounded-full bg-indigo-600"></span>
              <h2 class="text-lg sm:text-xl font-black text-indigo-950 font-jua">
                1단계 · ◆ 위치의 곱셈식을 완성하세요
              </h2>
            </div>
            <div class="flex items-center gap-2 flex-wrap">
              <button onclick="initPage1Question()" class="px-3 py-1.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-900 rounded-xl text-xs sm:text-sm font-black font-jua transition shadow-xs cursor-pointer flex items-center gap-1 active:scale-95">
                <span>🎲</span> <span>랜덤 문제</span>
              </button>
              <div class="flex items-center gap-2 bg-indigo-50 px-3.5 py-1.5 rounded-2xl border border-indigo-200">
                <span class="text-xs sm:text-sm font-jua text-slate-600 font-bold">⭐ 연속 성공:</span>
                <span id="p1-streak-stars" class="text-amber-500 font-bold tracking-widest text-base sm:text-lg">
                  ${'★'.repeat(p1Streak)}${'☆'.repeat(5 - p1Streak)}
                </span>
                <span class="text-xs sm:text-sm font-jua font-bold text-indigo-800">(${p1Streak}/5)</span>
              </div>
            </div>
          </div>

          <!-- 11x11 표 (◆ 표시) -->
          <div class="relative w-full max-w-[370px] sm:max-w-[500px] md:max-w-[580px] bg-white p-2 sm:p-4 rounded-3xl shadow-xl border-4 border-indigo-200">
            <svg class="absolute inset-0 w-full h-full pointer-events-none z-20" style="padding: inherit;">
              <line x1="9%" y1="9%" x2="100%" y2="100%" stroke="#16a34a" stroke-width="3" stroke-dasharray="6,6" stroke-linecap="round" />
            </svg>
            <div id="p1-grid-container" class="grid grid-cols-11 gap-1 w-full aspect-square relative z-10"></div>
          </div>

          <!-- 입력 카드 -->
          <div class="w-full max-w-[580px] mt-4 p-4 bg-white rounded-3xl shadow-lg border-2 border-indigo-200 flex flex-col items-center">
            <div class="flex items-center justify-center gap-2 sm:gap-3 flex-wrap">
              <div class="flex flex-col items-center">
                <input type="number" id="p1-input-r" inputmode="numeric" class="w-12 h-12 text-center text-xl font-black rounded-xl border-2 border-amber-300 bg-amber-50 focus:bg-white outline-none" placeholder="?">
              </div>
              <span class="text-2xl font-black text-slate-400 self-center">×</span>
              <div class="flex flex-col items-center">
                <input type="number" id="p1-input-c" inputmode="numeric" class="w-12 h-12 text-center text-xl font-black rounded-xl border-2 border-sky-300 bg-sky-50 focus:bg-white outline-none" placeholder="?">
              </div>
              <span class="text-2xl font-black text-slate-400 self-center">=</span>
              <div class="flex flex-col items-center">
                <input type="number" id="p1-input-ans" inputmode="numeric" class="w-16 h-12 text-center text-xl font-black rounded-xl border-2 border-indigo-300 bg-indigo-50 focus:bg-white outline-none" placeholder="?">
              </div>
              <button onclick="checkP1Answer()" class="self-center px-5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm rounded-xl shadow-md transition active:scale-95 cursor-pointer font-jua">
                정답 확인
              </button>
            </div>
            <div id="p1-feedback" class="mt-2 text-xs sm:text-sm font-black text-slate-500 text-center min-h-[20px]"></div>
          </div>
        </div>
      `;

      initPage1Question();
    }

    function initPage1Question() {
      // 10% 대각선 확률
      if (Math.random() < 0.1) {
        p1TargetR = Math.floor(Math.random() * 9) + 1;
        p1TargetC = p1TargetR;
      } else {
        p1TargetR = Math.floor(Math.random() * 9) + 1;
        p1TargetC = Math.floor(Math.random() * 9) + 1;
        while (p1TargetC === p1TargetR) {
          p1TargetC = Math.floor(Math.random() * 9) + 1;
        }
      }

      const inR = document.getElementById('p1-input-r');
      const inC = document.getElementById('p1-input-c');
      const inAns = document.getElementById('p1-input-ans');
      if (inR) inR.value = '';
      if (inC) inC.value = '';
      if (inAns) inAns.value = '';

      renderPage1Grid();
      setupP1AutoAdvance();
      setTimeout(() => { if (inR) inR.focus(); }, 100);
    }

    function renderPage1Grid() {
      const grid = document.getElementById('p1-grid-container');
      if (!grid) return;
      grid.innerHTML = '';

      grid.appendChild(createHeaderCell('×', 'rounded-tl-2xl bg-white border border-slate-300 font-black text-slate-700 text-base sm:text-xl flex items-center justify-center'));

      for (let c = 0; c <= 9; c++) {
        const cls = `header-col-bg font-black text-slate-800 text-sm sm:text-lg border border-slate-300 flex items-center justify-center ${c === 9 ? 'rounded-tr-2xl' : ''}`;
        grid.appendChild(createHeaderCell(c, cls));
      }

      for (let r = 0; r <= 9; r++) {
        const rowCls = `header-row-bg font-black text-slate-800 text-sm sm:text-lg border border-slate-300 flex items-center justify-center ${r === 9 ? 'rounded-bl-2xl' : ''}`;
        grid.appendChild(createHeaderCell(r, rowCls));

        for (let c = 0; c <= 9; c++) {
          const cell = document.createElement('div');
          const isCorner = (r === 9 && c === 9);
          cell.className = `w-full h-full border border-slate-200 flex items-center justify-center font-black ${isCorner ? 'rounded-br-2xl' : ''}`;

          if (r === c) cell.classList.add('diagonal-bg');
          else if (r < c) cell.classList.add('upper-triangle-bg');
          else cell.classList.add('lower-triangle-bg');

          if (r === p1TargetR && c === p1TargetC) {
            cell.innerHTML = `<span class="text-cyan-600 text-xl sm:text-2xl font-black animate-pulse drop-shadow">◆</span>`;
            cell.classList.add('ring-2', 'ring-cyan-500', 'bg-cyan-50');
          }
          grid.appendChild(cell);
        }
      }
    }

    function setupP1AutoAdvance() {
      const inR = document.getElementById('p1-input-r');
      const inC = document.getElementById('p1-input-c');
      const inAns = document.getElementById('p1-input-ans');
      if (inR && inC && inAns) {
        inR.oninput = () => { if (inR.value.length >= 1) inC.focus(); };
        inC.oninput = () => { if (inC.value.length >= 1) inAns.focus(); };
        inAns.onkeydown = (e) => { if (e.key === 'Enter') checkP1Answer(); };
      }
    }

    function checkP1Answer() {
      const inR = parseInt(document.getElementById('p1-input-r')?.value.trim(), 10);
      const inC = parseInt(document.getElementById('p1-input-c')?.value.trim(), 10);
      const inAns = parseInt(document.getElementById('p1-input-ans')?.value.trim(), 10);
      const feedback = document.getElementById('p1-feedback');

      if (isNaN(inR) || isNaN(inC) || isNaN(inAns)) {
        if (feedback) feedback.innerHTML = `<span class="text-amber-600 font-bold">네모 칸에 숫자를 모두 입력해 주세요!</span>`;
        return;
      }

      const expected = p1TargetR * p1TargetC;
      if (inR === p1TargetR && inC === p1TargetC && inAns === expected) {
        playSound('correct');
        p1Streak++;
        updateStreakDisplay('p1', p1Streak);

        if (p1Streak >= 5) {
          playSound('fanfare');
          triggerConfetti();
          const letter = awardKeywordLetter(1);
          p1Streak = 0;
          openSuccessModal({
            title: '1단계 5연속 정답 성공! 🎉',
            badge: '1단계 마스터 배지 & 비밀 글자 획득!',
            desc: `축하합니다! 5번 연속으로 모두 정확하게 맞혔습니다!\n[1번째 비밀 글자: '${letter}']을 획득했습니다!\n다음 2단계(한 줄 구구단)로 이동해 보세요! 🚀`,
            nextPageNum: 2
          });
        } else {
          showNoticeModal(`🎉 정답입니다! (${p1Streak}/5 성공)\n연속 5번 성공을 향해 다음 문제로 이동합니다! 🚀`);
          setTimeout(initPage1Question, 700);
        }
      } else {
        playSound('wrong');
        p1Streak = 0;
        updateStreakDisplay('p1', p1Streak);
        showNoticeModal(`❌ 틀렸어요! (${p1TargetR}행 × ${p1TargetC}열 = ${expected})\n연속 성공이 0으로 리셋됩니다. 처음부터 다시 도전해 보세요!`);
        setTimeout(initPage1Question, 1000);
      }
    }

    function renderPage2View() {
      const container = document.getElementById('page-content');
      if (!container) return;

      container.innerHTML = `
        <div class="w-full max-w-[720px] flex flex-col items-center">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 w-full">
            <div class="flex items-center gap-2">
              <span class="w-3.5 h-3.5 rounded-full bg-indigo-600"></span>
              <h2 class="text-lg sm:text-xl font-black text-indigo-950 font-jua">
                2단계 · 한 줄 구구단 & 성질 퀴즈 완성하기
              </h2>
            </div>
            <div class="flex items-center gap-2 bg-indigo-50 px-3.5 py-1.5 rounded-2xl border border-indigo-200">
              <span class="text-xs sm:text-sm font-jua text-slate-600 font-bold">⭐ 연속 성공:</span>
              <span id="p2-streak-stars" class="text-amber-500 font-bold tracking-widest text-base sm:text-lg">
                ${'★'.repeat(p2Streak)}${'☆'.repeat(5 - p2Streak)}
              </span>
              <span class="text-xs sm:text-sm font-jua font-bold text-indigo-800">(${p2Streak}/5)</span>
            </div>
          </div>

          <!-- 무작위 단 안내 배너 -->
          <div class="w-full mb-3 flex items-center justify-between gap-2 bg-white/95 px-4 py-3 rounded-2xl shadow border border-indigo-100">
            <span id="p2-status-title" class="text-sm sm:text-base font-black text-indigo-950 font-jua">
              🎲 무작위 출제: ?단의 빈칸과 퀴즈를 완성하세요!

    function newP2Problem() {
      // 0단부터 9단까지 무작위 단 선택 (이전 단과 가급적 다르게)
      let newDan;
      do {
        newDan = Math.floor(Math.random() * 10);
      } while (newDan === p2Dan && Math.random() < 0.8);
      p2Dan = newDan;

      // 출제된 해당 단에 속한 성질 퀴즈 중 하나를 무작위 선택
      const quizList = P2_QUIZZES[p2Dan] || [
        { pre: `${p2Dan}단의 답은 (`, blank: `${p2Dan}`, post: `)씩 커진다.` }
      ];
      p2CurrentQuiz = quizList[Math.floor(Math.random() * quizList.length)];

      // 빈칸 2개 열 무작위 추출 (0~9 중 2개)
      p2BlankCols = [];
      while (p2BlankCols.length < 2) {
        const pick = Math.floor(Math.random() * 10);
        if (!p2BlankCols.includes(pick)) p2BlankCols.push(pick);
      }
      p2BlankCols.sort((a, b) => a - b);

      const title = document.getElementById('p2-status-title');
      if (title) title.innerHTML = `🎲 이번 도전: <span class="text-indigo-600 font-black">${p2Dan}단</span>의 빈칸을 채우고 성질 퀴즈를 풀어보세요!`;

      // 한 줄 구구단 셀 렌더링
      const container = document.getElementById('p2-row-cells');
      if (container) {
        container.innerHTML = '';

        const danHeader = document.createElement('div');
        danHeader.className = 'h-12 sm:h-14 rounded-xl header-row-bg border border-amber-300 flex items-center justify-center font-black text-slate-800 text-base sm:text-2xl shadow-sm';
        danHeader.textContent = p2Dan;
        container.appendChild(danHeader);

        for (let c = 0; c <= 9; c++) {
          const cell = document.createElement('div');
          cell.className = 'h-12 sm:h-14 rounded-xl bg-white border border-slate-300 flex items-center justify-center font-black shadow-sm overflow-hidden';

          if (p2BlankCols.includes(c)) {
            const input = document.createElement('input');
            input.type = 'number';
            input.inputmode = 'numeric';
            input.id = `p2-input-${c}`;
            input.className = 'w-full h-full text-center text-base sm:text-xl font-black text-indigo-700 bg-amber-50 focus:bg-white focus:ring-2 focus:ring-indigo-300 outline-none';
            input.placeholder = '?';
            input.onkeydown = (e) => {
              if (e.key === 'Enter') {
                const nextBlank = p2BlankCols.find(col => col > c);
                if (nextBlank !== undefined) {
                  document.getElementById(`p2-input-${nextBlank}`)?.focus();
                } else {
                  document.getElementById('p2-quiz-input')?.focus();
                }
              }
            };
            cell.appendChild(input);
          } else {
            cell.textContent = p2Dan * c;
            cell.className += ' text-slate-700 text-base sm:text-2xl';
          }
          container.appendChild(cell);
        }
      }

      // 성질 탐구 퀴즈 렌더링
      const quizLabel = document.getElementById('p2-quiz-dan-label');
      if (quizLabel) quizLabel.textContent = `${p2Dan}단 성질 탐구 퀴즈`;

      const quizSentence = document.getElementById('p2-quiz-sentence');
      if (quizSentence && p2CurrentQuiz) {
        quizSentence.innerHTML = `
          <span>${p2CurrentQuiz.pre}</span>
          <input 
            type="text" 
            id="p2-quiz-input" 
            maxlength="4" 
            placeholder="?" 
            autocomplete="off"
            class="w-16 sm:w-20 h-10 text-center font-jua text-base sm:text-lg font-black text-indigo-800 bg-white border-2 border-amber-400 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300 shadow-inner"
          />
          <span>${p2CurrentQuiz.post}</span>
        `;

        const quizInput = document.getElementById('p2-quiz-input');
        if (quizInput) {
          quizInput.onkeydown = (e) => {
            if (e.key === 'Enter') checkP2Answers();
          };
        }
      }

      // 첫 번째 빈칸으로 자동 포커스
      setTimeout(() => {
        const firstInput = document.getElementById(`p2-input-${p2BlankCols[0]}`);
        if (firstInput) firstInput.focus();
      }, 80);
    }

    function checkP2Answers() {
      let allFilled = true;
      let tableCorrect = true;

      // 1. 구구단 빈칸 2개 검사
      for (let c of p2BlankCols) {
        const input = document.getElementById(`p2-input-${c}`);
        if (!input) continue;
        const valStr = input.value.trim();
        if (valStr === '') allFilled = false;
        const val = parseInt(valStr, 10);
        const expected = p2Dan * c;
        if (val === expected) {
          input.classList.remove('border-rose-400', 'bg-rose-50');
          input.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
        } else {
          input.classList.add('border-rose-400', 'bg-rose-50');
          tableCorrect = false;
        }
      }

      // 2. 성질 탐구 퀴즈 검사
      const quizInput = document.getElementById('p2-quiz-input');
      const quizVal = quizInput ? quizInput.value.trim().replace(/\s+/g, '') : '';
      if (quizVal === '') allFilled = false;

      let quizCorrect = false;
      if (p2CurrentQuiz && quizVal) {
        const expectedQuiz = p2CurrentQuiz.blank.replace(/\s+/g, '');
        if (quizVal === expectedQuiz) {
          quizCorrect = true;
          if (quizInput) {
            quizInput.classList.remove('border-rose-400', 'bg-rose-50');
            quizInput.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
          }
        } else {
          if (quizInput) {
            quizInput.classList.add('border-rose-400', 'bg-rose-50');
          }
        }
      }

      if (!allFilled) {
        playSound('wrong');
        showNoticeModal('⚠️ 구구단 빈칸 2개와 아래 성질 퀴즈의 답을 모두 적어주세요!');
        return;
      }

      if (tableCorrect && quizCorrect) {
        playSound('correct');
        p2Streak++;
        updateStreakDisplay('p2', p2Streak);

        if (p2Streak >= 5) {
          playSound('fanfare');
          triggerConfetti();
          const letter = awardKeywordLetter(2);
          p2Streak = 0;
          openSuccessModal({
            title: '2단계 5연속 정답 성공! 🎉',
            badge: '2단계 마스터 배지 & 비밀 글자 획득!',
            desc: `축하합니다! 한 줄 구구단과 성질 퀴즈를 5번 연속 모두 맞혔습니다!\n[2번째 비밀 글자: '${letter}']을 획득했습니다!\n다음 3단계(대칭 짝꿍 찾기)로 이동해 보세요! 🚀`,
            nextPageNum: 3
          });
        } else {
          showNoticeModal(`🎉 정답입니다! (${p2Streak}/5 성공)\n연속 5번 성공을 향해 다음 무작위 단으로 이동합니다! 🚀`);
          setTimeout(newP2Problem, 700);
        }
      } else {
        playSound('wrong');
        p2Streak = 0;
        updateStreakDisplay('p2', p2Streak);
        let errorMsg = '❌ 틀린 부분이 있어요!\n';
        if (!tableCorrect) errorMsg += '• 한 줄 구구단 빈칸을 확인해 보세요.\n';
        if (!quizCorrect) errorMsg += `• 성질 퀴즈의 알맞은 답은 [ ${p2CurrentQuiz.blank} ]입니다.\n`;
        errorMsg += '연속 성공이 0으로 리셋됩니다. 새로운 문제로 다시 도전해 보세요!';
        showNoticeModal(errorMsg);
        setTimeout(newP2Problem, 1100);
      }
    }

    function initPage3Question() {
      p3RevealedPartner = false;
      const eqBox = document.getElementById('p3-equation-box');
      if (eqBox) eqBox.classList.add('hidden');

      let r = Math.floor(Math.random() * 8) + 1;
      let c = Math.floor(Math.random() * 8) + 1;
      while (r === c) {
        c = Math.floor(Math.random() * 8) + 1;
      }
      p3TargetR = r;
      p3TargetC = c;
      p3SymbolType = Math.random() < 0.5 ? 'star' : 'heart';

      p3TableData = Array(10).fill(null).map(() => Array(10).fill(null));
      p3TableData[p3TargetR][p3TargetC] = (p3SymbolType === 'star') ? '★' : '♥';

      let counts = [3, 4, 3, 3, 3, 3, 4, 3, 4, 3];
      for (let row = 0; row <= 9; row++) {
        let avail = [];
        for (let col = 0; col <= 9; col++) {
          if (p3TableData[row][col] === null && !(row === p3TargetC && col === p3TargetR)) {
            avail.push(col);
          }
        }
        avail.sort(() => Math.random() - 0.5);
        for (let i = 0; i < counts[row] && i < avail.length; i++) {
          p3TableData[row][avail[i]] = row * avail[i];
        }
      }

      renderPage3Grid();
    }

    function renderPage3Grid() {
      const grid = document.getElementById('p3-grid-container');
      if (!grid) return;
      grid.innerHTML = '';

      grid.appendChild(createHeaderCell('×', 'rounded-tl-2xl bg-white border border-slate-300 font-black text-slate-700 text-base sm:text-xl flex items-center justify-center'));

      for (let c = 0; c <= 9; c++) {
        const cls = `header-col-bg font-black text-slate-800 text-sm sm:text-lg border border-slate-300 flex items-center justify-center ${c === 9 ? 'rounded-tr-2xl' : ''}`;
        grid.appendChild(createHeaderCell(c, cls));
      }

      for (let r = 0; r <= 9; r++) {
        const rowCls = `header-row-bg font-black text-slate-800 text-sm sm:text-lg border border-slate-300 flex items-center justify-center ${r === 9 ? 'rounded-bl-2xl' : ''}`;
        grid.appendChild(createHeaderCell(r, rowCls));

        for (let c = 0; c <= 9; c++) {
          const cell = document.createElement('div');
          const isCorner = (r === 9 && c === 9);
          cell.className = `w-full h-full border border-slate-200 flex items-center justify-center font-black cursor-pointer transition ${isCorner ? 'rounded-br-2xl' : ''}`;

          if (r === c) cell.classList.add('diagonal-bg');
          else if (r < c) cell.classList.add('upper-triangle-bg');
          else cell.classList.add('lower-triangle-bg');

          const val = p3TableData[r][c];
          if (val === '★') {
            cell.innerHTML = `<span class="text-pink-600 text-lg sm:text-2xl font-black animate-bounce">★</span>`;
            cell.classList.add('ring-2', 'ring-pink-500', 'bg-pink-100');
          } else if (val === '♥') {
            cell.innerHTML = `<span class="text-rose-600 text-lg sm:text-2xl font-black animate-bounce">♥</span>`;
            cell.classList.add('ring-2', 'ring-rose-500', 'bg-rose-100');
          } else if (p3RevealedPartner && r === p3TargetC && c === p3TargetR) {
            const partnerChar = (p3SymbolType === 'star') ? '♥' : '★';
            cell.innerHTML = `<span class="text-purple-600 text-lg sm:text-2xl font-black">${partnerChar}</span>`;
            cell.classList.add('ring-2', 'ring-purple-500', 'bg-purple-100');
          } else if (val !== null) {
            cell.textContent = val;
            cell.className += ' text-xs sm:text-lg text-slate-700';
          }

          cell.onclick = () => onPage3CellClick(r, c);
          grid.appendChild(cell);
        }
      }
    }

    function onPage3CellClick(r, c) {
      if (p3RevealedPartner) return;
      const expectedR = p3TargetC;
      const expectedC = p3TargetR;
      const banner = document.getElementById('p3-feedback-banner');

      if (r === expectedR && c === expectedC) {
        playSound('correct');
        p3RevealedPartner = true;
        renderPage3Grid();

        if (banner) banner.innerHTML = `<span class="text-emerald-700 font-black">🎉 대칭 위치 성공! 아래 네모에 짝꿍의 곱셈식을 완성하세요!</span>`;
        const eqBox = document.getElementById('p3-equation-box');
        if (eqBox) {
          eqBox.classList.remove('hidden');
          const inR = document.getElementById('p3-input-r');
          const inC = document.getElementById('p3-input-c');
          const inAns = document.getElementById('p3-input-ans');
          if (inR) inR.value = '';
          if (inC) inC.value = '';
          if (inAns) inAns.value = '';
          if (inR) {
            inR.oninput = () => { if (inR.value.length >= 1) inC.focus(); };
            inC.oninput = () => { if (inC.value.length >= 1) inAns.focus(); };
            inAns.onkeydown = (e) => { if (e.key === 'Enter') checkP3Formula(); };
            inR.focus();
          }
        }
      } else {
        playSound('wrong');
        p3Streak = 0;
        updateStreakDisplay('p3', p3Streak);
        showNoticeModal(`❌ 대칭 위치가 아니에요! (${p3TargetC}행 ${p3TargetR}열)\n연속 성공이 0으로 리셋됩니다. 새로운 문제로 다시 시작합니다!`);
        setTimeout(initPage3Question, 1000);
      }
    }

    function checkP3Formula() {

      const inC = parseInt(document.getElementById('p3-input-c')?.value.trim(), 10);
      const inAns = parseInt(document.getElementById('p3-input-ans')?.value.trim(), 10);

      const partnerR = p3TargetC;
      const partnerC = p3TargetR;
      const expectedAns = partnerR * partnerC;

      if (isNaN(inR) || isNaN(inC) || isNaN(inAns)) {
        showNoticeModal('⚠️ 행, 열, 곱을 모두 입력해 주세요!');
        return;
      }

      if (inR === partnerR && inC === partnerC && inAns === expectedAns) {
        playSound('correct');
        p3Streak++;
        updateStreakDisplay('p3', p3Streak);

        if (p3Streak >= 5) {
          playSound('fanfare');
          triggerConfetti();
          const letter = awardKeywordLetter(3);
          p3Streak = 0;
          openSuccessModal({
            title: '3단계 5연속 정답 성공! 🎉',
            badge: '3단계 마스터 배지 & 비밀 글자 획득!',
            desc: `축하합니다! 5번 연속으로 모두 정확하게 맞혔습니다!\n[3번째 비밀 글자: '${letter}']을 획득했습니다!\n다음 4단계(묶음 교환법칙)로 이동해 보세요! 🚀`,
            nextPageNum: 4
          });
        } else {
          showNoticeModal(`🎉 정답입니다! (${p3Streak}/5 성공)\n연속 5번 성공을 향해 다음 문제로 이동합니다! 🚀`);
          setTimeout(initPage3Question, 700);
        }
      } else {
        playSound('wrong');

    function initPage5Question() {
      const danMultiples = {};
      for (let d = 2; d <= 9; d++) {
        danMultiples[d] = [];
        for (let k = 1; k <= 9; k++) danMultiples[d].push(d * k);
      }

      const candidates = [];
      for (let d1 = 2; d1 <= 9; d1++) {
        for (let d2 = 2; d2 <= 9; d2++) {
          if (d1 >= d2) continue;
          const common = danMultiples[d1].filter(v => danMultiples[d2].includes(v));
          if (common.length < 2) continue;

          for (let target of common) {
            for (let a = 2; a <= 9; a++) {
              for (let b = 2; b <= 9; b++) {
                const compVal = a * b;
                const gt = common.filter(v => v > compVal);
                if (gt.length === 1 && gt[0] === target) {
                  candidates.push({ d1, d2, a, b, compVal, cmpText: '커요', target });
                }
                const lt = common.filter(v => v < compVal);
                if (lt.length === 1 && lt[0] === target) {
                  candidates.push({ d1, d2, a, b, compVal, cmpText: '작아요', target });
                }
              }
            }
          }
        }
      }

      let nextRiddle;
      do {
        nextRiddle = candidates[Math.floor(Math.random() * candidates.length)];
      } while (candidates.length > 1 && p5CurrentRiddle && nextRiddle.target === p5CurrentRiddle.target && Math.random() < 0.8);
      p5CurrentRiddle = nextRiddle;

      let clueDanA = p5CurrentRiddle.d1;
      let clueDanB = p5CurrentRiddle.d2;
      if (Math.random() < 0.5) {
        clueDanA = p5CurrentRiddle.d2;
        clueDanB = p5CurrentRiddle.d1;
      }

      document.getElementById('p5-clue-1').textContent = `${clueDanA}단`;
      document.getElementById('p5-clue-2-expr').textContent = `${p5CurrentRiddle.a} × ${p5CurrentRiddle.b}`;
      document.getElementById('p5-clue-2-cmp').textContent = p5CurrentRiddle.cmpText;
      document.getElementById('p5-clue-3').textContent = `${clueDanB}단`;

      const input = document.getElementById('p5-answer-input');
      if (input) {
        input.value = '';
        input.onkeydown = (e) => { if (e.key === 'Enter') checkP5Answer(); };
        input.focus();
      }

      const feedback = document.getElementById('p5-feedback');
      if (feedback) feedback.textContent = '';
    }

        if (feedback) {
          feedback.className = 'mt-4 font-jua text-lg text-emerald-600 font-bold';
          feedback.innerHTML = `🎉 정답 성공! [ <strong>${studentTargetSentence}</strong> ]`;
        }

        const cert = document.getElementById('certificate-print-area');
        if (cert) {
          cert.classList.remove('hidden');
          cert.classList.add('flex');
        }

        // 구글 앱스 스크립트(GAS)로 학생 이름 및 키워드 자동 전송
        if (GOOGLE_SCRIPT_URL) {
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerText = '📡 전자칠판에 등록 중...';
          }
          try {
            await fetch(GOOGLE_SCRIPT_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                name: currentStudent,
                keyword: userVal,
                time: new Date().toLocaleTimeString('ko-KR')
              })
            });

            if (feedback) {
              feedback.innerHTML = `🎉 대성공! 완벽한 정답입니다! "${studentTargetSentence}"<br><span class="text-indigo-600 text-sm">📡 전자칠판(구글 시트)에 성공적으로 등록되었습니다! ✨</span>`;
            }
          } catch (err) {
            console.warn('전송 중 오류 발생:', err);
            if (feedback) {
              feedback.innerHTML = `🎉 대성공! 완벽한 정답입니다! "${studentTargetSentence}"<br><span class="text-amber-600 text-xs">⚠️ 전자칠판 전송에 실패했으나 정답은 인증되었습니다.</span>`;
            }
          } finally {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerText = '✅ 제출 완료!';
            }
          }
        }

        openSuccessModal({
          title: '🎉 모든 모험 완료! 챔피언! 🎉',
          badge: '최종 보물 인증서 발급 완료!',
          desc: `축하합니다! ${currentStudent} 학생은 모든 곱셈 미션과 60초 챌린지를 클리어하여 보물 키워드 ["${studentTargetSentence}"]를 완성했습니다!\n화면 아래의 인증서를 확인하고 전자칠판 명단을 확인해 보세요! 🎓✨`,
          nextPageNum: 0
        });
      } else {
        playSound('wrong');
        if (feedback) {
          feedback.className = 'mt-4 font-jua text-base text-rose-500';
          feedback.innerText = `❌ 아직 일치하지 않아요! 모은 6글자를 순서대로 차근차근 이어 써보세요!`;
        }
      }
    }

    function createHeaderCell(text, className) {
      const el = document.createElement('div');
      el.textContent = text;
      el.className = className;
      return el;
    }

    // 앱 시작 시 표지 렌더링
    window.onload = function() {
      switchPage(0);
    };
  </script>
</body>
</html>
