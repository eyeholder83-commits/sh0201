<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수학 2-2 · 표와 그래프 4차시 답안지</title>
<style>
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: #edf2f8; color: #17253b; font-family: system-ui, sans-serif }
main { max-width: 850px; margin: auto; padding: 24px 12px 40px }
h1 { font-size: clamp(21px, 4vw, 32px); margin: 0 0 10px }
p { line-height: 1.55; margin: 0 0 16px }
nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px }
nav a { color: #184995; background: white; padding: 8px 14px; border-radius: 9px }
.sheet { position: relative; isolation: isolate; container-type: inline-size; margin: 0 0 16px; background: white; box-shadow: 0 2px 10px #283d5625 }
.sheet img { display: block; width: 100%; height: auto }
.entry,.mark { position: absolute; margin: 0; padding: 0; color: #1258ad; background: #2c82db18; border: 0; border-radius: 0; text-align: center; font: bold 3.5cqw system-ui }
.entry { min-width: 0 }
.entry:focus,.mark:focus-visible { outline: 2px solid #155abd; outline-offset: -2px; z-index: 2; background: #e4f0ff }
.mark { cursor: pointer; display: grid; place-items: center; line-height: 1; font-size: 5cqw }
.mark span { visibility: hidden }
.mark[aria-pressed="true"] span { visibility: visible }
.mark:hover { background: #2c82db38 }
.graph4 { font-size: 4.9cqw }
.graph5 { font-size: 4.3cqw }
#game { font-size: 3.05cqw }
#grade,#classroom,#number,#name { font-size: 2.55cqw }
.badge { position: absolute; left: 7%; padding: .35em .7em; border-radius: 6px; background: #e2f6eb; color: #11633c; font-weight: 750; font-size: clamp(10px, 2.3cqw, 16px) }
.badge[data-status="wrong"] { background: #ffe6e3; color: #a32825 }
.badge[data-status="blank"] { background: #fff0c6; color: #704800 }
.actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px }
#check { padding: 12px 20px; border: 0; border-radius: 8px; background: #1757a9; color: white; font: bold 1rem system-ui; cursor: pointer }
#summary { font-weight: 700; line-height: 1.6 }

.teacher-bar { display: flex; justify-content: flex-end; margin-bottom: 12px }
#teacher-toggle, #back-to-worksheet, dialog button { border: 1px solid #aac5e9; border-radius: 8px; padding: 8px 12px; background: white; color: #174a89; font: inherit; cursor: pointer }
dialog { width: min(360px, calc(100% - 32px)); border: 0; border-radius: 12px; padding: 24px; color: inherit }
dialog::backdrop { background: #17253b80 }
dialog h2 { margin: 0 0 12px }
dialog input { display: block; width: 100%; padding: 9px; margin-top: 5px; font: inherit }
#teacher-error { color: #a32825; margin: 8px 0 }
.teacher-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px }
</style>
</head>
<body>
<main id="worksheet">
<div class="teacher-bar"><button type="button" id="teacher-toggle" aria-haspopup="dialog">교사 로그인</button></div>
<dialog id="teacher-dialog" aria-labelledby="teacher-heading">
  <form id="teacher-form">
    <h2 id="teacher-heading">교사 로그인</h2>
    <label for="teacher-password">비밀번호</label>
    <input type="password" id="teacher-password" inputmode="numeric" autocomplete="off" required>
    <p id="teacher-error" role="alert" hidden></p>
    <div class="teacher-actions">
      <button type="button" id="teacher-cancel">취소</button>
      <button type="submit" id="teacher-submit">로그인</button>
    </div>
  </form>
</dialog>
<h1>자료를 분류하여 그래프로 나타내 볼까요</h1>
<p>종이에 푼 답을 파란 칸에 옮겨 쓰세요. 선택지와 그래프의 칸은 한 번 누르면 표시되고, 다시 누르면 지워져요.</p>

<main id="auto-evaluation-act-1795648132528" hidden style="max-width:1050px;">
  <div class="teacher-bar"><button type="button" id="back-to-worksheet">활동지로 돌아가기</button></div>
  <h1 id="auto-evaluation-heading" tabindex="-1">자동평가</h1>
  <iframe title="과제 참여 여부 확인하기"
    data-src="https://eyeholder83-commits.github.io/sh0201/%ED%95%99%EA%B8%89%ED%86%B5%ED%95%A9%EA%B4%80%EB%A6%AC.html?autoActivity=act-1795648132528"
    loading="lazy"
    style="display:block;width:100%;height:650px;border:0;border-radius:16px;background:#f8fafc;"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
</main>
<dialog id="evaluation-notice" aria-labelledby="evaluation-notice-heading">
  <h2 id="evaluation-notice-heading">6문제 모두 맞았어요!</h2>
  <p>자동평가 화면으로 이동했어요.</p>
</dialog>
<script>
const byId = id => document.getElementById(id);
const isMarked = button => button.getAttribute('aria-pressed') === 'true';
const marks = group => Array.from(document.querySelectorAll('.' + group));
const normalized = id => byId(id).value.normalize('NFC').replace(/\s+/gu, '');
const anyMarked = group => marks(group).some(isMarked);
const groupMatches = group => marks(group).every(button => isMarked(button) === (button.dataset.correct === '1'));
const order = () => [1, 2, 3].map(i => byId('order' + i).value);
const textAnswers = { flower: '꽃', order1: '㉠', order2: '㉣', order3: '㉢', game: '연날리기' };
const answerButtons = marks('mark');
const teacherToggle = byId('teacher-toggle');
const teacherDialog = byId('teacher-dialog');
const password = byId('teacher-password');
const error = byId('teacher-error');
let studentAnswers = null;

function openTeacherMode() {
  const fields = Object.entries(textAnswers).map(([id, answer]) => [byId(id), answer]);
  studentAnswers = {
    fields: fields.map(([field]) => [field, field.value]),
    marks: answerButtons.map(button => [button, isMarked(button)])
  };
  fields.forEach(([field, answer]) => { field.value = answer; });
  answerButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.correct === '1')));
  clearResults();
  teacherToggle.textContent = '교사 로그아웃';
  teacherToggle.removeAttribute('aria-haspopup');
}

teacherToggle.addEventListener('click', () => {
  if (!studentAnswers) {
    teacherDialog.showModal();
    password.focus();
    return;
  }
  studentAnswers.fields.forEach(([field, value]) => { field.value = value; });
  studentAnswers.marks.forEach(([button, pressed]) => button.setAttribute('aria-pressed', String(pressed)));
  studentAnswers = null;
  clearResults();
  teacherToggle.textContent = '교사 로그인';
  teacherToggle.setAttribute('aria-haspopup', 'dialog');
});

byId('teacher-cancel').addEventListener('click', () => teacherDialog.close());
teacherDialog.addEventListener('close', () => {
  password.value = '';
  error.hidden = true;
  teacherToggle.focus();
});
password.addEventListener('input', () => { error.hidden = true; });
byId('teacher-form').addEventListener('submit', async event => {
  event.preventDefault();
  const submit = byId('teacher-submit');
  if (submit.disabled) return;
  submit.disabled = true;
  const entered = password.value;
  try {
    const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('math-unit5-lesson4/teacher:' + entered));
    if (!teacherDialog.open || password.value !== entered) return;
    const hex = Array.from(new Uint8Array(hash), byte => byte.toString(16).padStart(2, '0')).join('');
    if (hex === 'a4ccc5f0c598cc4e838b1bae90881111a7d124de87b8cb60fb34205cf6d8f543') {
      openTeacherMode();
      teacherDialog.close();
      return;
    }
    error.textContent = '비밀번호를 다시 확인해 주세요.';
    password.select();
  } catch {
    if (!teacherDialog.open) return;
    error.textContent = '교사 로그인은 파일을 직접 열거나 HTTPS로 접속한 브라우저에서 사용해 주세요.';
  } finally {
    submit.disabled = false;
  }
  error.hidden = false;
});


function clearResults() {
  document.querySelectorAll('.badge').forEach(badge => badge.hidden = true);
  byId('summary').textContent = '';
}

document.querySelectorAll('.sheet').forEach((sheet, index) => { sheet.id = 'page' + (index + 1); });
document.querySelectorAll('.mark').forEach(button => {
  button.addEventListener('click', () => {
    const wasMarked = isMarked(button);
    if (button.classList.contains('choice')) {
      marks('choice').forEach(choice => choice.setAttribute('aria-pressed', 'false'));
    }
    button.setAttribute('aria-pressed', String(!wasMarked));
    clearResults();
  });
});
document.querySelectorAll('.entry').forEach(entry => entry.addEventListener('input', clearResults));

const worksheet = byId('worksheet');
const evaluation = byId('auto-evaluation-act-1795648132528');
const evaluationFrame = evaluation.querySelector('iframe');
const evaluationNotice = byId('evaluation-notice');

function showAutoEvaluation() {
  worksheet.hidden = true;
  evaluation.hidden = false;
  if (!evaluationFrame.hasAttribute('src')) evaluationFrame.src = evaluationFrame.dataset.src;
  evaluation.scrollIntoView({ block: 'start' });
  byId('auto-evaluation-heading').focus({ preventScroll: true });
  evaluationNotice.showModal();
  window.setTimeout(() => evaluationNotice.close(), 2000);
}

byId('back-to-worksheet').addEventListener('click', () => {
  evaluation.hidden = true;
  worksheet.hidden = false;
  byId('check').focus();
});

byId('check').addEventListener('click', () => {
  const results = [
    [Boolean(normalized('flower')), normalized('flower') === textAnswers.flower],
    [anyMarked('choice'), groupMatches('choice')],
    [order().every(Boolean), order().join('') === textAnswers.order1 + textAnswers.order2 + textAnswers.order3],
    [anyMarked('graph4'), groupMatches('graph4')],
    [anyMarked('graph5'), groupMatches('graph5')],
    [Boolean(normalized('game')), normalized('game') === textAnswers.game]
  ];
  let score = 0;
  const review = [];
  results.forEach(([complete, correct], index) => {
    const question = index + 1;
    const badge = byId('result' + question);
    if (correct) score++;
    else review.push(question + '번');
    badge.dataset.status = correct ? 'correct' : complete ? 'wrong' : 'blank';
    badge.textContent = question + '번 ' + (correct ? '맞았어요' : complete ? '다시 확인해 보세요' : '답을 표시해 주세요');
    badge.hidden = false;
  });
  byId('summary').textContent = score === results.length
    ? '6문제 모두 맞았어요!'
    : '6문제 중 ' + score + '문제를 맞았어요. ' + review.join(', ') + '을 확인해 주세요.';
  if (score === results.length) showAutoEvaluation();
});
</script>
