<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캠페인 알아보기 퀴즈</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#18243a;font-family:'Malgun Gothic',Arial,sans-serif}.wrap{max-width:900px;margin:0 auto;padding:72px 18px 55px}.top{position:absolute;right:18px;top:16px}.top button,.actions button,.modal button{border:0;border-radius:12px;padding:12px 17px;cursor:pointer;font-weight:700}.top button{background:#e2e8f0;color:#334155}header{text-align:center;margin-bottom:30px}h1{font-size:clamp(26px,5vw,38px);margin:0 0 12px}header p{color:#64748b}.progress{height:10px;background:#dce5f1;border-radius:10px;overflow:hidden;margin:15px 0 30px}.bar{height:100%;width:0;background:#3974eb;transition:.2s}.question{background:white;border:1px solid #e1e7ef;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 3px 12px #152c4b09}.question h2{font-size:19px;margin:0 0 18px;line-height:1.55}.num{display:inline-block;background:#eaf1ff;color:#245bcb;border-radius:8px;padding:4px 10px;margin-right:8px;font-size:15px}.choices{display:grid;gap:9px}.choice{display:flex;gap:10px;align-items:center;border:1px solid #e2e8f0;border-radius:11px;padding:12px;cursor:pointer;line-height:1.5}.choice:has(input:checked){background:#eaf1ff;border-color:#6b9bf5}.choice input{accent-color:#326be0;width:19px;height:19px;flex:none}.feedback{margin-top:12px;border-radius:10px;padding:12px;background:#f1f5f9}.correct{color:#16804b}.wrong{color:#d33c3c}.actions{display:flex;gap:10px;justify-content:center;margin-top:25px}.primary{background:#326be0;color:white}.secondary{background:#e2e8f0;color:#334155}.actions button{font-size:17px}.actions button:disabled{opacity:.5;cursor:not-allowed}#result{text-align:center;font-size:23px;font-weight:800;margin:20px 0}.modal-back{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:5}.modal{background:white;border-radius:18px;padding:25px;max-width:360px;width:100%;box-shadow:0 20px 60px #0003}.modal h2{margin-top:0}.modal input{width:100%;font-size:18px;padding:12px;border:1px solid #cbd5e1;border-radius:10px}.modal .actions{justify-content:flex-end}.hidden{display:none!important}[hidden]{display:none!important}.auto-page{max-width:1100px;margin:0 auto;padding:70px 18px 30px}.auto-page h1{text-align:center}.success-modal{text-align:center;font-size:20px;font-weight:800}.auto-page iframe{display:block;width:100%;height:650px;border:0;border-radius:16px;background:#f8fafc}.teacher-tag{display:inline-block;background:#e6f7ee;color:#167a4b;padding:7px 12px;border-radius:99px;font-size:14px;font-weight:700}#error{color:#d33c3c;min-height:22px;font-size:14px}@media(max-width:550px){.wrap{padding-top:76px}.question{padding:16px}.actions button{font-size:15px}}
</style></head><body><div class="top"><button id="teacherBtn" type="button">🔒 교사 로그인</button></div><main id="quizPage" class="wrap"><header><h1>📣 캠페인 알아보기 퀴즈</h1><p>10문제를 풀고 정답 확인 버튼을 눌러 보세요.</p><div id="teacherTag" class="teacher-tag hidden">교사 모드 · 정답 자동 선택</div></header><div id="count" aria-live="polite">0 / 10문제 선택</div><div class="progress"><div id="bar" class="bar"></div></div><div id="questions"></div><div id="result" aria-live="polite"></div><div class="actions"><button id="grade" class="primary" disabled>정답 확인</button><button id="reset" class="secondary">다시 풀기</button></div></main><section id="autoPage" class="auto-page hidden"><h1>자동평가</h1><!-- 자동평가: 캠페인 활동 --><div id="auto-evaluation-act-1794959926456" hidden style="margin:24px auto;max-width:1050px;"><iframe title="과제 참여 여부 확인하기" src="https://eyeholder83-commits.github.io/sh0201/%ED%95%99%EA%B8%89%ED%86%B5%ED%95%A9%EA%B4%80%EB%A6%AC.html?autoActivity=act-1794959926456" loading="lazy" style="display:block;width:100%;height:650px;border:0;border-radius:16px;background:#f8fafc;" referrerpolicy="strict-origin-when-cross-origin"></iframe></div></section><div id="successBackdrop" class="modal-back hidden" role="dialog" aria-modal="true" aria-label="모든 문제 정답"><div class="modal success-modal">🎉 모든 문제를 맞혔다!<p>자동평가 페이지로 이동한다.</p></div></div><div id="loginBackdrop" class="modal-back hidden"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle"><h2 id="loginTitle">교사 로그인</h2><form id="loginForm"><input id="password" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호 입력" aria-label="교사 비밀번호" required><p id="error" role="alert"></p><div class="actions"><button type="button" id="cancel" class="secondary">취소</button><button type="submit" class="primary">로그인</button></div></form></div></div><script>
const questions=[
{q:'캠페인이란 무엇인가?',opts:['물건을 사고파는 활동','좋은 변화를 만들기 위해 함께 펼치는 활동','혼자서 즐기는 놀이','시험을 준비하는 활동'],a:1,why:'캠페인은 문제를 해결하거나 좋은 행동을 널리 알리기 위한 활동이다.'},
{q:'캠페인을 하는 가장 중요한 목적은 무엇인가?',opts:['사람들의 생각과 행동을 좋은 방향으로 바꾸기','무조건 돈을 많이 벌기','다른 사람과 경쟁하기','유명한 사람이 되기'],a:0,why:'캠페인은 사람들의 관심과 참여를 이끌어 좋은 변화를 만드는 것이 목적이다.'},
{q:'다음 중 환경 보호 캠페인에 해당하는 것은?',opts:['새 장난감 광고하기','게임 대회 열기','일회용품 사용 줄이기','노래 발표회 열기'],a:2,why:'일회용품 사용을 줄이면 쓰레기를 줄이고 환경을 보호할 수 있다.'},
{q:'다음 중 교통안전 캠페인의 구호로 가장 알맞은 것은?',opts:['책을 많이 읽자!','횡단보도에서는 안전하게 건너자!','친구에게 고운 말을 쓰자!','음식을 남기지 말자!'],a:1,why:'교통안전 캠페인은 교통사고를 예방하고 안전한 행동을 알리는 활동이다.'},
{q:'다음 중 캠페인을 진행하는 방법으로 알맞지 않은 것은?',opts:['포스터 만들기','피켓 들고 홍보하기','실천 활동에 참여하기','다른 사람을 억지로 참여시키기'],a:3,why:'캠페인은 사람들을 설득하고 자발적인 참여를 이끌어야 한다.'},
{q:'어스아워(Earth Hour) 캠페인에서는 주로 어떤 활동을 하는가?',opts:['불필요한 전등을 한 시간 동안 끄기','하루 종일 운동하기','쓰레기를 아무 곳에나 버리기','새로운 전등을 많이 사기'],a:0,why:'어스아워는 한 시간 동안 불필요한 전등을 끄며 지구 환경 보호의 중요성을 알리는 캠페인이다.'},
{q:'우리 반에서 바른말 사용 캠페인을 할 때 가장 알맞은 활동은?',opts:['친구의 잘못을 놀리기','고운 말을 사용하는 포스터를 만들고 실천하기','친구에게 억지로 사과시키기','나쁜 말을 사용하는 친구를 공개적으로 망신 주기'],a:1,why:'바른말 사용 캠페인은 서로 존중하는 말을 알리고 직접 실천하는 활동이다.'},
{q:'캠페인은 반드시 많은 사람이 참여해야만 시작할 수 있다.',opts:['O','X'],a:1,why:'한 사람이나 작은 모둠도 캠페인을 시작할 수 있다.'},
{q:'공익광고는 캠페인의 한 가지 방법으로 활용할 수 있다.',opts:['O','X'],a:0,why:'공익광고를 통해 사회 문제를 알리고 사람들의 행동 변화를 이끌 수 있다.'},
{q:'캠페인은 포스터만 만들면 끝나며, 실제 행동은 중요하지 않다.',opts:['O','X'],a:1,why:'사람들이 실제로 좋은 행동을 실천하도록 하는 것이 중요하다.'}
];
const selections=Array(questions.length).fill(null);let teacher=false,graded=false;
const $=id=>document.getElementById(id);
function render(){const root=$('questions');root.innerHTML='';questions.forEach((item,i)=>{const section=document.createElement('section');section.className='question';const title=document.createElement('h2');const num=document.createElement('span');num.className='num';num.textContent=`${i+1}번`;title.append(num,document.createTextNode(item.q));section.append(title);const choices=document.createElement('div');choices.className='choices';item.opts.forEach((option,j)=>{const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type='radio';input.name=`q${i}`;input.value=String(j);input.checked=selections[i]===j;input.addEventListener('change',()=>{selections[i]=j;graded=false;update();render();});const span=document.createElement('span');span.textContent=option;label.append(input,span);choices.append(label);});section.append(choices);if(graded){const fb=document.createElement('div');fb.className='feedback';const good=selections[i]===item.a;const heading=document.createElement('strong');heading.className=good?'correct':'wrong';heading.textContent=good?'✓ 정답':'✕ 오답';fb.append(heading);section.append(fb);}root.append(section);});update();}
function update(){const count=selections.filter(x=>x!==null).length;$('count').textContent=`${count} / 10문제 선택`;$('bar').style.width=`${count*10}%`;$('grade').disabled=count!==questions.length;$('result').textContent=graded?`🎉 ${selections.filter((v,i)=>v===questions[i].a).length*10}점 · 10문제 중 ${selections.filter((v,i)=>v===questions[i].a).length}문제 정답`:'';}
function showAutoEvaluation(){const area=$('auto-evaluation-act-1794959926456');if(area){area.hidden=false;area.scrollIntoView({behavior:'smooth',block:'start'});}}
$('grade').addEventListener('click',()=>{if(selections.some(x=>x===null))return;graded=true;render();const allCorrect=selections.every((v,i)=>v===questions[i].a);if(allCorrect){$('quizPage').classList.add('hidden');$('autoPage').classList.remove('hidden');showAutoEvaluation();$('successBackdrop').classList.remove('hidden');setTimeout(()=>$('successBackdrop').classList.add('hidden'),2000);}else{$('result').scrollIntoView({behavior:'smooth',block:'center'});}});
$('reset').addEventListener('click',()=>{questions.forEach((q,i)=>selections[i]=teacher?q.a:null);graded=false;render();window.scrollTo({top:0,behavior:'smooth'});});
$('teacherBtn').addEventListener('click',()=>{if(teacher){teacher=false;selections.fill(null);graded=false;$('teacherBtn').textContent='🔒 교사 로그인';$('teacherTag').classList.add('hidden');render();return;}$('loginBackdrop').classList.remove('hidden');$('password').value='';$('error').textContent='';$('password').focus();});
function closeLogin(){$('loginBackdrop').classList.add('hidden');$('password').value='';}
$('cancel').addEventListener('click',closeLogin);
$('loginBackdrop').addEventListener('click',e=>{if(e.target===$('loginBackdrop'))closeLogin();});
async function digest(s){const bytes=new TextEncoder().encode(s);const hash=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('');}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{const entered=await digest($('password').value);if(entered==='d283fc7ed27a618f0d8e673ffbd01c18ba8d472f095f375f93576d3ed40c4782'){teacher=true;questions.forEach((q,i)=>selections[i]=q.a);graded=false;$('teacherBtn').textContent='교사 로그아웃';$('teacherTag').classList.remove('hidden');closeLogin();render();}else{$('error').textContent='비밀번호가 올바르지 않다.';$('password').value='';}}catch(err){$('error').textContent='이 환경에서는 로그인을 사용할 수 없다. HTTPS에서 열어 주세요.';}});
render();
</script></body></html>
