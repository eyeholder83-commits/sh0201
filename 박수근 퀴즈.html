<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미술관 탐방 독서 퀴즈</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js for Sound Effects without external audio files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- Google Fonts (Noto Sans KR, Gaegu for playful feel) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', 'sans-serif'],
            hand: ['"Gaegu"', 'cursive']
          },
          colors: {
            art: {
              50: '#fffaf5',
              100: '#ffedd5',
              200: '#fed7aa',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              clay: '#d97706',
              canvas: '#fdfbf7'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #f7f4ee;
      background-image: radial-gradient(#e5dec9 0.85px, transparent 0.85px), radial-gradient(#e5dec9 0.85px, #f7f4ee 0.85px);
      background-size: 34px 34px;
      background-position: 0 0, 17px 17px;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
    @keyframes bounce-gentle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .animate-gentle {
      animation: bounce-gentle 2.2s infinite ease-in-out;
    }
  </style>
</head>
<body class="font-sans text-stone-800 min-h-screen flex flex-col antialiased select-none">

  <header class="w-full bg-white/90 backdrop-blur-md border-b border-stone-200 sticky top-0 z-40 shadow-sm transition-all">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-3xl p-2 bg-amber-100 rounded-2xl shadow-inner inline-flex items-center justify-center">🎨</span>
        <div>
          <h1 class="text-lg md:text-xl font-bold tracking-tight text-stone-900 flex items-center gap-1.5">
            미술관 탐방 독해 퀴즈
            <span class="text-xs bg-amber-500 text-white font-semibold px-2 py-0.5 rounded-full">총 10문제</span>
          </h1>
          <p class="text-xs text-stone-500">박수근 화가와 미술관 이야기를 읽고 문제를 풀어봐요!</p>
        </div>
      </div>

      <!-- Controls: Audio & View Mode -->
      <div class="flex items-center space-x-2">
        <button id="soundToggleBtn" onclick="toggleSound()" class="p-2.5 rounded-xl border border-stone-200 bg-stone-50 hover:bg-stone-100 text-stone-600 transition flex items-center gap-1 text-xs font-medium" title="효과음 켜기/끄기">
          <span id="soundIcon">🔊</span>
          <span class="hidden sm:inline" id="soundText">소리 켬</span>
        </button>

        <button onclick="confirmRestartQuiz()" class="px-3 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-bold transition flex items-center gap-1.5" title="처음부터 다시 풀기">
          <span>🔄</span>
          <span>처음부터</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-3xl w-full mx-auto p-4 md:p-6 flex flex-col justify-start">

    <!-- Progress Indicator Bar (Visible in Card Mode) -->
    <div id="progressSection" class="w-full mb-6 bg-white p-4 rounded-2xl border border-stone-200 shadow-sm">
      <div class="flex justify-between items-center text-xs font-bold text-stone-500 mb-2">
        <span class="flex items-center gap-1.5 text-amber-700">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block animate-ping"></span>
          단계 <span id="currentNumberText" class="text-stone-900 text-sm font-extrabold">1</span> / 10
        </span>
        <div class="flex items-center gap-2">
          <span class="text-stone-400">문제별 도전 기회:</span>
          <span id="heartsContainer" class="flex gap-1 text-base">❤️❤️</span>
        </div>
      </div>
      <div class="w-full bg-stone-100 h-3 rounded-full overflow-hidden p-0.5 border border-stone-200">
        <div id="progressBar" class="bg-gradient-to-r from-amber-400 to-orange-500 h-full rounded-full transition-all duration-300 w-[10%]"></div>
      </div>
    </div>

    <!-- Card Mode Wrapper -->
    <section id="cardView" class="w-full flex-1 flex flex-col justify-between">
      <div id="questionCardBox" class="bg-white rounded-3xl p-6 md:p-8 border border-stone-200 shadow-md relative overflow-hidden transition-all duration-300">
        <!-- Accent Top Bar -->
        <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-amber-400 via-orange-400 to-amber-500"></div>

        <!-- Question Badge & Title -->
        <div class="flex items-start justify-between gap-3 mb-4">
          <div class="flex items-center gap-2">
            <span id="cardBadge" class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full border border-amber-200">
              객관식
            </span>
            <span id="questionTopicTag" class="text-xs text-stone-400 font-medium">10문제 연속 통과 챌린지</span>
          </div>
          <span id="attemptWarningBadge" class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200">
            첫 번째 도전
          </span>
        </div>

        <h2 id="cardQuestionTitle" class="text-lg md:text-xl font-extrabold text-stone-900 leading-snug mb-6">
          1. 이 글을 쓴 사람은 누구인가요?
        </h2>

        <!-- Interactive Question Body (Radio choices or text input) -->
        <div id="cardInteractiveBody" class="space-y-3 mb-6 min-h-[160px] flex flex-col justify-center">
          <!-- Dynamically filled by JavaScript -->
        </div>

        <!-- Feedback message box -->
        <div id="cardFeedback" class="hidden rounded-2xl p-4 text-sm font-medium transition-all mb-4"></div>

        <!-- Check Answer Button -->
        <div class="pt-2">
          <button id="verifyAnswerBtn" onclick="verifyCurrentAnswer()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-extrabold text-base shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 active:scale-[0.99]">
            <span>✨</span> 정답 확인하기
          </button>
        </div>
      </div>
    </section>

    <!-- Results Container (Hidden until all 10 are solved correctly) -->
    <section id="resultView" class="hidden space-y-6 pb-12 transition-all">
      <div class="bg-white rounded-3xl p-6 md:p-8 border border-stone-200 shadow-xl text-center">
        <div class="text-6xl mb-3 animate-gentle">🎉</div>
        <h2 class="text-2xl md:text-3xl font-black text-stone-900 mb-2">모든 문제를 맞혔습니다!</h2>
        <p class="text-stone-600 text-sm md:text-base mb-6">
          10문제를 모두 훌륭하게 통과했습니다! 아래 최종 확인지를 작성해 주세요.
        </p>

        <div class="inline-flex items-center gap-2 bg-emerald-50 border border-emerald-200 px-6 py-3 rounded-2xl text-emerald-800 font-bold text-sm mb-6">
          <span>🏅</span> 전 문항 정답 완료 (10 / 10)
        </div>

        <!-- Embedded Google Form specified by user -->
        <div class="mt-4 pt-6 border-t border-stone-100 flex flex-col items-center">
          <h3 class="text-base font-bold text-stone-800 mb-4 flex items-center gap-2">
            <span>📝</span> 최종 설문 제출하기
          </h3>
          <div class="w-full overflow-hidden rounded-2xl border border-stone-200 shadow-sm flex justify-center bg-stone-50">
            <iframe 
              src="https://docs.google.com/forms/d/e/1FAIpQLSdBXY7O-5XNN_hExe2b4jx1gyUKfKerrIJPTEO-mKufCVlAFQ/viewform?embedded=true" 
              width="640" 
              height="1497" 
              frameborder="0" 
              marginheight="0" 
              marginwidth="0"
              class="max-w-full w-full">
              로드 중…
            </iframe>
          </div>
        </div>

        <div class="mt-6">
          <button onclick="restartQuiz()" class="px-6 py-3 rounded-xl border border-stone-300 bg-stone-50 hover:bg-stone-100 text-stone-700 font-bold text-sm transition">
            🔄 퀴즈 다시 도전하기
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- Notification Toast Box -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-stone-900 text-white text-sm font-medium px-5 py-3 rounded-2xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2.5 max-w-sm text-center">
    <span id="toastIcon">✨</span>
    <span id="toastMsg">알림 메시지</span>
  </div>

  <script>
    // Quiz Questions Data (1~6 Multiple Choice, 7~10 Subjective Short Answer)
    const quizData = [
      {
        id: 1,
        type: "choice",
        title: "1. 이 글을 쓴 사람은 누구인가요?",
        options: ["화가", "미술관 관장", "2학년 선생님", "박수근"],
        answer: 2
      },
      {
        id: 2,
        type: "choice",
        title: "2. 어린이들은 언제 미술관을 방문했나요?",
        options: ["지난 월요일", "지난 화요일", "지난 수요일", "지난 목요일"],
        answer: 2
      },
      {
        id: 3,
        type: "choice",
        title: "3. 글에서 소개한 박수근 화가의 작품은 무엇인가요?",
        options: ["나무와 두 여인", "빨래터", "공기놀이하는 아이들", "시장의 사람들"],
        answer: 3
      },
      {
        id: 4,
        type: "choice",
        title: "4. 「공기놀이하는 아이들」에는 여자아이가 몇 명 나오나요?",
        options: ["한 명", "두 명", "세 명", "네 명"],
        answer: 3
      },
      {
        id: 5,
        type: "choice",
        title: "5. 미술관에서는 11월에 무엇을 전시할 예정인가요?",
        options: ["박수근 화가가 그린 그림", "어린이들이 그린 그림", "선생님들이 그린 그림", "옛날 사진"],
        answer: 2
      },
      {
        id: 6,
        type: "choice",
        title: "6. 어린이들이 그린 그림의 주제는 무엇인가요?",
        options: ["미술관에서 본 작품", "가족과 함께한 모습", "20년 뒤 자신의 모습", "공기놀이하는 모습"],
        answer: 3
      },
      {
        id: 7,
        type: "short",
        title: "7. 「공기놀이하는 아이들」을 그린 화가는 누구인가요?",
        validAnswers: ["박수근", "박수근화가", "박수근 화가"],
        placeholder: "화가의 이름을 적어주세요"
      },
      {
        id: 8,
        type: "short",
        title: "8. 그림 속 여자아이들은 무슨 놀이를 하고 있나요?",
        validAnswers: ["공기놀이", "공기", "공기 놀이"],
        placeholder: "놀이 이름을 적어주세요"
      },
      {
        id: 9,
        type: "short",
        title: "9. 미술관에서는 몇 월에 어린이들이 그린 그림을 전시할 예정인가요?",
        validAnswers: ["11월", "11", "십일월", "11 월"],
        placeholder: "숫자만 써도 괜찮아요 (예: 11)",
        guideHint: "💡 숫자만 써도 괜찮습니다! (예: 11 또는 11월)"
      },
      {
        id: 10,
        type: "short",
        title: "10. 미술관 관장은 어린이들을 어디에 초대하고 싶어 하나요?",
        validAnswers: ["특별 전시회", "특별전시회", "특별 전시", "특별전시"],
        placeholder: "초대하고 싶은 행사를 적어주세요 (5글자)",
        guideHint: "💡 힌트: 정답은 5글자입니다!"
      }
    ];

    let currentIndex = 0; // 0 to 9
    let currentSelectedAnswer = null; // for choice: number (1..4), for short: string
    let consecutiveFails = 0; // 0, 1 -> if reaches 2, resets to Q1
    let isSoundOn = true;
    let synth = null;

    function initSound() {
      if (!synth && window.Tone) {
        try {
          synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" },
            envelope: { attack: 0.02, decay: 0.1, sustain: 0.2, release: 0.4 }
          }).toDestination();
          synth.volume.value = -6;
        } catch (e) {
          console.warn("Audio Context init deferred:", e);
        }
      }
    }

    function playSound(type) {
      if (!isSoundOn) return;
      try {
        if (Tone.context.state !== 'running') {
          Tone.start();
        }
        initSound();
        if (!synth) return;

        const now = Tone.now();
        if (type === 'select') {
          synth.triggerAttackRelease("E5", "16n", now);
        } else if (type === 'correct') {
          synth.triggerAttackRelease("C5", "16n", now);
          synth.triggerAttackRelease("E5", "16n", now + 0.08);
          synth.triggerAttackRelease("G5", "16n", now + 0.16);
          synth.triggerAttackRelease("C6", "8n", now + 0.24);
        } else if (type === 'wrong') {
          synth.triggerAttackRelease(["D3", "F3"], "8n", now);
        } else if (type === 'reset') {
          synth.triggerAttackRelease(["C3", "G2"], "4n", now);
        }
      } catch (err) {
        console.error("Sound play error:", err);
      }
    }

    function toggleSound() {
      isSoundOn = !isSoundOn;
      const soundIcon = document.getElementById("soundIcon");
      const soundText = document.getElementById("soundText");
      if (isSoundOn) {
        soundIcon.textContent = "🔊";
        soundText.textContent = "소리 켬";
        showToast("효과음이 켜졌습니다 🔔");
        playSound('select');
      } else {
        soundIcon.textContent = "🔇";
        soundText.textContent = "소리 끔";
        showToast("효과음이 꺼졌습니다");
      }
    }

    let toastTimeout = null;
    function showToast(msg, icon = "💡") {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      const toastIcon = document.getElementById("toastIcon");

      toastMsg.textContent = msg;
      toastIcon.textContent = icon;
      toast.classList.remove("opacity-0", "pointer-events-none");
      toast.classList.add("opacity-100");

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0", "pointer-events-none");
      }, 2600);
    }

    function renderCardQuestion() {
      const q = quizData[currentIndex];

      // Update Header & Tags
      document.getElementById("currentNumberText").textContent = currentIndex + 1;
      document.getElementById("cardBadge").textContent = q.type === "choice" ? "객관식" : "단답형 주관식";
      document.getElementById("cardQuestionTitle").textContent = q.title;

      // Progress bar
      const progressPercent = ((currentIndex + 1) / quizData.length) * 100;
      document.getElementById("progressBar").style.width = `${progressPercent}%`;

      // Update Lives / Warning badge
      const heartsContainer = document.getElementById("heartsContainer");
      const attemptWarningBadge = document.getElementById("attemptWarningBadge");
      const feedbackBox = document.getElementById("cardFeedback");
      feedbackBox.className = "hidden rounded-2xl p-4 text-sm font-medium transition-all mb-4";
      feedbackBox.innerHTML = "";

      if (consecutiveFails === 0) {
        heartsContainer.innerHTML = "❤️❤️";
        attemptWarningBadge.className = "text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200";
        attemptWarningBadge.textContent = "첫 번째 도전 (기회 2개)";
      } else {
        heartsContainer.innerHTML = "❤️🖤";
        attemptWarningBadge.className = "text-xs font-bold text-rose-700 bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-200 animate-pulse";
        attemptWarningBadge.textContent = "마지막 기회! 한 번 더 틀리면 처음으로 리셋";
      }

      const interactiveBody = document.getElementById("cardInteractiveBody");
      interactiveBody.innerHTML = "";

      currentSelectedAnswer = null;

      if (q.type === "choice") {
        const choiceGrid = document.createElement("div");
        choiceGrid.className = "grid grid-cols-1 sm:grid-cols-2 gap-3";

        q.options.forEach((optText, optIdx) => {
          const optNumber = optIdx + 1;

          const btn = document.createElement("button");
          btn.type = "button";
          btn.id = `choice-btn-${optNumber}`;
          btn.className = "w-full text-left p-4 rounded-2xl border-2 transition-all flex items-center space-x-3 text-sm md:text-base font-semibold border-stone-200 bg-white hover:border-amber-400 hover:bg-amber-50/40 text-stone-700";

          const circleBadge = document.createElement("span");
          circleBadge.className = "w-8 h-8 rounded-xl flex items-center justify-center text-xs font-black shrink-0 transition-colors bg-stone-100 text-stone-600";
          circleBadge.textContent = optNumber;

          const label = document.createElement("span");
          label.className = "flex-1 break-keep";
          label.textContent = optText;

          btn.appendChild(circleBadge);
          btn.appendChild(label);

          btn.onclick = () => {
            currentSelectedAnswer = optNumber;
            // update selection styles
            q.options.forEach((_, idx) => {
              const b = document.getElementById(`choice-btn-${idx + 1}`);
              const badge = b.querySelector("span:first-child");
              if (idx + 1 === optNumber) {
                b.className = "w-full text-left p-4 rounded-2xl border-2 transition-all flex items-center space-x-3 text-sm md:text-base font-semibold border-amber-500 bg-amber-50 text-amber-900 shadow-sm ring-2 ring-amber-200";
                badge.className = "w-8 h-8 rounded-xl flex items-center justify-center text-xs font-black shrink-0 transition-colors bg-amber-500 text-white shadow-sm";
              } else {
                b.className = "w-full text-left p-4 rounded-2xl border-2 transition-all flex items-center space-x-3 text-sm md:text-base font-semibold border-stone-200 bg-white hover:border-amber-300 text-stone-700";
                badge.className = "w-8 h-8 rounded-xl flex items-center justify-center text-xs font-black shrink-0 transition-colors bg-stone-100 text-stone-600";
              }
            });
            playSound('select');
          };

          choiceGrid.appendChild(btn);
        });

        interactiveBody.appendChild(choiceGrid);
      } else {
        // Subjective short answer
        const inputWrap = document.createElement("div");
        inputWrap.className = "flex flex-col space-y-3";

        const input = document.createElement("input");
        input.id = "shortAnswerInput";
        input.type = "text";
        input.placeholder = q.placeholder;
        input.autocomplete = "off";
        input.className = "w-full px-5 py-4 rounded-2xl border-2 border-stone-200 focus:border-amber-500 focus:outline-none focus:ring-4 focus:ring-amber-100 text-base md:text-lg font-bold text-stone-800 transition shadow-inner placeholder:font-normal placeholder:text-stone-400";
        
        input.oninput = (e) => {
          currentSelectedAnswer = e.target.value;
        };
        input.onkeydown = (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            verifyCurrentAnswer();
          }
        };

        const hint = document.createElement("p");
        hint.className = "text-xs text-stone-500 flex items-center gap-1.5 flex-wrap";
        if (q.guideHint) {
          hint.innerHTML = `<span class="bg-amber-100 text-amber-900 font-bold px-2 py-0.5 rounded-md border border-amber-200">${q.guideHint}</span> <span class="text-stone-400">정답 입력 후 [정답 확인하기]를 눌러주세요.</span>`;
        } else {
          hint.innerHTML = `<span>✏️</span> 정답을 입력한 뒤 아래 [정답 확인하기] 버튼을 눌러주세요.`;
        }

        inputWrap.appendChild(input);
        inputWrap.appendChild(hint);
        interactiveBody.appendChild(inputWrap);

        setTimeout(() => input.focus(), 80);
      }
    }

    function normalizeText(text) {
      if (!text) return "";
      return String(text).trim().toLowerCase().replace(/\s+/g, "");
    }

    function checkAnswer(q, userAns) {
      if (q.type === "choice") {
        return userAns === q.answer;
      } else {
        const cleanUser = normalizeText(userAns);
        if (!cleanUser) return false;
        return q.validAnswers.some(ans => normalizeText(ans) === cleanUser);
      }
    }

    function verifyCurrentAnswer() {
      const q = quizData[currentIndex];
      const feedbackBox = document.getElementById("cardFeedback");
      const cardBox = document.getElementById("questionCardBox");

      if (currentSelectedAnswer === null || String(currentSelectedAnswer).trim() === "") {
        showToast(q.type === "choice" ? "보기를 선택해 주세요!" : "정답을 입력해 주세요!", "⚠️");
        return;
      }

      const isCorrect = checkAnswer(q, currentSelectedAnswer);

      if (isCorrect) {
        // Correct answer!
        playSound('correct');
        consecutiveFails = 0; // reset consecutive fail count for next question

        feedbackBox.className = "block bg-emerald-50 border border-emerald-300 text-emerald-800 rounded-2xl p-4 text-sm font-bold transition-all mb-4 text-center animate-bounce";
        feedbackBox.innerHTML = `🎉 정답입니다! 다음 문제로 넘어갑니다.`;

        // Temporarily disable button to prevent double-click
        const btn = document.getElementById("verifyAnswerBtn");
        btn.disabled = true;

        setTimeout(() => {
          btn.disabled = false;
          currentIndex++;
          if (currentIndex >= quizData.length) {
            // All 10 questions passed! Show Google Form
            showSuccessView();
          } else {
            renderCardQuestion();
          }
        }, 800);

      } else {
        // WRONG ANSWER - Never reveal the correct answer!
        consecutiveFails++;
        playSound('wrong');

        // Shake animation effect on the card
        cardBox.classList.add("translate-x-2");
        setTimeout(() => cardBox.classList.remove("translate-x-2"), 100);

        if (consecutiveFails >= 2) {
          // Failed twice consecutively on the same question -> RESET to Question 1!
          playSound('reset');
          feedbackBox.className = "block bg-rose-100 border border-rose-400 text-rose-900 rounded-2xl p-4 text-sm font-bold transition-all mb-4 text-center";
          feedbackBox.innerHTML = `❌ 같은 문제를 2번 연속 틀렸습니다!<br><span class="text-xs font-semibold text-rose-700">아쉽지만 1번 문제부터 다시 도전해야 합니다.</span>`;

          const btn = document.getElementById("verifyAnswerBtn");
          btn.disabled = true;

          showToast("2회 연속 오답으로 1번부터 다시 시작합니다.", "🔄");

          setTimeout(() => {
            btn.disabled = false;
            currentIndex = 0;
            consecutiveFails = 0;
            renderCardQuestion();
          }, 1800);

        } else {
          // First fail: give one more chance, DO NOT show answer
          feedbackBox.className = "block bg-amber-50 border border-amber-300 text-amber-900 rounded-2xl p-4 text-sm font-bold transition-all mb-4 text-center";
          feedbackBox.innerHTML = `🤔 틀렸습니다! 문제를 다시 잘 읽고 맞춰보세요. (남은 기회: 1회)`;

          const attemptWarningBadge = document.getElementById("attemptWarningBadge");
          const heartsContainer = document.getElementById("heartsContainer");
          heartsContainer.innerHTML = "❤️🖤";
          attemptWarningBadge.className = "text-xs font-bold text-rose-700 bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-200 animate-pulse";
          attemptWarningBadge.textContent = "마지막 기회! 한 번 더 틀리면 처음으로 리셋";

          showToast("틀렸습니다! 한 번의 기회가 더 있습니다.", "⚠️");
        }
      }
    }

    function showSuccessView() {
      document.getElementById("cardView").classList.add("hidden");
      document.getElementById("progressSection").classList.add("hidden");
      document.getElementById("resultView").classList.remove("hidden");

      playSound('correct');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function confirmRestartQuiz() {
      currentIndex = 0;
      consecutiveFails = 0;
      currentSelectedAnswer = null;
      document.getElementById("resultView").classList.add("hidden");
      document.getElementById("cardView").classList.remove("hidden");
      document.getElementById("progressSection").classList.remove("hidden");
      renderCardQuestion();
      showToast("1번 문제부터 다시 시작합니다!");
    }

    function restartQuiz() {
      confirmRestartQuiz();
    }

    // Initialize application on DOM load
    window.addEventListener("DOMContentLoaded", () => {
      renderCardQuestion();
    });
  </script>
</body>
</html>
