#teacherBtn{position:absolute;right:14px;top:12px;background:#1d4ed8;color:white;font-size:13px;padding:9px 12px}#teacherPanel{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:center;justify-content:center;padding:20px}#teacherPanel.open{display:flex}.teacherBox{width:min(380px,100%);background:white;border-radius:16px;padding:25px}.teacherBox input{width:100%;padding:13px;font-size:18px;margin:12px 0;border:1px solid #94a3b8;border-radius:9px}.teacherBox button{font-size:15px;padding:12px 15px}#teacherStatus{font-size:14px;color:#475569}header{position:relative}</style></head><body><div id="quizPage"><header><h1>📖 오염물이 터졌다</h1><p>글과 그림을 관련지으며 그림책 읽기</p><button id="teacherBtn" type="button" onclick="openTeacher()">교사 로그인</button></header><div id="teacherPanel"><div class="teacherBox"><h2>교사 로그인</h2><form id="teacherForm" onsubmit="teacherLogin(event)"><input id="teacherPassword" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호" required><button type="submit" style="background:#2563eb;color:white">로그인</button> <button type="button" onclick="closeTeacher()">닫기</button></form><p id="teacherStatus" role="status"></p></div></div><main><div class="progress"><span id="progressText">푼 문제: 0 / 11</span><div class="track"><div class="fill" id="fill"></div></div></div><div id="questions"></div><div id="result" aria-live="polite"></div><div class="actions"><button id="check" onclick="grade()">정답 확인</button><button id="reset" onclick="resetQuiz()">다시 풀기</button></div></main><script>
const quiz=[
{q:'철이가 아침 식사를 남기지 않고 다 먹은 까닭으로 알맞은 것은?',o:['아버지가 음식을 남기지 말라고 하셨기 때문이다.','꿈 때문에 마음이 뒤숭숭했기 때문이다.','평소보다 배가 많이 고팠기 때문이다.','어머니가 특별한 음식을 준비하셨기 때문이다.'],a:1},
{q:'그림 속 검은 오염물들이 집 안의 배관을 가득 채우고 있는 장면이 나타내는 뜻으로 가장 알맞은 것은?',o:['집 안의 수도관이 새것으로 교체되고 있다.','가족들이 물을 사용하는 방법을 잘 알고 있다.','가족의 생활 속 행동이 물 오염과 관련되어 있다.','검은 오염물들이 철이의 가족을 도와주고 있다.'],a:2},
{q:'아버지가 세탁물을 여러 번 나누어 빨고, 어머니가 샴푸를 많이 사용하는 그림을 함께 살펴보고 알 수 있는 내용은?',o:['물을 많이 사용하면 언제나 옷이 더 깨끗해진다.','가족 모두 물을 아끼기 위해 노력하고 있다.','물의 낭비와 오염은 여러 생활 습관에서 생길 수 있다.','세탁과 머리 감기는 물 오염과 관계가 없다.'],a:2},
{q:'철이가 우유를 싱크대에 붓는 장면과 검은 오염물 그림을 관련지어 해석한 것으로 가장 알맞은 것은?',o:['먹다 남은 우유를 버리는 행동도 물 오염의 원인이 될 수 있다.','우유를 싱크대에 버리면 오염된 물이 깨끗해진다.','우유를 버리면 수도관의 물이 더 빠르게 흐른다.','싱크대에 버리는 음식물은 모두 저절로 사라진다.'],a:0},
{q:'175쪽에서 어머니가 물을 틀어 놓고 욕실을 청소하는 그림이 보여 주는 문제점은?',o:['욕실 청소에는 물을 전혀 사용하면 안 된다는 점','청소할 때 물을 계속 흘려보내면 물이 낭비될 수 있다는 점','욕실 청소를 하면 집 안의 모든 물이 사라진다는 점','욕실 청소는 반드시 가족 모두가 해야 한다는 점'],a:1},
{q:'176~179쪽에서 검은 오염물들이 화면을 가득 채우고 가족들이 놀라는 모습을 크게 그린 까닭은?',o:['가족들이 새로운 놀이를 시작했음을 보여 주려고','검은 오염물들이 가족의 친구라는 것을 나타내려고','오염물의 위협과 가족들의 두려움을 강조하려고','가족들이 검은색 옷을 좋아한다는 것을 보여 주려고'],a:2},
{q:'철이가 “정말 생생했는데!”라고 말한 까닭으로 가장 알맞은 것은?',o:['꿈속에서 겪은 일이 실제처럼 느껴졌기 때문이다.','꿈속에서 가족과 즐겁게 놀았기 때문이다.','꿈에서 본 일을 모두 잊어버렸기 때문이다.','꿈이 실제로 일어났다는 것을 확인했기 때문이다.'],a:0},
{q:'철이가 “오염물이 터지기 전에 내가 막아야겠어!”라고 생각한 뒤 행동한 모습에서 알 수 있는 철이의 마음은?',o:['오염 문제를 다른 사람에게만 맡기려는 마음','꿈에서 본 일을 친구들에게 자랑하려는 마음','물 오염을 막기 위해 자신부터 실천하려는 마음','물을 사용하는 모든 일을 그만두려는 마음'],a:2},
{q:'마지막 장면에서 철이가 고무장갑과 장화를 착용한 모습이 나타내는 뜻으로 가장 알맞은 것은?',o:['철이가 오염물과 싸우는 놀이를 준비하고 있다.','철이가 물 오염과 낭비를 막기 위해 적극적으로 행동하려 한다.','철이가 가족들에게 청소를 모두 맡기려고 한다.','철이가 꿈속으로 다시 들어가려고 준비하고 있다.'],a:1},
{q:'이 그림책에서 글과 그림을 함께 읽었을 때 얻을 수 있는 효과로 가장 알맞은 것은?',o:['그림만 보면 글의 내용은 읽을 필요가 전혀 없다.','글과 그림은 언제나 똑같은 정보만 전달한다.','글에 직접 쓰이지 않은 오염의 모습과 인물의 감정을 더 생생하게 이해할 수 있다.','그림을 보면 이야기의 순서를 마음대로 바꾸어도 된다.'],a:2}
];
let matches=[null,null,null],selectedLeft=null;
const leftTexts=['꿈 때문에 마음이 <span class="em">뒤숭숭한</span> 철이는','거기에다 물을 계속 튼 <span class="em">채로</span> 욕실 청소를 해요!','철이의 <span class="em">행동</span>이 시작됩니다.'];
const rightTexts=['이미 있는 상태 그대로.','느낌이나 마음이 어수선한.','몸을 움직여 동작을 하거나 어떤 일을 함.'];
const rightAnswers=[1,0,2];
function renderMatch(){
 const sec=document.createElement('section');sec.className='question';sec.id='q10';
 sec.innerHTML='<h2>11. 파란색 낱말의 뜻으로 알맞은 것을 찾아 선으로 이어 봅시다.</h2><p class="match-hint">왼쪽 낱말을 누른 뒤, 뜻이 맞는 오른쪽 설명을 누르세요. 연결을 바꾸려면 다시 선택하세요.</p>';
 const grid=document.createElement('div');grid.className='match-grid';
 const lc=document.createElement('div');lc.className='match-col';const rc=document.createElement('div');rc.className='match-col';
 leftTexts.forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.className='match-item left';b.innerHTML=v;b.onclick=()=>{selectedLeft=i;refreshMatch()};lc.appendChild(b)});
 rightTexts.forEach((v,j)=>{const b=document.createElement('button');b.type='button';b.className='match-item right';b.textContent=v;b.onclick=()=>{if(selectedLeft===null)return;matches=matches.map(x=>x===j?null:x);matches[selectedLeft]=j;selectedLeft=null;refreshMatch();updateProgress()};rc.appendChild(b)});
 grid.append(lc,rc);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','match-svg');svg.setAttribute('aria-hidden','true');grid.appendChild(svg);sec.appendChild(grid);
 const pairs=document.createElement('div');pairs.className='match-pairs';sec.appendChild(pairs);
 const feedback=document.createElement('div');feedback.className='feedback';sec.appendChild(feedback);root.appendChild(sec);refreshMatch();
}
function refreshMatch(){const sec=document.getElementById('q10');if(!sec)return;const lb=sec.querySelectorAll('.left'),rb=sec.querySelectorAll('.right');lb.forEach((b,i)=>{b.classList.toggle('active',selectedLeft===i);b.classList.toggle('paired',matches[i]!==null)});rb.forEach((b,j)=>b.classList.toggle('paired',matches.includes(j)));sec.querySelector('.match-pairs').textContent='';drawMatchLines()}
function drawMatchLines(){
 const grid=document.querySelector('#q10 .match-grid');if(!grid)return;
 const svg=grid.querySelector('.match-svg'),bounds=grid.getBoundingClientRect();
 svg.setAttribute('viewBox',`0 0 ${bounds.width} ${bounds.height}`);
 svg.replaceChildren();
 const left=grid.querySelectorAll('.match-item.left'),right=grid.querySelectorAll('.match-item.right');
 matches.forEach((j,i)=>{if(j===null)return;
 const a=left[i].getBoundingClientRect(),b=right[j].getBoundingClientRect();
 const x1=a.right-bounds.left+7,y1=a.top+a.height/2-bounds.top;
 const x2=b.left-bounds.left-7,y2=b.top+b.height/2-bounds.top;
 const line=document.createElementNS('http://www.w3.org/2000/svg','line');
 for(const [k,v] of Object.entries({x1,y1,x2,y2,stroke:'#2563eb','stroke-width':4,'stroke-linecap':'round'}))line.setAttribute(k,v);
 svg.appendChild(line);
 for(const [x,y] of [[x1,y1],[x2,y2]]){const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.setAttribute('r',5);dot.setAttribute('fill','#2563eb');svg.appendChild(dot)}
 });
}
window.addEventListener('resize',drawMatchLines);
const root=document.getElementById('questions');function render(){root.innerHTML='';quiz.forEach((item,i)=>{const section=document.createElement('section');section.className='question';section.id='q'+i;const h=document.createElement('h2');h.textContent=(i+1)+'. '+item.q;section.appendChild(h);item.o.forEach((choice,j)=>{const label=document.createElement('label');label.className='option';const radio=document.createElement('input');radio.type='radio';radio.name='question'+i;radio.value=j;radio.addEventListener('change',updateProgress);const span=document.createElement('span');span.textContent=['① ','② ','③ ','④ '][j]+choice;label.append(radio,span);section.appendChild(label)});const feedback=document.createElement('div');feedback.className='feedback';section.appendChild(feedback);root.appendChild(section)});renderMatch()}function updateProgress(){let count=0;quiz.forEach((_,i)=>{if(document.querySelector('input[name="question'+i+'"]:checked'))count++});if(matches.every(x=>x!==null))count++;document.getElementById('progressText').textContent='푼 문제: '+count+' / '+(quiz.length+1);document.getElementById('fill').style.width=(count/(quiz.length+1)*100)+'%'}function grade(){let unanswered=[];quiz.forEach((_,i)=>{if(!document.querySelector('input[name="question'+i+'"]:checked'))unanswered.push(i+1)});if(matches.some(x=>x===null))unanswered.push(11);if(unanswered.length){alert('아직 풀지 않은 문제가 있습니다: '+unanswered.join(', ')+'번');return}let score=0,wrong=[];quiz.forEach((item,i)=>{const selected=Number(document.querySelector('input[name="question'+i+'"]:checked').value);const section=document.getElementById('q'+i);const feedback=section.querySelector('.feedback');section.classList.remove('wrong','correct');if(selected===item.a){score++;section.classList.add('correct');feedback.textContent='✓ 정답입니다.';feedback.style.color='#15803d'}else{wrong.push(i+1);section.classList.add('wrong');feedback.textContent='✕ 다시 생각해 보세요.';feedback.style.color='#dc2626'}});const msec=document.getElementById('q10'),mf=msec.querySelector('.feedback');msec.classList.remove('wrong','correct');if(matches.every((v,i)=>v===rightAnswers[i])){score++;msec.classList.add('correct');mf.textContent='✓ 정답입니다.';mf.style.color='#15803d'}else{wrong.push(11);msec.classList.add('wrong');mf.textContent='✕ 다시 생각해 보세요.';mf.style.color='#dc2626'}const result=document.getElementById('result');result.style.display='block';result.innerHTML='<h2>'+Math.round(score/11*100)+'점 / 100점</h2>'+(wrong.length===0?'🎉 모든 문제를 맞혔습니다! 참 잘했어요!':'다시 풀어 볼 문제: '+wrong.join(', ')+'번');if(wrong.length===0){showAutoEvaluation()}else{result.scrollIntoView({behavior:'smooth',block:'center'})}}function resetQuiz(){if(!confirm('모든 답안을 지우고 다시 풀까요?'))return;matches=[null,null,null];selectedLeft=null;render();document.getElementById('result').style.display='none';updateProgress();window.scrollTo({top:0,behavior:'smooth'})}render();
let teacherMode=false;
function openTeacher(){if(teacherMode){teacherMode=false;document.getElementById('teacherBtn').textContent='교사 로그인';resetTeacherView();return;}document.getElementById('teacherPanel').classList.add('open');document.getElementById('teacherPassword').focus()}
function closeTeacher(){document.getElementById('teacherPanel').classList.remove('open');document.getElementById('teacherPassword').value='';document.getElementById('teacherStatus').textContent=''}
async function teacherLogin(e){e.preventDefault();const value=document.getElementById('teacherPassword').value;const bytes=new TextEncoder().encode('quiz-teacher-2026:'+value);const digest=await crypto.subtle.digest('SHA-256',bytes);const hex=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');if(hex!==TEACHER_DIGEST){document.getElementById('teacherStatus').textContent='비밀번호가 일치하지 않습니다.';return;}teacherMode=true;closeTeacher();document.getElementById('teacherBtn').textContent='교사 모드 종료';fillTeacherAnswers()}
const TEACHER_DIGEST='e2feefd1156d2f540a0d3241a26c2e965a9fcdd89bbc0bb29b48e584e7aec59a';
function fillTeacherAnswers(){quiz.forEach((item,i)=>{const r=document.querySelector('input[name="question'+i+'"][value="'+item.a+'"]');if(r)r.checked=true});matches=[...rightAnswers];selectedLeft=null;refreshMatch();updateProgress();document.querySelectorAll('.question').forEach(sec=>{sec.classList.remove('wrong','correct');sec.querySelector('.feedback').textContent=''});document.getElementById('result').style.display='none'}
function resetTeacherView(){document.getElementById('quizPage').hidden=false;document.getElementById('autoEvaluationPage').hidden=true;document.getElementById('completionModal').hidden=true;matches=[null,null,null];selectedLeft=null;render();updateProgress();document.getElementById('result').style.display='none'}
const originalReset=resetQuiz;
resetQuiz=function(){if(!confirm('모든 답안을 지우고 다시 풀까요?'))return;matches=[null,null,null];selectedLeft=null;render();if(teacherMode)fillTeacherAnswers();else updateProgress();document.getElementById('result').style.display='none';window.scrollTo({top:0,behavior:'smooth'})};
</script></div>
