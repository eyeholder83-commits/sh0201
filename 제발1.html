<!DOCTYPE html>
<html lang="ko" class="w-full h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>초등학교 공개수업 실시간 감성 소통 칠판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Pretendard', 'Noto Sans KR', sans-serif !important; -webkit-font-smoothing: antialiased; }
    @keyframes starPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(253, 224, 71, 0.95)) drop-shadow(0 0 20px rgba(234, 179, 8, 0.6)); }
      50% { transform: scale(1.18); filter: drop-shadow(0 0 18px rgba(254, 240, 138, 1)) drop-shadow(0 0 32px rgba(245, 158, 11, 0.85)); }
    }
    .star-entity-glow { animation: starPulse 3s ease-in-out infinite; cursor: pointer; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
  </style>

  <!-- Firebase v9+ SDK 연동 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔴 선생님의 Firebase 키가 자동으로 적용되었습니다.
    const firebaseConfig = {
      apiKey: "AIzaSyDzWtxdH-8FX81sKUTcj3phLcLbMmk5zbk",
      authDomain: "open-class-0201-bb3d4.firebaseapp.com",
      projectId: "open-class-0201-bb3d4",
      storageBucket: "open-class-0201-bb3d4.firebasestorage.app",
      messagingSenderId: "155705765949",
      appId: "1:155705765949:web:da526c6ed345220385fa54"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
    window.firestoreModule = { collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, getDocs, deleteDoc, doc };
  </script>
</head>
<body class="relative w-full h-full bg-[#050814] select-none text-slate-100 overflow-hidden">

  <!-- 배경 밤하늘 -->
  <div id="blackboardSky" class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-b from-[#060a1f] via-[#09102c] to-[#040612]"></div>
    <div id="ambientStarsContainer" class="absolute inset-0"></div>
  </div>

  <audio id="externalBgmAudio" loop preload="auto" class="hidden"></audio>

  <!-- 0. 첫 화면 (포털 로비) -->
  <section id="viewPortal" class="relative z-20 w-full h-full flex flex-col justify-between overflow-y-auto px-4 py-6 md:p-8">
    <header class="text-center pt-2 md:pt-4">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-slate-800/80 border border-slate-700/80 text-amber-300 text-xs font-bold mb-3 shadow-lg">
        <span class="animate-pulse">✨</span>
        <span>초등학교 공개수업 실시간 감성 소통 시스템</span>
      </div>
      <h1 class="text-2xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-100 to-amber-300 tracking-tight">
        우리에게 영향을 준 사람들
      </h1>
      <p class="text-xs md:text-sm text-slate-400 mt-2 font-medium">참여 방식을 선택해 주세요. (실시간 데이터베이스 연동됨)</p>
    </header>

    <div class="max-w-5xl mx-auto w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-5 my-auto py-6">
      <div class="rounded-3xl p-5 bg-slate-900/85 border border-amber-500/40 flex flex-col justify-between shadow-xl">
        <div>
          <div class="w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-300 flex items-center justify-center text-2xl mb-3">🖥️</div>
          <h2 class="text-lg font-black text-white">전자칠판</h2>
          <p class="text-xs text-slate-400 mt-1.5">교실 전면 메인 밤하늘 무대입니다.</p>
        </div>
        <button onclick="switchView('board')" class="mt-4 w-full py-3 rounded-2xl bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-black text-xs">칠판 화면 열기 ➔</button>
      </div>

      <div class="rounded-3xl p-5 bg-slate-900/85 border border-indigo-500/40 flex flex-col justify-between shadow-xl">
        <div>
          <div class="w-12 h-12 rounded-2xl bg-indigo-500/20 text-indigo-300 flex items-center justify-center text-2xl mb-3">📱</div>
          <h2 class="text-lg font-black text-white">교사 리모컨</h2>
          <p class="text-xs text-slate-400 mt-1.5">선생님 원격 제어 및 안내글 전송</p>
        </div>
        <button onclick="switchView('teacher')" class="mt-4 w-full py-3 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-black text-xs">리모컨 열기 ➔</button>
      </div>

      <div class="rounded-3xl p-5 bg-slate-900/85 border border-emerald-500/40 flex flex-col justify-between shadow-xl">
        <div>
          <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-300 flex items-center justify-center text-2xl mb-3">🎒</div>
          <h2 class="text-lg font-black text-white">학생 배움</h2>
          <p class="text-xs text-slate-400 mt-1.5">학생 태블릿 전용 작성 화면</p>
        </div>
        <button onclick="switchView('student')" class="mt-4 w-full py-3 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-black text-xs">학생 작성 화면 ➔</button>
      </div>

      <div class="rounded-3xl p-5 bg-slate-900/85 border border-rose-500/40 flex flex-col justify-between shadow-xl">
        <div>
          <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-300 flex items-center justify-center text-2xl mb-3">💌</div>
          <h2 class="text-lg font-black text-white">학부모 응원</h2>
          <p class="text-xs text-slate-400 mt-1.5">학부모 스마트폰 전용 응원 화면</p>
        </div>
        <button onclick="switchView('parent')" class="mt-4 w-full py-3 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-500 text-white font-black text-xs">응원 작성 화면 ➔</button>
      </div>
    </div>
  </section>

  <!-- 1. 전자칠판 메인 화면 -->
  <main id="viewBoard" class="hidden relative z-10 w-full h-full flex flex-col justify-between">
    <header class="w-full px-6 py-3.5 flex items-center justify-between backdrop-blur-md bg-slate-950/40 border-b border-slate-800 z-20">
      <div class="flex items-center gap-3">
        <button onclick="switchView('portal')" class="px-3 py-1.5 rounded-xl bg-slate-800 text-xs font-bold">🏠 첫 화면</button>
        <h1 class="text-lg md:text-xl font-black text-amber-300">우리에게 영향을 준 사람들 (실시간 수신중)</h1>
      </div>
      <button onclick="switchView('teacher')" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-black">📱 교사 리모컨</button>
    </header>

    <div id="floatingStage" class="relative flex-1 w-full h-full overflow-hidden"></div>

    <aside class="absolute bottom-4 left-5 z-20 flex flex-col gap-2 w-56">
      <div class="backdrop-blur-xl bg-slate-900/85 border border-slate-700 rounded-2xl p-2.5 shadow-2xl flex flex-col gap-2 max-h-[55vh]">
        <div class="flex items-center justify-between pb-1.5 border-b border-slate-800 px-1">
          <span class="text-xs font-bold text-slate-200">🌱 나눈 사람들</span>
          <span id="leftListCountBadge" class="text-xs font-black text-amber-300 bg-amber-500/20 px-1.5 py-0.5 rounded-full">0명</span>
        </div>
        <div id="leftParticipantList" class="flex flex-col gap-1.5 overflow-y-auto pr-1 flex-1 max-h-40 text-xs"></div>
        <button id="btnGatherFormation" onclick="cycleGatherFormation()" class="w-full py-2 rounded-xl bg-gradient-to-r from-rose-500 via-pink-500 to-purple-600 text-white font-black text-xs shadow-lg">✨ 별들 모이기</button>
      </div>
    </aside>
  </main>

  <!-- 2. 학생 태블릿 화면 -->
  <section id="viewStudent" class="hidden absolute inset-0 z-30 w-full h-full bg-slate-950 flex flex-col justify-center px-4 overflow-y-auto">
    <form id="formStudent" onsubmit="handleStudentFormSubmit(event)" class="max-w-md mx-auto w-full bg-slate-900 border border-emerald-500/30 rounded-3xl p-6 flex flex-col gap-4 shadow-2xl">
      <h2 class="text-lg font-bold text-emerald-300 text-center">🎒 학생 배움 이야기 나눔터</h2>
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">내 이름 선택</label>
        <select id="studentAuthorSelect" required class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-700 text-white font-bold text-sm">
          <option value="" disabled selected>우리 반 명단에서 이름을 골라주세요</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">메시지</label>
        <textarea id="studentMessageInput" rows="3" required placeholder="소중한 배움 소감을 적어주세요..." class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-700 text-white text-sm"></textarea>
      </div>
      <button type="submit" class="w-full py-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-sm shadow-lg">칠판으로 슝 날려보내기 ✨</button>
    </form>
  </section>

  <!-- 3. 학부모 스마트폰 화면 -->
  <section id="viewParent" class="hidden absolute inset-0 z-30 w-full h-full bg-slate-950 flex flex-col justify-center px-4 overflow-y-auto">
    <form id="formParent" onsubmit="handleParentFormSubmit(event)" class="max-w-md mx-auto w-full bg-slate-900 border border-rose-500/30 rounded-3xl p-6 flex flex-col gap-4 shadow-2xl">
      <h2 class="text-lg font-bold text-rose-300 text-center">💌 학부모 사랑의 격려 편지</h2>
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">보내시는 분 (예: 철수 엄마)</label>
        <input type="text" id="parentAuthorInput" required placeholder="성함을 입력하세요" class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-700 text-white font-bold text-sm" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">응원 메시지</label>
        <textarea id="parentMessageInput" rows="3" required placeholder="아이들에게 따뜻한 응원을 보내주세요..." class="w-full p-3 rounded-2xl bg-slate-800 border border-slate-700 text-white text-sm"></textarea>
      </div>
      <button type="submit" class="w-full py-3.5 rounded-2xl bg-rose-500 hover:bg-rose-400 text-white font-black text-sm shadow-lg">메시지 보내기 💖</button>
    </form>
  </section>

  <!-- 4. 교사 스마트폰 리모컨 -->
  <section id="viewTeacher" class="hidden absolute inset-0 z-30 w-full h-full bg-slate-950 flex flex-col p-6 overflow-y-auto">
    <div class="max-w-md mx-auto w-full flex flex-col gap-4">
      <div class="bg-slate-900 border border-amber-500/40 rounded-3xl p-5 shadow-xl flex flex-col gap-3">
        <h3 class="text-sm font-bold text-amber-300">👑 교사 칭찬 메시지 전송</h3>
        <form onsubmit="handleTeacherMessageSubmit(event)" class="flex flex-col gap-2">
          <textarea id="teacherMessageInput" rows="2" required placeholder="선생님의 응원글을 띄웁니다..." class="w-full p-2.5 rounded-xl bg-slate-800 text-white text-xs"></textarea>
          <button type="submit" class="py-2.5 rounded-xl bg-amber-400 text-slate-950 font-black text-xs">칠판에 선생님 글 띄우기</button>
        </form>
      </div>

      <button onclick="switchView('board')" class="py-3.5 rounded-2xl bg-indigo-600 text-white font-black text-xs">칠판 화면으로 이동 ➔</button>
      <button onclick="clearAllBoardItems()" class="py-3.5 rounded-2xl bg-rose-700 text-white font-black text-xs">🗑️ 칠판의 모든 글 전체 삭제</button>
    </div>
  </section>

  <!-- 상세 정보 모달 -->
  <div id="detailModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
    <div class="w-full max-w-lg bg-slate-900 border border-slate-700 rounded-3xl p-6 flex flex-col gap-4 text-slate-100">
      <div class="flex items-center justify-between pb-2 border-b border-slate-800">
        <h2 id="modalAuthor" class="text-xl font-black text-white">이름</h2>
        <button onclick="closeDetailModal()" class="text-slate-400 hover:text-white font-bold text-lg">✕</button>
      </div>
      <p id="modalMessage" class="text-base font-semibold leading-relaxed text-slate-200 whitespace-pre-line"></p>
    </div>
  </div>

  <script>
    var CLASS_STUDENTS = ['김서아', '김수현', '김윤아', '김태영', '김하랑', '나예린', '박민제', '박선우', '양수빈', '유소영', '이대운', '이새봄', '이서율', '이진서', '이채원', '이초은', '이태환', '이하린', '한규빈', '한유은', '현지우', '황지우'];
    var state = { items: [], formationMode: 'free', lastTimestamp: 0 };

    function populateStudentSelect() {
      var sel = document.getElementById('studentAuthorSelect');
      if (!sel) return;
      sel.innerHTML = '<option value="" disabled selected>우리 반 명단에서 이름을 골라주세요</option>';
      for (var i = 0; i < CLASS_STUDENTS.length; i++) {
        var opt = document.createElement('option');
        opt.value = CLASS_STUDENTS[i]; opt.textContent = CLASS_STUDENTS[i];
        sel.appendChild(opt);
      }
    }

    function initFirebaseListener() {
      var checkInterval = setInterval(function() {
        if (window.db && window.firestoreModule) {
          clearInterval(checkInterval);
          var db = window.db;
          var f = window.firestoreModule;
          var q = f.query(f.collection(db, "boardItems"), f.orderBy("createdAt", "asc"));

          f.onSnapshot(q, function(snapshot) {
            snapshot.docChanges().forEach(function(change) {
              if (change.type === "added") {
                var data = change.doc.data();
                data.id = change.doc.id;
                addCardToStage(data);
              } else if (change.type === "removed") {
                removeCardFromStage(change.doc.id);
              }
            });
          });
        }
      }, 300);
    }

    async function handleStudentFormSubmit(e) {
      e.preventDefault();
      var author = document.getElementById('studentAuthorSelect').value;
      var msg = document.getElementById('studentMessageInput').value.trim();
      if (!author || !msg) return;

      var f = window.firestoreModule;
      await f.addDoc(f.collection(window.db, "boardItems"), {
        role: 'student', author: author, message: msg, createdAt: f.serverTimestamp()
      });
      alert('전자칠판으로 전송되었습니다! ✨');
      document.getElementById('formStudent').reset();
    }

    async function handleParentFormSubmit(e) {
      e.preventDefault();
      var author = document.getElementById('parentAuthorInput').value.trim();
      var msg = document.getElementById('parentMessageInput').value.trim();
      if (!author || !msg) return;

      var f = window.firestoreModule;
      await f.addDoc(f.collection(window.db, "boardItems"), {
        role: 'parent', author: author, message: msg, createdAt: f.serverTimestamp()
      });
      alert('전자칠판으로 응원이 전송되었습니다! 💖');
      document.getElementById('formParent').reset();
    }

    async function handleTeacherMessageSubmit(e) {
      e.preventDefault();
      var input = document.getElementById('teacherMessageInput');
      var msg = input.value.trim();
      if (!msg) return;

      var f = window.firestoreModule;
      await f.addDoc(f.collection(window.db, "boardItems"), {
        role: 'teacher', author: '선생님', message: msg, createdAt: f.serverTimestamp()
      });
      alert('선생님 글이 전자칠판에 띄워졌습니다!');
      input.value = '';
    }

    function addCardToStage(item) {
      var stage = document.getElementById('floatingStage');
      var stageW = stage && stage.clientWidth > 100 ? stage.clientWidth : window.innerWidth;
      var stageH = stage && stage.clientHeight > 100 ? stage.clientHeight : window.innerHeight;

      item.x = 80 + Math.random() * Math.max(150, stageW - 320);
      item.y = 80 + Math.random() * Math.max(150, stageH - 260);
      item.vx = (Math.random() - 0.5) * 55;
      item.vy = (Math.random() - 0.5) * 55;
      item.rot = (Math.random() - 0.5) * 6;
      item.waveOffset = Math.random() * Math.PI * 2;

      var el = document.createElement('div');
      el.id = 'entity_' + item.id;
      el.className = 'absolute cursor-pointer transition-transform duration-100';
      
      var isTeacher = item.role === 'teacher';
      var isParent = item.role === 'parent';
      var cardBg = isTeacher ? 'bg-gradient-to-b from-slate-900 to-indigo-950 border-amber-400' : (isParent ? 'bg-slate-900/90 border-rose-500/40' : 'bg-slate-900/90 border-emerald-500/40');
      var roleIcon = isTeacher ? '👑' : (isParent ? '💌' : '🌱');

      el.innerHTML = '<div class="w-56 p-3 rounded-2xl border backdrop-blur-md shadow-xl ' + cardBg + '" onclick="openDetailModal(\'' + item.id + '\')">' +
        '<div class="flex items-center justify-between mb-1">' +
          '<span class="text-xs font-black text-white">' + roleIcon + ' ' + item.author + '</span>' +
        '</div>' +
        '<p class="text-xs text-slate-200 line-clamp-3 leading-snug">' + item.message + '</p>' +
      '</div>';

      item.domElement = el;
      stage.appendChild(el);
      state.items.push(item);
      updateStats();
      updateLeftList();
    }

    function removeCardFromStage(id) {
      var idx = state.items.findIndex(function(it) { return it.id === id; });
      if (idx !== -1) {
        if (state.items[idx].domElement) state.items[idx].domElement.remove();
        state.items.splice(idx, 1);
        updateStats();
        updateLeftList();
      }
    }

    async function clearAllBoardItems() {
      if (!confirm('칠판의 모든 글을 삭제하시겠습니까?')) return;
      var f = window.firestoreModule;
      var querySnapshot = await f.getDocs(f.collection(window.db, "boardItems"));
      querySnapshot.forEach(async function(docSnap) {
        await f.deleteDoc(f.doc(window.db, "boardItems", docSnap.id));
      });
    }

    function openDetailModal(id) {
      var item = state.items.find(function(it) { return it.id === id; });
      if (!item) return;
      document.getElementById('modalAuthor').textContent = item.author;
      document.getElementById('modalMessage').textContent = item.message;
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function updateStats() {
      var badge = document.getElementById('leftListCountBadge');
      if (badge) badge.textContent = state.items.length + '명';
    }

    function updateLeftList() {
      var list = document.getElementById('leftParticipantList');
      if (!list) return;
      list.innerHTML = '';
      state.items.forEach(function(item) {
        var row = document.createElement('div');
        row.className = 'px-2 py-1 rounded-lg bg-slate-800/60 border border-slate-700/40 text-[11px] font-bold text-slate-200 truncate';
        row.textContent = item.author;
        list.appendChild(row);
      });
    }

    function cycleGatherFormation() {
      state.formationMode = state.formationMode === 'free' ? 'heart' : 'free';
      alert(state.formationMode === 'heart' ? '❤️ 카드들이 모입니다!' : '🌌 카드들이 다시 자유롭게 움직입니다.');
    }

    function switchView(viewName) {
      document.getElementById('viewPortal').classList.toggle('hidden', viewName !== 'portal');
      document.getElementById('viewBoard').classList.toggle('hidden', viewName !== 'board');
      document.getElementById('viewStudent').classList.toggle('hidden', viewName !== 'student');
      document.getElementById('viewParent').classList.toggle('hidden', viewName !== 'parent');
      document.getElementById('viewTeacher').classList.toggle('hidden', viewName !== 'teacher');
    }

    function updatePhysicsLoop(timestamp) {
      if (!state.lastTimestamp) state.lastTimestamp = timestamp;
      var dt = Math.min((timestamp - state.lastTimestamp) / 1000, 0.1);
      state.lastTimestamp = timestamp;

      var stage = document.getElementById('floatingStage');
      var stageW = stage ? stage.clientWidth : window.innerWidth;
      var stageH = stage ? stage.clientHeight : window.innerHeight;

      for (var i = 0; i < state.items.length; i++) {
        var item = state.items[i];
        if (!item.domElement) continue;

        if (state.formationMode === 'heart') {
          var t = (i / Math.max(1, state.items.length)) * Math.PI * 2;
          var r = Math.min(stageW, stageH) * 0.022;
          var hx = 16 * Math.pow(Math.sin(t), 3);
          var hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
          var tx = (stageW / 2) + hx * r;
          var ty = (stageH / 2) + hy * r;
          item.x += (tx - item.x) * 4.5 * dt;
          item.y += (ty - item.y) * 4.5 * dt;
        } else {
          item.x += item.vx * dt;
          item.y += item.vy * dt;

          if (item.x < 30) { item.x = 30; item.vx = Math.abs(item.vx); }
          if (item.x > stageW - 240) { item.x = stageW - 240; item.vx = -Math.abs(item.vx); }
          if (item.y < 30) { item.y = 30; item.vy = Math.abs(item.vy); }
          if (item.y > stageH - 160) { item.y = stageH - 160; item.vy = -Math.abs(item.vy); }
        }

        item.domElement.style.transform = 'translate3d(' + item.x + 'px, ' + item.y + 'px, 0px)';
      }
      requestAnimationFrame(updatePhysicsLoop);
    }

    window.onload = function() {
      populateStudentSelect();
      initFirebaseListener();
      requestAnimationFrame(updatePhysicsLoop);
    };
  </script>
</body>
