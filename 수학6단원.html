<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>초등 2학년 곱셈구구 6단 & 비밀 키워드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Gowun Dodum', sans-serif;
      background: radial-gradient(circle at 50% 0%, #eff6ff 0%, #e0f2fe 40%, #f1f5f9 100%);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .font-jua {
      font-family: 'Jua', sans-serif;
    }

    @keyframes modalPop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-modal {
      animation: modalPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes softFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-3px) scale(1.03); }
    }

    .animate-float {
      animation: softFloat 2.2s infinite ease-in-out;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center justify-between p-2 sm:p-5 relative overflow-x-hidden">

  <!-- Confetti Canvas for Celebration -->
  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50 w-full h-full"></canvas>

  <header class="w-full max-w-4xl bg-white/95 backdrop-blur-md rounded-3xl shadow-sm border border-sky-200/80 p-3 sm:p-4 mb-3">
    <div class="flex items-center justify-between gap-2 mb-2 px-1">
      <div class="flex items-center gap-2">
        <span class="text-2xl animate-float">🐝</span>
        <h1 class="font-jua text-base sm:text-xl text-sky-900 tracking-tight">초등 2학년 2학기 · 6단 곱셈구구 & 비밀 키워드</h1>
      </div>
      
      <div class="flex items-center gap-2">
        <!-- Student Name & Collected Letters Display -->
        <div id="header-student-badge" class="hidden sm:flex items-center gap-1.5 px-3 py-1 bg-sky-50 border border-sky-300 rounded-full text-xs font-jua text-sky-800">
          <span>👤</span>
          <span id="header-student-name" class="font-bold">학생 미등록</span>
          <span id="header-letters-count" class="text-amber-600 font-bold ml-1">(0/8)</span>
        </div>

        <!-- Sound Toggle Button -->
        <button id="sound-btn" onclick="toggleSound()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 text-xs sm:text-sm font-jua text-slate-700 transition-colors shadow-sm active:scale-95">
          <span id="sound-icon">🔊</span>
          <span id="sound-label" class="hidden sm:inline">효과음</span>
        </button>
      </div>
    </div>

    <!-- Step Navigation Tabs (10 tabs) -->
    <nav class="grid grid-cols-5 sm:grid-cols-10 gap-1 text-center font-jua text-xs sm:text-sm" aria-label="단계 탐색">
      <button onclick="setPage(1)" id="tab-1" class="py-2 px-0.5 rounded-xl transition-all duration-150">📖 표지</button>
      <button onclick="setPage(2)" id="tab-2" class="py-2 px-0.5 rounded-xl transition-all duration-150">1. 하나씩</button>
      <button onclick="setPage(3)" id="tab-3" class="py-2 px-0.5 rounded-xl transition-all duration-150">2. 두 개 비교</button>
      <button onclick="setPage(4)" id="tab-4" class="py-2 px-0.5 rounded-xl transition-all duration-150">3. 더하기</button>
      <button onclick="setPage(5)" id="tab-5" class="py-2 px-0.5 rounded-xl transition-all duration-150">4. 6씩 규칙</button>
      <button onclick="setPage(6)" id="tab-6" class="py-2 px-0.5 rounded-xl transition-all duration-150">5. 곱셈식</button>
      <button onclick="setPage(7)" id="tab-7" class="py-2 px-0.5 rounded-xl transition-all duration-150">6. 구구단</button>
      <button onclick="setPage(8)" id="tab-8" class="py-2 px-0.5 rounded-xl transition-all duration-150 text-emerald-700 font-bold">7. 3단·6단</button>
      <button onclick="setPage(9)" id="tab-9" class="py-2 px-0.5 rounded-xl transition-all duration-150 text-rose-600 font-bold">⏱️ 8. 40초</button>

    <!-- Dynamic Learning Screen Container -->
    <div id="page-content" class="w-full flex flex-col items-center flex-1 justify-start pt-1"></div>

    <!-- Bottom Step Navigation Controls -->
    <div id="bottom-nav" class="w-full pt-4 mt-4 border-t border-slate-100 flex items-center justify-between font-jua text-sm sm:text-base">
      <button id="prev-step-btn" onclick="goPrevPage()" class="flex items-center gap-1.5 px-4 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all disabled:opacity-30 disabled:hover:bg-slate-100">
        <span>◀</span> <span>이전 단계</span>
      </button>
      <span id="page-indicator" class="text-slate-400 font-bold">1 / 10 단계</span>
      <button id="next-step-btn" onclick="goNextPage()" class="flex items-center gap-1.5 px-5 py-2.5 rounded-2xl bg-sky-600 hover:bg-sky-700 text-white shadow-sm transition-all active:scale-95 disabled:opacity-30">
        <span>다음 단계</span> <span>▶</span>
      </button>
    </div>
  </main>

  <!-- Success / Celebration Modal -->
  <div id="success-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl border-4 border-sky-400 text-center animate-modal relative">
      <div class="text-6xl mb-2 animate-float">🐝👑</div>
      <div class="inline-block bg-sky-100 text-sky-800 text-xs font-bold px-3 py-1 rounded-full mb-2">단계 마스터 배지 & 비밀 글자 획득!</div>
      <h3 class="font-jua text-2xl sm:text-3xl text-sky-700 mb-2">대단해요! 정답 성공! 🎉</h3>
      <p id="modal-desc" class="text-slate-600 text-sm sm:text-base font-medium mb-6 leading-relaxed whitespace-pre-line">6단 곱셈구구를 완벽하게 이해하고 있어요!</p>
      <button onclick="closeModal()" class="w-full py-3.5 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white font-jua text-lg rounded-2xl shadow-md transition-all active:scale-95">
        멋져요! 계속 도전하기 🚀
      </button>
    </div>
  </div>

  <!-- Custom Alert / Warning Notice Modal (Replaces window.alert) -->
  <div id="notice-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-xl border-2 border-amber-400 text-center animate-modal relative">
      <div class="text-4xl mb-2">💡</div>
      <h4 class="font-jua text-xl text-amber-900 mb-2 font-bold">안내</h4>
      <p id="notice-modal-msg" class="text-slate-600 font-jua text-sm sm:text-base mb-5 whitespace-pre-line"></p>
      <button onclick="closeNoticeModal()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-jua text-base rounded-xl transition-all active:scale-95">
        확인
      </button>

  <script>
    const STUDENT_DB = {
      '김서아': '무지개꿈을꾸어봐',
      '김수현': '반짝이는별이되자',
      '김윤아': '아름다운꿈을꾸자',
      '김태영': '씩씩하게앞으로가',
      '김하랑': '신나는하루만들자',
      '나예린': '언제나즐겁게웃자',
      '박민제': '용기내어한걸음가',
      '박선우': '힘차게꿈향해가자',
      '양수빈': '따뜻한마음나누자',
      '유소영': '행복한오늘만들자',
      '이대운': '멋진꿈향해달리자',
      '이새봄': '새로운꿈을펼치자',
      '이서율': '친구와사이좋게가',
      '이진서': '즐거운마음으로가',
      '이채원': '자신있게도전하자',
      '이초은': '고운마음을나누자',
      '이태환': '씩씩하게꿈을키워',
      '이하린': '웃음가득하루보내',
      '한규빈': '힘을내어끝까지가',
      '한유은': '소중한꿈을키우자',
      '현지우': '오늘도힘차게달려',
      '황지우': '밝은미소가득피워',
      '이승찬': '대한민국교사어른'
    };

    let currentStudent = '';
    let studentTargetSentence = '대한민국교사어른';
    let unlockedLetters = {};

    function showNoticeModal(message) {
      const modal = document.getElementById('notice-modal');
      const msgEl = document.getElementById('notice-modal-msg');
      if (modal && msgEl) {
        msgEl.innerText = message;
        modal.classList.remove('hidden');
      }
    }

    function closeNoticeModal() {
      const modal = document.getElementById('notice-modal');
      if (modal) modal.classList.add('hidden');
    }

    function registerStudent(name) {
      const trimmed = name.trim();
      if (!trimmed) {
        showNoticeModal('이름을 입력하거나 명단에서 선택해 주세요!');
        return false;
      }
      const prevStudent = currentStudent;
      currentStudent = trimmed;
      if (STUDENT_DB[trimmed]) {
        studentTargetSentence = STUDENT_DB[trimmed];
      } else {
        studentTargetSentence = '열심히공부해보자';
      }

      // 학생 이름이 바뀐 경우, 이미 수집했던 슬롯의 글자도 새 학생의 글자로 즉시 동기화
      if (prevStudent !== currentStudent) {
        for (const step in unlockedLetters) {
          const charIdx = parseInt(step, 10) - 1;
          unlockedLetters[step] = studentTargetSentence.charAt(charIdx) || '★';
        }
      }

      const badge = document.getElementById('header-student-badge');
      const sName = document.getElementById('header-student-name');
      if (badge && sName) {
        badge.classList.remove('hidden');
        sName.innerText = currentStudent;
      }
      updateHeaderLettersTracker();
      return true;
    }

    function awardKeywordLetter(stepNum) {
      if (!currentStudent) {
        currentStudent = '친구';
      }
      const charIndex = stepNum - 1;
      const letter = studentTargetSentence.charAt(charIndex) || '★';
      unlockedLetters[stepNum] = letter;
      updateHeaderLettersTracker();
      return letter;
    }

    function updateHeaderLettersTracker() {
      const countEl = document.getElementById('header-letters-count');
      const count = Object.keys(unlockedLetters).length;
      if (countEl) countEl.innerText = `(${count}/8)`;
    }

    let audioCtx = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound() {
      isMuted = !isMuted;
      const icon = document.getElementById('sound-icon');
      const label = document.getElementById('sound-label');
      if (isMuted) {
        icon.innerText = '🔇';
        label.innerText = '음소거';
      } else {
        icon.innerText = '🔊';
        label.innerText = '효과음';
        initAudio();
        playSound('correct');
      }
    }

    function playSound(type) {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        osc.frequency.setValueAtTime(783.99, now + 0.16);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
        osc.start(now);
        osc.stop(now + 0.36);
      } else if (type === 'wrong') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(160, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'fanfare') {
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, idx) => {
          const noteOsc = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          noteOsc.connect(noteGain);
          noteGain.connect(audioCtx.destination);
          const startTime = now + idx * 0.09;
          noteOsc.frequency.setValueAtTime(freq, startTime);
          noteGain.gain.setValueAtTime(0.2, startTime);
          noteGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
          noteOsc.start(startTime);
          noteOsc.stop(startTime + 0.3);
        });
      }
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#0284c7', '#38bdf8', '#f59e0b', '#10b981', '#ec4899', '#6366f1'];

      for (let i = 0; i < 90; i++) {
        particles.push({
          x: canvas.width * 0.5,
          y: canvas.height * 0.4,
          r: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.75) * 16,
          alpha: 1,
          decay: Math.random() * 0.015 + 0.01
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach(p => {
          if (p.alpha > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.38;
            p.alpha -= p.decay;
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        });
        if (active) {
          requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      render();
    }

    function createSingleRobotSVG() {

      const allInputs = [inDiff, inResTop, inResBot, inBase, inMultDiff, inMultRes];

      if (allVals.every(v => v === '')) {

      const expectedDiff = p4ValB - p4ValA;

      const isResBotOk = parseInt(inResBot.value.trim(), 10) === expectedResBot;
      const isBaseOk = parseInt(inBase.value.trim(), 10) === expectedBase;
      const isMultDiffOk = parseInt(inMultDiff.value.trim(), 10) === expectedMultDiff;
      const isMultResOk = parseInt(inMultRes.value.trim(), 10) === expectedMultRes;

      const mark = (el, ok) => {
        el.classList.remove('border-sky-500', 'bg-sky-50', 'border-rose-400', 'bg-rose-50');
        if (ok) el.classList.add('border-sky-500', 'bg-sky-50');
        else el.classList.add('border-rose-400', 'bg-rose-50');

      mark(inResTop, isResTopOk);

      mark(inBase, isBaseOk);

        }
        setTimeout(randomizeP7, 1800);
      }

    function generateP8Questions() {
      const dans = [2, 3, 5, 6];
      const qList = [];
      const usedPairs = new Set();

      while (qList.length < 10) {
        const dan = dans[Math.floor(Math.random() * dans.length)];
        const mult = Math.floor(Math.random() * 9) + 1;
        const key = `${dan}x${mult}`;
        if (!usedPairs.has(key)) {
          usedPairs.add(key);
          qList.push({ dan, mult, ans: dan * mult });
        }
      }
      return qList;
    }

      const inp = document.getElementById('p10-final-input');

          feedback.className = 'mt-4 font-jua text-base text-amber-600';

        inp.focus();
        return;
      }

      if (userVal === targetVal) {
        playSound('fanfare');
        triggerConfetti();

          feedback.className = 'mt-4 font-jua text-xl text-emerald-600 font-bold';

    function getStreak() {
      if (currentPage === 2) return p1Streak;
      if (currentPage === 3) return p2Streak;
      if (currentPage === 4) return p3Streak;
      if (currentPage === 5) return p4Streak;
      if (currentPage === 6) return p5Streak;
      if (currentPage === 7) return p6Streak;
      if (currentPage === 8) return p7Streak;
      return 0;

    function updateStreakUI() {
      const s = getStreak();
      const starsEl = document.getElementById('top-streak-stars');
      const countEl = document.getElementById('top-streak-count');
      if (starsEl) starsEl.innerText = '★'.repeat(s) + '☆'.repeat(5 - s);

    }

    function triggerRandomizeCurrent() {
      if (currentPage === 2) randomizeP1();
      else if (currentPage === 3) randomizeP2();
      else if (currentPage === 4) randomizeP3();
      else if (currentPage === 5) randomizeP4();
      else if (currentPage === 6) randomizeP5();
      else if (currentPage === 7) randomizeP6();
      else if (currentPage === 8) randomizeP7();
      else if (currentPage === 9) resetP8Challenge();
      else if (currentPage === 10) renderPage10();
    }

    function setPage(num, forceRandom = true) {
      if (num !== 1 && !currentStudent) {
        showNoticeModal('🔒 이름을 먼저 등록해야 문제를 풀 수 있어요!\n표지에서 이름을 입력하거나 명단에서 선택해 주세요.');
        if (currentPage !== 1) {
          setPage(1, false);
        } else {
          const inp = document.getElementById('cover-student-input');
          if (inp) inp.focus();
        }
        return;
      }

      if (currentPage === 9 && p8TimerId) {
        clearInterval(p8TimerId);
        p8TimerId = null;
      }

      currentPage = num;

      for (let i = 1; i <= 10; i++) {
        const tab = document.getElementById(`tab-${i}`);
        if (tab) {
          if (i === num) {
            tab.className = "py-2 px-0.5 rounded-xl bg-sky-600 text-white shadow-sm font-bold border-2 border-sky-700";
          } else {
            tab.className = "py-2 px-0.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium border-2 border-transparent";
          }
        }
      }

      const pageIndicator = document.getElementById('page-indicator');
      if (pageIndicator) {
        pageIndicator.innerText = `${num} / 10 단계`;
      }

      const prevBtn = document.getElementById('prev-step-btn');
      const nextBtn = document.getElementById('next-step-btn');
      if (prevBtn) prevBtn.disabled = (num === 1);
      if (nextBtn) nextBtn.disabled = (num === 10);

      const topBar = document.getElementById('quiz-top-bar');

      if (num === 1 || num === 9 || num === 10) {
        if (topBar) topBar.classList.add('hidden');
        if (num === 1) renderCoverPage();
        else if (num === 9) {
          p8IsStarted = false;
          renderPage8();
        } else if (num === 10) {
          renderPage10();
        }
        return;
      }

      if (topBar) {
        topBar.classList.remove('hidden');
        updateStreakUI();
      }

      if (forceRandom) {
        if (num === 2) randomizeP1();
        else if (num === 3) randomizeP2();
        else if (num === 4) randomizeP3();
        else if (num === 5) randomizeP4();
        else if (num === 6) randomizeP5();
        else if (num === 7) randomizeP6();
        else if (num === 8) randomizeP7();
      } else {
        if (num === 2) renderPage1();
        else if (num === 3) renderPage2();
        else if (num === 4) renderPage3();
        else if (num === 5) renderPage4();
        else if (num === 6) renderPage5();
        else if (num === 7) renderPage6();
        else if (num === 8) renderPage7();
      }
    }

    function goPrevPage() {
      if (currentPage > 1) {
        setPage(currentPage - 1, false);
      }
    }

    function goNextPage() {
      if (currentPage === 1 && !currentStudent) {
        showNoticeModal('🔒 이름을 먼저 등록해야 다음 단계로 갈 수 있어요!\n표지에서 이름을 입력하거나 명단에서 선택해 주세요.');
        const inp = document.getElementById('cover-student-input');
        if (inp) inp.focus();
        return;
      }
      if (currentPage < 10) {
        setPage(currentPage + 1, false);
      }
    }

    function closeModal() {
      document.getElementById('success-modal').classList.add('hidden');
      if (currentPage === 2) randomizeP1();
      else if (currentPage === 3) randomizeP2();
      else if (currentPage === 4) randomizeP3();
      else if (currentPage === 5) randomizeP4();
      else if (currentPage === 6) randomizeP5();
      else if (currentPage === 7) randomizeP6();
      else if (currentPage === 8) randomizeP7();
      else if (currentPage === 9) resetP8Challenge();
      else if (currentPage === 10) renderPage10();
    }

    window.onload = function() {
      setPage(1, true);
    };
  </script>
</body>
</html>
