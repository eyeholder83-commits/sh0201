('feedback').textContent=ok?'정답입니다! 🎉':'다시 살펴보세요.';$('feedback').style.color=ok?'#15803d':'#dc2626';if(ok)newClock()}dial($('ticks'),$('numbers'),$('minutes'),245,245,189);render();\n\n;(()=>{let counted=false;const checkBtn=[...document.querySelectorAll('button')].find(b=>b.textContent.trim()==='정답확인'),nextBtn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('다른 문제'));if(nextBtn)nextBtn.addEventListener('click',()=>{counted=false},true);if(checkBtn)checkBtn.addEventListener('click',()=>{let ok=false;try{ok=!!($('h').value!=='' && $('m').value!=='' && Number($('h').value)===hour && Number($('m').value)===minute);}catch(e){}window.parent.postMessage({clockProgress:true,page:4,ok},'*');},true);})();\n<\/script><script>(function(){function teacherFill(){try{if(!parent.teacherMode)return;document.getElementById('h').value=hour;document.getElementById('m').value=minute;}catch(e){}}window.addEventListener('message',e=>{if(e.data&&e.data.teacherRefresh)teacherFill()});setInterval(teacherFill,350);document.addEventListener('click',e=>{if(parent.teacherMode && (e.target.closest('button')))setTimeout(teacherFill,0);});teacherFill()})();<\/script><\/body><\/html>\n", "<!doctype html><html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>자전거를 탄 시간 - 2페이지<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f1f6ff;font-family:'Malgun Gothic',Arial,sans-serif;color:#18263d}.wrap{max-width:760px;margin:22px auto;padding:24px;background:white;border-radius:22px;box-shadow:0 8px 28px #dce5f3}h1{text-align:center;font-size:27px}.story{background:#edf5ff;padding:16px;border-radius:14px;font-size:20px;line-height:1.7}.question{text-align:center;font-size:24px;font-weight:700;margin:18px 0 12px}.hint{text-align:center;color:#64748b;margin:8px 0 14px}svg{display:block;width:min(100%,420px);margin:auto;touch-action:manipulation}.outer{cursor:pointer;outline:none}.outer circle{fill:#ff <line id=\"minute\" x1=\"200\" y1=\"200\" x2=\"200\" y2=\"88\" stroke=\"#eb159b\" stroke-width=\"7\" stroke-linecap=\"round\"/><circle cx=\"200\" cy=\"200\" r=\"7\" fill=\"#ffce58\"/><\/svg><section id=\"barArea\" class=\"timebar hidden\"><div class=\"labels\"><span id=\"startLabel\"><\/span><span>10분<\/span><span>20분<\/span><span>30분<\/span><span>40분<\/span><span>50분<\/span><span id=\"endLabel\"><\/span><\/div><div class=\"track\" id=\"track\"><\/div><\/section><div class=\"question\" id=\"question\"><\/div><p class=\"hint\" id=\"hint\"><\/p><div class=\"answer\" id=\"answerArea\"><input type=\"text\" id=\"answer\" autocomplete=\"off\" aria-label=\"정답 입력\"><span id=\"unit\">시<\/span><\/div><div class=\"buttons\"><button class=\"primary\" id=\"check\">정답 확인<\/button><button id=\"again\">다른문제<\/button><\/div><div id=\"feedback\" role=\"status\" aria-live=\"polite\"><\/div><\/main><script>\nconst NS='http://www.w3.org/2000/svg';const $=id=>document.getElementById(id);let start=5,step=1,count=0,solved=0,locked=false;const clock=$('clock');function svg(parent,tag,attrs,txt){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(txt!==undefined)e.textContent=txt;parent.appendChild(e);return e}function pt(deg,r){const a=(deg-90)*Math.PI/180;return [200+Math.cos(a)*r,200+Math.sin(a)*r]}for(let i=0;i<60;i++){const a=pt(i*6,i%5===0?119:125),b=pt(i*6,131);svg($('ticks'),'line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#334155','stroke-width':i%5===0?2.2:1})}for(let i=1;i<=12;i++){const p=pt(i*30,103);svg($('numbers'),'text',{x:p[0],y:p[1]+8,'text-anchor':'middle','font-size':26,fill:'#17243b'},i)}for(let i=1;i<=12;i++){const value=i===12?60:i*5,p=pt(i*30,174),g=svg($('outerNumbers'),'g',{class:'outer','data-value':value,role:'button',tabindex:'0','aria-label':value+'분'});svg(g,'circle',{cx:p[0],cy:p[1],r:19});svg(g,'text',{x:p[0],y:p[1]+7},i===12?'0':String(value))}for(let i=0;i<12;i++)$('track').appendChild(Object.assign(docum st expected=step===1?start:step===3?60:step===4?1:(start%12+1);let ok=false;if(step===1||step===5)ok=raw===String(expected)||raw===expected+'시';if(step===3)ok=raw==='60'||raw==='60분';if(step===4)ok=raw==='1'||raw==='1시간';if(!ok){$('feedback').textContent='❌ 다시 생각해 보세요.';$('feedback').style.color='#dc2626';return}$('feedback').style.color='#16803d';if(step===5){solved++;window.parent.postMessage({clockProgress:true,page:5,ok:true},'*');locked=true;$('feedback').textContent='🎉 5단계 완료! 1문제 정답! (총 '+solved+'문제 정답)';$('check').disabled=true;setTimeout(()=>{locked=false;$('check').disabled=false;nextProblem()},1400);return}step++;show()}$('check').addEventListener('click',check);$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('check').disabled)check()});function nextProblem(){let next;do{next=1+Math.floor(Math.random()*11)}while(next===start);init(next)}$('again').addEventListener('click',()=>{locked=false;$('check').disabled=false;nextProblem()});init(5);\n\n<\/script><script>(function(){function teacherFill(){try{if(!parent.teacherMode)return;if(!locked){step=5;count=12;draw();show();document.getElementById('answer').value=start%12+1;}}catch(e){}}window.addEventListener('message',e=>{if(e.data&&e.data.teacherRefresh)teacherFill()});setInterval(teacherFill,350);teacherFill()})();<\/script><\/body><\/html>\n", "<!doctype html><html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>정각 몇 분 전<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;font-family:'Malgun Gothic',sans-serif;color:#18263b}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px}.panel{background:white;border-radius:24px;box-shadow:0 12px 35px #1e35521a;padding:28px 35px;text-align:center;width:min(95vw,650px)}h1{font-size:26px;margin:0 0 18px}.clock{width:min(75vw,420px);height:auto;display:block;margin:auto}.readout{font-size:30px;font-weight:800;min-height:55p n-items:center;justify-content:center;gap:12px;font-size:18px;font-weight:700}\n.travel-arrow{font-size:46px;color:#3b82f6;line-height:1}\n@media(max-width:530px){.flight{grid-template-columns:minmax(0,1fr) minmax(85px,.85fr) minmax(0,1fr);gap:4px}.flight-clock p{font-size:14px}.flight-clock p strong{font-size:18px}.flight-middle{font-size:14px}.travel-arrow{font-size:34px}}\n<\/style><style>.flight-middle{min-width:0;text-align:center}.travel-arrow{display:block;font-size:58px;line-height:1.1;color:#2563eb;font-weight:900}@media(max-width:530px){.travel-arrow{font-size:40px}}<\/style><\/head><body><main class=\"wrap\"><section id=\"page3\"><div class=\"plane-title\">🚗 자동차를 타고 이동하는 데 걸린 시간을 구해 봅시다.<\/div><div class=\"flight\"><div class=\"flight-clock\"><svg aria-label=\"10시 30분 시계\" id=\"departClock\" viewbox=\"0 0 200 200\"><\/svg><p><span>출발한 시각<\/span><strong id=\"departText\">10:30<\/strong><\/p><\/div><div class=\"flight-middle\"><div aria-label=\"오른쪽 화살표\" class=\"travel-arrow\">➜<\/div><div>차로 이동하는 시간<\/div><\/div><div class=\"flight-clock\"><svg aria-label=\"11시 30분 시계\" id=\"arriveClock\" viewbox=\"0 0 200 200\"><\/svg><p><span>도착한 시각<\/span><strong id=\"arriveText\">11:30<\/strong><\/p><\/div><\/div><p class=\"plane-note\">① 자동차를 타고 이동하는 데 걸린 시간을 <b>시간 띠에 색칠<\/b>해 보세요.<\/p><p class=\"flight-caption\">10분 칸을 누르거나 손가락으로 밀면 색칠되고, 색칠된 칸에서 시작하면 지워집니다. 굵은 선은 정각입니다.<\/p><div class=\"plane-labels\" id=\"planeLabels\"><\/div><div aria-label=\"10시부터 12시까지의 시간 띠\" class=\"plane-bar\" id=\"planeBar\"><\/div><p class=\"plane-note\">② 자동차를 타고 이동하는 데 걸린 시간을 구해 보세요.<\/p><div class=\"answer-line\"><input aria-label=\"걸린 전체 시간 분\" autocomplete=\"off\" id=\"answerMinutes\" inputmode=\"numeric\" type=\"text\"/> 분 = <input aria-label=\"걸린 시간 시간\" autocomplete=\"off\" id=\"answerHours\" inputmode=\"numeric\" type=\"text\"/> 시간<\/div><div class=\"controls\"><button class=\"check\" id=\"planeCheck\">정답 확인<\/button><button class=\"reset\" id=\"planeOther\">다른문제<\/button><button class=\"reset\" id=\"planeClear\">처음부터<\/button><\/div><div id=\"planeResult\" role=\"status\" style=\"text-align:center;min-height:30px;font-size:20px;font-weight:bold\"><\/div><\/section><\/main><script>function smallClock(id,h,m){let s=document.getElementById(id);s.replaceChildren();let N='http://www.w3.org/2000/svg';function add(tag,attrs,t){let el=document.createElementNS(N,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));if(t!==undefined)el.textContent=t;s.appendChild(el)}add('circle',{cx:100,cy:100,r:94,fill:'#ffcf50',stroke:'#e7a828','stroke-width':3});add('circle',{cx:100,cy:100,r:84,fill:'white'});for(let i=1;i<=12;i++){let a=(i*30-90)*Math.PI/180;add('text',{x:100+Math.cos(a)*66,y:106+Math.sin(a)*66,'text-anchor':'middle','font-size':17,fill:'#17243b'},i)}for(let i=0;i<60;i++){let a=(i*6-90)*Math.PI/180,r=i%5===0?78:81;add('line',{x1:100+Math.cos(a)*r,y1:100+Math.sin(a)*r,x2:100+Math.cos(a)*84,y2:100+Math.sin(a)*84,stroke:'#555','stroke-width':i%5===0?1.5:.6})}function hand(deg,len,color,width){let a=(deg-90)*Math.PI/180;add('line',{x1:100,y1:100,x2:100+Math.cos(a)*len,y2:100+Math.sin(a)*len,stroke:color,'stroke-width':width,'stroke-linecap':'round'})}hand(h*30+m*.5,48,'#28a64a',6);hand(m*6,70,'#eb159b',4);add('circle',{cx:100,cy:100,r:5,fill:'#ffcd5a'})}\nconst labels=document.getElementById('planeLabels'),bar=document.getElementById('planeBar');\nconst answerM=document.getElementById('answerMinutes'),answerH=document.getElementById('answerHours'),planeResult=document.getElementById('planeResult');\nlet flightStart=630,flightEnd=750,barStart=600,stepCount=12;\nfunction displayTime(t){let h=Math.floor(t/60)%12||12;return t%60===0?`${h}시`:`${h}시 ${t%60}분`}\nfunction digitalTime(t){return `${Math.floor(t/60)%12||12}:${String(t%60).padStart(2,\"0\")}`}\nfunction renderFlight(){\n const startHour=Math.floor(flightStart/60)*60;\n const endHour=Math.ceil(flightEnd/60)*60;\n barStart=startHour;stepCount=(endHour-startHour)/10;\n labels.replaceChildren();bar.replaceChildren();\n labels.style.setProperty('--cells',stepCount);bar.style.setProperty('--cells',stepCount);\n for(let i=0;i<stepCount;i++){\n   const t=barStart+i*10, min=t%60;\n   if(true){let lab=document.createElement('span');lab.textContent=min===0?`${Math.floor(t/60)%12||12}시`:`${min}분`;if(min===0)lab.className='hour-label';lab.style.gridColumn=`${i+1} / span 1`;labels.appendChild(lab)}\n   let cell=document.createElement('button');cell.type='button';cell.className='plane-cell'+((i+1)%6===0?' hour-end':false?' ten-end':'');\n   cell.setAttribute('aria-label',`${displayTime(t)}부터 10분 칸`);cell.setAttribute('aria-pressed','false');\n   cell.addEventListener('click',e=>{if(e.detail!==0)return;cell.classList.toggle('filled');cell.setAttribute('aria-pressed',String(cell.classList.contains('filled')));planeResult.textContent='';});\n   bar.appendChild(cell);\n }\n // 모든 구분선은 하나의 SVG에 그려 높이와 위치를 정확하게 맞춥니다.\n const overlay=document.createElementNS('http://www.w3.org/2000/svg','svg');\n overlay.setAttribute('viewBox',`0 0 ${stepCount*10} 100`);\n overlay.setAttribute('preserveAspectRatio','none');\n overlay.setAttribute('class','plane-grid-overlay');\n overlay.setAttribute('aria-hidden','true');\n for(let i=1;i<stepCount;i++){\n   const line=document.createElementNS('http://www.w3.org/2000/svg','line');\n   const x=i*10;\n   line.setAttribute('x1',x);line.setAttribute('x2',x);\n   line.setAttribute('y1','0');line.setAttribute('y2','100');\n   const isHour=i%6===0, isTen=false;\n   line.setAttribute('stroke',isHour?'#344054':isTen?'#475569':'#94a3b8');\n   line.setAttribute('stroke-width',isHour?'1.7':isTen?'1.1':'0.65');\n   if(!isHour)line.setAttribute('stroke-dasharray',isTen?'5 4':'2 5');\n   line.setAttribute('vector-effect','non-scaling-stroke');\n   overlay.appendChild(line);\n }\n bar.appendChild(overlay);\n // 손가락 또는 마우스로 문지르면 지나간 5분 칸을 연속 색칠합니다.\n // 처음 누른 칸이 이미 색칠돼 있다면 드래그로 지울 수도 있습니다.\n let painting=false,paintValue=true,lastPaintIndex=-1;\n const cellAt=(x,y)=>{const rect=bar.getBoundingClientRect();if(x<rect.left||x>rect.right||y<rect.top||y>rect.bottom)return null;const index=Math.min(stepCount-1,Math.max(0,Math.floor((x-rect.left)/rect.width*stepCount)));return bar.querySelectorAll('.plane-cell')[index];};\n const paintCell=c=>{if(!c)return;c.classList.toggle('filled',paintValue);c.setAttribute('aria-pressed',String(paintValue));planeResult.textContent='';};\n const paintTo=c=>{if(!c)return;const cells=[...bar.querySelectorAll('.plane-cell')],idx=cells.indexOf(c);if(idx<0)return;if(lastPaintIndex<0){paintCell(c)}else{for(let i=Math.min(idx,lastPaintIndex);i<=Math.max(idx,lastPaintIndex);i++)paintCell(cells[i]);}lastPaintIndex=idx;};\n bar.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;const c=cellAt(e.clientX,e.clientY);if(!c)return;painting=true;lastPaintIndex=-1;paintValue=!c.classList.contains('filled');paintTo(c);bar.setPointerCapture(e.pointerId);e.preventDefault();};\n bar.onpointermove=e=>{if(!painting)return;paintTo(cellAt(e.clientX,e.clientY));e.preventDefault();};\n bar.onpointerup=bar.onpointercancel=()=>{painting=false;lastPaintIndex=-1;};\n let last=document.createElement('span');last.textContent=`${Math.floor(endHour/60)%12||12}시`;last.className='hour-label';last.style.position='absolute';last.style.right='0';last.style.transform='translateX(50%)';labels.appendChild(last);\n const sh=Math.floor(flightStart/60)%12||12,eh=Math.floor(flightEnd/60)%12||12;\n smallClock('departClock',sh,flightStart%60);smallClock('arriveClock',eh,flightEnd%60);\n document.getElementById('departText').textContent=digitalTime(flightStart);\n document.getElementById('arriveText').textContent=digitalTime(flightEnd);\n \n bar.setAttribute('aria-label',`${displayTime(barStart)}부터 ${displayTime(endHour)}까지 10분 간격 시간 띠`);\n clearFlight();\n}\nfunction clearFlight(){[...bar.querySelectorAll('.plane-cell')].forEach(c=>{c.classList.remove('filled');c.setAttribute('aria-pressed','false')});answerM.value='';answerH.value='';planeResult.textContent=''}\ndocument.getElementById('planeCheck').onclick=()=>{\n \n \n const elapsed=flightEnd-flightStart;\n const correct=answerM.value!==''&&answerH.value!==''&&Number(answerM.value)===elapsed&&Number(answerH.value)===Math.floor(elapsed/60);\n const colored=[...bar.querySelectorAll('.plane-cell')].every((c,i)=>c.classList.contains('filled')===(barStart+i*10>=flightStart&&barStart+i*10<flightEnd));\n planeResult.textContent=correct&&colored?'⭕ 정답입니다!':'❌ 색칠한 시간 띠와 답을 다시 확인해 보세요.';\n planeResult.style.color=correct&&colored?'#16803d':'#dc2626';\n if(correct&&colored)document.getElementById('planeOther').click();\n};\ndocument.getElementById('planeClear').onclick=clearFlight;\ndocument.getElementById('planeOther').onclick=()=>{\n let nextStart,nextEnd;\n do{\n   nextStart=(1+Math.floor(Math.random()*9))*60+Math.floor(Math.random()*6)*10;\n   const duration=(1+Math.floor(Math.random()*3))*60;\n   nextEnd=nextStart+duration;\n }while(nextStart===flightStart&&nextEnd===flightEnd);\n flightStart=nextStart;flightEnd=nextEnd;renderFlight();};\nrenderFlight();\n\n;(()=>{let counted=false;const checkBtn=document.getElementById('planeCheck'),nextBtn=document.getElementById('planeOther');if(nextBtn)nextBtn.addEventListener('click',()=>{counted=false},true);if(checkBtn)checkBtn.addEventListener('click',()=>{if(counted)return;let ok=false;try{ok=!!(answerM.value!=='' && answerH.value!=='' && Number(answerM.value)===flightEnd-flightStart && Number(answerH.value)===Math.floor((flightEnd-flightStart)/60) && [...bar.querySelectorAll('.plane-cell')].every((c,i)=>c.classList.contains('filled')===(barStart+i*10>=flightStart&&barStart+i*10<flightEnd)));}catch(e){}if(ok)counted=true;window.parent.postMessage({clockProgress:true,page:8,ok},'*');},true);})();\n<\/script><script>(function(){function teacherFill(){try{if(!parent.teacherMode)return;document.getElementById('answerMinutes').value=flightEnd-flightStart;document.getElementById('answerHours').value=(flightEnd-flightStart)/60;document.querySelectorAll('.plane-cell').forEach((c,i)=>c.classList.toggle('filled',barStart+i*10>=flightStart&&barStart+i*10<flightEnd));}catch(e){}}window.addEventListener('message',e=>{if(e.data&&e.data.teacherRefresh)teacherFill()});setInterval(teacherFill,350);document.addEventListener('click',e=>{if(parent.teacherMode && (e.target.closest('button')))setTimeout(teacherFill,0);});teacherFill()})();<\/script><\/body><\/html>", "<!doctype html><html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>공연을 보는 데 걸린 시간 - 4페이지<\/title><style>body{font-family:'Malgun Gothic',sans-serif;background:#f5f8ff;margin:0;color:#17243b}.wrap{max-width:780px;margin:25px auto;padding:22px;background:white;border-radius:22px;box-shadow:0 8px 30px #dce4f2}h1{text-align:center;font-size:27px}.story{font-size:21px;line-height:1.8;background:#edf5ff;border-radius:15px;padding:17px}.task{text-align:center;font-size:23px;font-weight:bold;margin:22px 0 8px}svg{display:block;width:min(94vw,430px);height:auto;margin:auto;touch-action:none;user-select:none}.controls{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:16px}.control{background:#f4f6fa;padding:12px 16px;border-radius:14px;text-align:center}.control strong{display:block;margin-bottom:8px}button{border:0;border-radius:12px;padding:12px 18px;font-size:19px;font-weight:bold;cursor:pointer;background:#e0e9f8}button:active{transform:scale(.97)}.check{background:#2563eb;color:white}.reset{background:#e8edf4}#result{text-align:center;min-height:34px;font-size:23px;font-weight:bold}.hint{text-align:center;color:#64748b;font-size:16px} .minute{fill:#ffedc6;stroke:#ffbb3e;stroke-width:1.3}.minute-choice{cursor:pointer;touch-action:manipulation}.minute-choice.selected .minute{stroke:#e11d48;stroke-width:4.5}.hand{cursor:grab}.hand:active{cursor:grabbing}.timebar{max-width:410px;margin:12px auto 8px;padding:5px 12px 9px}.timebar-labels{display:flex;justify-content:space-between;align-items:end;font-size:17px;color:#152238;margin-bottom:2px}.timebar-track{height:18px;background:#d5effb;border:1.5px solid #344256;display:grid;grid-template-columns:repeat(6,1fr);position:relative}.timebar-track>span:not(:last-child){border-right:1.5px dotted #334155}.timebar-progress{position:absolute;left:0;top:0;bottom:0;width:0;background:#2696e8;pointer-events:none;transition:width .15s}.timebar-now{position:absolute;top:-4px;bottom:-4px;width:3px;background:#e11d48;left:0;pointer-events:none;transition:left .15s}\n.pages{display:flex;gap:10px;justify-content:center;margin-bottom:20px}.pages button.active{background:#2563eb;color:#fff}.plane-title{font-size:24px;font-weight:700}.flight{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0}.flight-clock{width:145px;flex-shrink:0}.flight-clock svg{width:100%;touch-action:auto}.flight-clock p{text-align:center;font-weight:bold;margin:5px 0}.flight-middle{flex:1;text-align:center;font-size:18px}.flight-line{border-top:2px solid #e983b3;margin:12px 0}.flight-time{display:flex;justify-content:space-between;font-size:17px}.plane-bar{display:grid;grid-template-columns:repeat(var(--cells,24),minmax(0,1fr));border:2px solid #555;height:48px;margin:4px 0 18px}.plane-cell{background:#fff;border:0;border-radius:0;padding:0;min-width:0;cursor:pointer;touch-action:manipulation;appearance:none;box-shadow:none;transform:none!important}.plane-cell.hour-end{border-right:2px solid #555}.plane-cell.ten-end{border-right:1px dashed #666}.plane-cell:last-child{border-right:0}.plane-cell.filled{background:#77c9ee}.plane-bar{position:relative;overflow:hidden;box-sizing:border-box;touch-action:none;user-select:none}.plane-grid-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}.plane-labels{display:grid;grid-template-columns:repeat(var(--cells,24),minmax(0,1fr));font-size:14px;text-align:center;position:relative;margin-top:28px}.plane-labels span{position:relative;white-space:nowrap;transform:translateX(-50%);font-size:12px}.plane-labels span:first-child{font-size:18px;font-weight:bold}.plane-labels .hour-label{font-size:18px;font-weight:bold}.answer-line{display:flex;align-items:center;justify-content:flex-end;gap:7px;font-size:22px;flex-wrap:wrap}.answer-line input{width:70px;height:46px;border:2px solid #74c7f5;border-radius:6px;font-size:23px;text-align:center}.plane-note{font-size:19px;line-height:1.6;margin:22px 0}.flight-caption{color:#667085;font-size:15px}@media(max-width:530px){.flight-clock{width:95px}.flight-middle{font-size:13px}.plane-labels{font-size:10px}.plane-labels .hour-label,.plane-labels span:first-child{font-size:13px}.answer-line input{width:55px}.plane-title{font-size:20px}}\n.performance-clocks{display:flex;align-items:center;justify-content:center;gap:35px;margin:50px auto 30px;flex-wrap:wrap}.clock-label{text-align:center;font-size:24px;margin-bottom:14px}.digital-clock{font-family:Consolas,monospace;font-size:45px;letter-spacing:-3px;color:#222;background:#fff;border:6px solid #ffca4c;border-radius:13px;padding:8px 16px;box-shadow:0 5px 0 #f5a74a}.time-arrow{font-size:38px;color:#9399a4;margin-top:36px}@media(max-width:530px){.performance-clocks{gap:10px}.digital-clock{font-size:29px;padding:6px 8px}.clock-label{font-size:18px}.time-arrow{font-size:24px}}\n.performance-analog-wrap{max-width:400px;margin:12px auto 25px;text-align:center}.performance-analog-wrap svg{width:min(90vw,370px);max-width:100%;touch-action:none;cursor:grab}.performance-analog-wrap svg:active{cursor:grabbing}.pages button[hidden]{display:none!important}<\/style><\/head><body><main class=\"wrap\"><section id=\"page4\">\n<h1 style=\"text-align:center\">공연을 보는 데 걸린 시간을 구해 봅시다.<\/h1>\n<div class=\"performance-clocks\"><div><div class=\"clock-label\">시작된 시각<\/div><div class=\"digital-clock\" id=\"performanceStartDigital\">9:00<\/div><\/div><div class=\"time-arrow\">➜<\/div><div><div class=\"clock-label\">끝난 시각<\/div><div class=\"digital-clock\" id=\"performanceEndDigital\">11:00<\/div><\/div><\/div>\n<div class=\"performance-analog-wrap\"><div id=\"elapsedMinutes\" aria-live=\"polite\" style=\"font-size:30px;font-weight:800;text-align:center;margin:8px 0 14px;color:#2563eb\">0분<\/div><svg aria-label=\"분침을 움직이면 시침도 함께 움직이는 모형 시계\" id=\"performanceAnalog\" viewbox=\"0 0 300 300\"><\/svg><p class=\"hint\">분홍색 분침을 돌리면 초록색 시침도 함께 움직입니다.<\/p><\/div>\n<div class=\"answer-line\" style=\"margin:22px auto 0;justify-content:center;max-width:400px\"><input aria-label=\"걸린 시간\" autocomplete=\"off\" id=\"performanceHours\" inputmode=\"numeric\" type=\"text\"> 시간 = <input aria-label=\"걸린 분\" autocomplete=\"off\" id=\"performanceMinutes\" inputmode=\"numeric\" type=\"text\"> 분<\/div>\n<div class=\"controls\"><button class=\"check\" id=\"performanceCheck\">정답 확인<\/button><button class=\"reset\" id=\"performanceOther\">다른문제<\/button><button class=\"reset\" id=\"performanceClear\">처음부터<\/button><\/div><div id=\"performanceResult\" role=\"status\" style=\"text-align:center;min-height:35px;font-size:21px;font-weight:bold\"><\/div>\n<\/section><\/main><script>const donePages=new Set(); const awaitingNext={4:false}; const streaks={4:0};\nfunction resetAttempt(n){awaitingNext[n]=false;}\nfunction recordAttempt(n,ok,output){if(donePages.has(n))return;if(awaitingNext[n]){output.textContent='다른문제를 눌러 다음 문제로 넘어가세요.';return;}if(ok){streaks[n]++;awaitingNext[n]=true;}else streaks[n]=0;if(ok&&streaks[n]>=7){donePages.add(n);output.textContent='🎉 연속 7문제 정답! 학습 완료!';output.style.color='#16803d';}else if(ok){output.textContent='⭕ 정답입니다! 연속 '+streaks[n]+'/5문제. 다른문제를 눌러 계속하세요.';output.style.color='#16803d';}else output.textContent+=' (연속 정답 0/5)';}\n\nconst ph=document.getElementById('performanceHours'),pm=document.getElementById('performanceMinutes'),pr=document.getElementById('performanceResult');\nlet performanceStart=9,performanceDuration=2,analogTotal=9*60;\nconst analog=document.getElementById('performanceAnalog');\nconst svgNS='http://www.w3.org/2000/svg';\nfunction addClockEl(parent,tag,attributes,content){const el=document.createElementNS(svgNS,tag);for(const [key,value] of Object.entries(attributes))el.setAttribute(key,value);if(content!==undefined)el.textContent=content;parent.appendChild(el);return el;}\naddClockEl(analog,'circle',{cx:150,cy:150,r:141,fill:'#ffd956',stroke:'#edb838','stroke-width':4});\naddClockEl(analog,'circle',{cx:150,cy:150,r:128,fill:'#fff',stroke:'#e5e7eb','stroke-width':3});\nfor(let i=0;i<60;i++){const a=(i*6-90)*Math.PI/180,r1=i%5===0?109:117;addClockEl(analog,'line',{x1:150+Math.cos(a)*r1,y1:150+Math.sin(a)*r1,x2:150+Math.cos(a)*123,y2:150+Math.sin(a)*123,stroke:'#475569','stroke-width':i%5===0?2.5:1});}\nfor(let i=1;i<=12;i++){const a=(i*30-90)*Math.PI/180;addClockEl(analog,'text',{x:150+Math.cos(a)*94,y:150+Math.sin(a)*94+7,'text-anchor':'middle','font-size':25,fill:'#1e293b'},String(i));}\nconst analogHour=addClockEl(analog,'line',{x1:150,y1:150,x2:150,y2:78,stroke:'#28a64a','stroke-width':9,'stroke-linecap':'round'});\nconst analogMinute=addClockEl(analog,'line',{x1:150,y1:150,x2:150,y2:47,stroke:'#eb159b','stroke-width':6,'stroke-linecap':'round'});\naddClockEl(analog,'circle',{cx:150,cy:150,r:7,fill:'#ffce58'});\nfunction paintAnalog(){const ma=(analogTotal%60)*Math.PI/30-Math.PI/2,ha=(analogTotal/60%12)*Math.PI/6-Math.PI/2;analogHour.setAttribute('x2',150+Math.cos(ha)*73);analogHour.setAttribute('y2',150+Math.sin(ha)*73);analogMinute.setAttribute('x2',150+Math.cos(ma)*103);analogMinute.setAttribute('y2',150+Math.sin(ma)*103);document.getElementById('elapsedMinutes').textContent=Math.round(analogTotal-performanceStart*60)+'분';}\nfunction renderPerformance(){resetAttempt(4);document.getElementById('performanceStartDigital').textContent=performanceStart+':00';document.getElementById('performanceEndDigital').textContent=(performanceStart+performanceDuration)+':00';analogTotal=performanceStart*60;paintAnalog();ph.value='';pm.value='';pr.textContent='';}\nlet analogDragging=false,prevAngle=0;\nfunction pointerAngle(e){const r=analog.getBoundingClientRect();const x=(e.clientX-r.left)*300/r.width-150,y=(e.clientY-r.top)*300/r.height-150;return Math.atan2(y,x)*180/Math.PI+90;}\nanalog.addEventListener('pointerdown',e=>{analogDragging=true;prevAngle=pointerAngle(e);analog.setPointerCapture(e.pointerId);});\nanalog.addEventListener('pointermove',e=>{if(!analogDragging)return;const angle=pointerAngle(e);let delta=angle-prevAngle;if(delta>180)delta-=360;if(delta< -180)delta+=360;analogTotal+=delta/6;prevAngle=angle;paintAnalog();});\nanalog.addEventListener('pointerup',()=>analogDragging=false);\nanalog.addEventListener('pointercancel',()=>analogDragging=false);\ndocument.getElementById('performanceCheck').onclick=()=>{if(donePages.has(4))return;if(awaitingNext[4]){pr.textContent='다른문제를 눌러 다음 문제로 넘어가세요.';return;}const correct=ph.value.trim()===String(performanceDuration)&&pm.value.trim()===String(performanceDuration*60);const clockOk=Math.abs(analogTotal-(performanceStart+performanceDuration)*60)<1.5;const ok=correct&&clockOk;pr.textContent=ok?'⭕ 정답입니다!':'❌ '+(!clockOk?'시계바늘을 공연이 끝난 시각에 맞춰 보세요. ':'')+(!correct?'시간과 분을 다시 확인하세요.':'');pr.style.color=ok?'#16803d':'#dc2626';recordAttempt(4,ok,pr);if(ok&&!donePages.has(4)){document.getElementById('performanceOther').click();pr.textContent='⭕ 정답! 연속 '+streaks[4]+'/7문제';pr.style.color='#16803d';}};\ndocument.getElementById('performanceClear').onclick=()=>{ph.value='';pm.value='';pr.textContent='';analogTotal=performanceStart*60;paintAnalog();};\ndocument.getElementById('performanceOther').onclick=()=>{let newStart,newDuration;do{newStart=1+Math.floor(Math.random()*8);newDuration=1+Math.floor(Math.random()*4);}while(newStart===performanceStart&&newDuration===performanceDuration);performanceStart=newStart;performanceDuration=newDuration;renderPerformance();};\nrenderPerformance();\n\n;(()=>{let counted=false;const checkBtn=document.getElementById('performanceCheck'),nextBtn=document.getElementById('performanceOther');if(nextBtn)nextBtn.addEventListener('click',()=>{counted=false},true);if(checkBtn)checkBtn.addEventListener('click',()=>{if(counted)return;let ok=false;try{ok=!!(!donePages.has(4) && !awaitingNext[4] && ph.value.trim()===String(performanceDuration) && pm.value.trim()===String(performanceDuration*60) && Math.abs(analogTotal-(performanceStart+performanceDuration)*60)<1.5);}catch(e){}if(ok)counted=true;window.parent.postMessage({clockProgress:true,page:9,ok},'*');},true);})();\n<\/script><script>(function(){function teacherFill(){try{if(!parent.teacherMode)return;ph.value=performanceDuration;pm.value=performanceDuration*60;analogTotal=(performanceStart+performanceDuration)*60;paintAnalog();}catch(e){}}window.addEventListener('message',e=>{if(e.data&&e.data.teacherRefresh)teacherFill()});setInterval(teacherFill,350);teacherFill()})();<\/script><\/body><\/html>"];
window.teacherMode=false;
const goals=[10,10,10,10,5,7,7],counts=Array(7).fill(0),done=Array(7).fill(false),tabs=document.getElementById('tabs'),stage=document.getElementById('stage'),status=document.getElementById('status'),frames=[];
let active=0,unlocked=false;

const autoTab=document.createElement('button');autoTab.type='button';autoTab.textContent='8페이지 · 자동평가';autoTab.hidden=true;autoTab.onclick=()=>show(7);tabs.appendChild(autoTab);
function update(){[...tabs.children].forEach((b,i)=>{if(i<7)b.textContent=(i+1)+'페이지'+(done[i]?' ✓ 완료':'');else b.textContent='8페이지 · 자동평가';b.classList.toggle('complete',i<7&&done[i]);b.classList.toggle('active',i===active)});status.textContent=active===7?'8페이지 · 자동평가':done[active]?'🎉 '+(active+1)+'페이지 학습 완료!':`${active+1}페이지 · 연속 정답 ${counts[active]} / ${goals[active]}문제`;}
function show(i){if(i===7&&!unlocked)return;active=i;frames.forEach((f,n)=>f.classList.toggle('active',n===i));evaluation.hidden=i!==7;evaluation.classList.toggle('active',i===7);stage.style.display=i===7?'none':'';update();window.scrollTo(0,0)}

function unlock(){if(unlocked||!done.every(Boolean))return;unlocked=true;autoTab.hidden=false;update();const toast=document.getElementById('unlockToast');toast.hidden=false;setTimeout(()=>{toast.hidden=true},3000)}
window.addEventListener('message',e=>{if(!e.data||e.data.clockProgress!==true)return;const i=e.data.page-1;if(i<0||i>=7||e.source!==frames[i].contentWindow||done[i])return;if(e.data.ok){counts[i]++;if(counts[i]>=goals[i])done[i]=true;}else counts[i]=0;update();unlock()});show(0);
