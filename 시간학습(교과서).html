 document.getElementById('q2').innerHTML=names.map((n,i)=&gt;`&lt;label style=&quot;padding:8px;border:1px solid #ddd;border-radius:8px&quot;&gt;&lt;input type=&quot;checkbox&quot; value=&quot;${i}&quot; style=&quot;width:19px;height:19px;vertical-align:middle&quot;&gt; ${n}&lt;/label&gt;`).join('');

}
function val(id){let s=document.getElementById(id).value.trim();return s===''?NaN:Number(s)}
function checkAll(){

 parent.postMessage({kind:'quiz',page:3,correct:correct.every(Boolean)},'*');if(correct.every(Boolean)){newProblem();return;}
