<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구구단 웹활동지</title><style>
:root{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#203047;background:#f1f5fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:22px 15px 90px}header{background:#fff;border-radius:22px;padding:25px;box-shadow:0 5px 22px #22335512;margin-bottom:18px}h1{margin:0 0 8px;font-size:29px}header p{margin:0;color:#64748b}.meta{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}.meta input{padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:17px;width:160px}.progress{height:10px;background:#e2e8f0;border-radius:12px;margin-top:18px;overflow:hidden}.progress div{height:100%;background:#3b82f6;width:0;transition:.2s}.sheet{display:grid;grid-template-columns:1fr 1fr;gap:16px}.q{background:white;border:2px solid transparent;border-radius:18px;padding:20px;box-shadow:0 3px 16px #2233550c;min-width:0}.q h2{font-size:19px;line-height:1.6;margin:0 0 17px;display:flex;gap:10px}.num{background:#2563eb;color:white;border-radius:9px;min-width:34px;height:34px;display:inline-grid;place-items:center;font-size:19px;flex-shrink:0}.options{display:grid;gap:8px}.option{display:flex;align-items:center;gap:9px;text-align:left;padding:11px 13px;border:2px solid #dbe4ef;background:#f8fafc;border-radius:12px;font-size:17px;cursor:pointer;color:#203047}.option.selected{border-color:#2563eb;background:#dbeafe}.option b{color:#2563eb}.answer{width:67px;padding:9px;border:2px solid #cbd5e1;border-radius:9px;font-size:21px;text-align:center;background:#fff}.answer:focus{outline:2px solid #93c5fd}.inline{font-size:20px;line-height:2.7}.dots{display:flex;justify-content:center;gap:7px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:19px 5px;margin-bottom:10px}.die{width:46px;height:46px;border-radius:6px;background:#9ca3af;position:relative;box-shadow:inset 0 0 0 2px #7e8795}.die:before,.die:after{content:'';position:absolute;width:7px;height:7px;border-radius:50%;background:white}.die:before{top:9px;right:9px}.die:after{bottom:9px;left:9px}.table30{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.cell{padding:11px 0;background:#f8fafc;border:2px solid #dbe4ef;border-radius:7px;font-size:17px;cursor:pointer}.cell.selected{background:#bfdbfe;border-color:#2563eb;font-weight:bold}.clovers{font-size:37px;letter-spacing:2px;text-align:center;white-space:nowrap;overflow:hidden}.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px}.match button{border:2px solid #cbd5e1;background:#f8fafc;border-radius:10px;padding:13px 4px;font-size:18px;cursor:pointer}.match button.active{border-color:#2563eb;background:#dbeafe}.match button.paired{background:#dcfce7;border-color:#86efac}.pairlist{font-size:14px;color:#475569;min-height:20px;margin-top:10px}.status{font-weight:bold;font-size:15px;margin-top:12px;min-height:20px}.wrong{border-color:#ef4444}.wrong .status{color:#dc2626}.correct{border-color:#22c55e}.correct .status{color:#15803d}.actions{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(10px);padding:14px;display:flex;gap:10px;justify-content:center;box-shadow:0 -5px 18px #22335515}.actions button{border:0;border-radius:12px;padding:13px 23px;font-size:18px;font-weight:bold;cursor:pointer}.primary{background:#2563eb;color:white}.secondary{background:#e2e8f0;color:#334155}#result{text-align:center;font-size:18px;font-weight:bold;margin:16px}button:focus-visible{outline:3px solid #f59e0b}@media(max-width:720px){.sheet{grid-template-columns:1fr}.wrap{padding:12px 10px 90px}.q{padding:17px}.clovers{font-size:32px}h1{font-size:25px}}

.match-board{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:26%;row-gap:14px;padding:8px 0;touch-action:none;user-select:none}.match-board button{position:relative;z-index:2;min-height:55px;border:2px solid #cbd5e1;border-radius:10px;background:#f8fafc;font-size:19px;cursor:pointer;touch-action:none}.match-board button.active{background:#dbeafe;border-color:#2563eb}.match-board svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:visible;pointer-events:none}.match-board line{stroke:#2563eb;stroke-width:4;stroke-linecap:round}.match-board line.preview{stroke:#93c5fd;stroke-dasharray:7 6}.match-board .left{grid-column:1}.match-board .right{grid-column:2}.match-board .r1{grid-row:1}.match-board .r2{grid-row:2}.match-board .r3{grid-row:3}
</style></head><body><main class="wrap"><header><h1>✏️ 구구단 웹활동지</h1><p>문제를 잘 읽고 알맞은 답을 골라 보세요. 틀린 문제의 정답은 알려주지 않아요.</p><div class="meta"><input id="grade" placeholder="학년 / 반" aria-label="학년 반"><input id="student" placeholder="번호 / 이름" aria-label="번호 이름"></div><div class="progress"><div id="bar"></div></div></header><section class="sheet" id="sheet"></section><div id="result" aria-live="polite"></div></main><div class="actions"><button class="secondary" id="reset">처음부터</button><button class="primary" id="check">정답 확인하기</button></div><!-- 모든 문제를 맞힌 경우에만 표시되는 자동평가 -->
<div id="auto-evaluation-act-1792450780342" hidden style="margin:24px auto;max-width:1050px;padding:0 16px;">
  <iframe title="과제 참여 여부 확인하기" src="https://eyeholder83-commits.github.io/sh0201/%ED%95%99%EA%B8%89%ED%86%B5%ED%95%A9%EA%B4%80%EB%A6%AC.html?autoActivity=act-1792450780342" loading="lazy" style="display:block;width:100%;height:650px;border:0;border-radius:16px;background:#f8fafc;" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
<script>
function showAutoEvaluation(){const area=document.getElementById('auto-evaluation-act-1792450780342');if(area){area.hidden=false;area.scrollIntoView({behavior:'smooth',block:'start'});}}
function hideAutoEvaluation(){const area=document.getElementById('auto-evaluation-act-1792450780342');if(area)area.hidden=true;}
</script>
<script>
const questions=[
{title:'주사위의 눈의 수는 모두 몇인지 곱셈식으로 나타내 보세요.',type:'dice'},
{title:'5단 곱셈구구의 곱을 모두 표시하세요.',type:'grid'},
{title:'그림을 보고 곱셈식으로 바르게 구한 것은 어느 것인가요?',type:'choice',choices:['3×5=15','4×6=24','3×6=18','4×7=28','3×7=21'],correct:[4]},
{title:'6단 곱셈구구의 값을 찾아 이어 보세요.',type:'match'},
{title:'□ 안에 알맞은 수를 써넣으세요.',type:'fill5'},
{title:'하영이는 연필 8자루씩 5묶음을 샀습니다. 하영이가 산 연필은 모두 몇 자루일까요?',type:'choice',choices:['32자루','35자루','40자루','48자루','54자루'],correct:[2]},
{title:'어떤 수에 7을 곱해야 하는데 잘못하여 더했더니 15가 되었습니다. 바르게 계산한 답은 얼마인지 쓰세요.',type:'fill7'},
{title:'곱셈식을 바르게 계산한 것을 모두 고르세요.',type:'choice',choices:['9×2=17','9×3=27','9×4=36','9×5=40','9×6=45'],correct:[1,2]},
{title:'□ 안에 알맞은 수를 써넣으세요.',type:'fill9'},
{title:'6×8의 값을 구하는 방법으로 옳지 않은 것은 어느 것인가요?',type:'choice',choices:['6을 8번 더하여 구합니다.','8을 6번 더하여 구합니다.','6×7의 값에 7을 더하여 구합니다.','6×4의 값을 두 번 더합니다.','8×5의 값에 8을 더하여 구합니다.'],correct:[2]}
];
const state={choices:{},grid:new Set(),pairs:{},pending:null};const sheet=document.getElementById('sheet');
function input(id){return `<input class="answer" id="${id}" inputmode="numeric" pattern="[0-9]*" aria-label="빈칸 답">`}
function render(){sheet.innerHTML=questions.map((q,i)=>{let html=`<article class="q" id="q${i}"><h2><span class="num">${i+1}</span><span>${q.title}</span></h2>`;switch(q.type){case 'dice':html+=`<div class="dots">${'<div class="die"></div>'.repeat(5)}</div><div class="inline" style="text-align:center">2 × ${input('d1')} = ${input('d2')}</div>`;break;case 'grid':html+=`<div class="table30">${Array.from({length:30},(_,n)=>`<button class="cell" data-value="${n+1}" aria-pressed="false">${n+1}</button>`).join('')}</div>`;break;case 'choice':html+=`<div class="options">${q.choices.map((c,j)=>`<button class="option" data-choice="${j}" aria-pressed="false"><b>${['①','②','③','④','⑤'][j]}</b>${c}</button>`).join('')}</div>`;if(i===2)html=`<article class="q" id="q${i}"><h2><span class="num">${i+1}</span><span>${q.title}</span></h2><div class="clovers">☘️☘️☘️☘️☘️☘️☘️</div>`+html.split('<div class="options">')[1].replace(/^/,'<div class="options">');break;case 'match':html+=`<p>왼쪽 곱셈식에서 오른쪽 답까지 손가락이나 마우스로 선을 그으세요. 두 항목을 차례로 눌러도 됩니다.</p><div class="match-board" id="matchBoard"><svg id="matchSvg" aria-hidden="true"></svg>${['6×2','6×6','6×8'].map((v,i)=>`<button class="left r${i+1}" data-side="left" data-key="${v}">${v}</button>`).join('')}${['48','36','12'].map((v,i)=>`<button class="right r${i+1}" data-side="right" data-key="${v}">${v}</button>`).join('')}</div><div class="pairlist" id="pairs" aria-live="polite"></div>`;break;case 'fill5':html+=`<div class="inline">(1) 4×7은 4×${input('f51')}에 4를 더합니다.<br>(2) 8×5는 8×4에 ${input('f52')}을 더합니다.</div>`;break;case 'fill7':html+=`<div class="inline">바르게 계산한 답: ${input('f7')}</div>`;break;case 'fill9':html+=`<div class="inline">(1) ${input('f91')} × 6 = 6<br>(2) ${input('f92')} × 5 = 0</div>`;break;}return html+'<div class="status" aria-live="polite"></div></article>'}).join('');bind();}
function bind(){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let i=Number(b.closest('.q').id.slice(1)),j=Number(b.dataset.choice),multi=i===7;let s=state.choices[i]||new Set();if(!multi)s=new Set();if(multi&&s.has(j))s.delete(j);else s.add(j);state.choices[i]=s;b.parentElement.querySelectorAll('button').forEach(x=>{let selected=s.has(Number(x.dataset.choice));x.classList.toggle('selected',selected);x.setAttribute('aria-pressed',selected)});updateProgress()});document.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{let n=+b.dataset.value;if(state.grid.has(n))state.grid.delete(n);else state.grid.add(n);b.classList.toggle('selected',state.grid.has(n));b.setAttribute('aria-pressed',state.grid.has(n));updateProgress()});bindMatch();document.querySelectorAll('.answer').forEach(x=>x.addEventListener('input',updateProgress))}
function drawMatch(preview=null){const board=document.getElementById('matchBoard'),svg=document.getElementById('matchSvg');if(!board)return;const rect=board.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);svg.innerHTML='';const point=(key,side)=>{const el=[...board.querySelectorAll('button')].find(b=>b.dataset.key===key&&b.dataset.side===side);if(!el)return null;const r=el.getBoundingClientRect();return {x:(side==='left'?r.right:r.left)-rect.left,y:r.top+r.height/2-rect.top}};const add=(a,b,cls='')=>{if(!a||!b)return;const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);if(cls)line.setAttribute('class',cls);svg.appendChild(line)};Object.entries(state.pairs).forEach(([l,r])=>add(point(l,'left'),point(r,'right')));if(preview&&state.pending)add(point(state.pending,'left'),preview,'preview');board.querySelectorAll('button.left').forEach(b=>b.classList.toggle('active',b.dataset.key===state.pending));document.getElementById('pairs').textContent=Object.keys(state.pairs).length+' / 3개 연결됨'}
function bindMatch(){const board=document.getElementById('matchBoard');let drag=null;function connect(left,right){Object.keys(state.pairs).forEach(k=>{if(k!==left&&state.pairs[k]===right)delete state.pairs[k]});state.pairs[left]=right;state.pending=null;drawMatch();updateProgress()}board.querySelectorAll('button').forEach(b=>{b.addEventListener('pointerdown',e=>{if(b.dataset.side!=='left')return;drag={key:b.dataset.key,x:e.clientX,y:e.clientY,moved:false};state.pending=drag.key;drawMatch();});b.addEventListener('click',e=>{if(drag&&drag.moved){e.preventDefault();return}if(b.dataset.side==='left'){state.pending=b.dataset.key;drawMatch()}else if(state.pending)connect(state.pending,b.dataset.key)});});board.addEventListener('pointermove',e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6)drag.moved=true;if(drag.moved){const r=board.getBoundingClientRect();drawMatch({x:e.clientX-r.left,y:e.clientY-r.top})}});board.addEventListener('pointerup',e=>{if(!drag)return;const moved=drag.moved;const key=drag.key;drag=null;if(moved){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('button[data-side="right"]');if(target&&board.contains(target))connect(key,target.dataset.key);else drawMatch()} });board.addEventListener('pointercancel',()=>{drag=null;drawMatch()});window.addEventListener('resize',()=>drawMatch());drawMatch()}
const val=id=>document.getElementById(id).value.trim();const same=(a,b)=>a.size===b.size&&[...a].every(x=>b.has(x));function grade(i){let q=questions[i];switch(q.type){case 'dice':return val('d1')==='5'&&val('d2')==='10';case 'grid':return same(state.grid,new Set([5,10,15,20,25,30]));case 'choice':return same(state.choices[i]||new Set(),new Set(q.correct));case 'match':return state.pairs['6×2']==='12'&&state.pairs['6×6']==='36'&&state.pairs['6×8']==='48'&&Object.keys(state.pairs).length===3;case 'fill5':return val('f51')==='6'&&val('f52')==='8';case 'fill7':return val('f7')==='56';case 'fill9':return val('f91')==='1'&&val('f92')==='0'}}
function updateProgress(){hideAutoEvaluation();let n=0;questions.forEach((q,i)=>{if(q.type==='choice'&&(state.choices[i]?.size||0))n++;else if(q.type==='grid'&&state.grid.size)n++;else if(q.type==='match'&&Object.keys(state.pairs).length)n++;else if(q.type==='dice'&&val('d1')&&val('d2'))n++;else if(q.type==='fill5'&&val('f51')&&val('f52'))n++;else if(q.type==='fill7'&&val('f7'))n++;else if(q.type==='fill9'&&val('f91')&&val('f92'))n++});document.getElementById('bar').style.width=n*10+'%'}
document.getElementById('check').onclick=()=>{let count=0;questions.forEach((q,i)=>{let ok=grade(i),el=document.getElementById('q'+i);count+=ok?1:0;el.classList.toggle('correct',ok);el.classList.toggle('wrong',!ok);el.querySelector('.status').textContent=ok?'✓ 잘했어요!':'✕ 다시 생각해 보세요.'});document.getElementById('result').textContent=count===10?'🎉 10문제를 모두 맞혔어요!':`10문제 중 ${count}문제 정답! 틀린 문제를 다시 풀어 보세요.`;if(count===questions.length){showAutoEvaluation()}else{hideAutoEvaluation();document.getElementById('result').scrollIntoView({behavior:'smooth',block:'center'})}};document.getElementById('reset').onclick=()=>{if(confirm('모든 답을 지우고 다시 시작할까요?'))location.reload()};render();
</script></body></html>
