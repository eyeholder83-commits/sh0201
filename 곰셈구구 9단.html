<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>초등 2학년 9단 곱셈구구 & 비밀 키워드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Noto+Sans+KR:wght@500;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif;
      background: radial-gradient(circle at 50% 0%, #eff6ff 0%, #e0f2fe 35%, #f1f5f9 100%);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .font-jua {
      font-family: 'Jua', sans-serif;
    }

    /* Input styling */
    .num-input {
      border: 2.5px solid #38bdf8;
      border-radius: 12px;
      text-align: center;
      font-weight: 800;
      color: #0369a1;
      background-color: #ffffff;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .num-input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.35);
      transform: scale(1.04);
    }
    .num-input.correct {
      border-color: #10b981 !important;
      background-color: #ecfdf5 !important;
      color: #047857 !important;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25) !important;
    }
    .num-input.wrong {
      border-color: #f43f5e !important;
      background-color: #fff1f2 !important;
      color: #be123c !important;
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    @keyframes modalPop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-modal {
      animation: modalPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes softFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.03); }
    }

    .animate-float {
      animation: softFloat 2.4s infinite ease-in-out;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    /* Print certificate styles */
    @media print {
      body * {
        visibility: hidden;
      }
      #certificate-print-area, #certificate-print-area * {
        visibility: visible;
      }
      #certificate-print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 30px;
        box-shadow: none;
        border: 6px double #d97706;
      }
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center justify-between p-2 sm:p-5 relative overflow-x-hidden">

  <!-- Confetti Canvas for Celebrations -->
  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50 w-full h-full"></canvas>

  <header class="w-full max-w-5xl bg-white/95 backdrop-blur-md rounded-3xl shadow-sm border border-sky-200/80 p-3 sm:p-4 mb-3">
    <div class="flex items-center justify-between gap-2 mb-2 px-1">
      <div class="flex items-center gap-2">
        <span class="text-2xl animate-float">🌟</span>
        <h1 class="font-jua text-base sm:text-xl text-sky-900 tracking-tight">초등 2학년 2학기 · 9단 곱셈구구 탐험 & 비밀 키워드</h1>
      </div>
      
      <div class="flex items-center gap-2">
        <!-- Student Badge -->
        <div id="header-student-badge" class="hidden sm:flex items-center gap-1.5 px-3 py-1 bg-sky-50 border border-sky-300 rounded-full text-xs font-jua text-sky-800 shadow-xs">
          <span>👤</span>
          <span id="header-student-name" class="font-bold">학생 미등록</span>
          <span id="header-letters-count" class="text-amber-600 font-bold ml-1">(0/6)</span>
        </div>

        <!-- Sound Button -->
        <button id="sound-btn" onclick="toggleSound()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 text-xs sm:text-sm font-jua text-slate-700 transition-all shadow-xs active:scale-95 cursor-pointer">
          <span id="sound-icon">🔊</span>
          <span id="sound-label" class="hidden sm:inline">효과음</span>
        </button>
      </div>
    </div>

    <!-- Step Navigation Tabs (Total 8 tabs: Cover + 5 Learning Pages + 40s Challenge + Keyword) -->
    <nav class="grid grid-cols-4 sm:grid-cols-8 gap-1.5 text-center font-jua text-xs sm:text-sm" aria-label="단계 탐색">
      <button onclick="setPage(1)" id="tab-1" class="py-2 px-1 rounded-xl transition-all duration-150 cursor-pointer">📖 표지</button>
      <button onclick="setPage(2)" id="tab-2" class="py-2 px-1 rounded-xl transition-all duration-150 cursor-pointer">📄 1. 뛰어 세기</button>
      <button onclick="setPage(3)" id="tab-3" class="py-2 px-1 rounded-xl transition-all duration-150 cursor-pointer">🎲 2. 구간 거리</button>
      <button onclick="setPage(4)" id="tab-4" class="py-2 px-1 rounded-xl transition-all duration-150 cursor-pointer">✨ 3. 곱셈 원리</button>
      <button onclick="setPage(5)" id="tab-5" class="py-2 px-1 rounded-xl transition-all duration-150 cursor-pointer">⚪ 4. 묶어 세기</button>
      <button onclick="setPage(6)" id="tab-6" class="py-2 px-1 rounded-xl transition-all duration-150 cursor-pointer">🔢 5. 곱셈 완성</button>
      <button onclick="setPage(7)" id="tab-7" class="py-2 px-1 rounded-xl transition-all duration-150 text-rose-600 font-bold cursor-pointer">⏱️ 6. 40초</button>
      <button onclick="setPage(8)" id="tab-8" class="py-2 px-1 rounded-xl transition-all duration-150 text-amber-600 font-bold cursor-pointer">🎁 7. 키워드</button>
    </nav>
  </header>

  <main class="w-full max-w-5xl bg-white rounded-3xl shadow-sm border border-slate-200/90 p-4 sm:p-7 flex-1 flex flex-col items-center justify-between min-h-[580px]">
    <!-- Dynamic Learning Screen Container -->
    <div id="page-content" class="w-full flex flex-col items-center flex-1 justify-start pt-1"></div>

    <!-- Bottom Step Navigation Controls -->
    <div id="bottom-nav" class="w-full pt-4 mt-4 border-t border-slate-100 flex items-center justify-between font-jua text-sm sm:text-base">
      <button id="prev-step-btn" onclick="goPrevPage()" class="flex items-center gap-1.5 px-4 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all disabled:opacity-30 disabled:hover:bg-slate-100 cursor-pointer">
        <span>◀</span> <span>이전 단계</span>
      </button>
      <span id="page-indicator" class="text-slate-400 font-bold">1 / 8 단계</span>
      <button id="next-step-btn" onclick="goNextPage()" class="flex items-center gap-1.5 px-5 py-2.5 rounded-2xl bg-sky-600 hover:bg-sky-700 text-white shadow-xs transition-all active:scale-95 disabled:opacity-30 cursor-pointer">
        <span>다음 단계</span> <span>▶</span>
      </button>
    </div>
  </main>

  <!-- Success / Celebration Modal -->
  <div id="success-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl border-4 border-sky-400 text-center animate-modal relative">
      <div id="modal-badge-icon" class="text-6xl mb-2 animate-float">🎉👑</div>
      <div id="modal-badge-label" class="inline-block bg-sky-100 text-sky-800 text-xs font-bold px-3 py-1 rounded-full mb-2">단계 마스터 배지 & 비밀 글자 획득!</div>
      <h3 id="modal-title" class="font-jua text-2xl sm:text-3xl text-sky-700 mb-2">대단해요! 정답 성공! 🎉</h3>
      <p id="modal-desc" class="text-slate-600 text-sm sm:text-base font-medium mb-6 leading-relaxed whitespace-pre-line">곱셈구구를 완벽하게 이해하고 있어요!</p>
      
      <div class="flex flex-col gap-2">
        <button id="modal-next-btn" onclick="handleModalNextStep()" class="w-full py-3.5 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white font-jua text-lg rounded-2xl shadow-md transition-all active:scale-95 cursor-pointer flex items-center justify-center gap-2">
          <span>다음 단계로 출발! 🚀</span>
        </button>
        <button onclick="closeModal()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-jua text-sm rounded-xl transition-all cursor-pointer">
          이 단계 더 연습하기 🔄
        </button>
      </div>
    </div>
  </div>

  <!-- Custom Alert / Warning Notice Modal -->
  <div id="notice-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-xl border-2 border-amber-400 text-center animate-modal relative">
      <div class="text-4xl mb-2">💡</div>
      <h4 class="font-jua text-xl text-amber-900 mb-2 font-bold">안내</h4>
      <p id="notice-modal-msg" class="text-slate-600 font-jua text-sm sm:text-base mb-5 whitespace-pre-line"></p>
      <button onclick="closeNoticeModal()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-jua text-base rounded-xl transition-all active:scale-95 cursor-pointer">
        확인
      </button>
    </div>
  </div>

  <script>
    const STUDENT_DB = {
      '김서아': '오늘도힘내자',
      '김수현': '친구를아껴요',
      '김윤아': '웃으며지내자',
      '김태영': '끝까지해보자',
      '김하랑': '마음을나눠요',
      '나예린': '서로를도와요',
      '박민제': '힘차게달려요',
      '박선우': '약속을지켜요',
      '양수빈': '천천히해봐요',
      '유소영': '밝게웃어봐요',
      '이대운': '씩씩하게가자',
      '이새봄': '고운말을써요',
      '이서율': '차근차근해요',
      '이진서': '자신있게해요',
      '이채원': '함께라서좋아',
      '이초은': '배려하며살자',
      '이태환': '용기내어보자',
      '이하린': '즐겁게배워요',
      '한규빈': '힘을모아보자',
      '한유은': '마음껏웃어요',
      '현지우': '포기하지말자',
      '황지우': '꿈을향해가자',
      '이승찬': '한국의교육자'
    };

    let currentStudent = '';
    let studentTargetSentence = '';
    let unlockedLetters = {};
    let currentPage = 1;
    let nextTargetPage = 0;

    // 연속 정답 스트릭 상태 변수
    let p1Streak = 0;
    let p1CardLayout = [];
    let p2Streak = 0;
    let p3Streak = 0;
    let p4Streak = 0;
    let p5Streak = 0;

    // Audio context management
    let audioCtx = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Wake audio up on first user touch/interaction
    window.addEventListener('pointerdown', () => {
      if (!audioCtx && !isMuted) {
        try { initAudio(); } catch (e) {}
      }
    }, { once: true });

    function toggleSound() {
      isMuted = !isMuted;
      const icon = document.getElementById('sound-icon');
      const label = document.getElementById('sound-label');
      if (isMuted) {
        icon.innerText = '🔇';
        label.innerText = '음소거';
      } else {
        icon.innerText = '🔊';
        label.innerText = '효과음';
        initAudio();
        playSound('correct');
      }
    }

    function playSound(type) {
      if (isMuted) return;
      try {
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;

        if (type === 'correct') {
          // Playful major chime
          const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const st = now + idx * 0.08;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, st);
            gain.gain.setValueAtTime(0.18, st);
            gain.gain.exponentialRampToValueAtTime(0.0001, st + 0.35);
            osc.start(st);
            osc.stop(st + 0.35);
          });
        } else if (type === 'wrong') {
          // Gentle warm boop
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(230, now);
          osc.frequency.setValueAtTime(160, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          osc.start(now);
          osc.stop(now + 0.32);
        } else if (type === 'fanfare') {
          // Victorious fanfare
          const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const st = now + idx * 0.09;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, st);
            gain.gain.setValueAtTime(0.22, st);
            gain.gain.exponentialRampToValueAtTime(0.0001, st + 0.4);
            osc.start(st);
            osc.stop(st + 0.4);
          });
        }
      } catch (e) {
        console.warn('Audio not available:', e);
      }
    }

    // Full screen Confetti Cannon
    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#0284c7', '#38bdf8', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6'];

      for (let i = 0; i < 90; i++) {
        particles.push({
          x: canvas.width * 0.5,
          y: canvas.height * 0.35,
          r: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.75) * 16,
          alpha: 1,
          decay: Math.random() * 0.015 + 0.01
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach(p => {
          if (p.alpha > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.38;
            p.alpha -= p.decay;
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        });
        if (active) {
          requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      render();
    }

    // Modal and Notice utilities
    function showNoticeModal(message) {
      const modal = document.getElementById('notice-modal');
      const msgEl = document.getElementById('notice-modal-msg');
      if (modal && msgEl) {
        msgEl.innerText = message;
        modal.classList.remove('hidden');
      }
    }

    function closeNoticeModal() {
      const modal = document.getElementById('notice-modal');
      if (modal) modal.classList.add('hidden');
    }

    function openSuccessModal({ title, badge, desc, nextPageNum }) {
      const modal = document.getElementById('success-modal');
      const titleEl = document.getElementById('modal-title');
      const badgeEl = document.getElementById('modal-badge-label');
      const descEl = document.getElementById('modal-desc');
      const nextBtn = document.getElementById('modal-next-btn');

      if (titleEl) titleEl.innerText = title;
      if (badgeEl) badgeEl.innerText = badge;
      if (descEl) descEl.innerText = desc;
      nextTargetPage = nextPageNum;

      if (nextBtn) {
        if (nextTargetPage === 1) {
          nextBtn.innerHTML = '<span>처음 화면으로 돌아가기 🏠</span>';
        } else if (nextTargetPage === 8) {
          nextBtn.innerHTML = '<span>비밀 키워드 열러 가기! 🎁</span>';
        } else {
          nextBtn.innerHTML = `<span>다음 단계로 출발! 🚀</span>`;
        }
      }

      if (modal) modal.classList.remove('hidden');
    }

    function handleModalNextStep() {
      const modal = document.getElementById('success-modal');
      if (modal) modal.classList.add('hidden');
      if (nextTargetPage > 0) {
        setPage(nextTargetPage, true);
      }
    }

    function closeModal() {
      document.getElementById('success-modal').classList.add('hidden');
    }

    // Student Registration & Keyword letter management
    function registerStudent(name) {
      const trimmed = name ? name.trim() : '';
      if (!trimmed) {
        showNoticeModal('🔒 이름을 입력하거나 명단에서 선택해 주세요!\n이름을 등록해야 다음 단계로 나아갈 수 있습니다.');
        return false;
      }

      const prevStudent = currentStudent;
      currentStudent = trimmed;
      // Fallback 6-letter encouraging target sentence
      studentTargetSentence = STUDENT_DB[trimmed] || '너는최고야멋져';

      if (prevStudent !== currentStudent) {
        for (const step in unlockedLetters) {
          const charIdx = parseInt(step, 10) - 1;
          unlockedLetters[step] = studentTargetSentence.charAt(charIdx) || '★';
        }
      }

      const badge = document.getElementById('header-student-badge');
      const sName = document.getElementById('header-student-name');
      if (badge && sName) {
        badge.classList.remove('hidden');
        sName.innerText = currentStudent;
      }
      updateHeaderLettersTracker();
      return true;
    }

    function awardKeywordLetter(stepNum) {
      if (!currentStudent) {
        currentStudent = '친구';
        studentTargetSentence = '너는최고야멋져';
      }
      const charIndex = stepNum - 1;
      const letter = studentTargetSentence.charAt(charIndex) || '★';
      unlockedLetters[stepNum] = letter;
      updateHeaderLettersTracker();
      return letter;
    }

    function updateHeaderLettersTracker() {
      const countEl = document.getElementById('header-letters-count');
      const count = Object.keys(unlockedLetters).length;
      if (countEl) countEl.innerText = `(${count}/6)`;
    }

    // Keyboard navigation helper for auto-advance
    function attachAutoAdvance(selector, onComplete) {
      const inputs = Array.from(document.querySelectorAll(selector));
      inputs.forEach((input, index) => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (index < inputs.length - 1) {
              inputs[index + 1].focus();
            } else if (onComplete) {
              onComplete();
            }
          }
        });
      });
    }

    function renderCoverPage() {
      const container = document.getElementById('page-content');
      if (!container) return;
      
      const studentOptions = Object.keys(STUDENT_DB).map(name => `
        <option value="${name}" ${currentStudent === name ? 'selected' : ''}>${name}</option>
      `).join('');

      const slotsHtml = [1, 2, 3, 4, 5, 6].map(num => {
        const letter = unlockedLetters[num];
        if (letter) {
          return `
            <div class="flex flex-col items-center">
              <span class="text-[10px] text-amber-700 font-bold mb-0.5">${num}단계</span>
              <div class="w-10 h-12 sm:w-12 sm:h-14 rounded-xl bg-gradient-to-b from-amber-200 to-amber-300 border-2 border-amber-400 text-amber-950 font-jua text-xl sm:text-2xl flex items-center justify-center font-bold shadow-xs">
                ${letter}
              </div>
            </div>
          `;
        }
        return `
          <div class="flex flex-col items-center">
            <span class="text-[10px] text-slate-400 font-medium mb-0.5">${num}단계</span>
            <div class="w-10 h-12 sm:w-12 sm:h-14 rounded-xl bg-slate-100 border-2 border-slate-200 text-slate-400 font-jua text-sm sm:text-base flex items-center justify-center font-bold shadow-inner">
              ${num}
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="w-full flex flex-col items-center justify-center py-3 px-2 text-center max-w-2xl">
          <div class="inline-flex items-center gap-2 px-5 py-2 bg-emerald-100 text-emerald-900 rounded-full font-jua text-sm sm:text-base mb-3 shadow-xs border border-emerald-300">
            <span>✨</span> <span>초등 수학 2학년 2학기 · 9단 곱셈구구 탐험</span>
          </div>
          
          <h2 class="font-jua text-3xl sm:text-5xl text-slate-900 tracking-tight mb-2 drop-shadow-xs">
            9단 곱셈구구 & 비밀 키워드
          </h2>
          
          <p class="font-jua text-slate-700 text-base sm:text-xl mb-4 font-medium">

    function resetP1Inputs() {
      const inputs = document.querySelectorAll('.p1-input');
      inputs.forEach(input => {
        input.value = '';
        input.classList.remove('correct', 'wrong');
      });
      const firstInput = document.querySelector('.p1-input');
      if (firstInput) firstInput.focus();
    }

    function checkP1Answers() {
      const inputs = document.querySelectorAll('.p1-input');
      let allFilled = true;
      let allCorrect = true;

      inputs.forEach(input => {
        const expected = input.getAttribute('data-ans').trim();
        const value = input.value.trim();

        input.classList.remove('correct', 'wrong');

        if (value === '') {
          allFilled = false;
          allCorrect = false;
        } else if (value === expected) {
          input.classList.add('correct');
        } else {
          input.classList.add('wrong');
          allCorrect = false;
        }
      });

      if (!allFilled) {
        playSound('wrong');
        showNoticeModal('⚠️ 아직 입력하지 않은 빈칸이 있어요!\n모든 네모칸에 알맞은 수를 적어주세요.');
        return;
      }

      if (allCorrect) {
        playSound('correct');
        p1Streak++;
        const starsEl = document.getElementById('p1-streak-stars');
        if (starsEl) {
          starsEl.innerText = '★'.repeat(p1Streak) + '☆'.repeat(5 - p1Streak);
        }

        if (p1Streak >= 5) {
          playSound('fanfare');
          triggerConfetti();
          const letter = awardKeywordLetter(1);
          p1Streak = 0;
          openSuccessModal({
            title: `1단계 5연속 정답 성공! 🎉`,
            badge: `1단계 마스터 배지 & 비밀 글자 획득!`,

            nextPageNum: 3
          });
        } else {
          showNoticeModal(`🎉 정답입니다! (${p1Streak}/5 성공)\n연속 5번 성공을 향해 다음 문제로 이동합니다! 🚀`);
          setTimeout(() => {
            generateP1CardLayout();
            renderPage1();
          }, 750);
        }
      } else {
        playSound('wrong');
        p1Streak = 0;
        showNoticeModal('❌ 빨간색으로 표시된 칸에 틀린 답이 있어요!\n연속 성공이 0으로 리셋됩니다. 새로운 문제로 다시 도전해 보세요!');

      { fill: '#f43f5e', stroke: '#e11d48', bg: '#ffe4e6', text: '#be123c' },
    ];

    function createSVGTrack(start, end, themeColor) {
      const maxTicks = 9;
      const svgWidth = 600;
      const leftMargin = 40;
      const stepWidth = (svgWidth - 80) / maxTicks;
      const trackY = 70;
      const getX = (i) => leftMargin + i * stepWidth;

      let svgHtml = `
        <svg viewBox="0 0 ${svgWidth} 105" class="w-full h-auto overflow-visible select-none">
          <rect x="${leftMargin - 15}" y="${trackY - 8}" width="${maxTicks * stepWidth + 30}" height="16" rx="8" fill="#e2e8f0" />
          <rect x="${getX(start)}" y="${trackY - 8}" width="${getX(end) - getX(start)}" height="16" fill="#bae6fd" />
      `;

      for (let i = 0; i <= maxTicks; i++) {
        const x = getX(i);
        const isStart = (i === start);
        const isEnd = (i === end);
        const inRange = (i >= start && i <= end);

        svgHtml += `<line x1="${x}" y1="${trackY - 26}" x2="${x}" y2="${trackY}" stroke="${inRange ? '#f59e0b' : '#cbd5e1'}" stroke-width="${inRange ? 3 : 2}" />`;

        const circleFill = isStart || isEnd ? '#ffffff' : (inRange ? '#fef3c7' : '#f8fafc');
        const circleStroke = isStart || isEnd ? '#0284c7' : (inRange ? '#f59e0b' : '#94a3b8');
        const textColor = isStart || isEnd ? '#0369a1' : (inRange ? '#b45309' : '#64748b');

        svgHtml += `
          <circle cx="${x}" cy="${trackY - 38}" r="13" fill="${circleFill}" stroke="${circleStroke}" stroke-width="${isStart || isEnd ? 2.5 : 1.5}"/>
          <text x="${x}" y="${trackY - 33}" text-anchor="middle" fill="${textColor}" font-size="${i === 0 ? '10' : '13'}" font-weight="900">
            ${i === 0 ? '출발' : i}
          </text>
        `;
      }

      for (let i = start; i < end; i++) {
        const x1 = getX(i);
        const x2 = getX(i + 1);
        const midX = (x1 + x2) / 2;
        svgHtml += `
          <path d="M ${x1} ${trackY - 24} Q ${midX} ${trackY - 48}, ${x2} ${trackY - 24}" fill="none" stroke="#db2777" stroke-width="2.5" stroke-dasharray="4 3"/>
          <text x="${midX}" y="${trackY - 50}" text-anchor="middle" fill="#db2777" font-size="11" font-weight="800">9 cm</text>
        `;
      }

      const startX = getX(start);
      const endX = getX(end);

      svgHtml += `<circle cx="${startX}" cy="${trackY}" r="12" fill="${themeColor.fill}" fill-opacity="0.3" stroke="${themeColor.stroke}" stroke-width="2"/>`;
      svgHtml += `<circle cx="${endX}" cy="${trackY}" r="13" fill="${themeColor.fill}" stroke="${themeColor.stroke}" stroke-width="2.5"/>`;

      svgHtml += `
        <line x1="${startX}" y1="${trackY + 18}" x2="${endX - 7}" y2="${trackY + 18}" stroke="#0284c7" stroke-width="3" />
        <polygon points="${endX},${trackY + 18} ${endX - 8},${trackY + 14} ${endX - 8},${trackY + 22}" fill="#0284c7" />
      `;

      svgHtml += `</svg>`;
      return svgHtml;
    }

    function generatePage3Problems() {
      const container = document.getElementById('page3ProblemsContainer');

      chosen.forEach((N, idx) => {
        const nextN = N + 1;
        const baseMul = 9 * N;

        const totalSteps = nextN + 1;
        const svgWidth = 660;
        const leftMargin = 40;
        const rightMargin = 40;
        const stepWidth = (svgWidth - leftMargin - rightMargin) / (totalSteps - 0.5);
        const trackY = 95;

        let svg = `<svg viewBox="0 0 ${svgWidth} 175" class="w-full h-auto overflow-visible select-none">`;

        const startX = getX(0);
        const midTargetX = getX(N);

        const bigArcPeakY = 32;

        svg += `
          <path d="M ${startX} ${trackY - 5} Q ${bigArcMidX} ${bigArcPeakY - 10}, ${midTargetX} ${trackY - 5}" fill="none" stroke="#0284c7" stroke-width="2.5" />

          <rect x="${bigArcMidX - 65}" y="${bigArcPeakY - 18}" width="130" height="30" rx="8" fill="#ffffff" stroke="#e0f2fe" stroke-width="1.5" />

            9 × ${N} ＝ ${baseMul}

        `;

        const lineEndX = getX(totalSteps - 1) + 20;
        svg += `<line x1="${startX}" y1="${trackY}" x2="${lineEndX}" y2="${trackY}" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />`;

        for (let i = 0; i < totalSteps; i++) {
          const x = getX(i);
          svg += `<line x1="${x}" y1="${trackY - 8}" x2="${x}" y2="${trackY + 8}" stroke="#334155" stroke-width="2" />`;

          if (i < nextN) {

        svg += `
          <foreignObject x="${lastMidX - 30}" y="${trackY - 78}" width="95" height="52">

              <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" data-ans="${targetMul}" class="p3-input num-input w-full h-11 text-xl shadow-sm" />
            </div>
          </foreignObject>
        `;

        svg += `</svg>`;

        const card = document.createElement('div');
        card.className = 'bg-slate-50/75 rounded-3xl p-6 md:p-8 border border-slate-200 shadow-sm';
        card.innerHTML = `
          <div class="flex items-center gap-3 mb-5">

    function generatePage4Problems() {
      const container = document.getElementById('page4ProblemsContainer');

      const rows = 9; 
      const cols = Math.floor(Math.random() * 9) + 1; // 1~9묶음
      const total = rows * cols;

      const dotRadius = 12;
      const spacingX = 36;
      const spacingY = 34;
      const padX = 26;
      const padY = 26;

      const svgWidth = padX * 2 + (cols - 1) * spacingX;
      const svgHeight = padY * 2 + (rows - 1) * spacingY;
      const capWidth = dotRadius * 2 + 8;
      const capHeight = (rows - 1) * spacingY + (dotRadius * 2) + 12;

      let capsulesSvg = '';
      for (let c = 0; c < cols; c++) {
        const cx = padX + c * spacingX;
        const topY = padY - dotRadius - 6;
        capsulesSvg += `
          <rect x="${cx - capWidth / 2}" y="${topY}" width="${capWidth}" height="${capHeight}" rx="${capWidth / 2}" fill="#bae6fd" />
        `;
      }

      let stonesSvg = '';
      for (let c = 0; c < cols; c++) {

          const cx = padX + c * spacingX;
          const cy = padY + r * spacingY;
          stonesSvg += `
            <circle cx="${cx}" cy="${cy}" r="${dotRadius}" fill="url(#p4StoneGrad)" />
            <ellipse cx="${cx - 3}" cy="${cy - 3.5}" rx="${dotRadius * 0.45}" ry="${dotRadius * 0.28}" fill="#ffffff" opacity="0.75" />

      const svg = `

              <stop offset="35%" stop-color="#1e293b" />

    function generateP8Questions() {
      const dans = [2, 3, 4, 5, 6, 7, 8, 9];
      const qList = [];
      const usedPairs = new Set();

      while (qList.length < 10) {
        const dan = dans[Math.floor(Math.random() * dans.length)];
        const mult = Math.floor(Math.random() * 9) + 1;
        const key = `${dan}x${mult}`;
        if (!usedPairs.has(key)) {
          usedPairs.add(key);
          qList.push({ dan, mult, ans: dan * mult });
        }
      }
      return qList;
    }

    function checkP10Answer() {
      const missingSteps = [1, 2, 3, 4, 5, 6].filter(i => !unlockedLetters[i]);

        showNoticeModal(`🔒 아직 비밀 글자를 다 모으지 못했어요!\n현재 ${6 - missingSteps.length}/6개 수집됨.\n학습 미션과 40초 스피드 챌린지를 먼저 성공해야 합니다.`);

      }

      const feedback = document.getElementById('p10-feedback');

      const userVal = inp.value.trim().replace(/\s+/g, '');
      const targetVal = studentTargetSentence.replace(/\s+/g, '');

      if (!userVal) {
        if (feedback) {
          feedback.className = 'mt-4 font-jua text-base text-amber-600';

        }
        inp.focus();
        return;
      }

      if (userVal === targetVal) {
        playSound('fanfare');
        triggerConfetti();
        if (feedback) {
          feedback.className = 'mt-4 font-jua text-xl text-emerald-600 font-bold';

          title: '🎉 모든 모험 완료! 챔피언! 🎉',

          nextPageNum: 1
        });
      } else {
        playSound('wrong');
        if (feedback) {
          feedback.className = 'mt-4 font-jua text-base text-rose-500';
          feedback.innerText = `❌ 아직 일치하지 않아요! 모은 6글자를 순서대로 차근차근 이어 써보세요!`;

      }

      for (let i = 1; i <= 8; i++) {
        const tab = document.getElementById(`tab-${i}`);
        if (tab) {
          if (i === num) {
            tab.className = "py-2 px-1 rounded-xl bg-sky-600 text-white shadow-xs font-bold border-2 border-sky-700 cursor-pointer";
          } else {
            tab.className = "py-2 px-1 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium border-2 border-transparent cursor-pointer";
          }
        }
      }

      const pageIndicator = document.getElementById('page-indicator');
      if (pageIndicator) {
        pageIndicator.innerText = `${num} / 8 단계`;
      }

      const prevBtn = document.getElementById('prev-step-btn');
      const nextBtn = document.getElementById('next-step-btn');
      if (prevBtn) prevBtn.disabled = (num === 1);
      if (nextBtn) nextBtn.disabled = (num === 8);

      if (num === 1) renderCoverPage();
      else if (num === 2) {
        if (forceRandom) generateP1CardLayout();
        renderPage1();
      }
      else if (num === 3) renderPage2();
      else if (num === 4) renderPage3();
      else if (num === 5) renderPage4();
      else if (num === 6) renderPage5();
      else if (num === 7) {
        p8IsStarted = false;
        renderPage6();
      } else if (num === 8) {
        renderPage7();
      }
    }

    function goPrevPage() {
      if (currentPage > 1) {
        setPage(currentPage - 1, false);
      }
    }

    function goNextPage() {
      if (currentPage === 1 && !currentStudent) {
        const inp = document.getElementById('cover-student-input');
        const name = inp ? inp.value.trim() : '';
        if (!name) {
          showNoticeModal('🔒 이름을 먼저 등록해야 다음 단계로 나아갈 수 있어요!\n표지에서 이름을 입력하거나 명단에서 선택해 주세요.');
          if (inp) inp.focus();
          return;
        }
        registerStudent(name);
      }
      if (currentPage < 8) {
        setPage(currentPage + 1, false);
      }
    }

    window.onload = function() {
      setPage(1, true);
    };
  </script>
</body>
</html>
