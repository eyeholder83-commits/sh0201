        // Synthesized audio feedback using Tone.js

        window.appState = {
            role: 'select', // 'select' | 'teacher' | 'student'
            roomCode: 'CLASS1',
            playerName: '',
            userId: '',
            gameStage: 'submit', // 'submit' | 'presenting' | 'result' | 'finished'
            myKeyword: '',
            keywordStatus: 'none', // 'none' | 'pending' | 'approved' | 'rejected'
            teacherFeedback: '',
            quizRounds: [], // Array of { order: 1, userId: '...', studentName: '...', keyword: '...' }
            currentRoundIndex: 0,
            activePresenterId: null,
            activePresenterName: '',
            activeKeyword: '',
            isKeywordRevealed: false,
            scores: {}, // { [userId]: { guessScore: 0, presenterScore: 0, total: 0 } }
            guesses: {}, // { [userId]: { guess: '...', correct: false, ... } }
            playersList: [],
            connected: false
        };

        // Logic for Participant-based Dynamic Scoring
        // Total participants N
        // Max Guess Score = N - 1
        // Max Presenter Score = round(N * (2/3) * 2)
        window.getGameScoreLimits = function(totalParticipants) {
            const N = Math.max(totalParticipants || window.appState.playersList.length || 22, 2);
            const maxGuessScore = N - 1;
            const maxPresenterScore = Math.round(N * (2 / 3) * 2);
            const totalMaxScore = maxGuessScore + maxPresenterScore;
            const optimalCorrect = Math.max(1, Math.round((N - 1) * (2 / 3)));
            return {
                N,
                maxGuessScore,
                maxPresenterScore,
                totalMaxScore,
                optimalCorrect
            };
        };

        // Logic for Presenter Score based on correctCount and totalGuessers (N - 1)
        window.calculatePresenterPoints = function(correctCount, totalGuessers) {
            if (correctCount <= 0) return 0;
            const N = Math.max(window.appState.playersList.length || (totalGuessers + 1), 2);
            const limits = window.getGameScoreLimits(N);
            const maxGuessers = Math.max(totalGuessers, N - 1);
            const optimal = limits.optimalCorrect;
            const maxPoints = limits.maxPresenterScore;

            if (correctCount >= maxGuessers) {
                return 0; // 전원 정답 = 너무 쉬움 = 0점
            } else if (correctCount === optimal) {
                return maxPoints; // 최적 비율 정답 = 설명 만점!
            } else if (correctCount < optimal) {
                // 1명부터 optimal명까지 비례 상승
                return Math.max(0, Math.round((correctCount / optimal) * maxPoints));
            } else {
                // optimal+1명부터 maxGuessers-1명까지 비례 하강
                const remaining = maxGuessers - correctCount;
                const span = maxGuessers - optimal;
                return Math.max(0, Math.round((remaining / span) * maxPoints));
            }
        };

        window.initFirebase = async function() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // This class game uses Firebase Anonymous Authentication.
                const credential = await signInAnonymously(auth);
                currentUser = credential.user;
                window.appState.userId = currentUser.uid;
                window.appState.connected = true;
                console.log("Firebase connected:", firebaseConfig.projectId, currentUser.uid);
                renderUI();
            } catch (e) {
                console.error("Firebase initialization failed:", e);
                window.appState.connected = false;
                window.appState.userId = '';
                renderUI();
                setTimeout(() => {
                    if (typeof showModal === 'function') {
                        showModal(
                            "Firebase 연결에 실패했습니다. 인터넷 연결, 익명 로그인, Firestore 설정을 확인해주세요.",
                            "연결 오류",
                            "⚠️"
                        );
                    }
                }, 300);
            }
        };

        window.joinRoomAsStudent = async function() {
            const selectEl = document.getElementById('student-select-name');
            const name = (selectEl?.value || '').trim();
            const code = 'CLASS1';

            if (!name) {
                showModal("우리 반 명단에서 본인의 이름을 선택해주세요!", "참가 안내", "⚠️");
                return;
            }

            sounds.click();
            window.appState.playerName = name;
            window.appState.roomCode = code;
            window.appState.role = 'student';

            await setupRoomDoc(code);
            await registerPlayer(code, name);
            listenToRoom(code);
            renderUI();
        };

        window.joinRoomAsTeacher = async function() {
            const code = 'CLASS1';
            window.appState.roomCode = code;
            window.appState.role = 'teacher';
            sounds.ding();

            await setupRoomDoc(code);
            listenToRoom(code);
            renderUI();
        };

        async function setupRoomDoc(code) {
            if (!db) return;
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
            try {
                const snap = await getDoc(roomRef);
                if (!snap.exists()) {
                    await setDoc(roomRef, {
                        code: code,
                        gameStage: 'submit',
                        quizRounds: [],
                        currentRoundIndex: 0,
                        activePresenterId: null,
                        activePresenterName: '',
                        activeKeyword: '',
                        isKeywordRevealed: false,
                        updatedAt: Date.now()
                    });
                }
            } catch (e) {
                console.error("Setup room error:", e);
            }
        }

        async function registerPlayer(code, name) {
            if (!db || !currentUser) return;
            const playerDocId = `${code}_${currentUser.uid}`;
            const playerRef = doc(db, 'artifacts', appId, 'public', 'data', 'players', playerDocId);
            try {
                const existing = await getDoc(playerRef);
                if (existing.exists()) {
                    const data = existing.data();
                    window.appState.myKeyword = data.keyword || '';
                    window.appState.keywordStatus = data.keywordStatus || 'none';
                    window.appState.teacherFeedback = data.teacherFeedback || '';
                    await updateDoc(playerRef, {
                        name: name,
                        online: true,
                        lastSeen: Date.now()
                    });
                } else {
                    await setDoc(playerRef, {
                        roomCode: code,
                        userId: currentUser.uid,
                        name: name,
                        keyword: '',
                        keywordStatus: 'none',
                        teacherFeedback: '',
                        guessScore: 0,
                        presenterScore: 0,
                        score: 0,
                        online: true,
                        createdAt: Date.now()
                    });
                }
            } catch (e) {
                console.error("Register player error:", e);
            }
        }

        function listenToRoom(code) {
            if (!db) return;

            if (unsubRoom) unsubRoom();
            if (unsubPlayers) unsubPlayers();
            if (unsubGuesses) unsubGuesses();

            // 1. Room document listener
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
            unsubRoom = onSnapshot(roomRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    window.appState.gameStage = data.gameStage || 'submit';
                    window.appState.quizRounds = data.quizRounds || [];
                    window.appState.currentRoundIndex = data.currentRoundIndex || 0;
                    window.appState.activePresenterId = data.activePresenterId || null;
                    window.appState.activePresenterName = data.activePresenterName || '';
                    window.appState.activeKeyword = data.activeKeyword || '';
                    window.appState.isKeywordRevealed = !!data.isKeywordRevealed;
                    renderUI();
                }
            }, (err) => console.error("Room listener error:", err));

            // 2. Players list listener
            const playersCol = collection(db, 'artifacts', appId, 'public', 'data', 'players');
            unsubPlayers = onSnapshot(playersCol, (snapshot) => {
                const list = [];
                const scores = {};
                snapshot.forEach(d => {
                    const p = d.data();
                    if (p.roomCode === code) {
                        list.push(p);
                        scores[p.userId] = {
                            total: (p.guessScore || 0) + (p.presenterScore || 0),
                            guessScore: p.guessScore || 0,
                            presenterScore: p.presenterScore || 0
                        };
                        if (currentUser && p.userId === currentUser.uid) {
                            window.appState.myKeyword = p.keyword || '';
                            window.appState.keywordStatus = p.keywordStatus || 'none';
                            window.appState.teacherFeedback = p.teacherFeedback || '';
                        }
                    }
                });
                window.appState.playersList = list;
                window.appState.scores = scores;
                renderUI();
            }, (err) => console.error("Players listener error:", err));

            // 3. Guesses listener
            const guessesCol = collection(db, 'artifacts', appId, 'public', 'data', 'guesses');
            unsubGuesses = onSnapshot(guessesCol, (snapshot) => {
                const map = {};
                snapshot.forEach(d => {
                    const g = d.data();
                    if (g.roomCode === code && g.roundIndex === window.appState.currentRoundIndex) {
                        map[g.userId] = g;
                    }
                });
                window.appState.guesses = map;
                renderUI();
            }, (err) => console.error("Guesses listener error:", err));
        }

        window.submitKeywordDirectly = async function(sourceInputId) {
            let val = '';
            if (sourceInputId) {
                const el = document.getElementById(sourceInputId);
                if (el) val = el.value.trim();
            }
            if (!val) {
                const activeEl = document.getElementById('keyword-input') || 
                                 document.getElementById('modal-keyword-input');
                if (activeEl) val = activeEl.value.trim();
            }

            if (!val) {
                showModal("설명할 물건 이름을 적어주세요! (예: 지구본, 필통)", "입력 확인", "✏️");
                return;
            }

            sounds.ding();
            window.appState.myKeyword = val;
            closeKeywordModal();

            if (!db || !currentUser) {
                window.appState.keywordStatus = 'approved';
                showModal(`"${val}" 키워드가 등록되었습니다!`, "등록 완료", "✅");
                renderUI();
                return;
            }

            const code = window.appState.roomCode;
            const playerDocId = `${code}_${currentUser.uid}`;
            const playerRef = doc(db, 'artifacts', appId, 'public', 'data', 'players', playerDocId);

            await updateDoc(playerRef, {
                keyword: val,
                keywordStatus: 'pending',
                teacherFeedback: '선생님이 확인 중입니다. 승인되면 답안지에 포함됩니다!'
            });
            showModal(`"${val}" 키워드를 선생님께 제출했습니다!`, "제출 완료", "📨");
            renderUI();
        };

        window.submitGuess = async function() {
            // Check if current student is the presenter for this round
            if (window.appState.activePresenterId === window.appState.userId) {
                showModal("출제자 본인은 이번 문제의 정답을 제출할 수 없습니다! (교실 앞에서 친구들에게 설명해주세요)", "출제자 안내", "🔒");
                return;
            }

            const input = document.getElementById('guess-input');
            const gVal = (input ? input.value : '').trim();
            if (!gVal) {
                showModal("정답을 입력해주세요!", "입력 확인", "🤔");
                return;
            }

            sounds.click();
            const code = window.appState.roomCode;
            const roundIdx = window.appState.currentRoundIndex;
            const presenterId = window.appState.activePresenterId;

            if (!db || !currentUser) {
                window.appState.guesses[window.appState.userId] = {
                    guess: gVal,
                    name: window.appState.playerName,
                    userId: window.appState.userId,
                    roundIndex: roundIdx,
                    timestamp: Date.now()
                };
                showModal(`정답 "${gVal}" 제출 완료!`, "제출됨", "🎯");
                renderUI();
                return;
            }

            const guessDocId = `${code}_round${roundIdx}_${currentUser.uid}`;
            const guessRef = doc(db, 'artifacts', appId, 'public', 'data', 'guesses', guessDocId);
            await setDoc(guessRef, {
                roomCode: code,
                roundIndex: roundIdx,
                presenterId: presenterId,
                userId: currentUser.uid,
                name: window.appState.playerName,
                guess: gVal,
                correct: false,
                timestamp: Date.now()
            });

            if (input) input.value = '';
            showModal(`정답 "${gVal}"이(가) 등록되었습니다!`, "제출 완료", "🎯");
            renderUI();
        };

        window.teacherApprove = async function(uid, approved, feedback = '') {
            sounds.ding();
            if (!db) {
                const p = window.appState.playersList.find(x => x.userId === uid);
                if (p) {
                    p.keywordStatus = approved ? 'approved' : 'rejected';
                    p.teacherFeedback = feedback || (approved ? '선생님 승인 완료!' : '다시 작성해주세요');
                }
                renderUI();
                return;
            }
            const code = window.appState.roomCode;
            const playerRef = doc(db, 'artifacts', appId, 'public', 'data', 'players', `${code}_${uid}`);
            await updateDoc(playerRef, {
                keywordStatus: approved ? 'approved' : 'rejected',
                teacherFeedback: feedback || (approved ? '선생님 승인 완료!' : '다시 작성해주세요!')
            });
        };

        // Shuffle approved keywords into Official Answer Key rounds (1, 2, 3...)
        window.teacherShuffleAndCreateRounds = async function() {
            const players = window.appState.playersList;
            const approved = players.filter(p => p.keywordStatus === 'approved' && p.keyword && p.keyword.trim());

            if (approved.length === 0) {
                showModal("승인된 키워드가 1개 이상 있어야 문제 답안지를 생성할 수 있습니다! 학생들의 키워드를 먼저 승인해주세요.", "답안지 생성 불가", "⚠️");
                return;
            }

            sounds.cheer();

            // Fisher-Yates shuffle
            const shuffled = [...approved];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            // Create Quiz Rounds list (1번, 2번, 3번 ...)
            const quizRounds = shuffled.map((p, index) => ({
                order: index + 1,
                userId: p.userId,
                studentName: p.name,
                keyword: p.keyword.trim()
            }));

            const code = window.appState.roomCode;
            if (db) {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
                await updateDoc(roomRef, {
                    quizRounds: quizRounds,
                    currentRoundIndex: 0,
                    activePresenterId: quizRounds[0].userId,
                    activePresenterName: quizRounds[0].studentName,
                    activeKeyword: quizRounds[0].keyword,
                    isKeywordRevealed: false
                });
            } else {
                window.appState.quizRounds = quizRounds;
                window.appState.currentRoundIndex = 0;
                window.appState.activePresenterId = quizRounds[0].userId;
                window.appState.activePresenterName = quizRounds[0].studentName;
                window.appState.activeKeyword = quizRounds[0].keyword;
                window.appState.isKeywordRevealed = false;
                renderUI();
            }

            showModal(`총 ${quizRounds.length}개의 문제가 무작위로 정렬되어 답안지가 완성되었습니다!`, "답안지 생성 완료", "🎲");
        };

        window.teacherStartGame = async function() {
            let rounds = window.appState.quizRounds;

            if (!rounds || rounds.length === 0) {
                await window.teacherShuffleAndCreateRounds();
                rounds = window.appState.quizRounds;
                if (!rounds || rounds.length === 0) return;
            }

            sounds.cheer();
            const firstRound = rounds[0];
            const code = window.appState.roomCode;

            if (db) {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
                await updateDoc(roomRef, {
                    gameStage: 'presenting',
                    currentRoundIndex: 0,
                    activePresenterId: firstRound.userId,
                    activePresenterName: firstRound.studentName,
                    activeKeyword: firstRound.keyword,
                    isKeywordRevealed: false
                });
            } else {
                window.appState.gameStage = 'presenting';
                window.appState.currentRoundIndex = 0;
                window.appState.activePresenterId = firstRound.userId;
                window.appState.activePresenterName = firstRound.studentName;
                window.appState.activeKeyword = firstRound.keyword;
                window.appState.isKeywordRevealed = false;
                renderUI();
            }
        };

        window.teacherJumpToRound = async function(roundIndex) {
            const rounds = window.appState.quizRounds;
            if (!rounds || roundIndex < 0 || roundIndex >= rounds.length) return;

            sounds.ding();
            const target = rounds[roundIndex];
            const code = window.appState.roomCode;

            if (db) {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
                await updateDoc(roomRef, {
                    gameStage: 'presenting',
                    currentRoundIndex: roundIndex,
                    activePresenterId: target.userId,
                    activePresenterName: target.studentName,
                    activeKeyword: target.keyword,
                    isKeywordRevealed: false
                });
            } else {
                window.appState.gameStage = 'presenting';
                window.appState.currentRoundIndex = roundIndex;
                window.appState.activePresenterId = target.userId;
                window.appState.activePresenterName = target.studentName;
                window.appState.activeKeyword = target.keyword;
                window.appState.isKeywordRevealed = false;
                renderUI();
            }
        };

        window.teacherRevealAndScore = async function() {
            sounds.cheer();
            const code = window.appState.roomCode;
            const target = (window.appState.activeKeyword || '').trim().toLowerCase().replace(/\s+/g, '');
            const guesses = window.appState.guesses;
            const presenterId = window.appState.activePresenterId;
            const players = window.appState.playersList;
            const roundIdx = window.appState.currentRoundIndex;

            let correctCount = 0;
            const guessers = Object.values(guesses);

            // 1. Grade each guesser (+1 point per correct answer)
            for (const g of guessers) {
                if (g.userId === presenterId) continue;
                const userGuess = (g.guess || '').trim().toLowerCase().replace(/\s+/g, '');
                const isCorrect = userGuess.length > 0 && (userGuess.includes(target) || target.includes(userGuess));
                if (isCorrect) correctCount++;

                if (db) {
                    const guessRef = doc(db, 'artifacts', appId, 'public', 'data', 'guesses', `${code}_round${roundIdx}_${g.userId}`);
                    await updateDoc(guessRef, { correct: isCorrect });
                    if (isCorrect) {
                        const guesserRef = doc(db, 'artifacts', appId, 'public', 'data', 'players', `${code}_${g.userId}`);
                        const pObj = players.find(x => x.userId === g.userId);
                        const newGuessScore = (pObj?.guessScore || 0) + 1;
                        const pScore = pObj?.presenterScore || 0;
                        await updateDoc(guesserRef, { 
                            guessScore: newGuessScore,
                            score: newGuessScore + pScore
                        });
                    }
                } else {
                    const pObj = players.find(x => x.userId === g.userId);
                    if (pObj && isCorrect) {
                        pObj.guessScore = (pObj.guessScore || 0) + 1;
                        pObj.score = pObj.guessScore + (pObj.presenterScore || 0);
                    }
                }
            }

            // 2. Calculate dynamic presenter score: round(N * 2/3 * 2) max
            const totalGuessers = guessers.filter(g => g.userId !== presenterId).length;
            const presenterPoints = window.calculatePresenterPoints(correctCount, totalGuessers);

            if (db && presenterId) {
                const presenterRef = doc(db, 'artifacts', appId, 'public', 'data', 'players', `${code}_${presenterId}`);
                const pObj = players.find(x => x.userId === presenterId);
                const gScore = pObj?.guessScore || 0;
                await updateDoc(presenterRef, { 
                    presenterScore: presenterPoints,
                    score: gScore + presenterPoints
                });

                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
                await updateDoc(roomRef, {
                    isKeywordRevealed: true,
                    gameStage: 'result'
                });
            } else {
                if (presenterId) {
                    const pObj = players.find(x => x.userId === presenterId);
                    if (pObj) {
                        pObj.presenterScore = presenterPoints;
                        pObj.score = (pObj.guessScore || 0) + presenterPoints;
                    }
                }
                window.appState.isKeywordRevealed = true;
                window.appState.gameStage = 'result';
                renderUI();
            }
        };

        window.teacherNextPresenter = async function() {
            sounds.ding();
            const rounds = window.appState.quizRounds;
            const nextIdx = window.appState.currentRoundIndex + 1;
            const code = window.appState.roomCode;

            if (nextIdx < rounds.length) {
                const nextRound = rounds[nextIdx];
                if (db) {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
                    await updateDoc(roomRef, {
                        currentRoundIndex: nextIdx,
                        activePresenterId: nextRound.userId,
                        activePresenterName: nextRound.studentName,
                        activeKeyword: nextRound.keyword,
                        isKeywordRevealed: false,
                        gameStage: 'presenting'
                    });
                } else {
                    window.appState.currentRoundIndex = nextIdx;
                    window.appState.activePresenterId = nextRound.userId;
                    window.appState.activePresenterName = nextRound.studentName;
                    window.appState.activeKeyword = nextRound.keyword;
                    window.appState.isKeywordRevealed = false;
                    window.appState.gameStage = 'presenting';
                    renderUI();
                }
            } else {
                if (db) {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
                    await updateDoc(roomRef, { gameStage: 'finished' });
                } else {
                    window.appState.gameStage = 'finished';
                    renderUI();
                }
            }
        };

        window.teacherResetToSubmitStage = async function() {
            sounds.ding();
            const code = window.appState.roomCode;
            if (db) {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
                await updateDoc(roomRef, {
                    gameStage: 'submit',
                    activePresenterId: null,
                    activePresenterName: '',
                    activeKeyword: '',
                    isKeywordRevealed: false
                });
            } else {
                window.appState.gameStage = 'submit';
                window.appState.activePresenterId = null;
                window.appState.activePresenterName = '';
                window.appState.activeKeyword = '';
                window.appState.isKeywordRevealed = false;
                renderUI();
            }
            showModal("키워드 제출 및 답안지 설정 단계로 초기화되었습니다.", "상태 변경", "🔄");
        };


        // 교사 관리 모드: 특정 학생 참가 기록 삭제
        window.teacherDeletePlayer = async function(uid, studentName) {
            const ok = window.confirm(`${studentName} 학생을 참가 목록에서 삭제할까요?\n\n이 학생의 키워드, 점수, 현재 게임의 제출 정답도 함께 삭제됩니다.`);
            if (!ok) return;

            sounds.click();
            const code = window.appState.roomCode;

            try {
                if (db) {
                    // 1) 학생 문서 삭제
                    const playerRef = doc(db, 'artifacts', appId, 'public', 'data', 'players', `${code}_${uid}`);
                    const batch = writeBatch(db);
                    batch.delete(playerRef);

                    // 2) 해당 학생의 정답 제출 기록 삭제
                    const guessesCol = collection(db, 'artifacts', appId, 'public', 'data', 'guesses');
                    const guessSnap = await getDocs(guessesCol);
                    guessSnap.docs.forEach(d => {
                        const g = d.data();
                        if (g.roomCode === code && g.userId === uid) batch.delete(d.ref);
                    });
                    await batch.commit();

                    // 3) 문제 순서에 이미 들어가 있으면 제거
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
                    const roomSnap = await getDoc(roomRef);
                    if (roomSnap.exists()) {
                        const data = roomSnap.data();
                        const oldRounds = Array.isArray(data.quizRounds) ? data.quizRounds : [];
                        const newRounds = oldRounds
                            .filter(r => r.userId !== uid)
                            .map((r, i) => ({ ...r, order: i + 1 }));

                        const patch = { quizRounds: newRounds, updatedAt: Date.now() };
                        if (data.activePresenterId === uid) {
                            patch.gameStage = 'submit';
                            patch.currentRoundIndex = 0;
                            patch.activePresenterId = null;
                            patch.activePresenterName = '';
                            patch.activeKeyword = '';
                            patch.isKeywordRevealed = false;
                        }
                        await setDoc(roomRef, patch, { merge: true });
                    }
                } else {
                    window.appState.playersList = window.appState.playersList.filter(p => p.userId !== uid);
                    window.appState.quizRounds = (window.appState.quizRounds || [])
                        .filter(r => r.userId !== uid)
                        .map((r, i) => ({ ...r, order: i + 1 }));
                    delete window.appState.guesses[uid];
                    delete window.appState.scores[uid];
                    if (window.appState.activePresenterId === uid) {
                        window.appState.gameStage = 'submit';
                        window.appState.currentRoundIndex = 0;
                        window.appState.activePresenterId = null;
                        window.appState.activePresenterName = '';
                        window.appState.activeKeyword = '';
                        window.appState.isKeywordRevealed = false;
                    }
                    renderUI();
                }

                showModal(`${studentName} 학생을 참가 목록에서 삭제했습니다.`, '학생 삭제 완료', '🗑️');
            } catch (e) {
                console.error('Delete player error:', e);
                showModal('학생 삭제 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.', '삭제 오류', '⚠️');
            }
        };

        // 새 게임용 전체 초기화: 참가자 이름은 유지하고 키워드/점수/정답/문제 순서를 모두 비웁니다.
        window.teacherFullGameReset = async function() {
            const ok = window.confirm(
                "새 게임을 시작할까요?\n\n학생 참가 목록은 유지하고, 키워드·승인 상태·점수·제출 정답·문제 순서를 모두 초기화합니다."
            );
            if (!ok) return;

            sounds.click();
            const code = window.appState.roomCode;

            try {
                if (db) {
                    // 1) 이전 게임의 정답 제출 기록 삭제 (Firestore 배치 제한을 고려해 400개씩 처리)
                    const guessesCol = collection(db, 'artifacts', appId, 'public', 'data', 'guesses');
                    const guessSnap = await getDocs(guessesCol);
                    const guessDocs = guessSnap.docs.filter(d => d.data().roomCode === code);

                    for (let i = 0; i < guessDocs.length; i += 400) {
                        const batch = writeBatch(db);
                        guessDocs.slice(i, i + 400).forEach(d => batch.delete(d.ref));
                        await batch.commit();
                    }

                    // 2) 참가 학생은 그대로 두고 게임 관련 정보만 초기화
                    const playersCol = collection(db, 'artifacts', appId, 'public', 'data', 'players');
                    const playerSnap = await getDocs(playersCol);
                    const playerDocs = playerSnap.docs.filter(d => d.data().roomCode === code);

                    for (let i = 0; i < playerDocs.length; i += 400) {
                        const batch = writeBatch(db);
                        playerDocs.slice(i, i + 400).forEach(d => {
                            batch.update(d.ref, {
                                keyword: '',
                                keywordStatus: 'none',
                                teacherFeedback: '',
                                guessScore: 0,
                                presenterScore: 0,
                                score: 0
                            });
                        });
                        await batch.commit();
                    }

                    // 3) 교사 진행 상태와 문제 목록 초기화
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
                    await setDoc(roomRef, {
                        code: code,
                        gameStage: 'submit',
                        quizRounds: [],
                        currentRoundIndex: 0,
                        activePresenterId: null,
                        activePresenterName: '',
                        activeKeyword: '',
                        isKeywordRevealed: false,
                        updatedAt: Date.now()
                    }, { merge: true });
                } else {
                    window.appState.gameStage = 'submit';
                    window.appState.quizRounds = [];
                    window.appState.currentRoundIndex = 0;
                    window.appState.activePresenterId = null;
                    window.appState.activePresenterName = '';
                    window.appState.activeKeyword = '';
                    window.appState.isKeywordRevealed = false;
                    window.appState.guesses = {};
                    window.appState.scores = {};
                    window.appState.playersList = window.appState.playersList.map(p => ({
                        ...p,
                        keyword: '',
                        keywordStatus: 'none',
                        teacherFeedback: '',
                        guessScore: 0,
                        presenterScore: 0,
                        score: 0
                    }));
                    renderUI();
                }

                sounds.cheer();
                showModal("새 게임 준비가 끝났습니다. 학생들은 다시 물건을 정해 제출하면 됩니다.", "전체 리셋 완료", "🧹");
            } catch (e) {
                console.error("Full game reset error:", e);
                showModal("전체 리셋 중 오류가 발생했습니다. 인터넷 연결과 Firestore 설정을 확인해주세요.", "리셋 실패", "⚠️");
            }
        };

        window.onload = function() {
            window.initFirebase();
        };
    </script>

                        <div class="pt-2 border-t border-slate-100 flex items-center justify-between bg-slate-50 px-3.5 py-2.5 rounded-2xl">
                            <div class="flex items-center space-x-2 truncate">
                                <span class="text-xs font-bold text-slate-500 shrink-0">내 설명 물건:</span>
                                <span class="text-xs sm:text-sm font-black ${hasKeyword ? 'text-indigo-700' : 'text-rose-500'} truncate">
                                    ${hasKeyword ? `"${state.myKeyword}"` : '아직 미등록'}
                                </span>
                            </div>
                            <button type="button" onclick="openKeywordModal()" 
                                class="text-xs font-bold px-3 py-1.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-100 text-indigo-600 cursor-pointer shrink-0 shadow-2xs">
                                ${hasKeyword ? '✏️ 수정' : '➕ 등록하기'}
                            </button>
                        </div>
                    </div>

                    <!-- Main Student Content Box -->
                    <div class="bg-white rounded-3xl p-5 sm:p-7 shadow-xs border border-slate-200/80 text-center space-y-5">
                        
                        <!-- CASE A: KEYWORD SUBMISSION STAGE -->
                        ${state.gameStage === 'submit' ? `
                            <div class="space-y-4">
                                <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-3xl mx-auto flex items-center justify-center text-2xl shadow-inner">
                                    🔍
                                </div>
                                <div>
                                    <h3 class="text-xl font-black text-slate-900">설명할 교실 물건 정하기</h3>
                                    <p class="text-xs text-slate-500 font-medium mt-1">내가 교실 앞에서 친구들에게 설명할 물건 1개를 적어주세요</p>
                                </div>

                                <div class="space-y-3 max-w-sm mx-auto">
                                    <input id="keyword-input" type="text" value="${state.myKeyword || ''}" 
                                        placeholder="예: 지우개, 지구본, 연필깎이, 시계" 
                                        class="w-full px-4 py-3.5 rounded-2xl border-2 border-indigo-200 text-center font-black text-lg text-slate-900 focus:outline-none focus:border-indigo-600 bg-slate-50" />
                                    <button type="button" onclick="submitKeywordDirectly('keyword-input')" 
                                        class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-extrabold py-3.5 rounded-2xl transition shadow-md shadow-indigo-100 cursor-pointer text-base">
                                        선생님께 제출하기
                                    </button>
                                </div>

                                ${state.keywordStatus !== 'none' ? `
                                    <div class="p-3.5 rounded-2xl max-w-sm mx-auto text-xs font-bold ${
                                        state.keywordStatus === 'approved' ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' :
                                        state.keywordStatus === 'rejected' ? 'bg-rose-50 text-rose-800 border border-rose-200' :
                                        'bg-amber-50 text-amber-800 border border-amber-200'
                                    }">
                                        <p class="font-black text-sm mb-0.5">
                                            ${state.keywordStatus === 'approved' ? '✓ 선생님 승인 완료 (답안지에 포함됨)' : state.keywordStatus === 'rejected' ? '다시 정해주세요' : '선생님 검토 중...'}
                                        </p>
                                        <p class="font-medium">${state.teacherFeedback || '선생님이 확인 중입니다.'}</p>
                                    </div>
                                ` : ''}

                                <div class="pt-3 border-t border-slate-100 text-left bg-slate-50 p-3.5 rounded-2xl text-xs space-y-1 text-slate-600">
                                    <p class="font-bold text-slate-800">💡 게임 진행 안내:</p>
                                    <p>선생님이 키워드를 승인하고 무작위로 섞으면 문제 순서가 정해집니다. 내 순서가 되면 교실 앞으로 나가서 친구들에게 설명하게 됩니다!</p>
                                </div>
                            </div>
                        ` : ''}

                        <!-- CASE B: PRESENTING OR RESULT STAGE -->
                        ${(state.gameStage === 'presenting' || state.gameStage === 'result') ? `
                            <div class="space-y-5">
                                
                                <!-- 1. IF CURRENT USER IS THE PRESENTER (출제자: 정답창 잠금) -->
                                ${isPresenter ? `
                                    <div class="bg-gradient-to-tr from-indigo-600 to-indigo-800 text-white p-6 sm:p-7 rounded-3xl space-y-5 shadow-lg shadow-indigo-100">
                                        <div class="inline-flex items-center space-x-1.5 bg-amber-400 text-slate-950 text-xs font-black px-4 py-1.5 rounded-full uppercase tracking-wider shadow-sm">
                                            <span>🌟</span>
                                            <span>제 ${currentRoundNum}번 문제 출제자 : 당신의 차례입니다!</span>
                                        </div>
                                        
                                        <div>
                                            <p class="text-xs text-indigo-200 font-bold mb-1">교실 앞에 나가서 설명할 나의 비밀 키워드</p>
                                            <div class="bg-white text-indigo-950 rounded-2xl py-4 px-6 text-3xl sm:text-4xl font-black max-w-sm mx-auto shadow-inner tracking-tight">
                                                ${currentRound ? currentRound.keyword : (state.myKeyword || '(키워드 없음)')}
                                            </div>
                                        </div>

                                        <!-- DISABLED NOTICE FOR PRESENTER -->
                                        <div class="bg-indigo-950/60 border-2 border-indigo-400/40 rounded-2xl p-4 text-center max-w-sm mx-auto">
                                            <div class="text-2xl mb-1">🔒</div>
                                            <p class="text-sm font-black text-amber-300">정답 입력창 비활성화</p>
                                            <p class="text-xs text-indigo-200 mt-0.5">
                                                ${state.playerName} 학생이 출제한 문제이므로<br/>
                                                <b>정답 제출이 비활성화</b>되었습니다.
                                            </p>
                                        </div>

                                        <div class="text-left bg-black/25 p-4 rounded-2xl text-xs space-y-1.5 text-indigo-100 border border-indigo-400/20">
                                            <p class="font-black text-amber-300 text-sm flex items-center space-x-1">
                                                <span>🎯</span>
                                                <span>설명자 ${limits.maxPresenterScore}점 만점 비법 (딱 ${limits.optimalCorrect}명 정답 목표!)</span>
                                            </p>
                                            <p>• 친구들 중 <b>딱 ${limits.optimalCorrect}명이 맞히면 ${limits.maxPresenterScore}점 만점</b>을 받습니다!</p>
                                            <p>• <b>다 맞히거나(${limits.maxGuessScore}명) 다 틀리면(0명) 0점</b>이 되므로, 난이도를 조절해서 설명해보세요!</p>
                                            <p>• 초성이나 글자 수를 직접 말하면 안 돼요.</p>
                                        </div>
                                    </div>
                                ` : `
                                    <!-- 2. IF CURRENT USER IS A GUESSER (맞히는 학생: 정답창 활성) -->
                                    <div class="space-y-4">
                                        <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 text-center">
                                            <div class="flex justify-center items-center gap-1.5 mb-1">
                                                <span class="text-xs font-black text-indigo-600 bg-white px-3 py-1 rounded-full shadow-2xs">
                                                    제 ${currentRoundNum}번 문제
                                                </span>
                                                <span class="text-[11px] font-bold text-indigo-700 bg-indigo-100/70 px-2.5 py-1 rounded-full">
                                                    맞히면 +1점 (최대 ${limits.maxGuessScore}점)
                                                </span>
                                            </div>
                                            <h3 class="text-xl font-black text-slate-900 mt-2">
                                                [${presenterName}] 학생의 설명을 잘 들어보세요!
                                            </h3>
                                            <p class="text-xs text-slate-500 mt-0.5">친구가 설명하는 교실 물건은 무엇일까요?</p>
                                        </div>

                                        ${state.gameStage === 'presenting' ? `
                                            <div class="space-y-3 max-w-sm mx-auto">
                                                <input id="guess-input" type="text" placeholder="${currentRoundNum}번 문제 정답 입력" 
                                                    class="w-full px-4 py-3.5 rounded-2xl border-2 border-indigo-200 text-center font-black text-lg text-slate-900 focus:outline-none focus:border-indigo-600 bg-slate-50" />
                                                <button type="button" onclick="submitGuess()" 
                                                    class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-extrabold py-3.5 rounded-2xl transition shadow-md shadow-indigo-100 cursor-pointer text-base">
                                                    정답 제출하기
                                                </button>
                                            </div>

                                            ${alreadyGuessed ? `
                                                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 max-w-sm mx-auto text-xs font-bold text-slate-600">
                                                    내가 낸 정답: <span class="text-indigo-600 font-extrabold">"${alreadyGuessed.guess}"</span> (다시 입력해 변경 가능)
                                                </div>
                                            ` : ''}
                                        ` : `
                                            <!-- Result Reveal -->
                                            <div class="bg-emerald-50 border-2 border-emerald-200 rounded-3xl p-6 text-center space-y-2 max-w-sm mx-auto">
                                                <span class="text-2xl">🎉</span>
                                                <p class="text-xs font-bold text-emerald-800">제 ${currentRoundNum}번 문제의 정답</p>
                                                <h2 class="text-3xl font-black text-emerald-700">${state.activeKeyword}</h2>
                                                ${alreadyGuessed ? `
                                                    <p class="text-xs font-bold pt-2 ${alreadyGuessed.correct ? 'text-emerald-600 font-black' : 'text-rose-500'}">
                                                        ${alreadyGuessed.correct ? '👏 정답입니다! (+1점 획득)' : '아쉬워요, 다음 문제에 도전해보세요!'}
                                                    </p>
                                                ` : ''}
                                            </div>
                                        `}
                                    </div>
                                `}
                            </div>
                        ` : ''}

                        <!-- CASE C: FINISHED STAGE -->
                        ${state.gameStage === 'finished' ? `
                            <div class="py-6 space-y-3">
                                <span class="text-4xl">🎊</span>
                                <h3 class="text-2xl font-black text-slate-900">모든 문제가 끝났습니다!</h3>
                                <p class="text-xs text-slate-500">선생님과 함께 최종 점수 순위를 확인하세요.</p>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
