<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>길이의 차 구하기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6fa;color:#172537;font-family:Arial,'Malgun Gothic',sans-serif}header{padding:24px;text-align:center}h1{font-size:26px;margin:0 0 10px}header p{color:#627185;margin:0}main{max-width:920px;margin:auto;padding:0 20px 35px}.pages{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:white;border-radius:16px;padding:25px 18px;box-shadow:0 4px 20px #162d4810}article{margin-bottom:36px}h2{font-size:17px;line-height:1.9;margin:0 0 18px}.math{font-size:23px;white-space:nowrap;text-align:center;line-height:1.8}.unit{font-size:15px;margin:0 4px}input{width:39px;height:40px;border:1.5px solid #dfb399;border-radius:5px;text-align:center;font:inherit;font-size:23px;background:#fffdf9;vertical-align:middle}input.wide{width:56px}input:focus{outline:3px solid #b3dfff}input.good{border:2px solid #279763;background:#eaf8ef}input.bad{border:2px solid #dc5d60;background:#fff0f0}.stack{display:table;margin:18px auto 0;font-size:23px;line-height:1.6;text-align:right}.stack .line{border-bottom:2px solid #586471}.stack .answer{padding-top:7px}.blue{color:#05a6df}.pink{color:#ef008f}.pair{display:flex;justify-content:space-around;gap:10px}.pair .stack{margin:0}.guide{position:relative;padding:22px 0 24px}.guide svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.diagram{text-align:center;font-size:23px}.arrow{color:#a2adb4;font-size:30px;line-height:1}.machine{margin:auto;width:220px;padding:24px;background:#cceafa;border:1px solid #88949c}.cards{display:flex;justify-content:center;gap:40px;background:#eaf6e5;border:1px solid #c7e0c0;padding:8px;border-radius:7px;width:240px;margin:auto}.cards span{width:38px;text-align:center;font-size:25px;border:1px solid;border-radius:4px;background:#fff}.cards span:nth-child(1){color:#d34363}.cards span:nth-child(2){color:#007aaf}.cards span:nth-child(3){color:#9453a5}.feedback{font-size:14px;text-align:center;min-height:20px;color:#52687c;margin-top:10px}.actions{display:flex;justify-content:center;gap:10px;margin:24px 0}button{border:0;border-radius:8px;padding:13px 22px;font-size:17px;cursor:pointer;background:#1776b7;color:white}button.secondary{background:#e2eaf1;color:#33465b}#result{text-align:center;font-weight:bold;min-height:24px}@media(max-width:760px){.pages{grid-template-columns:1fr}main{max-width:520px}.math{font-size:22px}}@media print{body{background:white}header,.actions,#result,.feedback{display:none}main{padding:0;max-width:none}.pages{display:block}section{box-shadow:none;border-radius:0;page-break-after:always;max-width:600px;margin:auto}section:last-child{page-break-after:auto}input.good,input.bad{background:white;border:1.5px solid #dfb399}}
</style><header><h1>길이의 차 구하기</h1><p>빈칸에 알맞은 수를 써 보세요.</p></header><main id="worksheet"><div class="pages"><section id="page1"></section><section id="page2"></section></div><div class="actions"><button id="check">정답 확인</button><button class="secondary" id="reset">다시 풀기</button><button class="secondary" onclick="window.print()">인쇄</button></div><div id="result" role="status" aria-live="polite"></div></main><main id="completion" hidden><section><h2>모두 맞혔어요! 설문지를 작성해 주세요.</h2><iframe title="학습 완료 설문지" src="https://docs.google.com/forms/d/e/1FAIpQLSdBXY7O-5XNN_hExe2b4jx1gyUKfKerrIJPTEO-mKufCVlAFQ/viewform?embedded=true" width="640" height="1486" frameborder="0" marginheight="0" marginwidth="0" style="display:block;width:100%;max-width:640px;margin:auto;border:0">로드 중…</iframe></section></main><script>
const u=t=>`<span class="unit">${t}</span>`;let counter=0;
function box(a,label,wide=false){return `<input inputmode="numeric" type="text" pattern="[0-9]*" maxlength="2" autocomplete="off" data-answer="${a}" aria-label="${label}" class="${wide?'wide':''}" id="a${++counter}">`}
const ans=(m,c,l)=>box(m,l+' 미터')+u('m')+box(c,l+' 센티미터',true)+u('cm');
function stack(m,c,n,d,l,col=false){return `<div class="stack"><div><span class="${col?'blue':''}">${m}</span>${u('m')} <span class="${col?'pink':''}">${c}</span>${u('cm')}</div><div class="line">− <span class="${col?'blue':''}">${n}</span>${u('m')} <span class="${col?'pink':''}">${d}</span>${u('cm')}</div><div class="answer">${ans(m-n,c-d,l)}</div></div>`}
function guide(m,c,n,d,l){return `<div class="math guide"><svg viewBox="0 0 400 110" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="b${l}" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5" fill="#00aff2"/></marker><marker id="p${l}" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5" fill="#ff009d"/></marker></defs><path d="M20 24 V17 H145 V24 M82 17 V7 H275 V30" fill="none" stroke="#00aff2" marker-end="url(#b${l})"/><path d="M66 75 V84 H194 V75 M130 84 V99 H342 V77" fill="none" stroke="#ff009d" marker-end="url(#p${l})"/></svg>${m}${u('m')}${c}${u('cm')}−${n}${u('m')}${d}${u('cm')} = ${ans(m-n,c-d,l)}</div>`}
function q(n,title,content){return `<article data-question="${n}"><h2>${n}. ${title}</h2>${content}<div class="feedback" aria-live="polite"></div></article>`}
document.querySelector('#page1').innerHTML=q(1,'□ 안에 알맞은 수를 써넣으세요.',guide(6,42,2,22,'1번'))+q(2,'□ 안에 알맞은 수를 써넣으세요.',guide(6,97,1,65,'2번 가로식')+stack(6,97,1,65,'2번 세로식',true))+q(3,'길이의 차를 구해 보세요.',`<div class="pair">${stack(8,42,6,30,'3번 왼쪽')}${stack(7,87,4,57,'3번 오른쪽')}</div>`);
document.querySelector('#page2').innerHTML=q(4,'□ 안에 알맞은 수를 써넣으세요.',`<div class="diagram">9${u('m')}85${u('cm')}<div class="arrow">⬇</div><div class="machine">−5${u('m')}13${u('cm')}</div><div class="arrow">⬇</div>${ans(4,72,'4번')}</div>`)+q(5,'수 카드 3장을 한 번씩 사용하여 가장 긴 길이를 만들고, 그 길이와 3 m 40 cm의 차를 구해 보세요.',`<div class="cards"><span>1</span><span>8</span><span>5</span></div><div class="stack"><div>${box(8,'5번 가장 긴 길이 미터')}${u('m')}${box(5,'5번 센티미터 십의 자리')}${box(1,'5번 센티미터 일의 자리')}${u('cm')}</div><div class="line">− 3${u('m')} 4 0${u('cm')}</div><div class="answer">${ans(5,11,'5번 차')}</div></div>`)+q(6,'민주는 5 m 60 cm의 리본을 가지고 있고, 민성이는 2 m 15 cm의 리본을 가지고 있습니다. 민주가 가지고 있는 리본은 민성이가 가지고 있는 리본보다 얼마나 더 긴가요?',`<div class="math">${ans(3,45,'6번')}</div>`);
document.querySelectorAll('input').forEach(e=>e.addEventListener('input',()=>{e.value=e.value.replace(/[^0-9]/g,'');e.classList.remove('good','bad');e.closest('article').querySelector('.feedback').textContent='';document.querySelector('#result').textContent=''}));
document.querySelector('#check').onclick=()=>{let correct=0;document.querySelectorAll('article').forEach(q=>{let ok=true,empty=false;q.querySelectorAll('input').forEach(i=>{let valid=i.value.trim()!==''&&Number(i.value)===Number(i.dataset.answer);empty ||= !i.value.trim();ok &&= valid;i.classList.toggle('good',valid);i.classList.toggle('bad',!valid);i.setAttribute('aria-invalid',String(!valid))});q.querySelector('.feedback').textContent=ok?'잘했어요!':empty?'빈칸을 모두 채워 주세요.':'표시된 칸을 다시 살펴보세요.';if(ok)correct++});document.querySelector('#result').textContent=correct===6?'6문제를 모두 맞혔어요!':`6문제 중 ${correct}문제를 맞혔어요.`;if(correct===6){document.querySelector('#worksheet').hidden=true;document.querySelector('#completion').hidden=false;window.scrollTo(0,0)}};
document.querySelector('#reset').onclick=()=>{document.querySelectorAll('input').forEach(i=>{i.value='';i.classList.remove('good','bad');i.removeAttribute('aria-invalid')});document.querySelectorAll('.feedback').forEach(e=>e.textContent='');document.querySelector('#result').textContent='';document.querySelector('input').focus()};
</script></html>
