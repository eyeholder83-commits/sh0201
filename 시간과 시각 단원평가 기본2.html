function card(n,inner){qs.insertAdjacentHTML('beforeend',`<section class="card" id="q${n}"><div class="head"><strong>${n}번</strong><span class="result" aria-live="polite"></span></div><p class="prompt">${prompts[n]}</p>${inner}</section>`)}
function fields(n,labels){card(n,`<div class="fields">${labels.map((t,i)=>`<input type="text" inputmode="${t==='오전/오후'||t==='요일'?'text':'numeric'}" data-n="${n}" data-i="${i}" aria-label="${i+1}번째 답" autocomplete="off"><span>${t}</span>`).join('')}</div>`)}
function choice(n,options,multi=false){card(n,`<div class="choice">${options.map((o,i)=>`<label><input type="${multi?'checkbox':'radio'}" name="a${n}" value="${i+1}"> ${'①②③④⑤⑥⑦⑧⑨⑩'[i]} ${o}</label>`).join('')}</div>`)}
function clockMarkup(n){return `<div class="clockbox"><svg class="clock" id="clock${n}" viewBox="0 0 220 220" aria-label="바늘을 움직이는 시계"><circle cx="110" cy="110" r="97" fill="white" stroke="#64748b" stroke-width="5"/><g class="ticks"></g><line class="hour" x1="110" y1="110" x2="110" y2="65" stroke="#334155" stroke-width="8" stroke-linecap="round"/><line class="minute" x1="110" y1="110" x2="110" y2="31" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><circle cx="110" cy="110" r="7" fill="#0f172a"/></svg><small>짧은바늘 또는 긴바늘 끝을 끌어 움직이세요.</small><div class="fields"><span class="clockread" id="read${n}">12시 00분</span></div></div>`}
fields(1,['와','사이','를 가리킴','시','분']);choice(2,['5시 10분','10시 10분','10시 15분','5시 15분','10시 25분']);card(3,clockMarkup(3));card(4,`<div class="sub"><b>(1)</b><div class="fields"><input data-n="4" data-i="0" inputmode="numeric" aria-label="4번 1번 시">시 <input data-n="4" data-i="1" inputmode="numeric" aria-label="4번 1번 분">분</div></div><div class="sub"><b>(2)</b><div class="fields"><input data-n="4" data-i="2" inputmode="numeric" aria-label="4번 2번 시">시 <input data-n="4" data-i="3" inputmode="numeric" aria-label="4번 2번 분">분</div></div>`);choice(5,['첫 번째 시계','두 번째 시계','세 번째 시계','네 번째 시계','다섯 번째 시계']);card(6,clockMarkup(6));card(7,`<div class="sub"><b>(1)</b><span class="fields"><input data-n="7" data-i="0" inputmode="numeric" aria-label="7번 1번">분</span></div><div class="sub"><b>(2)</b><span class="fields"><input data-n="7" data-i="1" inputmode="numeric" aria-label="7번 2번 시">시 <input data-n="7" data-i="2" inputmode="numeric" aria-label="7번 2번 분">분</span></div>`);card(8,`<svg id="link" class="linksvg" viewBox="0 0 600 300"><g id="lines"></g>${['시계 ①','시계 ②','시계 ③'].map((t,i)=>`<circle class="left" data-i="${i}" cx="190" cy="${50+i*100}" r="13" fill="#2563eb"/><text x="20" y="${57+i*100}" font-size="21">${t}</text>`).join('')}${['2시 5분 전','9시 10분 전','5시 10분 전'].map((t,i)=>`<circle class="right" data-i="${i}" cx="390" cy="${50+i*100}" r="13" fill="#0f766e"/><text x="415" y="${57+i*100}" font-size="19">${t}</text>`).join('')}</svg><p class="help">왼쪽 점 → 오른쪽 점을 선택하면 선이 연결됩니다.</p><button class="reset" type="button" onclick="connections={};drawLines()">선 초기화</button>`);fields(9,['시간']);choice(10,['1바퀴','2바퀴','3바퀴','4바퀴','5바퀴']);fields(11,['']);choice(12,['1시간 40분','2시간 40분','100분','160분','180분'],true);card(13,`<div class="sub"><b>(1)</b><span class="fields"><input data-n="13" data-i="0" inputmode="numeric">분</span></div><div class="sub"><b>(2)</b><span class="fields"><input data-n="13" data-i="1" inputmode="numeric">분 <input data-n="13" data-i="2" inputmode="numeric">분</span></div>`);fields(14,['시간','분']);card(15,`<div class="sub"><b>(1)</b><span class="fields"><input class="word" data-n="15" data-i="0" aria-label="15번 1번 오전 또는 오후"></span></div><div class="sub"><b>(2)</b><span class="fields"><input class="word" data-n="15" data-i="1" aria-label="15번 2번 오전 또는 오후"></span></div><div class="sub"><b>(3)</b><span class="fields"><input class="word" data-n="15" data-i="2" aria-label="15번 3번 오전 또는 오후"></span></div>`);choice(16,['4시간','24시간','26시간','28시간','30시간']);choice(17,['3시간','4시간','5시간','6시간','7시간']);fields(18,['월','일']);choice(19,['8월 20일 일요일','8월 22일 화요일','8월 24일 목요일','8월 26일 토요일','8월 28일 월요일']);fields(20,['요일']);
let clockState={3:{h:12,m:0},6:{h:12,m:0}};function drawClock(n){const svg=$(`#clock${n}`),s=clockState[n];svg.querySelector('.ticks').innerHTML=Array.from({length:60},(_,i)=>{let a=i*Math.PI/30;return `<line x1="${110+Math.sin(a)*(i%5?89:84)}" y1="${110-Math.cos(a)*(i%5?89:84)}" x2="${110+Math.sin(a)*94}" y2="${110-Math.cos(a)*94}" stroke="#64748b" stroke-width="${i%5?2:1}"/>${i%5?'':`<text x="${110+Math.sin(a)*70}" y="${115-Math.cos(a)*70}" text-anchor="middle" font-size="14">${i===0?12:i/5}</text>`}`}).join('');let ha=(s.h%12+s.m/60)*Math.PI/6,ma=s.m*Math.PI/30;svg.querySelector('.hour').setAttribute('x2',110+Math.sin(ha)*48);svg.querySelector('.hour').setAttribute('y2',110-Math.cos(ha)*48);svg.querySelector('.minute').setAttribute('x2',110+Math.sin(ma)*80);svg.querySelector('.minute').setAttribute('y2',110-Math.cos(ma)*80);$(`#read${n}`).textContent=`${s.h}시 ${String(s.m).padStart(2,'0')}분`}
for(let n of [3,6]){drawClock(n);let svg=$(`#clock${n}`),hand=null;svg.addEventListener('pointerdown',e=>{let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;p=p.matrixTransform(svg.getScreenCTM().inverse());let h=svg.querySelector('.hour'),m=svg.querySelector('.minute');let dist=(el)=>Math.hypot(p.x-+el.getAttribute('x2'),p.y-+el.getAttribute('y2'));hand=dist(h)<dist(m)?'h':'m';svg.setPointerCapture(e.pointerId);move(e)});function move(e){if(!hand)return;let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;p=p.matrixTransform(svg.getScreenCTM().inverse());let deg=(Math.atan2(p.x-110,110-p.y)*180/Math.PI+360)%360;if(hand==='m')clockState[n].m=Math.round(deg/6)%60;else clockState[n].h=(Math.round(deg/30)%12)||12;drawClock(n)}svg.addEventListener('pointermove',move);svg.addEventListener('pointerup',()=>hand=null);svg.addEventListener('pointercancel',()=>hand=null)}
let connections={},selected=null;function drawLines(){let g=$('#lines');g.innerHTML=Object.entries(connections).map(([l,r])=>`<line x1="190" y1="${50+Number(l)*100}" x2="390" y2="${50+Number(r)*100}" stroke="#2563eb" stroke-width="5"/>`).join('');document.querySelectorAll('.left').forEach(el=>el.setAttribute('stroke',selected===+el.dataset.i?'#f59e0b':'none'));document.querySelectorAll('.left').forEach(el=>el.setAttribute('stroke-width','5'))}document.querySelectorAll('.left').forEach(el=>el.addEventListener('click',()=>{selected=+el.dataset.i;drawLines()}));document.querySelectorAll('.right').forEach(el=>el.addEventListener('click',()=>{if(selected===null)return;Object.keys(connections).forEach(k=>{if(connections[k]===+el.dataset.i)delete connections[k]});connections[selected]=+el.dataset.i;selected=null;drawLines()}));
const norm=v=>String(v).replace(/\s/g,'').trim().toLowerCase();function same(a,b){return norm(a)===norm(b)}function grade(){let correct=0;for(let n=1;n<=20;n++){let valid=false;if(n===3||n===6){let s=clockState[n],a=answers[n];valid=s.h===a[0]&&s.m===a[1]}else if(n===8){valid=answers[8].every((v,i)=>connections[i]===v-1)}else if([2,5,10,12,16,17,19].includes(n)){let picked=[...document.querySelectorAll(`input[name=a${n}]:checked`)].map(e=>e.value).sort();let target=n===5?['4']:Array.isArray(answers[n])?answers[n]:[answers[n]];valid=JSON.stringify(picked)===JSON.stringify(target.sort())}else{let vals=[...document.querySelectorAll(`input[data-n="${n}"]`)].map(e=>e.value);let target=Array.isArray(answers[n])?answers[n]:[answers[n]];valid=vals.length===target.length&&vals.every((v,i)=>{if(n===11)return ['3','3시간'].some(x=>same(v,x));if(n===20)return ['화','화요일'].some(x=>same(v,x));return same(v,target[i])})}let card=$(`#q${n}`);card.classList.toggle('ok',valid);card.classList.toggle('wrong',!valid);card.querySelector('.result').textContent=valid?'✓ 정답':'✕ 다시 풀어보세요';if(valid)correct++}$('#summary').textContent=`${correct}/20문항 정답 · ${20-correct}문항 다시 풀기`;if(correct===20)showAutoEvaluation()}
