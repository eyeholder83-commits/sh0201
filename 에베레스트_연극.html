{title:'초등학교 2학년의 꿈',time:'약 35초',items:[['cue','전자칠판: 초등학교 교실 사진'],['cue','효과음: 학교 종소리'],['B','얘들아, 초등학교 2학년 때 생각이 나.'],['C','초등학교 2학년?'],['B','교과서에서 에베레스트산 사진을 봤잖아.'],['E','맞아! 그때 선생님이 꿈이 뭐냐고 물어보셨지.'],['C','B이가 손을 번쩍 들었잖아!'],['B','(어린아이 목소리로) “선생님! 저는 에베레스트산 정상에 올라갈 거예요!”'],['D','그때 우리가 얼마나 웃었는데!'],['E','그런데 정말 꿈을 이루었네!'],['B','작은 교실에서 시작된 꿈이 현실이 되었네.']]},
{title:'새로운 꿈을 향해',time:'약 45초',items:[['cue','전자칠판: 에베레스트산 정상에서 떠오르는 해'],['cue','배경음악: 잔잔하고 희망찬 음악'],['E','이제 정상에 올랐으니 우리의 꿈은 끝난 걸까?'],['C','아니! 아직 우리에게는 많은 목표가 있어!'],['D','나는 다음에는 우주에 가 보고 싶어!'],['B','나는 또 다른 높은 산에 도전하고 싶어!'],['E','나는 우리의 모험을 책으로 쓰고 싶어!'],['C','나는 어려운 사람들을 도와주고 싶어!'],['A','나는 우리 모두가 꿈을 이루는 모습을 보고 싶어.'],['B','그런데 우리가 정상에 오를 수 있었던 이유가 뭘까?'],['E','포기하지 않았기 때문이야!'],['C','서로 도와주었기 때문이기도 해!'],['D','그리고 맛있는 치킨도 중요하지!'],['B','치킨은 왜?'],['D','정상에 오르면 먹기로 했잖아! 빨리 내려가자!'],['end','— 끝 —']]}
];
const roles=['A','B','C','D','E'];
let current=0,fontExtra=0;
const main=document.getElementById('main'),nav=document.getElementById('nav');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names=Object.fromEntries(roles.map(k=>[k,'']));
const API_URL = 'https://script.google.com/macros/s/AKfycbywjRsQVVQwYA4SOHqGoEoe3kdwI-EUXIkStfydj93OhQz7L-FOMZ1oyGaMk3xb_Qyt/exec';

const displayName=k=>names[k]?.trim()||k;
// Only replace standalone character identifiers in text, not letters inside other words.
const displayText=s=>String(s).replace(/(?<![A-Za-z])([ABCDE])(?![A-Za-z])/g,(match,k)=>displayName(k));
const cover=document.createElement('section');cover.className='page';cover.innerHTML=`<div class="tag">표지 · 등장인물 이름 설정</div><div class="cover-banner">🏔️ 🧗 🏔️</div><h2 class="cover-title">우리의 꿈은 더 높은 곳에!</h2><div class="cover-sub">에베레스트를 향한 다섯 친구의 도전</div><div class="cover-roles"><b>공연:</b> 학예회 연극　 <b>출연:</b> 5명　 <b>구성:</b> 5막</div><h3>등장인물 이름</h3><div class="cast">${roles.map(k=>`<label for="actor-${k}"><span class="initial">${k} :</span><input id="actor-${k}" placeholder="이름 입력" autocomplete="off" aria-label="${k} 역할 학생 이름"></label>`).join('')}</div><div class="cover-note">✏️ 교사가 저장한 이름이 모든 기기에서 표시됩니다. 음성이 연결된 대사를 누르면 녹음이 재생됩니다. 이름을 저장하면 1막부터 5막까지 <b>등장인물 표시와 대사 속 이름</b>이 자동으로 바뀝니다.<br>예: <b>B: 승찬</b>을 입력하면 대본의 B가 모두 <b>승찬</b>으로 표시됩니다. 빈칸은 A~E로 유지됩니다.</div><button class="primary" onclick="show(1)">1막 대본 보기 →</button><div class="footer"><span class="progress">표지 / 총 6페이지</span><button onclick="show(1)">다음 페이지 →</button></div>`;main.append(cover);
// 교사 모드에서만 편집하며, 저장하기 전에는 다른 기기의 값에 영향을 주지 않습니다.
roles.forEach(k=>{const el=document.getElementById('actor-'+k);el.disabled=true;el.addEventListener('input',e=>{if(!teacherMode)return;names[k]=e.target.value;renderLines();setStatus('수정 중 · 아직 공동 저장되지 않았습니다.');});});
const panel=document.createElement('div');panel.className='teacher-panel';
panel.innerHTML=`<div><b>🔒 교사 전용 배역 관리</b></div>
<div style="margin-top:9px">학생은 이름을 볼 수만 있습니다. 교사만 비밀번호로 편집할 수 있습니다.</div>
<div id="teacherAuth" style="margin-top:10px"><input id="teacherPw" type="password" placeholder="교사 비밀번호" autocomplete="off"> <button id="teacherOpen">교사 편집 시작</button></div>
<div id="teacherActions" hidden style="margin-top:10px"><button id="teacherSave">이름 전체 공동 저장</button> <button class="secondary" id="teacherClose">편집 종료</button></div>
<div id="syncStatus" role="status" aria-live="polite">저장된 배역을 불러오는 중...</div>`;
cover.querySelector('.cover-note').after(panel);
const statusEl=document.getElementById('syncStatus');
function setStatus(t){statusEl.textContent=t;}
function applyRemote(remote){if(!remote||typeof remote!=='object')throw Error('응답 형식 오류');roles.forEach(k=>{names[k]=String(remote[k]??'');document.getElementById('actor-'+k).value=names[k];});renderLines();}
function loadRoles(){return new Promise((resolve,reject)=>{
 const cb='everest_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e7);
 const script=document.createElement('script');let done=false;
 const finish=(err,val)=>{if(done)return;done=true;clearTimeout(timeout);script.remove();delete window[cb];err?reject(err):resolve(val);};
 window[cb]=data=>finish(null,data);
 script.onerror=()=>finish(Error('불러오기 실패'));
 const timeout=setTimeout(()=>finish(Error('응답 시간 초과')),12000);
 script.src=API_URL+'?callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.appendChild(script);
});}
async function refreshRoles(){if(teacherMode||saveBusy)return;try{const result=await loadRoles();if(result.success!==true||!result.names)throw Error('배역 정보 없음');applyRemote(result.names);setStatus('✓ 공동 저장된 이름을 불러왔습니다.');}catch(err){setStatus('⚠ 이름을 불러오지 못했습니다. 네트워크 및 웹 앱 배포 설정을 확인하세요.');}}
document.getElementById('teacherOpen').onclick=()=>{const pw=document.getElementById('teacherPw').value;if(!pw){setStatus('교사 비밀번호를 입력하세요.');return;}teacherMode=true;roles.forEach(k=>document.getElementById('actor-'+k).disabled=false);document.getElementById('teacherAuth').hidden=true;document.getElementById('teacherActions').hidden=false;setStatus('교사 편집 모드 · 저장 버튼을 누르면 서버에서 비밀번호를 검사합니다.');};
document.getElementById('teacherClose').onclick=async()=>{teacherMode=false;roles.forEach(k=>document.getElementById('actor-'+k).disabled=true);document.getElementById('teacherAuth').hidden=false;document.getElementById('teacherActions').hidden=true;document.getElementById('teacherPw').value='';await refreshRoles();};
document.getElementById('teacherSave').onclick=async()=>{
 if(saveBusy)return;
 const password=document.getElementById('teacherPw').value;
 if(!password){setStatus('교사 비밀번호가 없습니다. 편집을 종료하고 다시 입력하세요.');return;}
 const wanted=Object.fromEntries(roles.map(k=>[k,document.getElementById('actor-'+k).value.trim()]));
 saveBusy=true;const btn=document.getElementById('teacherSave');btn.disabled=true;
 try{
  for(const role of roles){setStatus('저장 중... '+role+' / E');
   await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({password,role,name:wanted[role]})});
  }
  // Apps Script의 교차 출처 POST 응답은 브라우저에서 읽을 수 없으므로 GET으로 결과를 검증합니다.
  let verified=false;
  for(let attempt=0;attempt<4;attempt++){
   await new Promise(r=>setTimeout(r,850));
   const data=await loadRoles();
   if(data.success===true&&roles.every(k=>String(data.names?.[k]??'')===wanted[k])){verified=true;break;}
  }
  if(verified)setStatus('✓ 5개 배역이 공동 저장되었습니다. 다른 기기에도 반영됩니다.');
  else setStatus('⚠ 저장을 확인하지 못했습니다. 비밀번호 또는 웹 앱 설정을 확인하세요.');
 }catch(err){setStatus('⚠ 저장 또는 확인에 실패했습니다: '+err.message);}
 finally{saveBusy=false;btn.disabled=false;}
};

const player = new Audio();
let activeLine = null;
function stopAudio(){player.pause();player.currentTime=0;if(activeLine){activeLine.classList.remove('playing');activeLine=null;}}
function playLine(node,path){
 if(activeLine===node && !player.paused){stopAudio();return;}
 stopAudio(); activeLine=node;node.classList.add('playing');player.src=path;player.play().catch(()=>{stopAudio();alert('음성 파일을 찾을 수 없습니다. HTML과 audio 폴더를 함께 두세요.');});
}
player.addEventListener('ended',stopAudio);
document.addEventListener('click',e=>{const node=e.target.closest('.line[data-audio]');if(node)playLine(node,node.dataset.audio);});
