<!DOCTYPE html>

<html lang="ko"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>시계보기 · 30분 시계보기 · 걸린시간</title><style>*{box-sizing:border-box}body{margin:0;background:#eef5f7;font-family:"Malgun Gothic",sans-serif;color:#233e4c}.nav{display:flex;justify-content:center;gap:12px;padding:18px;background:white;box-shadow:0 2px 12px #0001;position:sticky;top:0;z-index:2}.nav button{font:700 19px "Malgun Gothic",sans-serif;padding:13px 28px;border:2px solid #b6d8df;border-radius:13px;background:white;cursor:pointer}.nav button.active{background:#087d78;border-color:#087d78;color:white}.nav{flex-wrap:wrap}.page{display:none;width:100%;height:calc(100dvh - 90px);min-height:650px;border:0}.page.active{display:block}@media(max-width:600px){.nav{padding:10px;gap:8px}.nav button{font-size:16px;padding:11px 14px}.page{height:calc(100dvh - 70px)}}
/* 한 줄 페이지 탐색 */
.nav{flex-wrap:nowrap;justify-content:center;align-items:center;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:thin;white-space:nowrap}

</style><style>
.clock-launch{position:fixed;right:20px;top:78px;z-index:10;border:2px solid #087d78;background:#fff;color:#087d78;border-radius:12px;padding:11px 18px;font:bold 17px "Malgun Gothic",sans-serif;cursor:pointer;box-shadow:0 3px 12px #0002;display:none}
.clock-launch.visible{display:block}
.clock-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:transparent;pointer-events:auto}
.clock-overlay.open{display:flex}
.clock-window{width:430px;height:510px;min-width:300px;min-height:360px;max-width:95vw;max-height:94vh;resize:both;overflow:auto;background:white;border:2px solid #087d78;border-radius:18px;box-shadow:0 12px 45px #0004;padding:15px;display:flex;flex-direction:column;gap:8px}
.clock-header{display:flex;align-items:center;justify-content:space-between;gap:8px;font:bold 18px "Malgun Gothic",sans-serif}
.clock-header button,.clock-tools button{border:1px solid #b6d8df;border-radius:8px;background:white;padding:8px 10px;font:600 14px "Malgun Gothic",sans-serif;cursor:pointer}

.clock-svg{display:block;width:100%;min-height:170px;flex:1;touch-action:none;cursor:grab}
.clock-time{text-align:center;font:bold 20px "Malgun Gothic",sans-serif;color:#305768}
.clock-note{text-align:right;font:12px "Malgun Gothic",sans-serif;color:#657980}
@media(max-width:600px){.clock-launch{top:64px;right:10px;padding:8px 12px;font-size:14px}}
</style><style>
.clock-header{cursor:move;user-select:none;touch-action:none;padding:4px 3px 8px}

.clock-overlay{align-items:initial;justify-content:initial}

PopupTime"></div><div class="clock-tools"><button onclick="clockMove(-1)">−1시간</button><button onclick="clockMove(-0.5)">−30분</button><button onclick="clockMove(-1/6)">−10분</button><button onclick="clockMove(1/6)">+10분</button><button onclick="clockMove(0.5)">+30분</button><button onclick="clockMove(1)">+1시간</button></div><div class="clock-note">오른쪽 아래 모서리를 끌어 크기를 조절하세요.</div></section></div><script>
const clockPages=new Set([4,5,6,7,8,9,10]);
let clockHour=9, clockDrag=false,clockLast=0;
const clockSvg=document.getElementById('clockPopupSvg');
const svgNS='http://www.w3.org/2000/svg';
function clockNode(tag,attr,txt){const n=document.createElementNS(svgNS,tag);Object.entries(attr).forEach(([k,v])=>n.setAttribute(k,v));if(txt!==undefined)n.textContent=txt;clockSvg.appendChild(n)}
function clockDraw(){
 clockSvg.replaceChildren();
 clockNode('circle',{cx:130,cy:130,r:115,fill:'#fffdf3',stroke:'#f8c438','stroke-width':12});
 for(let i=0;i<60;i++){let a=i*Math.PI/30,r=i%5===0?97:103;clockNode('line',{x1:130+Math.sin(a)*r,y1:130-Math.cos(a)*r,x2:130+Math.sin(a)*109,y2:130-Math.cos(a)*109,stroke:'#66757e','stroke-width':i%5===0?2:1})}
 for(let i=1;i<=12;i++){let a=i*Math.PI/6;clockNode('text',{x:130+Math.sin(a)*82,y:130-Math.cos(a)*82,'text-anchor':'middle','dominant-baseline':'middle','font-size':23,fill:'#263e50'},i)}
 let a=clockHour*Math.PI/6;
 clockNode('line',{x1:130,y1:130,x2:130+Math.sin(a)*61,y2:130-Math.cos(a)*61,stroke:'#24a34d','stroke-width':7,'stroke-linecap':'round'});
 a=clockHour*2*Math.PI;
 clockNode('line',{x1:130,y1:130,x2:130+Math.sin(a)*87,y2:130-Math.cos(a)*87,stroke:'#f3299b','stroke-width':4,'stroke-linecap':'round'});
 clockNode('circle',{cx:130,cy:130,r:6,fill:'#f5be29'});
 let t=((clockHour%24)+24)%24,hh=Math.floor(t),mm=Math.round((t-hh)*60);if(mm===60){hh=(hh+1)%24;mm=0}
 document.getElementById('clockPopupTime').textContent=(hh<12?'오전 ':'오후 ')+(hh%12||12)+'시 '+String(mm).padStart(2,'0')+'분';
}
function clockMove(d){clockHour=Math.round((clockHour+d)*6)/6;clockDraw()}
function openClock(){
 const win=document.querySelector('.clock-window');
 win.style.left='50%';win.style.top='50%';win.style.transform='translate(-50%,-50%)';
 document.getElementById('clockOverlay').classList.add('open');clockDraw();
}
function closeClock(){document.getElementById('clockOverlay').classList.remove('open')}
function clockAngle(e){let r=clockSvg.getBoundingClientRect();let a=Math.atan2((e.clientX-r.left)/r.width*260-130,-((e.clientY-r.top)/r.height*260-130));return (Math.round(a/(Math.PI/6))+12)%12}
clockSvg.addEventListener('pointerdown',e=>{clockDrag=true;clockLast=clockAngle(e);clockSvg.setPointerCapture(e.pointerId);e.preventDefault()});
clockSvg.addEventListener('pointermove',e=>{if(!clockDrag)return;let h=clockAngle(e),d=h-clockLast;if(d>6)d-=12;if(d< -6)d+=12;if(d){clockMove(d);clockLast=h}});
clockSvg.addEventListener('pointerup',()=>clockDrag=false);clockSvg.addEventListener('pointercancel',()=>clockDrag=false);
const originalShow=show;
show=function(n){closeClock();originalShow(n)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('clockOverlay').classList.contains('open'))closeClock()});

// iframe의 정답확인 왼쪽에 있는 시계 버튼으로 열기
window.addEventListener('message', e => {
 if (!e.data || e.data.type !== 'openStudyClock') return;
 // data: URL iframe은 출처가 불투명하므로 source 검사에 의존하지 않음.
 // 버튼이 있는 학습 페이지가 현재 표시 중일 때만 시계를 연다.
 const current = document.querySelector('.page.active');
 if (!current || !clockPages.has(Number(current.id.replace('page','')))) return;
 openClock();
});
// 제목 표시줄을 끌어서 팝업 위치 이동 (크기 조절 기능 유지)
const clockWindow=document.querySelector('.clock-window');
const clockHeader=document.querySelector('.clock-header');
let windowDragging=false,dragStartX=0,dragStartY=0,windowStartX=0,windowStartY=0;
clockHeader.addEventListener('pointerdown',e=>{
 if(e.button!==0||e.target.closest('button'))return;
 const r=clockWindow.getBoundingClientRect();
 clockWindow.style.left=r.left+'px';clockWindow.style.top=r.top+'px';clockWindow.style.transform='none';
 windowStartX=r.left;windowStartY=r.top;dragStartX=e.clientX;dragStartY=e.clientY;
 windowDragging=true;clockHeader.setPointerCapture(e.pointerId);e.preventDefault();
});
clockHeader.addEventListener('pointermove',e=>{
 if(!windowDragging)return;
 const x=Math.max(0,Math.min(innerWidth-70,windowStartX+e.clientX-dragStartX));

 clockWindow.style.left=x+'px';clockWindow.style.top=y+'px';
});
clockHeader.addEventListener('pointerup',()=>windowDragging=false);
clockHeader.addEventListener('pointercancel',()=>windowDragging=false);

const completedStudyPages=new Set();
try{JSON.parse(sessionStorage.getItem('studyCompletedPages')||'[]').forEach(n=>{if(Number.isInteger(n)&&n>=1&&n<=10)completedStudyPages.add(n)})}catch(e){}
function markStudyComplete(n){
 if(!Number.isInteger(n)||n<1||n>10)return;
 completedStudyPages.add(n);
 try{sessionStorage.setItem('studyCompletedPages',JSON.stringify([...completedStudyPages]))}catch(e){}
 const tab=document.getElementById('tab'+n);
 if(tab){tab.classList.add('completed');if(!tab.querySelector('.done-symbol')){const badge=document.createElement('span');badge.className='done-symbol';badge.textContent=' ✓';tab.appendChild(badge)}tab.title=(tab.title||'')+' · 완료';}
}
completedStudyPages.forEach(markStudyComplete);
window.addEventListener('message',e=>{
 if(!e.data||e.data.type!=='studyPageCompleted')return;
 const frames=[...document.querySelectorAll('iframe.page')];
 const index=frames.findIndex(f=>f.contentWindow===e.source);
 if(index!==-1 && index+1===Number(e.data.page))markStudyComplete(index+1);
});
</script><script>
let teacherAuthenticated=false;
function toggleTeacherPanel(){const p=document.getElementById('teacherPanel');p.hidden=!p.hidden;if(!p.hidden&&!teacherAuthenticated)document.getElementById('teacherPassword').focus()}
async function teacherLogin(){
 const input=document.getElementById('teacherPassword');const msg=document.getElementById('teacherMessage');
 const password=input.value;input.value='';
 // 비밀번호 원문 대신 해시 비교. 단, 정적 HTML은 완전한 비밀 보호가 불가능합니다.
 const bytes=new TextEncoder().encode(password);
 const digest=await crypto.subtle.digest('SHA-256',bytes);
 const hex=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');
 if(hex!=='d283fc7ed27a618f0d8e673ffbd01c18ba8d472f095f375f93576d3ed40c4782'){msg.textContent='비밀번호가 올바르지 않습니다.';return;}
 teacherAuthenticated=true;msg.textContent='';document.getElementById('teacherLoginArea').hidden=true;document.getElementById('teacherLoggedArea').hidden=false;
 document.getElementById('teacherToggle').textContent='⚙ 교사 ✓';sendTeacherMode();
}
function teacherLogout(){teacherAuthenticated=false;document.getElementById('teacherLoginArea').hidden=false;document.getElementById('teacherLoggedArea').hidden=true;document.getElementById('teacherToggle').textContent='⚙ 교사';document.getElementById('teacherPanel').hidden=true;sendTeacherMode()}
function sendTeacherMode(target){const data={type:'studyTeacherMode',enabled:teacherAuthenticated};(target?[target]:[...document.querySelectorAll('iframe.page')].map(f=>f.contentWindow)).forEach(w=>{try{w.postMessage(data,'*')}catch(e){}})}
window.addEventListener('message',e=>{if(e.data?.type!=='studyPageReady')return;const f=[...document.querySelectorAll('iframe.page')].find(f=>f.contentWindow===e.source);if(f)sendTeacherMode(e.source)});
document.getElementById('teacherPassword').addEventListener('keydown',e=>{if(e.key==='Enter')teacherLogin()});
</script><div aria-label="모든 학습 완료" aria-modal="true" hidden="" id="allDoneOverlay" role="dialog"><div id="allDoneDialog"><strong>🎉 모든 학습 완료!</strong><span>자동평가 페이지로 이동합니다.</span></div></div><script>
(function(){
 const TOTAL=10;
 let autoPageOpened=false;
 let opening=false;
 const isAllDone=()=>Array.from({length:TOTAL},(_,i)=>completedStudyPages.has(i+1)).every(Boolean);
 function revealEvaluation(){
   if(!isAllDone())return;
   document.getElementById('tab11').hidden=false;
   if(autoPageOpened||opening)return;
   opening=true;
   const overlay=document.getElementById('allDoneOverlay');
   overlay.hidden=false;
   setTimeout(()=>{
     overlay.hidden=true;
     opening=false;
     autoPageOpened=true;
     show(11);
   },2000);
 }
 const previousShow=window.show;
 window.show=function(n){if(n===11&&!isAllDone())return;previousShow(n)};
 const previousMark=window.markStudyComplete;
 window.markStudyComplete=function(n){previousMark(n);revealEvaluation()};
 if(isAllDone())revealEvaluation();
})();
</script></body></html>
