<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>독도의 날 퀴즈</title><style>*{box-sizing:border-box}body{margin:0;font-family:'Malgun Gothic',sans-serif;background:#eef5fc;color:#18324d}.wrap{max-width:850px;margin:auto;padding:24px 16px 80px}header{background:linear-gradient(120deg,#0866a5,#14a7a0);color:white;border-radius:22px;padding:30px;text-align:center}h1{margin:4px;font-size:32px}header p{margin:10px 0 0}.card{background:white;border:2px solid transparent;border-radius:18px;padding:22px;margin:17px 0;box-shadow:0 5px 15px #1232  }h2{font-size:19px;line-height:1.6;margin:0 0 14px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{display:block;border:2px solid #dce8f1;padding:13px;border-radius:12px;cursor:pointer}.choice:has(input:checked){border-color:#1784ca;background:#e8f5ff}input[type=radio]{accent-color:#087bc4}input[type=text]{width:100%;padding:15px;border:2px solid #cbddea;border-radius:12px;font-size:18px}input[type=text]:focus{outline:2px solid #57b8e6}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wrong{border-color:#e05252!important;background:#fff8f8}.right{border-color:#21a37b!important}.status{margin-top:10px;font-weight:700;color:#cc3737;min-height:20px}.right .status{color:#16845c}.actions{position:sticky;bottom:0;background:#eef5fcef;padding:14px 0;display:flex;gap:10px}button{flex:1;background:#087db9;color:white;border:0;border-radius:13px;padding:17px;font-size:18px;font-weight:700;cursor:pointer}button.secondary{background:#657a8d}#result{text-align:center;font-weight:800;font-size:20px;padding:14px}#complete{display:none;background:#e7fff3;border:2px solid #33a579;border-radius:16px;padding:20px;text-align:center;font-size:22px;font-weight:800}@media(max-width:520px){.choices,.pair{grid-template-columns:1fr}h1{font-size:26px}}</style></head><body><main class="wrap"><header><div>🌊 10월 25일 · 독도의 날</div><h1>독도 탐험 퀴즈 🇰🇷</h1><p>10문제를 모두 맞히면 자동평가가 열립니다.<br>틀린 문제만 표시되며 정답은 공개되지 않습니다.</p></header><div id="quiz"></div><div id="result" role="status" aria-live="polite"></div><div id="complete" role="status">🎉 통과했어요!<br>독도 탐험 완료!</div><!-- 자동평가: 독도교육주간 -->
<div id="auto-evaluation-act-1792469633557" hidden style="margin:24px auto;max-width:1050px;">
  <iframe title="과제 참여 여부 확인하기"
    src="https://eyeholder83-commits.github.io/sh0201/%ED%95%99%EA%B8%89%ED%86%B5%ED%95%A9%EA%B4%80%EB%A6%AC.html?autoActivity=act-1792469633557"
    loading="lazy"
    style="display:block;width:100%;height:650px;border:0;border-radius:16px;background:#f8fafc;"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
<div class="actions"><button type="button" onclick="grade()">정답 확인하기</button><button type="button" class="secondary" onclick="resetQuiz()">다시 풀기</button></div></main><script>
const questions=[
['매년 지정되어 있는 ‘독도의 날’은 몇 월 며칠일까요?',['8월 15일','10월 3일','10월 25일','12월 25일'],['3']],
['우산국(울릉도와 독도)을 신라 영토로 복속시킨 신라 장군의 이름은 무엇일까요?',null,['이사부']],
['독도는 약 250만 년 전 어떤 자연 현상(폭발)에 의해 만들어진 섬일까요?',null,['화산','화산폭발','화산섬']],
['조선 시대에 일본으로 건너가 독도가 조선 땅임을 경고한 조선 어부의 이름은 누구일까요?',null,['안용복']],
['독도를 구성하는 두 개의 가장 큰 바위섬의 이름은 무엇일까요?',null,['동도서도','서도동도']],
['조선시대 『세종실록지리지』 등에 기록되어 있는 독도의 대표적인 옛 이름은 무엇일까요?',null,['우산도']],
['독도가 행정 구역상 속해 있는 대한민국의 군(郡) 이름은 무엇일까요?',null,['울릉군']],
['일제 강점기 때 일본의 무분별한 포획으로 인해 독도 바다에서 사라진 바다사자과 동물의 이름은 무엇일까요?',null,['강치','독도강치']],
['1953년 홍순칠 대장을 중심으로 결성되어 독도를 지켜낸 민간 수비 조직의 이름은 무엇일까요?',null,['독도의용수비대']],
['독도 경비대와 함께 생활하며 독도를 지키는 상징적인 대한민국 토종개 품종은 무엇일까요?',null,['삽살개']]
];
const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\s,，、·.\-와과및]+/g,'');
const quiz=document.getElementById('quiz');questions.forEach((q,i)=>{let c=document.createElement('section');c.className='card';c.id='q'+i;let h=document.createElement('h2');h.textContent=(i+1)+'. '+q[0];c.append(h);if(q[1]){let opts=document.createElement('div');opts.className='choices';q[1].forEach((v,j)=>{let l=document.createElement('label');l.className='choice';let r=document.createElement('input');r.type='radio';r.name='answer'+i;r.value=String(j+1);l.append(r,document.createTextNode(' '+['①','②','③','④'][j]+' '+v));opts.append(l)});c.append(opts)}else{let inp=document.createElement('input');inp.type='text';inp.id='answer'+i;inp.autocomplete='off';inp.placeholder='답을 입력하세요';if(i===4){let pair=document.createElement('div');pair.className='pair';inp.placeholder='첫 번째 섬';let inp2=document.createElement('input');inp2.type='text';inp2.id='answer'+i+'b';inp2.autocomplete='off';inp2.placeholder='두 번째 섬';pair.append(inp,inp2);c.append(pair)}else c.append(inp)}let st=document.createElement('div');st.className='status';st.setAttribute('aria-live','polite');c.append(st);quiz.append(c)});
function showAutoEvaluation(){const area=document.getElementById("auto-evaluation-act-1792469633557");if(area){area.hidden=false;area.scrollIntoView({behavior:"smooth",block:"start"})}}
function grade(){let correct=0;questions.forEach((q,i)=>{let card=document.getElementById('q'+i);let value=q[1]?document.querySelector('input[name="answer'+i+'"]:checked')?.value||'':document.getElementById('answer'+i).value;let ok=i===4?(()=>{const a=norm(document.getElementById('answer4').value),b=norm(document.getElementById('answer4b').value);return (a==='동도'&&b==='서도')||(a==='서도'&&b==='동도')})():q[2].some(a=>norm(a)===norm(value));card.classList.toggle('wrong',!ok);card.classList.remove('right');card.querySelector('.status').textContent=ok?'':(i===4?(document.getElementById('answer4').value.trim()&&document.getElementById('answer4b').value.trim()):value.trim())?'✕ 다시 생각해 보세요.':'✕ 답을 입력해 주세요.';if(ok)correct++});document.getElementById('result').textContent=`${correct}점 / 10점 · ${10-correct}문제 다시 확인`;document.getElementById('complete').style.display=correct===10?'block':'none';if(correct===10)showAutoEvaluation();else {document.getElementById('auto-evaluation-act-1792469633557').hidden=true;document.querySelector('.card.wrong')?.scrollIntoView({behavior:'smooth',block:'center'})}}
function resetQuiz(){document.querySelectorAll('input').forEach(x=>{if(x.type==='radio')x.checked=false;else x.value=''});document.querySelectorAll('.card').forEach(x=>{x.classList.remove('wrong','right');x.querySelector('.status').textContent='' });document.getElementById('result').textContent='';document.getElementById('complete').style.display='none';document.getElementById('auto-evaluation-act-1792469633557').hidden=true;window.scrollTo({top:0,behavior:'smooth'})}
</script></body></html>
