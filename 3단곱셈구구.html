<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>곱셈구구 디지털 교과서 (3단)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');
    
    body {
      font-family: 'Gowun Dodum', sans-serif;
      background: radial-gradient(circle at 50% 0%, #f0fdf4 0%, #f1f5f9 100%);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    
    .font-jua {
      font-family: 'Jua', sans-serif;
    }

    @keyframes modalAppear {
      0% { transform: scale(0.88); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-modal {
      animation: modalAppear 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes pulseSoft {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .animate-pulse-soft {
      animation: pulseSoft 2s infinite ease-in-out;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center justify-between p-2 sm:p-5 relative overflow-x-hidden">

  <!-- Confetti Canvas for 5-Streak Celebration -->

      <div class="flex items-center gap-2">
        <span class="text-2xl animate-pulse-soft">☘️</span>
        <h1 class="font-jua text-base sm:text-xl text-emerald-900 tracking-tight">초등 2학년 2학기 · 3단 곱셈구구</h1>
      </div>
      
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- Chanting TTS sound button -->
        <button id="chant-btn" onclick="readChant()" class="flex items-center gap-1 px-2.5 py-1.5 rounded-full bg-emerald-50 hover:bg-emerald-100 text-xs sm:text-sm font-jua text-emerald-800 border border-emerald-300 transition-colors shadow-2xs">
          <span>🎵</span>
          <span class="hidden sm:inline">3단 구구송</span>

        <!-- Sound toggle button -->
        <button id="sound-btn" onclick="toggleSound()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 text-xs sm:text-sm font-jua text-slate-700 transition-colors shadow-2xs">

          <span id="sound-label" class="hidden sm:inline">효과음</span>

      <button onclick="setPage(2)" id="tab-2" class="py-2 px-1 rounded-2xl transition-all duration-150">1. 하나씩</button>

        멋져요! 계속 도전하기 🚀
      </button>
    </div>

  <script>
    let audioCtx = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound() {
      isMuted = !isMuted;
      const icon = document.getElementById('sound-icon');
      const label = document.getElementById('sound-label');
      if (isMuted) {
        icon.innerText = '🔇';
        label.innerText = '음소거';
      } else {
        icon.innerText = '🔊';
        label.innerText = '효과음';
        initAudio();
        playSound('correct');
      }
    }

    function playSound(type) {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        osc.frequency.setValueAtTime(783.99, now + 0.16);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
        osc.start(now);
        osc.stop(now + 0.36);
      } else if (type === 'wrong') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(160, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'fanfare') {
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, idx) => {
          const noteOsc = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          noteOsc.connect(noteGain);
          noteGain.connect(audioCtx.destination);
          const startTime = now + idx * 0.09;
          noteOsc.frequency.setValueAtTime(freq, startTime);
          noteGain.gain.setValueAtTime(0.2, startTime);
          noteGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
          noteOsc.start(startTime);
          noteOsc.stop(startTime + 0.3);
        });
      }
    }

    function readChant() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const chant = "삼 일은 삼. 삼 이 육. 삼 삼은 구. 삼 사 십이. 삼 오 십오. 삼 육 십팔. 삼 칠 이십일. 삼 팔 이십사. 삼 구 이십칠!";
        const utterance = new SpeechSynthesisUtterance(chant);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#10b981', '#34d399', '#f59e0b', '#3b82f6', '#ec4899', '#8b5cf6'];

      for (let i = 0; i < 90; i++) {
        particles.push({
          x: canvas.width * 0.5,
          y: canvas.height * 0.4,
          r: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.75) * 16,
          alpha: 1,
          decay: Math.random() * 0.015 + 0.01
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach(p => {
          if (p.alpha > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.38;
            p.alpha -= p.decay;
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        });
        if (active) {
          requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      render();
    }

      return `
        <svg class="w-11 h-11 sm:w-13 sm:h-13 inline-block drop-shadow-xs select-none hover:rotate-6 transition-transform" viewBox="0 0 100 100">

    // Student Database and 7-Letter Keyword Mapping
    const STUDENT_KEYWORDS = {
      "김서아": "파란하늘구름꽃",
      "김수현": "아기토끼인형들",
      "김윤아": "반짝이는별빛들",
      "김태영": "노란해바라기꽃",
      "김하랑": "바다거북친구야",
      "나예린": "달콤딸기우유맛",
      "박민제": "씽씽기차놀이방",
      "박선우": "하얀눈송이꽃잎",
      "양수빈": "빨간아기사과꽃",
      "유소영": "귀여운다람쥐야",
      "이대운": "하늘뭉게구름빛",
      "이새봄": "향기로운꽃길로",
      "이서율": "반짝보석상자속",
      "이진서": "종이배띄우기날",
      "이채원": "달콤보라포도맛",
      "이초은": "둥근보름달빛아",
      "이태환": "튼튼장난감차야",
      "이하린": "살랑이는바람결",
      "한규빈": "멋진우주로봇맨",
      "한유은": "시원여름수박맛",
      "현지우": "예쁜호랑나비야",
      "황지우": "따스한아침빛깔",
      "이승찬": "대한민국의교사"
    };

    let currentStudent = localStorage.getItem('multiplication_student_name') || "";
    let unlockedLetters = [false, false, false, false, false, false, false];

    function getStudentKeyword() {
      const name = currentStudent.trim();
      return STUDENT_KEYWORDS[name] || "즐거운수학공부야";
    }

    function unlockStageLetter(stageNum) {
      if (stageNum >= 1 && stageNum <= 7) {
        unlockedLetters[stageNum - 1] = true;
      }
    }

    function showKeywordModal(stageNum, desc) {
      unlockStageLetter(stageNum);
      const keyword = getStudentKeyword();
      const char = keyword[stageNum - 1] || "★";

      const charEl = document.getElementById('modal-keyword-char');
      const stepEl = document.getElementById('modal-keyword-step');
      const collectedEl = document.getElementById('modal-keyword-collected');
      const descEl = document.getElementById('modal-desc');

      if (descEl) descEl.innerText = desc;
      if (charEl) charEl.innerText = char;
      if (stepEl) stepEl.innerText = stageNum;

      if (collectedEl) {
        let displayStr = "";
        for (let i = 0; i < 7; i++) {
          if (unlockedLetters[i]) {
            displayStr += (keyword[i] || "?") + " ";
          } else {
            displayStr += "□ ";
          }
        }
        collectedEl.innerText = displayStr.trim();
      }

      document.getElementById('success-modal').classList.remove('hidden');
    }

    let currentPage = 1;
    let p1Multiplier = Math.floor(Math.random() * 9) + 1;
    let p1Streak = 0;

    let p2MultA = 3;
    let p2MultB = 5;
    let p2Streak = 0;

    let p3Target = Math.floor(Math.random() * 8) + 2;
    let p3CurrentCount = 0;
    let p3Streak = 0;

    let p4ValA = Math.floor(Math.random() * 6) + 1;
    let p4ValB = p4ValA + Math.floor(Math.random() * 3) + 2;
    let p4Streak = 0;

    let p5Clovers = Math.floor(Math.random() * 8) + 2;
    let p5Streak = 0;

    let p6Multiplier = Math.floor(Math.random() * 9) + 1;
    let p6Streak = 0;

    function renderCoverPage() {
      const studentNames = Object.keys(STUDENT_KEYWORDS);
      const container = document.getElementById('page-content');
      container.innerHTML = `

              <input type="number" id="p6-total-input" inputmode="numeric" placeholder="?" maxlength="3"
                class="w-16 sm:w-20 h-12 text-center font-bold text-xl text-teal-700 bg-white border-2 border-teal-400 rounded-2xl focus:ring-4 focus:ring-teal-200 outline-none shadow-xs transition-all">

            <div class="flex items-center gap-3">
              <button onclick="checkP6Answer()" class="py-3 px-8 bg-emerald-600 hover:bg-emerald-700 text-white font-jua text-lg rounded-2xl shadow-md transition-all active:scale-95 flex items-center gap-2">
                ✏️ 정답 확인

      const inputA = document.getElementById('p6-dice-input');
      const inputB = document.getElementById('p6-total-input');

      inputA.addEventListener('input', () => {
        if (inputA.value.length >= 1) inputB.focus();
      });

      [inputA, inputB].forEach(el => {
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter') checkP6Answer();
        });
      });
      inputA.focus();
    }

    function randomizeP6() {
      let nextMult;
      do {
        nextMult = Math.floor(Math.random() * 9) + 1;
      } while (nextMult === p6Multiplier);
      p6Multiplier = nextMult;
      renderPage6();
    }

    function checkP6Answer() {
      const dInput = document.getElementById('p6-dice-input');
      const tInput = document.getElementById('p6-total-input');
      const feedback = document.getElementById('p6-feedback');

      if (!dInput || !tInput) return;
      const dVal = dInput.value.trim();
      const tVal = tInput.value.trim();

      if (dVal === '' && tVal === '') {
        feedback.className = 'font-jua text-base text-center text-amber-600';
        feedback.innerText = '⚠️ 답을 입력하지 않았어요! 주사위 개수와 총 점의 수를 써넣어 보세요.';
        dInput.focus();
        return;
      }

      if (dVal === '' || tVal === '') {
        feedback.className = 'font-jua text-base text-center text-amber-600';
        feedback.innerText = '⚠️ 빈칸이 남아있어요! 두 네모칸을 모두 입력해 주세요.';
        return;
      }

      const expectedD = p6Multiplier;
      const expectedT = p6Multiplier * 3;

      const isDOk = parseInt(dVal, 10) === expectedD;
      const isTOk = parseInt(tVal, 10) === expectedT;

      if (isDOk && isTOk) {
        playSound('correct');
        p6Streak++;
        updateStreakUI();
        feedback.className = 'font-jua text-base text-center text-emerald-600';
        feedback.innerText = `🎉 완벽합니다! 3 × ${expectedD} = ${expectedT} 정답입니다!`;

        if (p6Streak >= 5) {
          playSound('fanfare');
          triggerConfetti();
          showKeywordModal(6, '6단계 5연속 성공! 여섯 번째 비밀 글자를 획득했습니다!');
          p6Streak = 0;
          updateStreakUI();
        } else {
          setTimeout(randomizeP6, 1100);
        }
      } else {
        playSound('wrong');
        p6Streak = 0;
        updateStreakUI();
        feedback.className = 'font-jua text-base text-center text-rose-500';
        feedback.innerText = '❌ 3, 6, 9, 12... 3씩 뛰어세며 주사위 눈을 세어보세요!';
        setTimeout(randomizeP6, 1700);
      }
    }

    let p8Questions = [];
    let p8Timer = null;
    let p8ElapsedTime = 0.0;
    let p8IsActive = false;
    let p8Solved = false;
    let p8StartTime = 0;

    function generateP8Questions() {
      const allCombos = [];
      [2, 3, 5].forEach(dan => {
        for (let num = 1; num <= 9; num++) {
          allCombos.push({ dan, num, ans: dan * num });
        }
      });

      // Shuffle using Fisher-Yates
      for (let i = allCombos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allCombos[i], allCombos[j]] = [allCombos[j], allCombos[i]];
      }

      // Pick 10 unique problems
      p8Questions = allCombos.slice(0, 10);
      p8ElapsedTime = 0.0;
      p8Solved = false;
      p8IsActive = false;
    }

    function stopP8Timer() {
      if (p8Timer) {
        clearInterval(p8Timer);
        p8Timer = null;
      }
      p8IsActive = false;
    }

    function startP8Timer() {
      if (p8IsActive) return;
      stopP8Timer();
      p8IsActive = true;
      p8Solved = false;
      p8StartTime = Date.now() - Math.floor(p8ElapsedTime * 1000);

      // Unlock all inputs
      p8Questions.forEach((_, idx) => {
        const input = document.getElementById(`p8-ans-${idx}`);
        if (input) input.disabled = false;
      });

      // Update start button appearance
      const startBtn = document.getElementById('p8-start-btn');
      if (startBtn) {
        startBtn.className = 'py-2 px-4 sm:px-5 bg-emerald-600 text-white font-jua text-sm sm:text-base rounded-2xl shadow-sm cursor-default flex items-center gap-1.5';
        startBtn.innerHTML = '<span>⚡</span> <span>도전 진행 중</span>';
      }

      p8Timer = setInterval(() => {
        p8ElapsedTime = (Date.now() - p8StartTime) / 1000;
        updateP8TimerUI();
      }, 100);

      const firstInput = document.getElementById('p8-ans-0');
      if (firstInput) firstInput.focus();
    }

    function updateP8TimerUI() {
      const timeValEl = document.getElementById('p8-time-val');
      const timeBarEl = document.getElementById('p8-time-bar');
      const statusBadge = document.getElementById('p8-time-status');
      if (!timeValEl || !timeBarEl) return;

      timeValEl.innerText = p8ElapsedTime.toFixed(1);

      if (p8ElapsedTime <= 30.0) {
        const percent = Math.min(100, (p8ElapsedTime / 30.0) * 100);
        timeBarEl.style.width = `${percent}%`;

        if (p8ElapsedTime < 18.0) {
          timeBarEl.className = 'h-full bg-emerald-500 rounded-full transition-all duration-100';
          timeValEl.className = 'font-black text-2xl sm:text-3xl text-emerald-600';
        } else if (p8ElapsedTime < 25.0) {
          timeBarEl.className = 'h-full bg-amber-500 rounded-full transition-all duration-100';
          timeValEl.className = 'font-black text-2xl sm:text-3xl text-amber-600';
        } else {
          timeBarEl.className = 'h-full bg-rose-500 rounded-full transition-all duration-100 animate-pulse';
          timeValEl.className = 'font-black text-2xl sm:text-3xl text-rose-600';
        }

        if (statusBadge) {
          statusBadge.className = 'font-jua text-xs sm:text-sm bg-emerald-50 border border-emerald-300 text-emerald-800 font-bold px-3 py-1 rounded-full shadow-2xs';
          statusBadge.innerText = '🎯 30초 내 성공 목표!';
        }
      } else {
        // 30 seconds exceeded, but keep allowing solve
        timeBarEl.style.width = '100%';
        timeBarEl.className = 'h-full bg-rose-500 rounded-full transition-all duration-100';
        timeValEl.className = 'font-black text-2xl sm:text-3xl text-rose-600';

        if (statusBadge) {

    function checkP8Answer() {
      if (p8Solved) return;
      const feedback = document.getElementById('p8-feedback');
      if (!feedback) return;

      if (!p8IsActive && p8ElapsedTime === 0) {
        feedback.className = 'font-jua text-base text-center text-amber-600 bg-amber-50 py-2 px-4 rounded-xl border border-amber-300';
        feedback.innerText = '⚠️ 먼저 [▶️ 시작하기] 버튼을 눌러 도전을 시작해 주세요!';
        return;
      }

      let correctCount = 0;
      let emptyCount = 0;

      p8Questions.forEach((q, idx) => {
        const input = document.getElementById(`p8-ans-${idx}`);
        const card = document.getElementById(`p8-card-${idx}`);
        if (!input) return;

        const val = input.value.trim();
        if (val === '') {

              모든 7단계를 완벽하게 정복하고 비밀 키워드<br/>
              <span class="text-amber-700 font-black text-xl sm:text-2xl bg-white px-4 py-1 rounded-xl border-2 border-amber-300 shadow-2xs inline-block my-2">${keyword}</span><br/>
              를 성공적으로 완성하였습니다! 참 잘했어요! 🎉
            </p>
            <div class="flex items-center gap-2 font-jua text-xs sm:text-sm text-slate-500">
              <span>초등 수학 2학년 2학기 · 곱셈구구 마스터</span>
            </div>
          </div>

        </div>
      `;

      const input = document.getElementById('p9-keyword-input');
      if (input) {
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') checkP9Keyword();
        });
        input.focus();
      }
    }

    function checkP9Keyword() {
      const input = document.getElementById('p9-keyword-input');
      const feedback = document.getElementById('p9-feedback');
      const cert = document.getElementById('p9-certificate');
      if (!input || !feedback) return;

      const userVal = input.value.replace(/\s+/g, '');
      const targetVal = getStudentKeyword().replace(/\s+/g, '');

      if (!userVal) {
        feedback.className = 'font-jua text-base text-center text-amber-600';
        feedback.innerText = '⚠️ 키워드를 입력하지 않았어요! 7글자를 입력해 주세요.';
        input.focus();
        return;
      }

      if (userVal === targetVal) {
        playSound('fanfare');
        triggerConfetti();
        feedback.className = 'font-jua text-lg text-center text-emerald-600 font-bold mb-2';
        feedback.innerText = '🎉 대성공입니다! 비밀 키워드가 정확하게 일치합니다!';
        if (cert) cert.classList.remove('hidden');
      } else {
        playSound('wrong');
        feedback.className = 'font-jua text-base text-center text-rose-500';
        feedback.innerText = '❌ 키워드가 일치하지 않아요! 1~7단계에서 획득한 글자를 다시 확인해 보세요!';
      }
    }

    function getStreak() {
      if (currentPage === 2) return p1Streak;
      if (currentPage === 3) return p2Streak;
      if (currentPage === 4) return p3Streak;
      if (currentPage === 5) return p4Streak;
      if (currentPage === 6) return p5Streak;
      if (currentPage === 7) return p6Streak;
      return 0;
    }

    function updateStreakUI() {
      const s = getStreak();
      const starsEl = document.getElementById('top-streak-stars');
      const countEl = document.getElementById('top-streak-count');
      if (starsEl) starsEl.innerText = '★'.repeat(s) + '☆'.repeat(5 - s);
      if (countEl) countEl.innerText = `(${s}/5)`;
    }

    function triggerRandomizeCurrent() {
      if (currentPage === 2) randomizeP1();
      else if (currentPage === 3) randomizeP2();
      else if (currentPage === 4) randomizeP3();
      else if (currentPage === 5) randomizeP4();
      else if (currentPage === 6) randomizeP5();
      else if (currentPage === 7) randomizeP6();
      else if (currentPage === 8) randomizeP8();
      else if (currentPage === 9) renderPage9();
    }

    function setPage(num, forceRandom = true) {
      if (currentPage === 8 && num !== 8) {
        stopP8Timer();
      }

      currentPage = num;
      
      for (let i = 1; i <= 9; i++) {
        const tab = document.getElementById(`tab-${i}`);
        if (tab) {
          if (i === num) {
            tab.className = "py-2 px-1 rounded-2xl bg-emerald-600 text-white shadow-sm font-bold border-2 border-emerald-700";
          } else {
            tab.className = "py-2 px-1 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium border-2 border-transparent";
          }
        }
      }

      const pageIndicator = document.getElementById('page-indicator');
      if (pageIndicator) {
        pageIndicator.innerText = `${num} / 9 단계`;
      }

      const prevBtn = document.getElementById('prev-step-btn');
      const nextBtn = document.getElementById('next-step-btn');
      if (prevBtn) prevBtn.disabled = (num === 1);
      if (nextBtn) nextBtn.disabled = (num === 9);

      const topBar = document.getElementById('quiz-top-bar');

      if (num === 1 || num === 8 || num === 9) {
        if (topBar) topBar.classList.add('hidden');
        if (num === 1) renderCoverPage();
        else if (num === 8) {
          if (forceRandom) randomizeP8();
          else renderPage8();
        } else if (num === 9) renderPage9();
        return;
      }

      if (topBar) {
        topBar.classList.remove('hidden');
        updateStreakUI();
      }

      if (forceRandom) {
        if (num === 2) randomizeP1();
        else if (num === 3) randomizeP2();
        else if (num === 4) randomizeP3();
        else if (num === 5) randomizeP4();
        else if (num === 6) randomizeP5();
        else if (num === 7) randomizeP6();
      } else {
        if (num === 2) renderPage1();
        else if (num === 3) renderPage2();
        else if (num === 4) renderPage3();
        else if (num === 5) renderPage4();
        else if (num === 6) renderPage5();
        else if (num === 7) renderPage6();
      }
    }

    function goPrevPage() {
      if (currentPage > 1) {
        setPage(currentPage - 1, false);
      }
    }

    function goNextPage() {
      if (currentPage < 9) {
        setPage(currentPage + 1, false);
      }
    }

    function closeModal() {
      document.getElementById('success-modal').classList.add('hidden');
      if (currentPage === 2) randomizeP1();
      else if (currentPage === 3) randomizeP2();
      else if (currentPage === 4) randomizeP3();
      else if (currentPage === 5) randomizeP4();
      else if (currentPage === 6) randomizeP5();
      else if (currentPage === 7) randomizeP6();
      else if (currentPage === 8) randomizeP8();
    }

    window.onload = () => {
      setPage(1, true);
    };
  </script>
</body>
</html>
