      margin: 0;
    }

  <script>
    let audioCtx = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound() {
      isMuted = !isMuted;
      const icon = document.getElementById('sound-icon');
      const label = document.getElementById('sound-label');
      if (isMuted) {
        icon.innerText = '🔇';
        label.innerText = '소리 꺼짐';
      } else {
        icon.innerText = '🔊';
        label.innerText = '소리 켜짐';
        initAudio();
        playSound('correct');
      }
    }

    function playSound(type) {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        osc.frequency.setValueAtTime(783.99, now + 0.16);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
        osc.start(now);
        osc.stop(now + 0.38);
      } else if (type === 'wrong') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.setValueAtTime(180, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
        osc.start(now);
        osc.stop(now + 0.32);
      } else if (type === 'fanfare') {
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, idx) => {
          const noteOsc = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          noteOsc.connect(noteGain);
          noteGain.connect(audioCtx.destination);
          const startTime = now + idx * 0.1;
          noteOsc.frequency.setValueAtTime(freq, startTime);
          noteGain.gain.setValueAtTime(0.2, startTime);
          noteGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.28);
          noteOsc.start(startTime);
          noteOsc.stop(startTime + 0.28);
        });
      }
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];

      for (let i = 0; i < 80; i++) {
        particles.push({
          x: canvas.width * 0.5,
          y: canvas.height * 0.4,
          r: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.7) * 15,
          alpha: 1,
          decay: Math.random() * 0.015 + 0.01
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach(p => {
          if (p.alpha > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35;
            p.alpha -= p.decay;
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        });
        if (active) {
          requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      render();
    }

              <span>씩</span>
              <input type="number" id="p1-input-group" inputmode="numeric" placeholder="?" maxlength="2"
                class="w-14 h-11 text-center font-bold text-xl text-amber-600 bg-white border-2 border-amber-400 rounded-xl focus:outline-none focus:ring-4 focus:ring-amber-200 transition-all">
              <span>묶음은</span>

            <div class="flex items-center justify-center gap-2 whitespace-nowrap">

      let nextA, nextB;
      do {
        nextA = Math.floor(Math.random() * 6) + 1;
        nextB = Math.floor(Math.random() * (9 - nextA)) + (nextA + 1);

      p4ValB = nextB;

        'p4-mult-diff-input',

          el.value = '';

      if (feedback) feedback.innerText = '';

    function checkP4Answer() {
      const inDiff = document.getElementById('p4-ans-diff');
      const inResTop = document.getElementById('p4-res-top-input');
      const inResBot = document.getElementById('p4-res-bot-input');
      const inBase = document.getElementById('p4-mult-base-input');
      const inMultDiff = document.getElementById('p4-mult-diff-input');
      const inMultRes = document.getElementById('p4-mult-res-input');
      const feedback = document.getElementById('p4-feedback');

      if (!inDiff || !inResTop || !inResBot || !inBase || !inMultDiff || !inMultRes) return;

      const allInputs = [inDiff, inResTop, inResBot, inBase, inMultDiff, inMultRes];
      const allVals = allInputs.map(el => el.value.trim());

      if (allVals.every(v => v === '')) {
        feedback.className = 'font-jua text-base text-center text-amber-600';
        feedback.innerText = '⚠️ 답을 입력하지 않았어요! 네모칸에 숫자를 먼저 써넣어 보세요.';
        inDiff.focus();
        return;
      }

      if (allVals.some(v => v === '')) {

        feedback.innerText = '⚠️ 아직 채우지 않은 네모칸이 있어요! 모든 칸을 입력해 주세요.';
        return;
      }

      const expectedDiff = p4ValB - p4ValA;
      const expectedResTop = p4ValA * 5;
      const expectedResBot = p4ValB * 5;
      const expectedBase = 5;
      const expectedMultDiff = expectedDiff;
      const expectedMultRes = expectedDiff * 5;

      const isDiffOk = parseInt(inDiff.value.trim(), 10) === expectedDiff;
      const isResTopOk = parseInt(inResTop.value.trim(), 10) === expectedResTop;
      const isResBotOk = parseInt(inResBot.value.trim(), 10) === expectedResBot;
      const isBaseOk = parseInt(inBase.value.trim(), 10) === expectedBase;
      const isMultDiffOk = parseInt(inMultDiff.value.trim(), 10) === expectedMultDiff;
      const isMultResOk = parseInt(inMultRes.value.trim(), 10) === expectedMultRes;

      const mark = (el, ok) => {
        el.classList.remove('border-emerald-500', 'bg-emerald-50', 'border-rose-400', 'bg-rose-50');
        if (ok) el.classList.add('border-emerald-500', 'bg-emerald-50');
        else el.classList.add('border-rose-400', 'bg-rose-50');
      };

      mark(inDiff, isDiffOk);
      mark(inResTop, isResTopOk);
      mark(inResBot, isResBotOk);
      mark(inBase, isBaseOk);
      mark(inMultDiff, isMultDiffOk);
      mark(inMultRes, isMultResOk);

      if (isDiffOk && isResTopOk && isResBotOk && isBaseOk && isMultDiffOk && isMultResOk) {
        playSound('correct');
        p4Streak++;
        updateStreakUI();
        feedback.className = 'font-jua text-base text-center text-emerald-600';
        feedback.innerText = `🎉 완벽합니다! 5를 ${expectedDiff}번 더 더해서 (+ 5 × ${expectedDiff} = ${expectedMultRes}) ${expectedResBot}이 됩니다!`;

          triggerConfetti();

    /* Fixed Top Bar Helper Functions */
    function getStreak() {
      if (currentPage === 2) return p1Streak;
      if (currentPage === 3) return p2Streak;
      if (currentPage === 4) return p3Streak;
      if (currentPage === 5) return p4Streak;
      if (currentPage === 6) return p5Streak;
      if (currentPage === 7) return p6Streak;
      return 0;
    }

    function updateStreakUI() {
      const s = getStreak();
      const starsEl = document.getElementById('top-streak-stars');
      const countEl = document.getElementById('top-streak-count');
      if (starsEl) starsEl.innerText = '★'.repeat(s) + '☆'.repeat(5 - s);
      if (countEl) countEl.innerText = `(${s}/5)`;
    }

    function triggerRandomizeCurrent() {
      if (currentPage === 2) randomizeP1();
      else if (currentPage === 3) randomizeP2();
      else if (currentPage === 4) randomizeP3();
      else if (currentPage === 5) randomizeP4();
      else if (currentPage === 6) randomizeP5();
      else if (currentPage === 7) randomizeP6();
    }

    function setPage(num, forceRandom = true) {
      currentPage = num;
      
      // Update top tabs
      for (let i = 1; i <= 7; i++) {
        const tab = document.getElementById(`tab-${i}`);
        if (tab) {
          if (i === num) {
            tab.className = "py-2 px-1 rounded-2xl bg-amber-500 text-white shadow-sm font-bold border-2 border-amber-600";
          } else {
            tab.className = "py-2 px-1 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium border-2 border-transparent";
          }
        }
      }

      // Update bottom indicator
      const pageIndicator = document.getElementById('page-indicator');
      if (pageIndicator) {
        pageIndicator.innerText = `${num} / 7 단계`;
      }

      const prevBtn = document.getElementById('prev-step-btn');
      const nextBtn = document.getElementById('next-step-btn');
      if (prevBtn) prevBtn.disabled = (num === 1);
      if (nextBtn) nextBtn.disabled = (num === 7);

      const topBar = document.getElementById('quiz-top-bar');

      if (num === 1) {
        if (topBar) topBar.classList.add('hidden');
        renderCoverPage();
        return;
      }

      if (topBar) {
        topBar.classList.remove('hidden');
        updateStreakUI();
      }

      if (forceRandom) {
        if (num === 2) randomizeP1();
        else if (num === 3) randomizeP2();
        else if (num === 4) randomizeP3();
        else if (num === 5) randomizeP4();
        else if (num === 6) randomizeP5();
        else if (num === 7) randomizeP6();
      } else {
        if (num === 2) renderPage1();
        else if (num === 3) renderPage2();
        else if (num === 4) renderPage3();
        else if (num === 5) renderPage4();
        else if (num === 6) renderPage5();
        else if (num === 7) renderPage6();
      }
    }

    function goPrevPage() {
      if (currentPage > 1) {
        setPage(currentPage - 1, false);
      }
    }

    function goNextPage() {
      if (currentPage < 7) {
        setPage(currentPage + 1, false);
      }
    }

    function closeModal() {
      document.getElementById('success-modal').classList.add('hidden');
      if (currentPage === 2) randomizeP1();
      else if (currentPage === 3) randomizeP2();
      else if (currentPage === 4) randomizeP3();
      else if (currentPage === 5) randomizeP4();
      else if (currentPage === 6) randomizeP5();
      else if (currentPage === 7) randomizeP6();
    }

    window.onload = () => {
      setPage(1, true);
    };
  </script>
