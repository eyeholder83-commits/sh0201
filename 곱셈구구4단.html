<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>초등 2학년 곱셈구구 4단 & 비밀 키워드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Gowun Dodum', sans-serif;
      background: radial-gradient(circle at 50% 0%, #eff6ff 0%, #e0f2fe 40%, #f1f5f9 100%);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .font-jua {
      font-family: 'Jua', sans-serif;
    }

    @keyframes modalPop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-modal {
      animation: modalPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes softFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-3px) scale(1.03); }
    }

    .animate-float {
      animation: softFloat 2.2s infinite ease-in-out;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center justify-between p-2 sm:p-5 relative overflow-x-hidden">

  <!-- Confetti Canvas for Celebrations -->
  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50 w-full h-full"></canvas>

  <header class="w-full max-w-4xl bg-white/95 backdrop-blur-md rounded-3xl shadow-sm border border-sky-200/80 p-3 sm:p-4 mb-3">
    <div class="flex items-center justify-between gap-2 mb-2 px-1">
      <div class="flex items-center gap-2">
        <span class="text-2xl animate-float">🚗</span>
        <h1 class="font-jua text-base sm:text-xl text-sky-900 tracking-tight">초등 2학년 2학기 · 4단 곱셈구구 & 비밀 키워드</h1>
      </div>
      
      <div class="flex items-center gap-2">
        <!-- Student Badge -->
        <div id="header-student-badge" class="hidden sm:flex items-center gap-1.5 px-3 py-1 bg-sky-50 border border-sky-300 rounded-full text-xs font-jua text-sky-800">
          <span>👤</span>
          <span id="header-student-name" class="font-bold">학생 미등록</span>
          <span id="header-letters-count" class="text-amber-600 font-bold ml-1">(0/7)</span>
        </div>

        <!-- Fruit Switch Button -->
        <button id="fruit-toggle-btn" onclick="cycleFruit()" class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-amber-50 border border-amber-300 hover:bg-amber-100 text-xs sm:text-sm font-jua text-amber-800 transition-colors shadow-xs active:scale-95">
          <span id="fruit-icon">🍎</span>
          <span id="fruit-label" class="hidden sm:inline">사과 4개</span>
        </button>

        <!-- Sound Button -->
        <button id="sound-btn" onclick="toggleSound()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 text-xs sm:text-sm font-jua text-slate-700 transition-colors shadow-xs active:scale-95">
          <span id="sound-icon">🔊</span>
          <span id="sound-label" class="hidden sm:inline">효과음</span>
        </button>
      </div>
    </div>

    <!-- Step Navigation Tabs (Total 9 tabs: Cover + 7 Steps + Keyword) -->
    <nav class="grid grid-cols-5 sm:grid-cols-9 gap-1 text-center font-jua text-xs sm:text-sm" aria-label="단계 탐색">
      <button onclick="setPage(1)" id="tab-1" class="py-2 px-0.5 rounded-xl transition-all duration-150">📖 표지</button>
      <button onclick="setPage(2)" id="tab-2" class="py-2 px-0.5 rounded-xl transition-all duration-150">1. 하나씩</button>
      <button onclick="setPage(3)" id="tab-3" class="py-2 px-0.5 rounded-xl transition-all duration-150">2. 두 개 비교</button>
      <button onclick="setPage(4)" id="tab-4" class="py-2 px-0.5 rounded-xl transition-all duration-150">3. 더하기</button>
      <button onclick="setPage(5)" id="tab-5" class="py-2 px-0.5 rounded-xl transition-all duration-150">4. 4씩 규칙</button>
      <button onclick="setPage(6)" id="tab-6" class="py-2 px-0.5 rounded-xl transition-all duration-150 text-sky-700 font-bold">🚗 5. 자동차</button>
      <button onclick="setPage(7)" id="tab-7" class="py-2 px-0.5 rounded-xl transition-all duration-150">6. 주사위</button>
      <button onclick="setPage(8)" id="tab-8" class="py-2 px-0.5 rounded-xl transition-all duration-150 text-rose-600 font-bold">⏱️ 7. 40초</button>
      <button onclick="setPage(9)" id="tab-9" class="py-2 px-0.5 rounded-xl transition-all duration-150 text-amber-600 font-bold">🎁 8. 키워드</button>
    </nav>
  </header>

  <main class="w-full max-w-4xl bg-white rounded-3xl shadow-sm border border-slate-200/90 p-4 sm:p-7 flex-1 flex flex-col items-center justify-between min-h-[580px]">
    <!-- Top Status & Action Bar -->
    <div id="quiz-top-bar" class="w-full flex flex-wrap items-center justify-between gap-3 mb-4 pb-3.5 border-b border-slate-100 min-h-[56px] hidden">
      <div class="flex items-center flex-wrap gap-2.5 font-jua text-base sm:text-lg text-sky-900 bg-sky-50/90 px-4 sm:px-5 py-2 rounded-2xl border-2 border-sky-300 shadow-xs select-none">
        <span class="flex items-center gap-1.5 font-bold">⭐ 연속 성공:</span>
        <span id="top-streak-stars" class="text-amber-500 font-bold tracking-widest text-lg sm:text-2xl">☆☆☆☆☆</span>
        <span id="top-streak-count" class="text-slate-600 text-sm sm:text-base font-bold">(0/5)</span>
        <span class="text-xs sm:text-sm font-bold text-rose-600 bg-rose-50 border border-rose-300 px-2 py-0.5 rounded-xl ml-1">틀리면 0개로 리셋!</span>
      </div>
      <button onclick="triggerRandomizeCurrent()" class="py-2.5 px-4 sm:px-5 bg-sky-600 hover:bg-sky-700 text-white font-jua text-sm sm:text-base rounded-2xl shadow-xs transition-all active:scale-95 flex items-center gap-2 shrink-0 select-none cursor-pointer">
        <span>🎲 새로운 문제</span>
      </button>
    </div>

    <!-- Dynamic Learning Screen Container -->
    <div id="page-content" class="w-full flex flex-col items-center flex-1 justify-start pt-1"></div>

    <!-- Bottom Step Navigation Controls -->
    <div id="bottom-nav" class="w-full pt-4 mt-4 border-t border-slate-100 flex items-center justify-between font-jua text-sm sm:text-base">
      <button id="prev-step-btn" onclick="goPrevPage()" class="flex items-center gap-1.5 px-4 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all disabled:opacity-30 disabled:hover:bg-slate-100 cursor-pointer">
        <span>◀</span> <span>이전 단계</span>
      </button>
      <span id="page-indicator" class="text-slate-400 font-bold">1 / 9 단계</span>
      <button id="next-step-btn" onclick="goNextPage()" class="flex items-center gap-1.5 px-5 py-2.5 rounded-2xl bg-sky-600 hover:bg-sky-700 text-white shadow-xs transition-all active:scale-95 disabled:opacity-30 cursor-pointer">
        <span>다음 단계</span> <span>▶</span>
      </button>
    </div>
  </main>

  <!-- Success / Celebration Modal -->
  <div id="success-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl border-4 border-sky-400 text-center animate-modal relative">
      <div class="text-6xl mb-2 animate-float">🚗👑</div>
      <div class="inline-block bg-sky-100 text-sky-800 text-xs font-bold px-3 py-1 rounded-full mb-2">단계 마스터 배지 & 비밀 글자 획득!</div>
      <h3 class="font-jua text-2xl sm:text-3xl text-sky-700 mb-2">대단해요! 정답 성공! 🎉</h3>
      <p id="modal-desc" class="text-slate-600 text-sm sm:text-base font-medium mb-6 leading-relaxed whitespace-pre-line">4단 곱셈구구를 완벽하게 이해하고 있어요!</p>
      <button onclick="closeModal()" class="w-full py-3.5 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white font-jua text-lg rounded-2xl shadow-md transition-all active:scale-95 cursor-pointer">
        멋져요! 계속 도전하기 🚀
      </button>
    </div>
  </div>

  <!-- Custom Alert / Warning Notice Modal -->
  <div id="notice-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-xl border-2 border-amber-400 text-center animate-modal relative">
      <div class="text-4xl mb-2">💡</div>
      <h4 class="font-jua text-xl text-amber-900 mb-2 font-bold">안내</h4>
      <p id="notice-modal-msg" class="text-slate-600 font-jua text-sm sm:text-base mb-5 whitespace-pre-line"></p>
      <button onclick="closeNoticeModal()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-jua text-base rounded-xl transition-all active:scale-95 cursor-pointer">
        확인
      </button>
    </div>
  </div>

  <script>
    const STUDENT_DB = {
      '김서아': '빛나는작은별님',
      '김수현': '용기있는어린이',
      '김윤아': '마음고운어린이',
      '김태영': '씩씩하게자라요',
      '김하랑': '꿈을향해달려요',
      '나예린': '사랑가득한마음',
      '박민제': '언제나밝은미소',
      '박선우': '힘차게걷는아이',
      '양수빈': '소중하고귀한별',
      '유소영': '친구를돕는마음',
      '이대운': '씩씩하고멋진별',
      '이새봄': '봄처럼따뜻한별',
      '이서율': '반짝이는고운꿈',
      '이진서': '행복을주는미소',
      '이채원': '마음이따뜻한별',
      '이초은': '꿈이자라는아이',
      '이태환': '힘차게나는새싹',
      '이하린': '햇살처럼밝은별',
      '한규빈': '용기넘치는마음',
      '한유은': '웃음가득한아이',
      '현지우': '희망을품은새싹',
      '황지우': '사랑을나누는별',
      '이승찬': '대한민국선생님'
    };

    let currentStudent = '';
    let studentTargetSentence = '';
    let unlockedLetters = {};

    const FRUITS = ['사과', '귤', '딸기'];
    let currentFruitIdx = 0;
    let currentFruit = FRUITS[currentFruitIdx];

    function cycleFruit() {
      currentFruitIdx = (currentFruitIdx + 1) % FRUITS.length;
      currentFruit = FRUITS[currentFruitIdx];
      updateFruitToggleUI();
      playSound('correct');
      if (currentPage === 1) renderCoverPage();
      else if (currentPage === 2) renderPage1();
      else if (currentPage === 3) renderPage2();
    }

    function updateFruitToggleUI() {
      const icon = document.getElementById('fruit-icon');
      const label = document.getElementById('fruit-label');
      const fruitEmoji = currentFruit === '사과' ? '🍎' : (currentFruit === '귤' ? '🍊' : '🍓');
      if (icon) icon.innerText = fruitEmoji;
      if (label) label.innerText = `${currentFruit} 4개`;
    }

    function showNoticeModal(message) {
      const modal = document.getElementById('notice-modal');
      const msgEl = document.getElementById('notice-modal-msg');
      if (modal && msgEl) {
        msgEl.innerText = message;
        modal.classList.remove('hidden');
      }
    }

    function closeNoticeModal() {
      const modal = document.getElementById('notice-modal');
      if (modal) modal.classList.add('hidden');
    }

    function registerStudent(name) {
      const trimmed = name ? name.trim() : '';
      if (!trimmed) {
        showNoticeModal('🔒 이름을 입력하거나 명단에서 선택해 주세요!\n이름을 등록해야 다음 단계로 나아갈 수 있습니다.');
        return false;
      }

      const prevStudent = currentStudent;
      currentStudent = trimmed;
      studentTargetSentence = STUDENT_DB[trimmed] || '빛나는우리친구';

      // 이름 변경 시 이미 획득한 글자도 해당 학생의 키워드로 동기화
      if (prevStudent !== currentStudent) {
        for (const step in unlockedLetters) {
          const charIdx = parseInt(step, 10) - 1;
          unlockedLetters[step] = studentTargetSentence.charAt(charIdx) || '★';
        }
      }

      const badge = document.getElementById('header-student-badge');
      const sName = document.getElementById('header-student-name');
      if (badge && sName) {
        badge.classList.remove('hidden');
        sName.innerText = currentStudent;
      }
      updateHeaderLettersTracker();
      return true;
    }

    function awardKeywordLetter(stepNum) {
      if (!currentStudent) {
        currentStudent = '친구';
        studentTargetSentence = '빛나는우리친구';
      }
      const charIndex = stepNum - 1;
      const letter = studentTargetSentence.charAt(charIndex) || '★';
      unlockedLetters[stepNum] = letter;
      updateHeaderLettersTracker();
      return letter;
    }

    function updateHeaderLettersTracker() {
      const countEl = document.getElementById('header-letters-count');
      const count = Object.keys(unlockedLetters).length;
      if (countEl) countEl.innerText = `(${count}/7)`;
    }

    let audioCtx = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound() {
      isMuted = !isMuted;
      const icon = document.getElementById('sound-icon');
      const label = document.getElementById('sound-label');
      if (isMuted) {
        icon.innerText = '🔇';
        label.innerText = '음소거';
      } else {
        icon.innerText = '🔊';
        label.innerText = '효과음';
        initAudio();
        playSound('correct');
      }
    }

    function playSound(type) {
      if (isMuted) return;
      try {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
          osc.start(now);
          osc.stop(now + 0.36);
        } else if (type === 'wrong') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(160, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'fanfare') {
          const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
          notes.forEach((freq, idx) => {
            const noteOsc = audioCtx.createOscillator();
            const noteGain = audioCtx.createGain();
            noteOsc.connect(noteGain);
            noteGain.connect(audioCtx.destination);
            const startTime = now + idx * 0.09;
            noteOsc.frequency.setValueAtTime(freq, startTime);
            noteGain.gain.setValueAtTime(0.2, startTime);
            noteGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
            noteOsc.start(startTime);
            noteOsc.stop(startTime + 0.3);
          });
        }
      } catch (e) {
        console.warn('Audio not available', e);
      }
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#0284c7', '#38bdf8', '#f59e0b', '#10b981', '#ec4899', '#6366f1'];

      for (let i = 0; i < 90; i++) {
        particles.push({
          x: canvas.width * 0.5,
          y: canvas.height * 0.4,
          r: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.75) * 16,
          alpha: 1,
          decay: Math.random() * 0.015 + 0.01
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        particles.forEach(p => {
          if (p.alpha > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.38;
            p.alpha -= p.decay;
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        });
        if (active) {
          requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      render();
    }

    function createSingleAppleSVG() {
      return `
        <svg class="w-6 h-6 sm:w-7 sm:h-7 inline-block drop-shadow-xs select-none hover:scale-110 transition-transform" viewBox="0 0 100 100" fill="none">

          <path d="M 50 28 C 48 16 49 10 52 5" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
          <path d="M 50 30 C 32 18, 12 30, 16 58 C 20 84, 42 94, 50 94 C 58 94, 80 84, 84 58 C 88 30, 68 18, 50 30 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
          <ellipse cx="32" cy="42" rx="5" ry="12" fill="#f87171" transform="rotate(-25 32 42)"/>
          <circle cx="30" cy="36" r="3.5" fill="#ffffff" opacity="0.6"/>

    function createSingleTangerineSVG() {
      return `
        <svg class="w-6 h-6 sm:w-7 sm:h-7 inline-block drop-shadow-xs select-none hover:scale-110 transition-transform" viewBox="0 0 100 100" fill="none">

          <ellipse cx="50" cy="53" rx="37" ry="33" fill="#fb923c"/>
          <ellipse cx="36" cy="42" rx="7" ry="4" fill="#fdba74" opacity="0.7"/>
          <circle cx="50" cy="22" r="5" fill="#15803d"/>

      `;
    }

    function createSingleStrawberrySVG() {
      return `
        <svg class="w-6 h-6 sm:w-7 sm:h-7 inline-block drop-shadow-xs select-none hover:scale-110 transition-transform" viewBox="0 0 100 100" fill="none">
          <path d="M 50 92 C 78 82 90 55 86 35 C 83 22 70 18 50 22 C 30 18 17 22 14 35 C 10 55 22 82 50 92 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
          <circle cx="36" cy="40" r="2.5" fill="#fef08a"/>
          <circle cx="50" cy="42" r="2.5" fill="#fef08a"/>
          <circle cx="64" cy="40" r="2.5" fill="#fef08a"/>
          <circle cx="28" cy="56" r="2.5" fill="#fef08a"/>
          <circle cx="43" cy="60" r="2.5" fill="#fef08a"/>
          <circle cx="57" cy="60" r="2.5" fill="#fef08a"/>
          <circle cx="72" cy="56" r="2.5" fill="#fef08a"/>
          <circle cx="50" cy="76" r="2.5" fill="#fef08a"/>
          <path d="M 50 22 C 48 10 44 6 42 3 C 48 5 52 5 58 3 C 56 7 52 11 50 22 Z" fill="#15803d"/>
          <path d="M 50 22 C 38 18 22 14 18 24 C 28 24 38 23 50 22 Z" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
          <path d="M 50 22 C 62 18 78 14 82 24 C 72 24 62 23 50 22 Z" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
        </svg>
      `;
    }

    function createSingleCurrentFruitSVG() {
      if (currentFruit === '귤') return createSingleTangerineSVG();
      if (currentFruit === '딸기') return createSingleStrawberrySVG();
      return createSingleAppleSVG();
    }

    function createFruitPack4SVG() {
      const bgBorder = currentFruit === '귤' 
        ? 'bg-amber-50 border-amber-200' 
        : (currentFruit === '딸기' ? 'bg-[#e0f2fe] border-[#bae6fd]' : 'bg-rose-50 border-rose-200');

      return `
        <div class="w-full max-w-[170px] sm:max-w-[190px] py-1.5 px-2 ${bgBorder} rounded-2xl shadow-xs border-2 flex flex-col gap-1 items-center transition-all">
          <div class="flex items-center justify-around w-full">
            ${Array(2).fill(0).map(() => createSingleCurrentFruitSVG()).join('')}

        }
        document.getElementById('modal-desc').innerText = `기록: ${recordedTime}초! 40초 내 10문제 올 클리어!\n[7번째 마지막 비밀 글자: '${letter7}'] 획득!\n이제 마지막 '8. 키워드' 단계에서 7글자 최종 보물을 열어보세요!`;
        document.getElementById('success-modal').classList.remove('hidden');
      } else {
        playSound('wrong');
        if (feedback) {
          feedback.className = 'font-jua text-base sm:text-lg text-center text-rose-500';
          if (p8ElapsedTime > 40.0 && correctCount === 10) {
            feedback.innerText = `⏱️ ${recordedTime}초로 아쉽게 40초를 넘겼어요! (10문제 정답) 조금만 더 빠르게 다시 도전해 보세요!`;
          } else if (p8ElapsedTime <= 40.0) {
            feedback.innerText = `❌ ${recordedTime}초에 풀었지만 ${10 - correctCount}문제가 틀렸어요! 빨간색 문제를 확인하고 다시 도전해 보세요!`;
          } else {
            feedback.innerText = `❌ 기록: ${recordedTime}초, 정답: ${correctCount}/10개. 다시 연습하면 분명 40초 안에 통과할 수 있어요!`;
          }
        }
      }
    }

    function renderPage10() {
      const container = document.getElementById('page-content');
      if (!container) return;
      
      const missingSteps = [1, 2, 3, 4, 5, 6, 7].filter(i => !unlockedLetters[i]);
      const collectedCount = 7 - missingSteps.length;
      const isAllCollected = collectedCount === 7;

      const lettersClues = [1, 2, 3, 4, 5, 6, 7].map(i => {
        const char = unlockedLetters[i];
        const isFound = !!char;
        return `
          <div class="flex flex-col items-center">
            <span class="text-[11px] font-jua ${isFound ? 'text-emerald-700 font-bold' : 'text-rose-600 font-bold'} mb-1">${i}단계</span>
            <div class="w-11 h-13 sm:w-12 sm:h-14 rounded-2xl ${isFound ? 'bg-gradient-to-b from-amber-100 to-amber-200 border-2 border-amber-400 text-amber-950 shadow-sm scale-105' : 'bg-slate-100 border-2 border-dashed border-slate-300 text-slate-400'} font-jua text-xl sm:text-2xl flex items-center justify-center font-black transition-all">
              ${isFound ? char : '🔒'}
            </div>
            ${!isFound ? `<button onclick="setPage(${i + 1})" class="mt-1 px-2 py-0.5 bg-rose-50 hover:bg-rose-100 border border-rose-300 text-rose-700 rounded-lg text-[10px] font-jua transition-all">도전하기</button>` : '<span class="text-[10px] text-emerald-600 font-jua mt-1 font-bold">획득 완료</span>'}
          </div>
        `;
      }).join('');

      // If not all 7 letters collected, show LOCKED vault UI
      if (!isAllCollected) {
        container.innerHTML = `
          <div class="w-full flex flex-col items-center justify-center py-4 px-2 text-center max-w-xl">
            <div class="inline-flex items-center gap-2 px-5 py-2 bg-rose-100 text-rose-900 rounded-full font-jua text-sm sm:text-base mb-3 border border-rose-300 shadow-2xs">
              <span>🔒</span> <span>보물 상자가 굳게 잠겨 있습니다</span>
            </div>

            <h2 class="font-jua text-3xl sm:text-4xl text-slate-900 mb-2 drop-shadow-xs">
              ${currentStudent ? `👑 ${currentStudent} 학생의 잠긴 보물 상자` : '👑 잠긴 보물 상자'}
            </h2>

            <p class="font-jua text-rose-600 text-base sm:text-lg mb-4 font-bold leading-relaxed">
              비밀 글자를 모두 모으지 않으면 추측해서 암호를 풀 수 없어요!<br>
              <span class="text-slate-600 font-medium text-sm sm:text-base">1단계부터 7단계까지 각 미션을 통과해 7개의 글자를 모두 모아오세요.</span>
            </p>

            <div class="w-full bg-white rounded-3xl p-5 border-2 border-slate-200 shadow-sm mb-5 flex flex-col items-center">
              <div class="w-full flex items-center justify-between mb-3 px-1">
                <span class="text-xs sm:text-sm font-jua text-slate-700 font-bold">
                  비밀 글자 수집 현황
                </span>
                <span class="font-jua text-sm sm:text-base px-3 py-1 bg-amber-50 border border-amber-300 rounded-full text-amber-800 font-bold">
                  ${collectedCount} / 7개 완료
                </span>
              </div>
              
              <div class="flex items-center justify-center gap-2 sm:gap-3 flex-wrap mb-2">
                ${lettersClues}
              </div>
            </div>

            <div class="w-full bg-rose-50/70 rounded-2xl p-4 border-2 border-dashed border-rose-300 flex flex-col items-center gap-2 mb-4">
              <div class="text-3xl">⛔</div>
              <p class="font-jua text-rose-700 text-base font-bold">
                아직 [${missingSteps.map(s => s + '단계').join(', ')}]의 글자가 없어서 입력창이 열리지 않아요!
              </p>
              <p class="font-jua text-xs sm:text-sm text-slate-600">
                위의 빨간색 <strong>[도전하기]</strong> 버튼을 눌러 부족한 단계를 먼저 클리어하세요.
              </p>
            </div>
          </div>
        `;
        return;
      }

      // All 7 letters collected - Unlocked Input Form
      container.innerHTML = `
        <div class="w-full flex flex-col items-center justify-center py-4 px-2 text-center max-w-xl">
          <div class="inline-flex items-center gap-2 px-5 py-2 bg-emerald-100 text-emerald-900 rounded-full font-jua text-sm sm:text-base mb-3 border border-emerald-300 shadow-2xs">
            <span>🔓</span> <span>모든 비밀 글자 수집 완료! 봉인 해제</span>
          </div>

          <h2 class="font-jua text-3xl sm:text-4xl text-slate-900 mb-2 drop-shadow-xs">
            👑 ${currentStudent} 학생의 보물 상자
          </h2>

          <p class="font-jua text-slate-600 text-base sm:text-lg mb-5 leading-relaxed">
            축하합니다! 7단계 미션을 모두 돌파하여 <strong>7개의 비밀 글자</strong>를 모두 모았습니다.<br>
            모은 글자를 알맞은 순서대로 입력하여 최종 보물을 열어보세요!
          </p>

          <div class="w-full bg-white rounded-3xl p-5 border-2 border-emerald-400 shadow-sm mb-5 flex flex-col items-center">
            <span class="text-xs sm:text-sm font-jua text-emerald-800 font-bold mb-3">
              수집 완료된 7글자 보물 열쇠 (7/7)
            </span>
            <div class="flex items-center justify-center gap-2 sm:gap-3 flex-wrap mb-1">
              ${lettersClues}
            </div>
          </div>

          <div class="w-full bg-slate-50 rounded-2xl p-5 border border-slate-200 flex flex-col items-center gap-3 mb-5 shadow-xs">
            <label for="p10-final-input" class="font-jua text-base sm:text-lg text-slate-800 font-bold">
              🗝️ 7글자 비밀 키워드를 입력하세요:
            </label>
            <input 
              type="text" 
              id="p10-final-input" 
              maxlength="7" 
              placeholder="모은 7글자 입력" 
              autocomplete="off"
              class="w-full max-w-sm h-14 text-center font-jua text-2xl text-amber-900 bg-white border-2 border-amber-400 rounded-2xl focus:outline-none focus:ring-4 focus:ring-amber-200 shadow-inner transition-all tracking-widest font-black placeholder:text-slate-300 placeholder:font-normal placeholder:text-lg"
            />
          </div>

          <button onclick="checkP10Answer()" class="py-3.5 px-12 bg-gradient-to-r from-amber-500 to-rose-500 hover:from-amber-600 hover:to-rose-600 text-white font-jua text-xl rounded-2xl shadow-md hover:shadow-lg transition-all active:scale-95 flex items-center gap-2 cursor-pointer">
            <span>🏆 최종 보물 열기!</span>
          </button>

          <div id="p10-feedback" class="mt-4 font-jua text-base sm:text-lg text-center min-h-[30px]"></div>
        </div>
      `;

      const inp = document.getElementById('p10-final-input');
      if (inp) {
        inp.addEventListener('keydown', e => {
          if (e.key === 'Enter') checkP10Answer();
        });
        inp.focus();
      }
    }

    function checkP10Answer() {
      const missingSteps = [1, 2, 3, 4, 5, 6, 7].filter(i => !unlockedLetters[i]);
      if (missingSteps.length > 0) {
        showNoticeModal(`🔒 아직 비밀 글자를 다 모으지 못했어요!\n현재 ${7 - missingSteps.length}/7개 수집됨.\n${missingSteps.map(s => s + '단계').join(', ')}를 먼저 성공해야 합니다.`);
        return;
      }

      const inp = document.getElementById('p10-final-input');
      const feedback = document.getElementById('p10-feedback');
      if (!inp) return;

      const userVal = inp.value.trim().replace(/\s+/g, '');
      const targetVal = studentTargetSentence.replace(/\s+/g, '');

      if (!userVal) {
        if (feedback) {
          feedback.className = 'mt-4 font-jua text-base text-amber-600';
          feedback.innerText = '⚠️ 비밀 키워드를 입력해 주세요!';
        }
        inp.focus();
        return;
      }

      if (userVal === targetVal) {
        playSound('fanfare');
        triggerConfetti();
        if (feedback) {
          feedback.className = 'mt-4 font-jua text-xl text-emerald-600 font-bold';
          feedback.innerText = `🎉 대성공! 완벽한 정답입니다! "${studentTargetSentence}"`;
        }
        document.getElementById('modal-desc').innerText = `축하합니다! ${currentStudent} 학생은 4단 곱셈구구와 40초 챌린지를 모두 마스터하여 최종 보물 키워드 ["${studentTargetSentence}"]를 멋지게 완성했습니다! 🎓✨`;
        document.getElementById('success-modal').classList.remove('hidden');
      } else {
        playSound('wrong');
        if (feedback) {
          feedback.className = 'mt-4 font-jua text-base text-rose-500';
          feedback.innerText = `❌ 아직 일치하지 않아요! 1~7단계에서 모은 7글자를 순서대로 차근차근 이어 써보세요!`;
        }
      }
    }

    function getStreak() {
      if (currentPage === 2) return p1Streak;
      if (currentPage === 3) return p2Streak;
      if (currentPage === 4) return p3Streak;
      if (currentPage === 5) return p4Streak;
      if (currentPage === 6) return p5Streak;
      if (currentPage === 7) return p6Streak;
      return 0;
    }

    function updateStreakUI() {
      const s = getStreak();
      const starsEl = document.getElementById('top-streak-stars');
      const countEl = document.getElementById('top-streak-count');
      if (starsEl) starsEl.innerText = '★'.repeat(s) + '☆'.repeat(5 - s);
      if (countEl) countEl.innerText = `(${s}/5)`;
    }

    function triggerRandomizeCurrent() {
      if (currentPage === 2) randomizeP1();
      else if (currentPage === 3) randomizeP2();
      else if (currentPage === 4) randomizeP3();
      else if (currentPage === 5) randomizeP4();
      else if (currentPage === 6) randomizeP5();
      else if (currentPage === 7) randomizeP6();
      else if (currentPage === 8) resetP8Challenge();
      else if (currentPage === 9) renderPage10();
    }

    function setPage(num, forceRandom = true) {
      // Guard: 이름이 없으면 1단계 이상으로 갈 수 없음
      if (num > 1 && !currentStudent) {
        showNoticeModal('🔒 이름을 먼저 등록해야 다음 단계로 나아갈 수 있어요!\n표지에서 이름을 입력하거나 명단에서 선택해 주세요.');
        if (currentPage !== 1) {
          setPage(1, false);
        } else {
          const inp = document.getElementById('cover-student-input');
          if (inp) inp.focus();
        }
        return;
      }

      if (currentPage === 8 && p8TimerId) {
        clearInterval(p8TimerId);
        p8TimerId = null;
      }

      currentPage = num;

      for (let i = 1; i <= 9; i++) {
        const tab = document.getElementById(`tab-${i}`);
        if (tab) {
          if (i === num) {
            tab.className = "py-2 px-0.5 rounded-xl bg-sky-600 text-white shadow-xs font-bold border-2 border-sky-700";
          } else {
            tab.className = "py-2 px-0.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium border-2 border-transparent cursor-pointer";
          }
        }
      }

      const pageIndicator = document.getElementById('page-indicator');
      if (pageIndicator) {
        pageIndicator.innerText = `${num} / 9 단계`;
      }

      const prevBtn = document.getElementById('prev-step-btn');
      const nextBtn = document.getElementById('next-step-btn');
      if (prevBtn) prevBtn.disabled = (num === 1);
      if (nextBtn) nextBtn.disabled = (num === 9);

      const topBar = document.getElementById('quiz-top-bar');

      if (num === 1 || num === 8 || num === 9) {
        if (topBar) topBar.classList.add('hidden');
        if (num === 1) renderCoverPage();
        else if (num === 8) {
          p8IsStarted = false;
          renderPage8();
        } else if (num === 9) {
          renderPage10();
        }
        return;
      }

      if (topBar) {
        topBar.classList.remove('hidden');
        updateStreakUI();
      }

      if (forceRandom) {
        if (num === 2) randomizeP1();
        else if (num === 3) randomizeP2();
        else if (num === 4) randomizeP3();
        else if (num === 5) randomizeP4();
        else if (num === 6) randomizeP5();
        else if (num === 7) randomizeP6();
      } else {
        if (num === 2) renderPage1();
        else if (num === 3) renderPage2();
        else if (num === 4) renderPage3();
        else if (num === 5) renderPage4();
        else if (num === 6) renderPage5();
        else if (num === 7) renderPage6();
      }
    }

    function goPrevPage() {
      if (currentPage > 1) {
        setPage(currentPage - 1, false);
      }
    }

    function goNextPage() {
      if (currentPage === 1 && !currentStudent) {
        const inp = document.getElementById('cover-student-input');
        const name = inp ? inp.value.trim() : '';
        if (!name) {
          showNoticeModal('🔒 이름을 먼저 등록해야 다음 단계로 나아갈 수 있어요!\n표지에서 이름을 입력하거나 명단에서 선택해 주세요.');
          if (inp) inp.focus();
          return;
        }
        registerStudent(name);
      }
      if (currentPage < 9) {
        setPage(currentPage + 1, false);
      }
    }

    function closeModal() {
      document.getElementById('success-modal').classList.add('hidden');
      if (currentPage === 2) randomizeP1();
      else if (currentPage === 3) randomizeP2();
      else if (currentPage === 4) randomizeP3();
      else if (currentPage === 5) randomizeP4();
      else if (currentPage === 6) randomizeP5();
      else if (currentPage === 7) randomizeP6();
      else if (currentPage === 8) resetP8Challenge();
      else if (currentPage === 9) renderPage10();
    }

    window.onload = function() {
      updateFruitToggleUI();
      setPage(1, true);
    };
  </script>
</body>
</html>
