<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1시간을 알아볼까요</title><style>body{font-family:'Malgun Gothic',sans-serif;background:#f1f5f9;color:#172033;margin:0}header{position:sticky;top:0;background:white;padding:12px;display:flex;gap:7px;flex-wrap:wrap;box-shadow:0 2px 8px #ddd;z-index:2}button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:bold;background:#e2e8f0}button.active{background:#2563eb;color:white}button.done{background:#bbf7d0;color:#166534}main{max-width:850px;margin:25px auto;background:white;padding:28px;border-radius:20px;min-height:430px;box-shadow:0 4px 20px #dbe2ec}h1{color:#1d4ed8}h2{font-size:23px;line-height:1.6}.clock{width:190px;max-width:42vw}.clocks{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin:25px 0}.arrow{font-size:36px;color:#64748b}input{width:75px;padding:10px;font-size:22px;text-align:center;border:2px solid #94a3b8;border-radius:8px;margin:5px}input.bad{border-color:#ef4444;background:#fee2e2}.question{font-size:21px;line-height:2.4}.actions{margin-top:30px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.primary{background:#2563eb;color:white}.feedback{font-weight:bold;color:#dc2626}.timeline{display:flex;flex-wrap:wrap;gap:0;margin:30px 0}.tick{flex:1;min-width:34px;border:1px solid #94a3b8;text-align:center;padding:12px 0;font-size:12px}.time-strip{margin:28px auto;max-width:730px;touch-action:pan-y;user-select:none}.time-labels{position:relative;height:26px;margin-bottom:4px;font-size:clamp(9px,1.65vw,14px);white-space:nowrap}.time-labels span{position:absolute;bottom:0;transform:translateX(-50%);text-align:center}.time-labels span:first-child{transform:translateX(-50%)}.time-labels span:last-child{transform:translateX(-50%)}.time-cells{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));border:1px solid #64748b;touch-action:none}.time-cell{height:43px;border-right:1px dashed #94a3b8;background:#fff;touch-action:none}.time-cell:last-child{border-right:0}.time-cell.painted{background:#93c5fd}.time-hint{font-size:15px;color:#475569;text-align:center}.hidden{display:none}@media(max-width:500px){main{margin:10px;padding:16px}.clock{width:145px}.question{font-size:18px}}.exercise{padding:28px 0;border-top:2px solid #e2e8f0;scroll-margin-top:95px}.exercise h2{margin-top:0}main{min-height:0}header{justify-content:center}@media(max-width:500px){.exercise{padding:20px 0}}#autoNav{background:#7c3aed;color:white}#autoSection{scroll-margin-top:90px}.unlock-toast{position:fixed;inset:0;background:#0f172a66;display:flex;align-items:center;justify-content:center;z-index:99;pointer-events:none}.unlock-toast>div{background:white;border-radius:22px;padding:32px 28px;text-align:center;box-shadow:0 12px 35px #0003;font-size:22px;font-weight:700;max-width:85vw}.unlock-toast[hidden]{display:none}#autoSection[hidden],#autoNav[hidden]{display:none}#autoSection iframe{width:100%;height:650px;border:0;border-radius:16px;background:#f8fafc}</style></head><body><header id="nav"></header><main id="main"></main><div id="unlockToast" class="unlock-toast" hidden><div>🎉 축하합니다!<p>모든 문제를 맞혔습니다.<br>자동평가 페이지가 열렸습니다!</p></div></div><script>
let page=0;const completed=JSON.parse(localStorage.getItem('hourLessonDone')||'{}');const answers={};const painted=new Set();localStorage.removeItem("hourLessonPaint");let painting=false,paintMode=true;
function clock(h,m){let minute=m*6,hour=(h%12)*30+m*.5;return `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="${h}시 ${m}분 시계"><circle cx="100" cy="100" r="94" fill="#facc15" stroke="#9a6700" stroke-width="2"/><circle cx="100" cy="100" r="83" fill="white" stroke="#64748b" stroke-width="2"/>${Array.from({length:60},(_,i)=>{let a=i*6*Math.PI/180;return `<line x1="${100+Math.sin(a)* (i%5===0?75:79)}" y1="${100-Math.cos(a)*(i%5===0?75:79)}" x2="${100+Math.sin(a)*82}" y2="${100-Math.cos(a)*82}" stroke="#475569" stroke-width="${i%5===0?2:1}"/>`}).join('')}${Array.from({length:12},(_,i)=>{let n=i+1,a=n*30*Math.PI/180;return `<text x="${100+Math.sin(a)*65}" y="${105-Math.cos(a)*65}" text-anchor="middle" font-size="17" font-weight="bold">${n}</text>`}).join('')}<line x1="100" y1="100" x2="${100+Math.sin(hour*Math.PI/180)*42}" y2="${100-Math.cos(hour*Math.PI/180)*42}" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/><line x1="100" y1="100" x2="${100+Math.sin(minute*Math.PI/180)*68}" y2="${100-Math.cos(minute*Math.PI/180)*68}" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="5" fill="#eab308"/></svg>`}
function field(id){return `<input inputmode="numeric" aria-label="답 ${id}" id="${id}" value="${answers[id]||''}" oninput="answers[this.id]=this.value;this.classList.remove('bad')">`}
const tasks={1:[['a','60'],['b','60']],2:[['c','30']],3:[['d','60'],['e','1']],4:[['f','1']],5:[['g','10']],6:[['h','2']]};
function render(){document.getElementById('nav').innerHTML=['표지',...Array.from({length:6},(_,i)=>`${i+1}페이지${completed[i+1]?' ✓':''}`)].map((t,i)=>`<button class="${page===i?'active':''} ${completed[i]?'done':''}" onclick="go(${i})">${t}</button>`).join('');let content='';switch(page){case 0:content=`<h1>1시간을 알아볼까요</h1><h2>수학 4. 시각과 시간 · 5차시</h2><p>1페이지부터 6페이지까지 문제를 풀어 보세요.</p><p>답을 입력하고 채점하기를 누르면 틀린 답만 표시됩니다.</p>`;break;case 1:content=`<h2>1. □ 안에 알맞은 수를 써넣으세요.</h2><div class="question">시계의 긴바늘이 한 바퀴 도는 데 걸리는 시간은 ${field('a')}분입니다.<p>${field('b')}분은 1시간입니다.</p></div>`;break;case 2:content=`<h2>2. 두 시계를 보고 시간이 얼마나 지났는지 구해 보세요.</h2><div class="clocks">${clock(7,0)}<span class="arrow">➜</span>${clock(7,30)}</div><div class="question" style="text-align:center">${field('c')}분</div>`;break;case 3:content=`<h2>3. 두 시계를 보고 시간이 얼마나 지났는지 시간 띠에 나타내고, 구해 보세요.</h2><div class="clocks">${clock(3,10)}<span class="arrow">➜</span>${clock(4,10)}</div><div class="time-strip" id="timeStrip"><div class="time-labels">${Array.from({length:13},(_,i)=>`<span style="left:${i/12*100}%">${i===0?'3시':i===6?'4시':i===12?'5시':`${(i%6)*10}분`}</span>`).join('')}</div><div class="time-cells" id="timeCells">${Array.from({length:12},(_,i)=>`<div class="time-cell ${painted.has(i)?'painted':''}" data-index="${i}"></div>`).join('')}</div><p class="time-hint">손가락이나 마우스로 누른 채 미끄러져 색칠하세요.</p></div><div class="question" style="text-align:center">${field('d')}분 = ${field('e')}시간</div>`;break;case 4:content=`<h2>4. 유준이가 하루에 축구를 하는 시간을 구해 보세요.</h2><div class="question" style="background:#eff6ff;padding:24px;border-radius:15px">⚽ 유준: 나는 하루에 60분씩 친구들과 축구를 해.</div><div class="question">${field('f')}시간</div>`;break;case 5:content=`<h2>5. 준희는 친구들과 함께 1시간 동안 자전거를 타기로 했습니다. 시계를 보고 몇 분 더 타야 하는지 구해 보세요.</h2><div class="clocks"><div style="text-align:center"><b>시작한 시각</b><br>${clock(11,0)}</div><div style="text-align:center"><b>현재 시각</b><br>${clock(11,50)}</div></div><div class="question" style="text-align:center">${field('g')}분</div>`;break;case 6:content=`<h2>6. 미주가 할머니 댁에 가는 데 집에서 1시 30분에 출발하여 3시 30분에 도착하였습니다. 미주가 할머니 댁에 가는 데 걸린 시간을 구해 보세요.</h2><div class="question">${field('h')}시간</div>`;break;}
document.getElementById('main').innerHTML=content+`<div class="actions">${page?'<button class="primary" onclick="grade()">채점하기</button>':''}<button onclick="go(${Math.max(0,page-1)})">이전</button>${page<6?`<button onclick="go(${page+1})">다음</button>`:''}<span id="feedback" class="feedback">${completed[page]?'✓ 완료':''}</span></div>`}
function go(n){const target=document.getElementById('section'+n);if(target)target.scrollIntoView({behavior:'smooth',block:'start'});}function grade(n){let wrong=0;for(let [id,correct] of tasks[n]){let el=document.getElementById(id);if((answers[id]||'').trim()!==correct){wrong++;el.classList.add('bad')}}if(n===3){const good=painted.size===6&&[1,2,3,4,5,6].every(i=>painted.has(i));if(!good){wrong++;document.getElementById("timeCells").style.outline="3px solid #ef4444";}else document.getElementById("timeCells").style.outline="none";}let feedback=document.getElementById('feedback'+n);if(!wrong){completed[n]=true;localStorage.setItem('hourLessonDone',JSON.stringify(completed));feedback.textContent='✓ 모두 맞혔습니다!';document.getElementById('nav'+n).classList.add('done');document.getElementById('nav'+n).textContent=n+'번 ✓';checkUnlock(true);}else feedback.textContent=wrong+'개를 다시 확인해 보세요.';}
function renderAll(){const parts=[];for(let n=1;n<=6;n++){page=n;render();let main=document.getElementById('main');let content=main.innerHTML;content=content.replace(/<div class="actions">[\s\S]*$/, '');parts.push(`<section id="section${n}" class="exercise">${content}<div class="actions"><button class="primary" onclick="grade(${n})">${n}번 채점하기</button><span id="feedback${n}" class="feedback">${completed[n]?'✓ 완료':''}</span></div></section>`);}document.getElementById('main').innerHTML=`<h1>1시간을 알아볼까요</h1><p>수학 4. 시각과 시간 · 5차시</p><p>모든 문제를 아래로 스크롤하며 풀어 보세요. 정답은 표시하지 않습니다.</p>${parts.join('')}<section id="autoSection" class="exercise" hidden><h2>자동평가</h2><div id="auto-evaluation-act-1793142745779" style="margin:24px auto;max-width:1050px"><iframe title="과제 참여 여부 확인하기" data-src="https://eyeholder83-commits.github.io/sh0201/%ED%95%99%EA%B8%89%ED%86%B5%ED%95%A9%EA%B4%80%EB%A6%AC.html?autoActivity=act-1793142745779" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div></section>`;document.getElementById('nav').innerHTML=Array.from({length:6},(_,i)=>`<button id="nav${i+1}" class="${completed[i+1]?'done':''}" onclick="go(${i+1})">${i+1}번${completed[i+1]?' ✓':''}</button>`).join('')+'<button id="autoNav" hidden onclick="showAutoEvaluation()">자동평가</button>';checkUnlock(false);}renderAll();
function allDone(){return Array.from({length:6},(_,i)=>i+1).every(i=>completed[i]===true)}
function checkUnlock(notify){if(!allDone())return;document.getElementById('autoNav').hidden=false;document.getElementById('autoSection').hidden=false;if(notify&&!sessionStorage.getItem('hourLessonUnlockToastShown')){sessionStorage.setItem('hourLessonUnlockToastShown','1');const toast=document.getElementById('unlockToast');toast.hidden=false;setTimeout(()=>toast.hidden=true,3000)}}
function showAutoEvaluation(){if(!allDone())return;const area=document.getElementById('auto-evaluation-act-1793142745779');const frame=area.querySelector('iframe');if(!frame.src)frame.src=frame.dataset.src;document.getElementById('autoSection').hidden=false;document.getElementById('autoSection').scrollIntoView({behavior:'smooth',block:'start'})}
const strip=document.getElementById("timeCells");function markAt(e){const el=document.elementFromPoint(e.clientX,e.clientY);const cell=el&&el.closest(".time-cell");if(!cell||!strip.contains(cell))return;const i=Number(cell.dataset.index);if(paintMode)painted.add(i);else painted.delete(i);cell.classList.toggle("painted",paintMode);localStorage.setItem("hourLessonPaint",JSON.stringify([...painted]));strip.style.outline="none";}strip.addEventListener("pointerdown",e=>{painting=true;const cell=e.target.closest(".time-cell");if(!cell)return;paintMode=!painted.has(Number(cell.dataset.index));markAt(e);strip.setPointerCapture(e.pointerId);});strip.addEventListener("pointermove",e=>{if(painting)markAt(e)});strip.addEventListener("pointerup",()=>painting=false);strip.addEventListener("pointercancel",()=>painting=false);
</script></body></html>
