<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>10분씩 움직이는 큰 시계</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:"Malgun Gothic",sans-serif;background:white;gap:25px}
svg{width:min(88vw,650px);height:auto;touch-action:none}
.controls{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
button{border:0;border-radius:14px;background:#0c948b;color:white;font-size:clamp(20px,3vw,30px);font-weight:bold;padding:20px 30px;cursor:pointer}
button:hover{background:#08786f}
</style></head><body>
<svg viewBox="0 0 500 500" aria-label="큰 아날로그 시계">
<circle cx="250" cy="250" r="235" fill="#ffb12f"/>
<circle cx="250" cy="250" r="214" fill="white"/>
<g id="ticks"></g><g id="numbers"></g>
<line id="hour" x1="250" y1="250" x2="250" y2="142" stroke="#ed6278" stroke-width="14" stroke-linecap="round"/>
<line id="minute" x1="250" y1="250" x2="250" y2="90" stroke="#0eac77" stroke-width="10" stroke-linecap="round"/>
<circle cx="250" cy="250" r="12" fill="#334155"/>
</svg>
<div class="controls"><button id="prev">◀ 10분 전</button><button id="next">10분 후 ▶</button></div>
<script>
const NS="http://www.w3.org/2000/svg",ticks=document.getElementById("ticks"),nums=document.getElementById("numbers");
function el(tag,attrs,parent,text){let e=document.createElementNS(NS,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);if(text)e.textContent=text;parent.appendChild(e)}
for(let i=0;i<60;i++){let a=i*Math.PI/30,r1=i%5===0?193:202,r2=207;
el("line",{x1:250+Math.sin(a)*r1,y1:250-Math.cos(a)*r1,x2:250+Math.sin(a)*r2,y2:250-Math.cos(a)*r2,stroke:"#6684a1","stroke-width":i%5===0?3:1.6},ticks)}
for(let i=1;i<=12;i++){let a=i*Math.PI/6;el("text",{x:250+Math.sin(a)*163,y:250-Math.cos(a)*163+7,"text-anchor":"middle","font-size":30,"font-weight":"bold",fill:"#1b304b"},nums,String(i))}
let minutes=6*60+30;
function draw(){document.getElementById("minute").setAttribute("transform",`rotate(${minutes%60*6} 250 250)`);document.getElementById("hour").setAttribute("transform",`rotate(${minutes/2} 250 250)`)}
document.getElementById("prev").onclick=()=>{minutes=(minutes-10+1440)%1440;draw()};
document.getElementById("next").onclick=()=>{minutes=(minutes+10)%1440;draw()};
draw();
</script></body></html>
