<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신흥초등학교 누리집 탐색 퀴즈</title>
<style>:root{font-family:'Malgun Gothic',system-ui,sans-serif;color:#17233b;background:#f2f6fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:950px;margin:auto;padding:25px 16px 70px}header{background:linear-gradient(125deg,#2155b5,#518be8);color:white;padding:32px;border-radius:22px;margin-bottom:22px}h1{margin:0 0 12px;font-size:clamp(26px,4vw,39px)}header p{margin:0;line-height:1.8}.question{background:white;padding:25px;border:1px solid #e0e7f1;border-radius:20px;margin:17px 0;box-shadow:0 5px 16px #173c7610}.place{display:inline-block;color:#1e58a9;background:#eaf2ff;border-radius:10px;padding:9px 13px;font-weight:800;margin-bottom:16px}.qtitle{font-size:21px;font-weight:800;line-height:1.55;margin-bottom:17px}.choices{display:grid;gap:10px}.choice{display:flex;gap:10px;align-items:flex-start;padding:13px;border:2px solid #e3e9f2;border-radius:12px;cursor:pointer;line-height:1.6}.choice:has(input:checked){border-color:#3979db;background:#f0f6ff}.choice input{margin-top:5px;accent-color:#296dd3;transform:scale(1.3)}.short{display:block;width:100%;max-width:430px;padding:15px;border:2px solid #d8e1ee;border-radius:12px;font-size:19px}.wrong{border-color:#ed8080;background:#fffafa}.feedback{font-weight:800;margin-top:12px;min-height:22px}.feedback.bad{color:#c03939}.feedback.good{color:#19734e}.actions{position:sticky;bottom:0;background:#f2f6fcf5;padding:15px 0;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:15px 22px;font-size:18px;font-weight:800;cursor:pointer;background:#245dc1;color:white}button.secondary{background:#dce6f5;color:#234a82}#summary{background:#fff;border-radius:16px;padding:18px;margin-top:15px;font-size:19px;font-weight:800}#success{display:none;text-align:center;background:#fff;border-radius:22px;padding:65px 20px;margin-top:25px}#success h2{font-size:36px;color:#1c65ba}a{color:#1e58a9}@media(max-width:600px){.question{padding:18px}.qtitle{font-size:19px}header{padding:24px}}#teacherOpen{position:fixed;right:14px;top:12px;z-index:20;background:#fff;color:#24518d;border:1px solid #b9cce8;font-size:13px;padding:9px 12px;box-shadow:0 3px 12px #10264c22}#teacherPanel{display:none;position:fixed;inset:0;z-index:30;background:#0a193c99;align-items:center;justify-content:center;padding:16px}#teacherPanel.visible{display:flex}.teacherBox{width:min(100%,390px);background:white;padding:24px;border-radius:18px;box-shadow:0 14px 50px #0003}.teacherBox h2{margin-top:0}.teacherBox input{font-size:19px;padding:12px;width:100%;border:2px solid #c8d5e7;border-radius:10px;margin:10px 0}.teacherBox button{font-size:15px;padding:11px 14px}.teacherActions{display:flex;gap:9px;flex-wrap:wrap}.teacherNote{font-size:13px;color:#53637a;line-height:1.6}#teacherStatus{font-size:13px;font-weight:700;color:#176348;margin:8px 0 0}body.teacher-mode header{padding-right:80px}@media(max-width:600px){#teacherOpen{right:8px;top:8px;padding:7px 9px;font-size:12px}} .short-group{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;gap:10px}.short-group label{font-weight:800;color:#344d70}.short-group .short{max-width:none;min-width:0;text-align:center;padding:12px 5px;font-size:clamp(14px,2.5vw,19px)}.short-cell{min-width:0;display:grid;gap:8px;text-align:center}</style></head>
<body><button id="teacherOpen" type="button" aria-label="교사 로그인">교사 로그인</button><div id="teacherPanel" role="dialog" aria-modal="true" aria-labelledby="teacherHeading"><div class="teacherBox"><h2 id="teacherHeading">교사 로그인</h2><div id="loginView"><label for="teacherPassword">비밀번호</label><input id="teacherPassword" type="password" autocomplete="off" inputmode="numeric" maxlength="12" placeholder="비밀번호 입력"><p id="loginError" style="color:#bd3030;min-height:20px" role="alert"></p><div class="teacherActions"><button id="teacherLogin" type="button">로그인</button><button id="teacherCancel" class="secondary" type="button">닫기</button></div><p class="teacherNote">간편 교사용 기능입니다. 서버 인증 방식이 아니므로 완전한 보안 기능은 아닙니다.</p></div><div id="teacherView" hidden><p>교사 모드입니다. 정답이 미리 입력되어 있으며, 답을 자유롭게 수정할 수 있습니다.</p><div class="teacherActions"><button id="teacherFill" type="button">정답 다시 채우기</button><button id="teacherLogout" class="secondary" type="button">로그아웃</button><button id="teacherClose" class="secondary" type="button">닫기</button></div></div></div></div><div class="wrap"><header><h1>🔎 신흥초등학교 누리집 탐색 퀴즈</h1><p>각 문제 위에 적힌 위치를 찾아가 누리집을 살펴보세요.<br>1~7번은 객관식, 8~10번은 하나로 묶인 주관식이며, 세 칸에 서로 다른 답을 쓰세요. 틀린 문제는 다시 찾아 도전해 보세요!</p></header><main id="quiz"></main><div class="actions" id="actions"><button id="grade">정답 확인하기</button><button class="secondary" id="reset">처음부터 다시 하기</button></div><div id="summary" role="status" aria-live="polite" hidden></div><section id="evaluationPage" hidden><h1>자동평가</h1><div id="auto-evaluation-act-1795474397548" hidden style="margin:24px auto;max-width:1050px;"><iframe title="과제 참여 여부 확인하기" src="https://eyeholder83-commits.github.io/sh0201/%ED%95%99%EA%B8%89%ED%86%B5%ED%95%A9%EA%B4%80%EB%A6%AC.html?autoActivity=act-1795474397548" loading="lazy" style="display:block;width:100%;height:650px;border:0;border-radius:16px;background:#f8fafc;" referrerpolicy="strict-origin-when-cross-origin"></iframe></div><button onclick="location.reload()">다시 도전하기</button></section><div id="completionModal" role="dialog" aria-modal="true" hidden style="position:fixed;inset:0;z-index:100;background:#0a193c99;align-items:center;justify-content:center;padding:20px"><div class="teacherBox" style="text-align:center"><h2>🎉 모든 문제를 맞혔습니다!</h2><p>자동평가 페이지로 이동합니다.</p></div></div></div>
<script>
const questions=[
{place:'누리집 맨 아래',q:'신흥초등학교의 주소는 무엇인가요?',opts:['충남 천안시 동남구 목천읍 신계3길 27','충남 천안시 동남구 목천읍 신계5길 27','충남 천안시 서북구 목천읍 신계5길 27','충남 천안시 동남구 목천읍 신계5길 72','충남 아산시 목천읍 신계5길 27'],answer:1},
{place:'학교소개 → 학교연혁',q:'신흥초등학교는 언제 개교했나요?',opts:['2005년 3월 1일','2006년 3월 1일','2007년 3월 1일','2008년 3월 1일','2009년 3월 1일'],answer:2},
{place:'학교소개 → 학교현황',q:'신흥초등학교의 현재 학생 수는 몇 명인가요?',opts:['246명','256명','266명','276명','286명'],answer:3},
{place:'게시판',q:'신흥초등학교 누리집에 있는 게시판 3가지를 모두 바르게 고른 것은 무엇인가요?',opts:['학생게시판, 학부모게시판, 클린신고센터','학생게시판, 교사게시판, 급식게시판','학부모게시판, 도서게시판, 행사게시판','학생게시판, 자유게시판, 사진게시판','교사게시판, 학부모게시판, 알림게시판'],answer:0},
{place:'온돌봄 → 활동앨범',q:'선생님이 보여 주신 사진이 게시된 글의 제목은 무엇인가요?',opts:['2026학년도 학교 체육대회 활동 사진(5)','2026학년도 현장체험학습 활동 사진(5)','2026학년도 방과후학교 프로그램 공개의 날 활동 사진(5)','2026학년도 학부모 공개수업 활동 사진(5)','2026학년도 학교 축제 활동 사진(5)'],answer:2},
{place:'온라인학습터',q:'현재 신흥초등학교의 온라인학습터는 운영되고 있나요?',opts:['모든 학생이 이용할 수 있다.','1~2학년 학생만 이용할 수 있다.','3~6학년 학생만 이용할 수 있다.','교사만 이용할 수 있다.','현재 운영되지 않고 있다.'],answer:4},
{place:'직접 확인해 보기',q:'학교 점심 식사 사진을 보려면 어느 메뉴로 들어가야 하나요?',opts:['학교소개 → 학교현황','교육활동 → 활동사진','게시판 → 공지사항','급식실 → 식단사진','보건실 → 건강소식'],answer:3},
{place:'누리집 첫 화면',q:'신흥초등학교가 강조하는 3성을 순서에 관계 없이 쓰세요',short:true}
];
const quiz=document.getElementById('quiz');questions.forEach((x,i)=>{const section=document.createElement('section');section.className='question';section.id='q'+i;const p=document.createElement('div');p.className='place';p.textContent='📍 확인 위치: '+x.place;section.append(p);const title=document.createElement('div');title.className='qtitle';title.textContent=(i===7?'8-10':(i+1))+'. '+x.q;section.append(title);if(x.short){const group=document.createElement('div');group.className='short-group';['8번','9번','10번'].forEach((num,j)=>{const inp=document.createElement('input');inp.setAttribute('aria-label',num+' 정답');inp.className='short';inp.id='answer'+i+'-'+j;inp.placeholder='정답 입력';inp.autocomplete='off';const cell=document.createElement('div');cell.className='short-cell';cell.append(inp);group.append(cell)});section.append(group)}else{const choices=document.createElement('div');choices.className='choices';x.opts.forEach((opt,j)=>{const label=document.createElement('label');label.className='choice';const inp=document.createElement('input');inp.type='radio';inp.name='answer'+i;inp.value=j;const span=document.createElement('span');span.textContent=['①','②','③','④','⑤'][j]+' '+opt;label.append(inp,span);choices.append(label)});section.append(choices)}const feedback=document.createElement('div');feedback.className='feedback';feedback.id='feedback'+i;feedback.setAttribute('aria-live','polite');section.append(feedback);quiz.append(section)});
document.getElementById('grade').addEventListener('click',()=>{let correct=0,firstWrong=null;questions.forEach((q,i)=>{let ok=false;if(i<7){const chosen=document.querySelector('input[name="answer'+i+'"]:checked');ok=!!chosen&&Number(chosen.value)===q.answer}else{const values=[0,1,2].map(j=>document.getElementById('answer'+i+'-'+j).value.replace(/\s+/g,'').trim());ok=values.every(v=>['인성','지성','감성'].includes(v))&&new Set(values).size===3}const el=document.getElementById('q'+i),fb=document.getElementById('feedback'+i);el.classList.toggle('wrong',!ok);fb.className='feedback '+(ok?'good':'bad');fb.textContent=ok?'':'✗ 틀렸습니다.';if(ok)correct+=(i===7?3:1);else if(firstWrong===null)firstWrong=el});document.getElementById('summary').hidden=true;if(correct===10){showAutoEvaluation()}else if(firstWrong){firstWrong.scrollIntoView({behavior:'smooth',block:'center'})}});
function showAutoEvaluation(){
  quiz.hidden=true;document.querySelector('header').hidden=true;
  document.getElementById('actions').style.display='none';
  document.getElementById('evaluationPage').hidden=false;
  const area=document.getElementById('auto-evaluation-act-1795474397548');
  area.hidden=false;window.scrollTo(0,0);
  const modal=document.getElementById('completionModal');modal.hidden=false;modal.style.display='flex';
  setTimeout(()=>{modal.style.display='none';modal.hidden=true;},2000);
}
// 교사 모드: 비밀번호 원문을 HTML에 넣지 않고 SHA-256 비교값만 저장합니다.
// 정적 HTML은 개발자 도구로 분석 가능하므로 실제 접근 통제 수단은 아닙니다.
const teacherOpen=document.getElementById('teacherOpen');
const teacherPanel=document.getElementById('teacherPanel');
const teacherPassword=document.getElementById('teacherPassword');
const loginView=document.getElementById('loginView');
const teacherView=document.getElementById('teacherView');
let teacherMode=false;
const passwordSalt='sh2026-quiz-teacher-v2:';
const passwordHash='74d9445089509cc8351357b0d8b7e645eae45f86bcdf27f139ade2122a09a0c0';
async function sha256(str){const bytes=new TextEncoder().encode(str);const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('')}
function showTeacherPanel(){teacherPanel.classList.add('visible');loginView.hidden=teacherMode;teacherView.hidden=!teacherMode;if(!teacherMode){teacherPassword.value='';document.getElementById('loginError').textContent='';teacherPassword.focus()}}
function hideTeacherPanel(){teacherPanel.classList.remove('visible')}
function fillTeacherAnswers(){questions.forEach((q,i)=>{if(i<7){const radio=document.querySelector('input[name="answer'+i+'"][value="'+q.answer+'"]');if(radio)radio.checked=true}else{['인성','지성','감성'].forEach((v,j)=>document.getElementById('answer'+i+'-'+j).value=v)}document.getElementById('q'+i).classList.remove('wrong');document.getElementById('feedback'+i).textContent=''});document.getElementById('summary').hidden=true;document.getElementById('evaluationPage').hidden=true;quiz.hidden=false;document.querySelector('header').hidden=false;document.getElementById('actions').style.display='flex'}
teacherOpen.addEventListener('click',showTeacherPanel);
document.getElementById('teacherCancel').addEventListener('click',hideTeacherPanel);
document.getElementById('teacherClose').addEventListener('click',hideTeacherPanel);
teacherPanel.addEventListener('click',e=>{if(e.target===teacherPanel)hideTeacherPanel()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTeacherPanel();if(e.key==='Enter'&&teacherPanel.classList.contains('visible')&&!teacherMode){document.getElementById('teacherLogin').click()}});
document.getElementById('teacherLogin').addEventListener('click',async()=>{try{if(await sha256(passwordSalt+teacherPassword.value)===passwordHash){teacherMode=true;document.body.classList.add('teacher-mode');teacherOpen.textContent='교사 모드';fillTeacherAnswers();hideTeacherPanel()}else{document.getElementById('loginError').textContent='비밀번호가 올바르지 않습니다.';teacherPassword.value='';teacherPassword.focus()}}catch(e){document.getElementById('loginError').textContent='이 환경에서 인증할 수 없습니다. HTTPS 또는 localhost에서 열어 주세요.'}});
document.getElementById('teacherFill').addEventListener('click',()=>{fillTeacherAnswers();hideTeacherPanel()});
document.getElementById('teacherLogout').addEventListener('click',()=>{teacherMode=false;document.body.classList.remove('teacher-mode');teacherOpen.textContent='교사 로그인';hideTeacherPanel();location.reload()});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('모든 답을 지우고 처음부터 시작할까요?'))location.reload()});
</script></body></html>
