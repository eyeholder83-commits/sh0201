<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시간을 알아볼까요</title><style>body{font-family:'Malgun Gothic',sans-serif;background:#f1f7fc;margin:0;color:#18304a}header{background:#168e9a;color:white;padding:18px;text-align:center;font-size:25px;font-weight:bold}nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:16px}button{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:bold;background:#dcebf6;color:#16415d}button.active{background:#087e91;color:white}main{max-width:820px;margin:0 auto 40px;background:white;padding:25px;border-radius:20px;box-shadow:0 6px 24px #2342  }h2{color:#087e91}p{font-size:21px;line-height:1.65}input{width:65px;padding:9px;font-size:23px;text-align:center;border:2px solid #a6c9df;border-radius:9px;margin:4px}input.bad{border-color:#e05252;background:#fff0f0}.clock{width:180px;height:180px;max-width:45vw}.clocks{display:flex;justify-content:center;gap:35px;flex-wrap:wrap;align-items:center}.clockbox{text-align:center}.clockbox strong{display:block;margin-bottom:8px}.digital{font-size:34px;font-weight:bold;border:3px solid #76b9e0;border-radius:10px;padding:8px 18px;display:inline-block;background:#f5fbff}.timeline{display:grid;grid-template-columns:repeat(6,1fr);margin:30px 0 8px;border:2px solid #77b1c5;border-radius:8px;overflow:hidden}.timeline span{padding:20px 0;text-align:center;border-right:1px solid #77b1c5;background:#eaf8fb}.timeline span:last-child{border:0}.actions{text-align:center;margin-top:25px}.actions button{background:#087e91;color:white}.feedback{text-align:center;font-size:21px;font-weight:bold;min-height:30px;margin:14px}.hint{color:#5a7183;font-size:16px}.arrow{font-size:35px;color:#178ca2}@media(max-width:600px){main{margin:0 10px;padding:16px}.clock{width:145px;height:145px}.clocks{gap:10px}p{font-size:18px}} .time-ruler{position:relative;margin:52px 12px 12px;touch-action:none;user-select:none}.ruler-labels{height:28px;position:relative}.ruler-label{position:absolute;bottom:3px;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:700;color:#25485d}.ruler-label:first-child{transform:none}.ruler-label:last-child{transform:translateX(-100%)}.ruler-track{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));height:66px;border-top:2px solid #315b70;border-bottom:2px solid #315b70;position:relative}.ruler-cell{background:#fff;min-width:0;touch-action:none}.ruler-cell.painted{background:#79c9ef}.ruler-line{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed #66899c;pointer-events:none}.ruler-line.hour{border-left:2px solid #315b70}.ruler-help{font-size:15px;color:#59778a;text-align:center}  .unit-options{display:inline-flex;gap:12px;vertical-align:middle;flex-wrap:wrap}.unit-options label{display:inline-flex;align-items:center;gap:3px;cursor:pointer;border:2px solid #b8d4e3;border-radius:10px;padding:4px 10px;font-size:19px}.unit-options input{width:18px;height:18px;margin:0;accent-color:#087e91}.unit-options label.bad-unit{border-color:#e05252}  .interactive-clock{width:240px;height:240px;max-width:75vw;touch-action:none;cursor:grab}.interactive-clock:active{cursor:grabbing}.clock-instruction{text-align:center;font-size:16px;color:#54758a}  .teacher-launch{position:fixed;right:12px;top:10px;z-index:20;background:#17445b;color:white;font-size:13px;padding:8px 11px}.teacher-dialog{position:fixed;inset:0;background:#132b40a8;display:none;align-items:center;justify-content:center;z-index:30;padding:16px}.teacher-dialog.open{display:flex}.teacher-panel{width:min(360px,95vw);background:white;padding:24px;border-radius:16px;box-shadow:0 10px 40px #0004}.teacher-panel input{width:calc(100% - 24px);box-sizing:border-box;text-align:left}.teacher-panel button{margin:4px}.teacher-status{font-size:14px;color:#087e91;text-align:center}.teacher-error{font-size:14px;color:#ce4545;min-height:20px}  .unlock-dialog{position:fixed;inset:0;background:#132b40a8;display:none;align-items:center;justify-content:center;z-index:50;padding:18px}.unlock-dialog.open{display:flex}.unlock-panel{background:white;border-radius:20px;padding:30px;text-align:center;max-width:420px;box-shadow:0 12px 45px #0004}.unlock-panel h2{margin-top:0} </style></head><body><header>⏰ 시간을 알아볼까요</header><button class="teacher-launch" id="teacherLaunch" type="button">교사용</button><div id="teacherDialog" class="teacher-dialog" role="dialog" aria-modal="true" aria-label="교사용 로그인"><div class="teacher-panel"><h2>교사용 로그인</h2><form id="teacherForm"><label for="teacherPin">로그인 번호</label><input id="teacherPin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="번호 입력" required><div class="teacher-error" id="teacherError" aria-live="polite"></div><button type="submit">로그인</button><button type="button" id="teacherClose">취소</button></form></div></div><div id="unlockDialog" class="unlock-dialog" role="status" aria-live="polite"><div class="unlock-panel"><h2>🎉 새로운 페이지가 만들어졌습니다!</h2><p>7페이지 자동평가를 확인해 보세요.</p></div></div><nav id="nav"></nav><main><h2 id="heading"></h2><div id="content"></div><div class="actions"><button id="check">정답확인</button></div><div id="feedback" class="feedback" aria-live="polite"></div><div id="auto-evaluation-act-1793230692007" hidden style="margin:24px auto;max-width:1050px;"><iframe title="과제 참여 여부 확인하기" src="https://eyeholder83-commits.github.io/sh0201/%ED%95%99%EA%B8%89%ED%86%B5%ED%95%A9%EA%B4%80%EB%A6%AC.html?autoActivity=act-1793230692007" loading="lazy" style="display:block;width:100%;height:650px;border:0;border-radius:16px;background:#f8fafc;" referrerpolicy="strict-origin-when-cross-origin"></iframe></div></main><script>
let page=1;let teacherMode=false;const completed=new Set();let unlocked=false;const answers={1:[1,60],2:[60],3:[10,40],4:[20],5:[4],6:[2]};
function clock(h,m,empty=false){let ticks='',nums='';for(let i=0;i<60;i++){let a=i*Math.PI/30;let r=i%5===0?76:81;let r2=85;ticks+=`<line x1="${100+Math.sin(a)*r}" y1="${100-Math.cos(a)*r}" x2="${100+Math.sin(a)*r2}" y2="${100-Math.cos(a)*r2}" stroke="#708999" stroke-width="${i%5===0?2:1}"/>`;}for(let i=1;i<=12;i++){let a=i*Math.PI/6;nums+=`<text x="${100+Math.sin(a)*64}" y="${105-Math.cos(a)*64}" text-anchor="middle" font-size="17" fill="#263e50">${i}</text>`}let hands=empty?'':`<line x1="100" y1="100" x2="${100+Math.sin((h%12+m/60)*Math.PI/6)*43}" y2="${100-Math.cos((h%12+m/60)*Math.PI/6)*43}" stroke="#54a043" stroke-width="6" stroke-linecap="round"/><line x1="100" y1="100" x2="${100+Math.sin(m*Math.PI/30)*70}" y2="${100-Math.cos(m*Math.PI/30)*70}" stroke="#e34d9d" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="5" fill="#e6aa28"/>`;return `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="시계"><circle cx="100" cy="100" r="95" fill="#fff" stroke="#74b5e3" stroke-width="9"/>${ticks}${nums}${hands}</svg>`}
const inp=(id)=>`<input id="a${id}" inputmode="numeric" type="text" autocomplete="off" aria-label="${id+1}번째 답">`;
const pages=[null,()=>`<p>□ 안에 알맞은 수를 써넣으세요.</p><p>60분 = ${inp(0)} 시간</p><p>1시간 = ${inp(1)} 분</p>`,()=>`<p>축구를 하는 데 걸린 시간을 시간 띠에 색칠하고 구해 보세요.</p><div class="clocks"><div class="clockbox"><strong>시작한 시각</strong><span class="digital">8:30</span></div><span class="arrow">→</span><div class="clockbox"><strong>끝낸 시각</strong><span class="digital">9:30</span></div></div><div class="time-ruler" id="timeRuler"><div class="ruler-labels">${Array.from({length:13},(_,i)=>`<span class="ruler-label" style="left:${i/12*100}%">${i===0?'8시':i===6?'9시':i===12?'10시':(i%6)*10+'분'}</span>`).join('')}</div><div class="ruler-track" id="rulerTrack">${Array.from({length:12},(_,i)=>`<div class="ruler-cell" data-cell="${i}"></div>`).join('')}${Array.from({length:13},(_,i)=>`<div class="ruler-line ${i%6===0?'hour':''}" style="left:${i/12*100}%"></div>`).join('')}</div></div><div class="ruler-help">칸을 누르거나 손가락·마우스로 쓸어 색칠하세요.</div><p>축구를 하는 데 걸린 시간은 ${inp(0)} <span class="unit-options"><label><input type="radio" name="timeUnit" value="분"> 분</label><label><input type="radio" name="timeUnit" value="시간"> 시간</label></span>입니다.</p>`,()=>`<p>그림 그리기를 60분 동안 했습니다. 그림을 그리기 시작한 시각과 끝낸 시각을 나타내 보세요.</p><div class="clocks"><div class="clockbox"><strong>시작한 시각</strong>${clock(9,40)}</div><span class="arrow">→</span><div class="clockbox"><strong>끝낸 시각</strong>${clock(10,40)}</div></div><p>끝낸 시각은 ${inp(0)}시 ${inp(1)}분입니다.</p><p class="hint">시작한 시각에서 60분이 지나면 시침과 분침이 어떻게 움직이는지 살펴보세요.</p>`,()=>`<p>슬기는 친구들과 함께 1시간 동안 봉사활동을 하기로 했습니다. 시계를 보고 봉사활동을 몇 분 더 해야 하는지 구해 보세요.</p><div class="clocks"><div class="clockbox"><strong>시작한 시각</strong>${clock(4,0)}</div><span class="arrow">→</span><div class="clockbox"><strong>현재 시각</strong>${clock(4,40)}</div></div><p>더 해야 하는 시간: ${inp(0)} 분</p>`,()=>`<p>시계가 멈춰서 현재 시각으로 맞추려고 합니다. 긴바늘을 몇 바퀴 돌리면 되는지 구해 보세요.</p><div class="clocks"><div class="clockbox"><strong>멈춘 시계</strong>${clock(1,30)}</div><span class="arrow">→</span><div class="clockbox"><strong>현재 시각</strong><span class="digital">5:30</span></div></div><p>긴바늘을 ${inp(0)} 바퀴 돌리면 됩니다.</p>`,()=>`<p>채영이는 4가지 직업 체험을 30분씩 했습니다. 직업 체험을 하는 데 걸린 시간을 구하고 끝낸 시각을 나타내 보세요.</p><div class="clocks"><div class="clockbox"><strong>끝낸 시각</strong><div id="interactiveClock"></div></div></div><p class="clock-instruction">시침(초록색)과 분침(분홍색)을 손가락이나 마우스로 직접 돌려 보세요.</p><p>걸린 시간: ${inp(0)} 시간</p>`];
function render(){if(page===7){document.getElementById("nav").innerHTML=Array.from({length:6},(_,i)=>`<button onclick="go(${i+1})">${i+1}페이지 ✓</button>`).join("")+`<button class="active" onclick="go(7)">7페이지 · 자동평가</button>`;document.getElementById("heading").textContent="7페이지 · 자동평가";document.getElementById("content").innerHTML="";document.querySelector(".actions").hidden=true;document.getElementById("feedback").textContent="";showAutoEvaluation(false);return;}document.querySelector(".actions").hidden=false;document.getElementById("auto-evaluation-act-1793230692007").hidden=true;if(page===6){clockHour=1;clockMinute=0;}document.getElementById('nav').innerHTML=Array.from({length:6},(_,i)=>`<button class="${page===i+1?'active':''}" onclick="go(${i+1})">${i+1}페이지 ${completed.has(i+1)?'✓':''}</button>`).join('')+(unlocked?`<button onclick="go(7)">7페이지 · 자동평가</button>`:'');document.getElementById('heading').textContent=page+'페이지 · '+['','시간의 관계','축구한 시간','그림 그린 시간','봉사활동','멈춘 시계','직업 체험'][page];document.getElementById('content').innerHTML=pages[page]();document.getElementById('feedback').textContent='';if(page===2)initRuler();if(page===6)initInteractiveClock();if(teacherMode)fillTeacherAnswers();}
let clockHour=1,clockMinute=0;
function initInteractiveClock(){
 const host=document.getElementById('interactiveClock');
 const ticks=Array.from({length:60},(_,i)=>{let a=i*Math.PI/30,r=i%5===0?76:81;return `<line x1="${100+Math.sin(a)*r}" y1="${100-Math.cos(a)*r}" x2="${100+Math.sin(a)*85}" y2="${100-Math.cos(a)*85}" stroke="#708999" stroke-width="${i%5===0?2:1}"/>`}).join('');
 const nums=Array.from({length:12},(_,i)=>{let n=i+1,a=n*Math.PI/6;return `<text x="${100+Math.sin(a)*64}" y="${105-Math.cos(a)*64}" text-anchor="middle" font-size="17" fill="#263e50">${n}</text>`}).join('');
 host.innerHTML=`<svg id="clockDrag" class="interactive-clock" viewBox="0 0 200 200" aria-label="바늘을 움직일 수 있는 끝낸 시각 시계"><circle cx="100" cy="100" r="95" fill="white" stroke="#74b5e3" stroke-width="9"/>${ticks}${nums}<line id="hourHand" stroke="#54a043" stroke-width="7" stroke-linecap="round"/><line id="minuteHand" stroke="#e34d9d" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="5" fill="#e6aa28" pointer-events="none"/></svg>`;
 const svg=host.querySelector('svg');let active=null;
 function draw(){let ah=(clockHour%12+clockMinute/60)*Math.PI/6,am=clockMinute*Math.PI/30;for(const [id,a,len] of [['hourHand',ah,43],['minuteHand',am,70]]){let el=document.getElementById(id);el.setAttribute('x1',100);el.setAttribute('y1',100);el.setAttribute('x2',100+Math.sin(a)*len);el.setAttribute('y2',100-Math.cos(a)*len)}}
 function coords(e){let pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;let m=svg.getScreenCTM();return m?pt.matrixTransform(m.inverse()):{x:100,y:100}}
 function move(e){let p=coords(e),a=(Math.atan2(p.x-100,100-p.y)+2*Math.PI)%(2*Math.PI);if(active==='minute'){clockMinute=(Math.round(a*30/Math.PI/5)*5)%60}else if(active==='hour'){let target=a*6/Math.PI;clockHour=(Math.round(target-clockMinute/60+12)%12)||12}draw()}
 svg.addEventListener('pointerdown',e=>{let p=coords(e),r=Math.hypot(p.x-100,p.y-100);if(r<9)return;let angle=Math.atan2(p.x-100,100-p.y),ah=(clockHour%12+clockMinute/60)*Math.PI/6,am=clockMinute*Math.PI/30;let dist=(a)=>Math.abs(Math.atan2(Math.sin(angle-a),Math.cos(angle-a)));active=(r<52&&dist(ah)<0.55)?'hour':(r>=48&&dist(am)<0.55)?'minute':(r<53?'hour':'minute');svg.setPointerCapture(e.pointerId);move(e)});
 svg.addEventListener('pointermove',e=>{if(active)move(e)});svg.addEventListener('pointerup',()=>active=null);svg.addEventListener('pointercancel',()=>active=null);draw();
}
let rulerColors=Array(12).fill(false);function initRuler(){const track=document.getElementById('rulerTrack');let drawing=false,paint=true;const refresh=()=>track.querySelectorAll('.ruler-cell').forEach((el,i)=>el.classList.toggle('painted',rulerColors[i]));const indexAt=e=>{const r=track.getBoundingClientRect();return Math.max(0,Math.min(11,Math.floor((e.clientX-r.left)/r.width*12)))};const apply=e=>{rulerColors[indexAt(e)]=paint;refresh()};track.addEventListener('pointerdown',e=>{drawing=true;paint=!rulerColors[indexAt(e)];track.setPointerCapture(e.pointerId);apply(e)});track.addEventListener('pointermove',e=>{if(drawing)apply(e)});track.addEventListener('pointerup',()=>drawing=false);track.addEventListener('pointercancel',()=>drawing=false);refresh()}function fillTeacherAnswers(){
 const values=answers[page];values.forEach((value,i)=>{const el=document.getElementById('a'+i);if(el){el.value=value;el.classList.remove('bad')}});
 if(page===2){const radio=document.querySelector('input[name="timeUnit"][value="분"]');if(radio)radio.checked=true;rulerColors=Array.from({length:12},(_,i)=>i>=3&&i<9);document.querySelectorAll('.ruler-cell').forEach((el,i)=>el.classList.toggle('painted',rulerColors[i]));}
 if(page===6){clockHour=11;clockMinute=0;const svg=document.getElementById('clockDrag');if(svg){const hour=document.getElementById('hourHand'),minute=document.getElementById('minuteHand');const a=11*Math.PI/6;hour.setAttribute('x2',100+Math.sin(a)*43);hour.setAttribute('y2',100-Math.cos(a)*43);minute.setAttribute('x2',100);minute.setAttribute('y2',30);}}
}
const teacherDialog=document.getElementById('teacherDialog');const teacherPin=document.getElementById('teacherPin');const teacherError=document.getElementById('teacherError');
document.getElementById('teacherLaunch').addEventListener('click',()=>{if(teacherMode){teacherMode=false;document.getElementById('teacherLaunch').textContent='교사용';render();return;}teacherDialog.classList.add('open');teacherPin.value='';teacherError.textContent='';teacherPin.focus();});
document.getElementById('teacherClose').addEventListener('click',()=>teacherDialog.classList.remove('open'));
document.getElementById('teacherForm').addEventListener('submit',async e=>{e.preventDefault();const bytes=new TextEncoder().encode(teacherPin.value);const expected=[53,54,53,56].map(n=>String.fromCharCode(n)).join('');if(teacherPin.value===expected){teacherMode=true;teacherDialog.classList.remove('open');document.getElementById('teacherLaunch').textContent='교사 모드 종료';render();}else{teacherError.textContent='로그인 번호가 올바르지 않습니다.';teacherPin.value='';teacherPin.focus();}});
function showAutoEvaluation(scroll=true){const area=document.getElementById("auto-evaluation-act-1793230692007");if(area){area.hidden=false;if(scroll)area.scrollIntoView({behavior:"smooth",block:"start"});}}function unlockAutoEvaluation(){if(unlocked||completed.size!==6)return;unlocked=true;const dialog=document.getElementById("unlockDialog");dialog.classList.add("open");setTimeout(()=>dialog.classList.remove("open"),3000);render();}function go(n){if(n===7&&!unlocked)return;page=n;render()};document.getElementById('check').onclick=()=>{let ok=true;answers[page].forEach((v,i)=>{let el=document.getElementById('a'+i);let good=el.value.trim()!==''&&Number(el.value.trim())===v;el.classList.toggle('bad',!good);if(!good)ok=false});let fb=document.getElementById('feedback');if(page===6){if(clockHour!==11||clockMinute!==0){ok=false;document.getElementById('clockDrag').style.outline='3px solid #e05252';document.getElementById('clockDrag').style.borderRadius='50%';}else{document.getElementById('clockDrag').style.outline='none';}}if(page===2){const selected=document.querySelector('input[name="timeUnit"]:checked');const entered=Number(document.getElementById('a0').value.trim());const unitGood=(selected?.value==='분'&&entered===60)||(selected?.value==='시간'&&entered===1);if(unitGood){document.getElementById('a0').classList.remove('bad');ok=true;}document.querySelectorAll('.unit-options label').forEach(el=>el.classList.toggle('bad-unit',!unitGood));if(!unitGood)ok=false;}if(ok){completed.add(page);fb.textContent='정답입니다! 🎉';fb.style.color='#12804c';document.querySelectorAll('#nav button')[page-1].textContent=page+'페이지 ✓';unlockAutoEvaluation()}else{fb.textContent='틀린 답을 다시 확인해 보세요.';fb.style.color='#ce4545'}};render();
</script></body></html>
