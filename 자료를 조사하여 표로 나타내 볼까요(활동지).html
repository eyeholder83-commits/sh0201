<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자료를 조사하여 표로 나타내 볼까요</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#182438;font:18px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px}header,section{background:white;border:2px solid transparent;border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 3px 12px #00000009}h1{font-size:clamp(23px,4vw,34px);margin:0}h2{font-size:20px;margin:0 0 18px}small{color:#64748b}table{border-collapse:collapse;width:100%;table-layout:fixed;text-align:center;min-width:480px}caption{font-weight:bold;color:#9d345b;padding:8px}th,td{border:1px solid #d9a3b6;padding:9px 5px}th{background:#fce7ef}input[type=text]{width:100%;min-width:0;padding:10px 4px;border:1px solid #a5b4c8;border-radius:8px;font:inherit;text-align:center;background:#fff}input:focus{outline:3px solid #93c5fd}label.option{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #dbe3ee;border-radius:10px;margin:8px 0;cursor:pointer}input[type=checkbox]{width:23px;height:23px;accent-color:#2563eb;flex-shrink:0}.scroll{overflow-x:auto}.answers{display:flex;align-items:center;gap:8px;margin-top:18px}.answers input{flex:1}.short{max-width:110px}.status{font-weight:bold;margin-top:12px}.wrong{border-color:#dc2626}.wrong .status{color:#b91c1c}.right{border-color:#16a34a}.right .status{color:#15803d}button{border:0;border-radius:12px;padding:14px 28px;background:#2563eb;color:white;font:inherit;font-weight:bold;cursor:pointer}footer{text-align:center;padding:16px;position:sticky;bottom:0;background:#f1f5f9ee}#result{font-weight:bold;margin:8px} @media(max-width:600px){main{padding:10px}section,header{padding:15px}body{font-size:16px}}
header{position:relative;padding-top:58px}.teacher{position:absolute;right:16px;top:12px;font-size:13px;padding:7px 12px;background:#475569}dialog{border:0;border-radius:16px;padding:24px;max-width:90vw;width:340px}dialog::backdrop{background:#0006}dialog input{width:100%;padding:12px;font:inherit;margin:10px 0;border:1px solid #94a3b8;border-radius:8px}dialog button{font-size:15px;padding:9px 15px}#loginError{color:#b91c1c;font-size:14px}</style></head><body><main><header><button type="button" class="teacher" id="teacherBtn">교사 로그인</button><small>수학 · 5. 표와 그래프 · 3차시</small><h1>자료를 조사하여 표로 나타내 볼까요</h1><p>종이 시험지에 푼 답을 입력하세요.</p></header><form id="quiz"><div id="questions"></div><footer><div id="result" role="status" aria-live="polite"></div><button type="submit">정답 확인</button></footer></form><section id="autoPage" hidden><h1 tabindex="-1" id="autoTitle">자동평가</h1><div id="auto-evaluation-act-1795562197789" hidden style="margin:24px auto;max-width:1050px;"><iframe title="과제 참여 여부 확인하기" data-src="https://eyeholder83-commits.github.io/sh0201/%ED%95%99%EA%B8%89%ED%86%B5%ED%95%A9%EA%B4%80%EB%A6%AC.html?autoActivity=act-1795562197789" loading="lazy" style="display:block;width:100%;height:650px;border:0;border-radius:16px;background:#f8fafc;" referrerpolicy="strict-origin-when-cross-origin"></iframe></div></section></main><dialog id="successDialog" aria-label="모든 문제 정답"><h2>🎉 축하합니다!</h2><p>모든 문제를 맞혔습니다.<br>자동평가 페이지로 이동합니다.</p></dialog><dialog id="teacherDialog"><form id="teacherForm"><h2>교사 로그인</h2><label for="teacherPassword">비밀번호</label><input id="teacherPassword" type="password" inputmode="numeric" autocomplete="off" required><div id="loginError" role="alert"></div><button type="submit">로그인</button> <button type="button" id="cancelLogin" style="background:#64748b">취소</button></form></dialog><script>
const field=(id,label,num=false)=>`<input type="text" id="${id}" aria-label="${label}" ${num?'inputmode="numeric" pattern="[0-9]*"':''} autocomplete="off" spellcheck="false">`;
const table=(title,heads,row,values)=>`<div class="scroll"><table><caption>${title}</caption><thead><tr>${heads.map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody><tr><th scope="row">${row}</th>${values.map(x=>`<td>${x}</td>`).join('')}</tr></tbody></table></div>`;
const options=['혈액형을 한 사람씩 말합니다.','친구들의 얼굴을 보고 혈액형을 짐작합니다.','혈액형을 종이에 적어 모읍니다.','친구들의 키를 재어 혈액형을 알아냅니다.','혈액형별로 손을 들어 그 수를 셉니다.'];
const nums=(prefix,labels)=>labels.map((x,i)=>field(prefix+i,x,true));
const qs=[['친구들의 혈액형을 조사하려고 합니다. 알맞은 조사 방법을 모두 고르세요.',options.map((x,i)=>`<label class="option"><input type="checkbox" name="q1" value="${i}">${i+1}. ${x}</label>`).join('')],['다은이네 모둠 학생들이 좋아하는 동물을 조사했습니다. 조사한 내용을 정리해 보세요.',table('다은이네 모둠 학생들이 좋아하는 동물',['동물','강아지','고양이','금붕어'],'학생 이름',['강아지','고양이','금붕어'].map((x,i)=>field('b'+i,x)))],['구슬을 주머니에 넣고 10번 뽑아서 나온 구슬의 색입니다. 표로 나타내 보세요.',table('나온 구슬의 색깔별 횟수',['색깔','빨강','노랑','파랑','초록','합계'],'횟수(번)',[...nums('c',['빨강','노랑','파랑','초록']),10])],['여행 가고 싶은 나라를 조사하였습니다. 표로 나타내 보세요.',table('여행 가고 싶은 나라별 학생 수',['나라','미국','일본','프랑스','이탈리아','합계'],'학생 수(명)',[...nums('d',['미국','일본','프랑스','이탈리아']),15])],['지윤이네 반 학생들이 좋아하는 운동을 조사하여 나타낸 표입니다. 지윤이네 반 학생은 모두 몇 명일까요?',table('좋아하는 운동별 학생 수',['운동','줄넘기','축구','야구','배구','합계'],'학생 수(명)',[4,5,5,4,field('e0','합계',true)])+`<div class="answers" style="justify-content:center"><div class="short">${field('e1','전체 학생 수',true)}</div>명</div>`],['친구들이 좋아하는 과일을 조사하여 나타낸 표입니다. 친구들이 가장 좋아하는 과일부터 차례로 써 보세요.',table('좋아하는 과일별 학생 수',['과일','사과','딸기','바나나','참외','합계'],'학생 수(명)',[3,6,5,2,16])+`<div class="answers">${[0,1,2,3].map(i=>field('f'+i,`${i+1}번째 과일`)).join('<span>,</span>')}</div>`]];
document.getElementById('questions').innerHTML=qs.map(([q,body],i)=>`<section id="q${i+1}"><h2>${i+1}. ${q}</h2>${body}<div class="status" aria-live="polite"></div></section>`).join('');
const val=id=>document.getElementById(id).value.replace(/\s/g,'');
const eq=(id,a)=>val(id)===String(a);
const seq=(p,a)=>a.every((x,i)=>eq(p+i,x));
function names(id,expected){const s=val(id).replace(/[,，、·/]/g,'');let left=s;for(const n of expected){const i=left.indexOf(n);if(i<0)return false;left=left.slice(0,i)+left.slice(i+n.length)}return left===''}
document.getElementById('quiz').noValidate=true;
document.getElementById('quiz').addEventListener('submit',e=>{e.preventDefault();const selected=[...document.querySelectorAll('[name=q1]:checked')].map(x=>x.value).join(',');const checks=[selected==='0,2,4',names('b0',['지민','유준'])&&names('b1',['다은','서율','윤지'])&&names('b2',['라온']),seq('c',[3,5,1,1]),seq('d',[6,3,4,2]),eq('e0',18)&&eq('e1',18),seq('f',['딸기','바나나','사과','참외'])];checks.forEach((ok,i)=>{const s=document.getElementById('q'+(i+1));s.classList.remove('right');s.classList.toggle('wrong',!ok);s.querySelector('.status').textContent=ok?'':'✗ 틀렸습니다.'});const score=checks.filter(Boolean).length;document.getElementById('result').textContent=score===6?'🎉 축하합니다! 모든 문제를 맞혔습니다.':`6문항 중 ${score}문항 정답 · 틀린 문제를 다시 풀어 보세요.`;if(score===6)showAutoEvaluation();});
document.getElementById('quiz').addEventListener('input',e=>{const s=e.target.closest('section');if(s){s.classList.remove('right','wrong');s.querySelector('.status').textContent='';document.getElementById('result').textContent=''}});

const teacherBtn=document.getElementById('teacherBtn'), dlg=document.getElementById('teacherDialog'), pw=document.getElementById('teacherPassword'), err=document.getElementById('loginError');
let teacherMode=false;
function clearMarks(){document.querySelectorAll('#questions section').forEach(s=>{s.classList.remove('right','wrong');s.querySelector('.status').textContent=''});document.getElementById('result').textContent=''}
teacherBtn.onclick=()=>{if(teacherMode){teacherMode=false;teacherBtn.textContent='교사 로그인';document.getElementById('quiz').reset();clearMarks();return}pw.value='';err.textContent='';dlg.showModal();pw.focus()};
document.getElementById('cancelLogin').onclick=()=>dlg.close();
document.getElementById('teacherForm').addEventListener('submit',async e=>{e.preventDefault();try{const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw.value));const hex=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');pw.value='';if(hex!=='d283fc7ed27a618f0d8e673ffbd01c18ba8d472f095f375f93576d3ed40c4782'){err.textContent='비밀번호가 올바르지 않습니다.';pw.focus();return}teacherMode=true;teacherBtn.textContent='교사 로그아웃';dlg.close();document.querySelectorAll('[name=q1]').forEach(x=>x.checked=['0','2','4'].includes(x.value));const fill=(p,a)=>a.forEach((v,i)=>document.getElementById(p+i).value=v);fill('b',['지민, 유준','다은, 서율, 윤지','라온']);fill('c',[3,5,1,1]);fill('d',[6,3,4,2]);fill('e',[18,18]);fill('f',['딸기','바나나','사과','참외']);clearMarks()}catch{err.textContent='보안 연결(HTTPS)에서 다시 시도해 주세요.'}});
let completed=false;
function showAutoEvaluation(){if(completed)return;completed=true;const page=document.getElementById('autoPage'),area=document.getElementById('auto-evaluation-act-1795562197789'),modal=document.getElementById('successDialog');document.getElementById('quiz').hidden=true;document.querySelector('main > header').hidden=true;page.hidden=false;area.hidden=false;const frame=area.querySelector('iframe');frame.src=frame.dataset.src;window.scrollTo(0,0);modal.addEventListener('cancel',e=>e.preventDefault());modal.showModal();setTimeout(()=>{modal.close();document.getElementById('autoTitle').focus();area.scrollIntoView({behavior:'smooth',block:'start'});},2000);}
</script></body></html>
