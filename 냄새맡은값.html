const pages=[[["p", "옛날에 마음씨 고약한 구두쇠 영감이 장터에 국밥집을 차렸어요. 국밥집은 장사가 아주 잘되었어요."], ["p", "“히히, 이제 금방 부자가 되겠네.”"], ["p", "어느 날, 옆 마을에 사는 최 서방이 국밥집 앞을 지나게 되었어요."], ["p", "“킁킁, 킁킁! 아, 국밥 냄새 참 훌륭하네! 얼른 집에 가서 밥 먹어야겠다.”"], ["img", 0]], [["img", 1], ["p", "최 서방은 코를 벌름거리며 감탄했어요. 그리고 주린 배를 잡으며 얼른 집으로 가려고 돌아섰어요. 그때 누군가 최 서방을 붙잡았어요."], ["p", "“여끼, 나쁜 사람 같으니! 왜 그냥 가려는 거야?”"], ["p", "구두쇠 영감이 눈을 부릅뜨고 말했어요."], ["p", "“아, 국밥 냄새를 맡았으면 값을 치르고 가야지.”"], ["p", "최 서방은 기가 막혔지요."], ["p", "“냄새 맡은 값이라니요? 이 무슨 말도 안 되는 소리요?”"], ["p", "“그럼 국밥에서 나온 냄새가 공짜인 줄 알았나?”"], ["p", "최 서방은 정말 어처구니가 없었어요. 그러다 갑자기 좋은 생각이 떠올라 손뼉을 쳤어요. 그리고는 구두쇠 영감에게 손짓했지요."], ["p", "“이리 가까이 오시오. 냄새 맡은 값을 줄 테니…….”"]], [["img", 2], ["p", "최 서방은 돈주머니를 꺼내어 구두쇠 영감의 귀에 대고 흔들었어요."], ["p", "“자, 이 소리가 들리지요?”"], ["p", "“이것은 엽전 소리가 아닌가?”"], ["p", "구두쇠 영감은 눈을 동그랗게 뜨고 최 서방을 쳐다보았어요."], ["p", "“분명히 엽전 소리를 들었지요?”"], ["p", "“틀림없이 들었네.”"], ["p", "“그럼 됐어요.”"], ["p", "최 서방은 웃음이 가득한 얼굴로 고개를 끄덕였어요. 구두쇠 영감이 어리둥절한 표정을 지었어요."], ["p", "“뭐가 됐다는 거야? 어서 국밥 냄새 맡은 값이나 내놔.”"], ["p", "최 서방은 구두쇠 영감에게 말했어요."]], [["p", "“무슨 소리요? 엽전 소리는 공짜인 줄 아시오? 엽전 소리를 그리 오래 들었으니 냄새 맡은 값은 치르고도 남았소.”"], ["p", "“아니, 뭐라고?”"], ["p", "구두쇠 영감은 더는 아무 말도 못 하고 얼굴이 빨개졌어요. 쥐구멍에라도 숨고 싶은지 주변을 두리번거렸지요. 국밥집에 있던 사람들이 모두 웃음을 터뜨렸답니다."], ["img", 3]]];

const summaryValues={};
function initSummaryBlanks(){
  const inputs=[...document.querySelectorAll('.story-summary .summary-blank')];
  inputs.forEach(input=>{
    const key=input.dataset.word;
    if(teacherMode){
      input.value=summaryAnswers[Number(key)];
      input.readOnly=true;
      input.classList.add('summary-correct');
    }else{
      input.readOnly=false;
      input.value=summaryValues[key]||'';
      input.addEventListener('input',()=>{
        summaryValues[key]=input.value;
        document.querySelectorAll('.story-summary .summary-blank').forEach(el=>{if(el.dataset.word===key){el.classList.remove('summary-wrong');el.removeAttribute('aria-invalid')}});
        const feedback=document.getElementById('summaryFeedback');if(feedback){feedback.textContent='';feedback.classList.remove('success')}
        inputs.forEach(other=>{if(other!==input&&other.dataset.word===key)other.value=input.value;});
      });
    }
  });
}
function checkSummaryAnswers(){
  if(teacherMode)return;
  const inputs=[...document.querySelectorAll('.story-summary .summary-blank')];
  let wrongCount=0;
  const wrongKeys=new Set();
  for(const input of inputs){
    const key=input.dataset.word;
    const normalize=v=>String(v).normalize('NFC').replace(/\s+/g,'').trim();
    const correct=normalize(input.value)===normalize(summaryAnswers[Number(key)]);
    input.classList.toggle('summary-wrong',!correct);
    input.setAttribute('aria-invalid',String(!correct));
    if(!correct){wrongCount++;wrongKeys.add(key)}
  }
  const feedback=document.getElementById('summaryFeedback');
  if(feedback){
    feedback.classList.toggle('success',wrongCount===0);
    feedback.textContent=wrongCount===0?'모두 맞았습니다!':`틀리거나 비어 있는 빈칸 ${wrongCount}곳을 빨간색으로 표시했어요. 다시 확인해 보세요.`;
  }
}

let dialogueOpen=null;let dialogueSelected={};
function renderDialogueAnalysis(){
 tabs.innerHTML='';for(let i=0;i<4;i++){let b=document.createElement('button');b.textContent=(i+1)+'쪽';b.className=page===i?'active':'';b.onclick=()=>{page=i;dialogueOpen=null;render()};tabs.appendChild(b)}
 let story=document.createElement('article');story.className='story dialogue-story';let count=0;
 if(page===0){let h=document.createElement('h2');h.className='story-heading';h.textContent='냄새 맡은 값';story.appendChild(h)}
 for(let pg=0;pg<page;pg++)for(let item of pages[pg])if(item[0]==='p'&&/[“”]/.test(item[1]))count++;
 for(let [kind,value] of pages[page]){
  if(kind==='img'){let im=document.createElement('img');im.src=imgs[value];im.alt='이야기 삽화';story.appendChild(im);continue}
  let para=document.createElement('p');let matches=[...value.matchAll(/“[^”]+”/g)];let pos=0;
  for(let m of matches){para.appendChild(document.createTextNode(value.slice(pos,m.index)));let id=count++;let btn=document.createElement('button');btn.className='dialogue-line-button';btn.textContent=m[0];btn.title='대사를 누르면 목소리 문제를 풀 수 있습니다';btn.onclick=()=>{dialogueOpen=dialogueOpen===id?null:id;renderDialogueAnalysis();document.getElementById('dialogue-'+id)?.scrollIntoView({block:'nearest',behavior:'smooth'})};para.appendChild(btn);pos=m.index+m[0].length}
  para.appendChild(document.createTextNode(value.slice(pos)));story.appendChild(para);
  let last=count-1;if(matches.length&&dialogueOpen!==null&&dialogueOpen>=count-matches.length&&dialogueOpen<count){let id=dialogueOpen;let panel=document.createElement('div');panel.className='dialogue-panel';panel.id='dialogue-'+id;panel.innerHTML='<strong>이 대사에서 느껴지는 인물의 마음과 어울리는 목소리는 무엇일까요?</strong>';
   let opts=dialoguePrompts[id]||dialoguePrompts[0];let order=[0,1,2,3].sort((a,b)=>((a+id*3)%4)-((b+id*3)%4));
   for(let k of order){let opt=document.createElement('button');opt.className='dialogue-option'+(dialogueSelected[id]===k?' selected':'');opt.textContent=opts[k];opt.onclick=()=>{dialogueSelected[id]=k;renderDialogueAnalysis();document.getElementById('dialogue-'+id)?.scrollIntoView({block:'nearest'})};panel.appendChild(opt)}
   let msg=document.createElement('div');msg.className='dialogue-feedback';if(dialogueSelected[id]!==undefined)msg.textContent=dialogueSelected[id]===0?'정답입니다! 대사를 소리 내어 읽어 보세요.':'다시 생각해 보세요. 앞뒤 상황과 인물의 마음을 살펴보세요.';panel.appendChild(msg);story.appendChild(panel)
  }
 }
 content.replaceChildren(story);document.querySelector('.nav').style.display='flex';document.querySelector('.tools').style.display='flex';document.getElementById('counter').textContent=(page+1)+' / 4';document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===3;
}

let mindOpenRow=null;
function renderMindQuiz(){
 content.innerHTML='<section class="activity mind-activity"><h2>「냄새 맡은 값」 인물의 마음 짐작하기</h2><p><strong>학습 문제:</strong> 빈칸을 누르면 해당 행 <strong>바로 아래에 선택지</strong>가 나타납니다. 같은 행의 내용을 보면서 답을 고르세요. (총 7문제)</p><div class="mind-scroll"><table class="mindtable mind-full"><thead><tr><th>번호</th><th>이야기 상황</th><th>인물의 말이나 행동</th><th>인물의 마음</th></tr></thead><tbody id="mindQuizBody"></tbody></table></div><button class="check" onclick="checkMindQuiz()">정답 확인</button><div id="mindQuizFeedback" class="feedback" aria-live="polite"></div></section>';
 const tbody=document.getElementById('mindQuizBody');mindRows.forEach((row,i)=>{const tr=document.createElement('tr');const num=document.createElement('td');num.textContent=i+1;tr.appendChild(num);row.forEach((value,j)=>{const td=document.createElement('td');if(mindBlank[i]===j){const b=document.createElement('button');b.className='mind-empty'+(mindSelections[i]!==undefined?' answered':'');b.textContent=teacherMode?row[j]:(mindSelections[i]===undefined?'빈칸 클릭하여 문제 풀기':mindOptions[i][mindSelections[i]]);b.setAttribute('aria-expanded',String(mindOpenRow===i));b.onclick=()=>openMindModal(i);td.appendChild(b);}else td.textContent=value;tr.appendChild(td)});tbody.appendChild(tr);
 if(mindOpenRow===i){const details=document.createElement('tr');details.className='mind-inline-row';const cell=document.createElement('td');cell.colSpan=4;const panel=document.createElement('div');panel.className='mind-inline-panel';const h=document.createElement('h3');h.textContent=(i+1)+'번 문제 · '+['이야기 상황','인물의 말이나 행동','인물의 마음'][mindBlank[i]];panel.appendChild(h);const hint=document.createElement('p');hint.textContent='바로 위의 이야기 상황과 인물의 말이나 행동을 살펴보고 가장 알맞은 내용을 고르세요.';panel.appendChild(hint);mindOptions[i].forEach((opt,k)=>{const b=document.createElement('button');b.className='mind-choice'+(mindSelections[i]===k?' chosen':'');b.textContent=(k+1)+'. '+opt;b.onclick=()=>{mindSelections[i]=k;mindOpenRow=null;renderMindQuiz();};panel.appendChild(b)});const close=document.createElement('button');close.textContent='선택지 닫기';close.onclick=()=>{mindOpenRow=null;renderMindQuiz()};panel.appendChild(close);cell.appendChild(panel);details.appendChild(cell);tbody.appendChild(details)}
 });
}
function openMindModal(i){mindOpenRow=mindOpenRow===i?null:i;renderMindQuiz();}
function closeMindModal(){mindOpenRow=null;renderMindQuiz();}
function checkMindQuiz(){const wrong=[];mindRows.forEach((r,i)=>{const btn=document.querySelectorAll('.mind-empty')[i];const bad=mindSelections[i]!==mindAnswers[i];btn.classList.toggle('incorrect',bad);if(bad)wrong.push(i+1)});document.getElementById('mindQuizFeedback').textContent=wrong.length?'다시 확인할 문제: '+wrong.join(', ')+'번 (정답은 표시하지 않습니다.)':'축하합니다! 7문제를 모두 맞혔습니다! 🎉';}

function checkVocabulary(){let wrong=[];document.querySelectorAll('.vocab-input').forEach((el,i)=>{const clean=v=>v.replace(/\s+/g,'').toLowerCase();const accepted=[['구두쇠'],['벌름거리다','벌름거리며'],['값을 치르다','값을 치르고'],['주리다','주린'],['예끼'],['기가 막히다','기가 막혔지요'],['놋쇠']];const ok=accepted[i].some(answer=>clean(el.value)===clean(answer));el.classList.toggle('vocab-wrong',!ok);el.setAttribute('aria-invalid',String(!ok));if(!ok)wrong.push(i+1)});document.getElementById('vocabFeedback').textContent=wrong.length?`다시 확인할 낱말: ${wrong.join(', ')}번`:'참 잘했어요! 7개 낱말을 모두 맞혔습니다! 🎉';markCompleted(3,wrong.length===0)}
function checkSentences(){let wrong=[];sentenceQuestions.forEach((q,i)=>{const checked=document.querySelector(`input[name="sentence${i}"]:checked`);const bad=!checked||Number(checked.value)!==q[1];document.getElementById('sentence'+i).classList.toggle('bad',bad);if(bad)wrong.push(i+1)});document.getElementById('sentenceFeedback').textContent=wrong.length?`다시 확인할 문제: ${wrong.join(', ')}번`:'참 잘했어요! 6문제 모두 맞혔습니다! 🎉'}
function checkLetter(){const frame=document.getElementById('letterFrame');const doc=frame&&frame.contentDocument;const fields=doc?[...doc.querySelectorAll('.field')]:[];if(fields.length!==6){document.getElementById('letterResult').textContent='입력창을 불러오는 중입니다. 잠시 후 다시 눌러 주세요.';return;}const answers=['받는사람','첫인사','전하고싶은말','끝인사','쓴날짜','쓴사람'];let wrong=[];fields.forEach((field,i)=>{const clean=field.value.replace(/\s+/g,'').toLowerCase();const ok=clean===answers[i];field.style.borderColor=ok?'#48a66a':'#db4545';field.style.backgroundColor=ok?'#fff':'#fff0f0';field.style.borderWidth=ok?'3px':'4px';field.setAttribute('aria-invalid',String(!ok));if(!ok)wrong.push(i+1)});document.getElementById('letterResult').textContent=wrong.length?`다시 확인할 빈칸: ${wrong.join(', ')}번`:'참 잘했어요! 6개 모두 맞혔습니다! 🎉';markCompleted(1,wrong.length===0);}
function checkSequence(){let wrong=[];document.querySelectorAll('.seqbox input').forEach((e,i)=>{const ok=e.dataset.answer.split('|').some(v=>v.replace(/\s+/g,'').toLowerCase()===e.value.replace(/\s+/g,'').toLowerCase());e.style.borderBottomColor=ok?'#48a66a':'#db4545';e.style.backgroundColor=ok?'transparent':'#fff0f0';e.setAttribute('aria-invalid',String(!ok));if(!ok)wrong.push(i+1)});document.getElementById('activityResult').textContent=wrong.length?`다시 생각해 볼 빈칸: ${wrong.join(', ')}번`:'참 잘했어요! 모두 맞혔습니다! 🎉';markCompleted(5,wrong.length===0)}
function saveThoughts(){document.getElementById('activityResult').textContent='작성한 내용을 확인해 보세요. (이 화면에서 내용을 수정할 수 있습니다.)'}
function checkAnswers(){marked=[];questions.forEach((q,i)=>{const a=document.querySelector(`input[name=q${i}]:checked`);if(!a||Number(a.value)!==q[2])marked.push(i)});document.querySelectorAll('.question').forEach((el,i)=>el.classList.toggle('bad',marked.includes(i)));document.getElementById('result').textContent=marked.length?`${marked.map(i=>i+1).join(', ')}번 문제를 다시 생각해 보세요. (${questions.length-marked.length}/${questions.length}문제 정답)`:'참 잘했어요! 모든 문제를 맞혔습니다! 🎉';markCompleted(4,marked.length===0)}document.getElementById('prev').onclick=()=>{if(displaySection===0&&page>0){page--;render()}};document.getElementById('next').onclick=()=>{if(displaySection===0&&page<(section===2?4:3)){page++;render()}};render();</script></body></html>
