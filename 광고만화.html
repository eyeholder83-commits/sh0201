<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>광고와 만화 퀴즈</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#18263c;font-family:'Malgun Gothic',Arial,sans-serif}header{background:linear-gradient(120deg,#3056b8,#6b55c7);color:white;padding:38px 20px;text-align:center}h1{margin:0 0 12px;font-size:32px}header p{margin:0}main{max-width:920px;margin:25px auto;padding:0 16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.pill{background:white;border-radius:30px;padding:10px 16px;font-weight:700}.login{position:fixed;right:14px;top:12px;z-index:4;border:1px solid #d7e0f2;background:white;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}.question{background:white;padding:24px;border-radius:18px;margin-bottom:17px;box-shadow:0 3px 12px #1a376012}.question h3{margin:0 0 16px;font-size:20px;line-height:1.6}.category{color:#4d5bb2;font-size:14px;font-weight:bold;margin-bottom:7px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{border:2px solid #e0e6f0;border-radius:12px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:9px;line-height:1.5}.opt:has(input:checked){border-color:#526cd1;background:#eff2ff}.opt input{accent-color:#526cd1;width:18px;height:18px;flex-shrink:0}.result{font-weight:bold;margin-top:12px;min-height:20px}.wrong{color:#c03443}.correct{color:#16814f}button{font:inherit}#check{display:block;margin:25px auto 60px;background:#375ecb;color:white;border:0;border-radius:14px;padding:16px 60px;font-size:20px;font-weight:bold;cursor:pointer}.summary{text-align:center;font-size:19px;font-weight:bold;margin:18px}.hidden{display:none!important}.eval{background:white;padding:24px;border-radius:18px;margin:30px auto}.eval iframe{display:block;width:100%;height:650px;border:0;border-radius:16px;background:#f8fafc}.overlay{position:fixed;inset:0;background:#15234a99;display:grid;place-items:center;z-index:10;padding:18px}.modal{background:white;border-radius:20px;padding:28px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px #0002}.modal input{width:100%;padding:13px;border:1px solid #b7c3db;border-radius:10px;font-size:18px;margin:12px 0}.modal button{background:#375ecb;color:white;border:0;padding:12px 20px;border-radius:10px;cursor:pointer}.modal .secondary{background:#e8edf6;color:#23314e}.modal .actions{display:flex;justify-content:center;gap:10px}.error{color:#b7253b;min-height:20px}.teacher-note{background:#fff7e4;border:1px solid #f1d9a1;padding:13px 18px;border-radius:12px;margin-bottom:15px}@media(max-width:600px){.options{grid-template-columns:1fr}h1{font-size:25px}.question{padding:18px}.login{position:absolute;top:8px;right:8px;font-size:12px;padding:7px}}
</style></head><body><button class="login" id="loginBtn">교사 로그인</button><header><h1>광고와 만화 퀴즈</h1><p>생각하고 판단하는 12문제 · 4지선다</p></header><main><section id="quizPage"><div class="top"><span class="pill" id="progress">응답 0 / 12</span><span class="pill" id="teacherStatus">학생 모드</span></div><div id="teacherNote" class="teacher-note hidden">교사 모드: 모든 정답이 자동 선택되어 있다. 선택지를 바꾸어 오답도 시험할 수 있다.</div><div id="questions"></div><div class="summary" id="summary" aria-live="polite"></div><button id="check">정답확인</button></section><section id="evalPage" class="eval hidden"><h2>자동평가</h2><p>12문제를 모두 맞혔다! 아래에서 과제 참여 여부를 확인하자.</p><div id="auto-evaluation-act-1795047697291"><iframe title="과제 참여 여부 확인하기" src="https://eyeholder83-commits.github.io/sh0201/%ED%95%99%EA%B8%89%ED%86%B5%ED%95%A9%EA%B4%80%EB%A6%AC.html?autoActivity=act-1795047697291" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div></section></main><div id="loginOverlay" class="overlay hidden"><div class="modal"><h2>교사 로그인</h2><p>교사 비밀번호를 입력하세요.</p><input type="password" id="password" autocomplete="off" placeholder="비밀번호"><div class="error" id="loginError"></div><div class="actions"><button id="loginSubmit">로그인</button><button class="secondary" id="loginCancel">취소</button></div></div></div><div id="successOverlay" class="overlay hidden"><div class="modal"><h2>🎉 모두 정답!</h2><p>잠시 후 자동평가 페이지로 이동한다.</p></div></div><script>
'use strict';
const data=[
['광고','새로 나온 운동화 광고에서 발이 편안한 모습을 반복해서 보여 주는 가장 알맞은 까닭은?',['운동화의 장점을 알려 구매하도록 권하려고','운동화를 신는 일을 금지하려고','운동화의 제조 날짜만 알려 주려고','운동화 대신 맨발로 걷도록 권하려고'],0],
['광고','다음 중 다른 세 가지와 광고의 주된 목적이 다른 것은?',['새 과자 맛을 소개하는 영상','놀이공원 이용권을 할인한다는 안내','횡단보도에서 신호를 지키자는 포스터','새 학용품을 사면 선물을 준다는 전단지'],2],
['광고','학교에서 열리는 그림 전시회에 많은 사람이 오도록 광고를 만들려고 한다. 가장 필요한 정보는?',['전시회를 준비한 학생의 키','전시회 날짜와 장소','학교 운동장의 넓이','전시회에 쓰인 종이의 무게'],1],
['광고','어떤 광고가 버스 정류장 화면과 스마트폰 영상에 모두 나타났다. 알 수 있는 사실은?',['광고는 종이에서만 볼 수 있다','광고는 반드시 돈을 내고 봐야 한다','광고는 한 가지 매체에서만 나온다','같은 광고도 여러 매체로 전달할 수 있다'],3],
['공익광고','“일회용 컵 대신 개인 물병을 사용합시다.”라는 광고의 가장 중요한 목적은?',['물병 가격을 높이기 위해','특정 물병 회사의 판매를 늘리기 위해','쓰레기를 줄여 환경을 보호하기 위해','모든 음료수를 마시지 못하게 하기 위해'],2],
['공익광고','공익광고를 만들 때 글과 그림을 함께 사용하는 까닭으로 가장 알맞은 것은?',['광고에서 전하려는 뜻을 더 쉽게 이해시키기 위해','글을 읽지 못하도록 숨기기 위해','광고를 무조건 길게 만들기 위해','광고의 뜻을 일부러 헷갈리게 하기 위해'],0],
['공익광고','친구들이 한 학생을 혼자 두고 놀고 있는 그림 옆에 “함께하면 더 즐거워요.”라고 쓰여 있다. 이 광고가 권하는 행동은?',['혼자 있는 친구를 무시하기','친구를 놀이에 함께 참여시키기','놀이를 모두 그만두기','친구에게 비밀을 만들기'],1],
['공익광고','다음 중 공익광고의 주제로 가장 알맞지 않은 것은?',['화재가 났을 때 안전하게 대피하기','손을 비누로 깨끗이 씻기','다른 사람의 모습을 존중하기','특정 회사의 신제품 과자를 더 많이 사기'],3],
['만화','4컷 만화의 첫 장면에는 맑은 하늘, 둘째 장면에는 먹구름, 셋째 장면에는 비, 넷째 장면에는 우산을 쓰는 아이가 나온다. 이 만화를 이해하는 가장 좋은 방법은?',['마지막 장면만 살펴보기','말풍선의 글만 읽기','장면을 순서대로 보며 그림의 변화를 살피기','장면을 아무 순서로 읽기'],2],
['만화','만화 속 아이가 “괜찮아!”라고 말하지만 눈물을 흘리고 어깨를 축 늘어뜨리고 있다. 가장 알맞은 해석은?',['말과 달리 속상한 마음일 수 있다','무조건 기뻐하고 있다','잠이 든 상태이다','표정은 만화 내용을 이해하는 데 도움이 되지 않는다'],0],
['만화','만화에서 문이 갑자기 닫히는 장면에 “쾅!”이라고 크게 쓰여 있다. 이 표현의 역할은?',['인물의 이름을 알려 준다','사건이 일어난 날짜를 알려 준다','인물의 생각을 직접 설명한다','문이 닫히는 소리를 생생하게 나타낸다'],3],
['만화','어려운 과학 지식을 등장인물의 대화와 그림으로 쉽게 알려 주는 만화에 대한 설명으로 가장 알맞은 것은?',['반드시 상품 광고이다','학습만화로, 이야기와 그림을 통해 지식을 전달한다','말풍선이 있으면 모두 공익광고이다','만화는 지식을 전달할 수 없다'],1]
];
let teacher=false,finished=false;const answers=Array(data.length).fill(null);const root=document.getElementById('questions');
function render(){root.innerHTML='';data.forEach((q,i)=>{const article=document.createElement('article');article.className='question';const cat=document.createElement('div');cat.className='category';cat.textContent=q[0]+' · '+(i+1)+'번';const h=document.createElement('h3');h.textContent=q[1];const options=document.createElement('div');options.className='options';q[2].forEach((o,j)=>{const label=document.createElement('label');label.className='opt';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;input.checked=answers[i]===j;input.addEventListener('change',()=>{answers[i]=j;document.getElementById('result'+i).textContent='';document.getElementById('summary').textContent='';updateProgress()});label.append(input,document.createTextNode(' '+['①','②','③','④'][j]+' '+o));options.append(label)});const result=document.createElement('div');result.className='result';result.id='result'+i;article.append(cat,h,options,result);root.append(article)});updateProgress()}
function updateProgress(){document.getElementById('progress').textContent='응답 '+answers.filter(x=>x!==null).length+' / '+data.length}
function check(){if(finished)return;let correct=0;data.forEach((q,i)=>{const result=document.getElementById('result'+i);const good=answers[i]===q[3];if(good)correct++;result.textContent=answers[i]===null?'⚠ 답을 선택하지 않았다.':good?'✓ 정답':'✕ 오답';result.className='result '+(good?'correct':'wrong')});document.getElementById('summary').textContent='결과: '+correct+' / '+data.length+'문제 정답';if(correct===data.length){finished=true;document.getElementById('successOverlay').classList.remove('hidden');setTimeout(showAutoEvaluation,2000)}}
function showAutoEvaluation(){document.getElementById('successOverlay').classList.add('hidden');document.getElementById('quizPage').classList.add('hidden');document.getElementById('evalPage').classList.remove('hidden');document.getElementById('auto-evaluation-act-1795047697291').scrollIntoView({behavior:'smooth',block:'start'})}
function openLogin(){document.getElementById('loginOverlay').classList.remove('hidden');document.getElementById('password').value='';document.getElementById('loginError').textContent='';document.getElementById('password').focus()}
function closeLogin(){document.getElementById('loginOverlay').classList.add('hidden')}
// Client-only verification obfuscates the password in source but does not provide secure server authentication.
function verify(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)===1091302247}
function login(){const s=document.getElementById('password').value;if(!verify(s)){document.getElementById('loginError').textContent='비밀번호가 올바르지 않다.';return}teacher=true;answers.splice(0,answers.length,...data.map(q=>q[3]));document.getElementById('teacherStatus').textContent='교사 모드';document.getElementById('teacherNote').classList.remove('hidden');document.getElementById('loginBtn').textContent='교사 로그아웃';closeLogin();render()}
document.getElementById('check').addEventListener('click',check);document.getElementById('loginBtn').addEventListener('click',()=>{if(teacher){teacher=false;answers.fill(null);document.getElementById('teacherStatus').textContent='학생 모드';document.getElementById('teacherNote').classList.add('hidden');document.getElementById('loginBtn').textContent='교사 로그인';document.getElementById('summary').textContent='';render()}else openLogin()});document.getElementById('loginSubmit').addEventListener('click',login);document.getElementById('loginCancel').addEventListener('click',closeLogin);document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});render();
</script></body></html>
