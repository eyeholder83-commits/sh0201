<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>컴퓨터에 대해 알아보기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6fc;color:#17243b;font-family:'Malgun Gothic',system-ui,sans-serif}header{background:linear-gradient(120deg,#244b9b,#5385d9);color:white;padding:36px 20px;text-align:center}h1{margin:0 0 10px;font-size:clamp(26px,4vw,38px)}header p{margin:0}.wrap{max-width:920px;margin:25px auto;padding:0 16px}.teacher{position:fixed;right:12px;top:12px;z-index:5;border:1px solid #c5d1e6;border-radius:12px;background:white;padding:9px 13px;color:#233e6a;cursor:pointer}.card{background:white;border:1px solid #dce5f3;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 4px 14px #1b3d7010}.question{font-size:19px;font-weight:750;line-height:1.6;margin-bottom:14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{display:flex;align-items:center;gap:9px;padding:14px;border:2px solid #e2e8f3;border-radius:12px;cursor:pointer;line-height:1.5}.choice:has(input:checked){border-color:#3c70d7;background:#edf3ff}.choice input{width:19px;height:19px;accent-color:#2e63c7}.feedback{font-weight:700;margin-top:10px;min-height:24px}.wrong{color:#c52d39}.right{color:#16774a}.actions{text-align:center;margin:28px 0 45px}button.primary{background:#285fcb;color:white;border:0;border-radius:13px;padding:16px 38px;font-size:19px;font-weight:800;cursor:pointer}.notice{margin:14px auto;font-weight:700}.hidden{display:none!important}#eval{margin:25px auto;max-width:1050px}#eval iframe{display:block;width:100%;height:650px;border:0;border-radius:16px;background:#f8fafc}.modal{position:fixed;inset:0;background:#071a35aa;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}.dialog{background:white;padding:30px;border-radius:20px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px #0003}.dialog input{font-size:18px;padding:12px;width:100%;border:1px solid #a9b7ce;border-radius:10px;margin:10px 0}.dialog button{padding:12px 20px;border:0;border-radius:10px;background:#285fcb;color:white;cursor:pointer;font-weight:bold}.dialog .cancel{background:#6c7788}.progress{font-weight:700;color:#274c8e;margin-bottom:12px}@media(max-width:640px){.choices{grid-template-columns:1fr}.card{padding:17px}.teacher{font-size:12px;padding:7px 9px}header{padding-top:58px}}
</style></head><body><button id="teacherBtn" class="teacher" type="button">교사 로그인</button><header><h1>💻 컴퓨터에 대해 알아보기</h1><p>각 문제를 읽고 알맞은 답을 하나씩 선택하세요.</p></header><main class="wrap"><section id="quiz"><div class="progress" id="progress">총 10문제</div><div id="questions"></div><div class="actions"><button class="primary" id="check" type="button">정답확인</button><p id="result" class="notice" aria-live="polite"></p></div></section><section id="eval" class="hidden"><h2>🎉 모든 문제를 해결했어요!</h2><h2>자동평가</h2><div id="auto-evaluation-act-1795132221833"><iframe title="과제 참여 여부 확인하기" src="https://eyeholder83-commits.github.io/sh0201/%ED%95%99%EA%B8%89%ED%86%B5%ED%95%A9%EA%B4%80%EB%A6%AC.html?autoActivity=act-1795132221833" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div></section></main><div id="loginModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="loginTitle"><div class="dialog"><h2 id="loginTitle">교사 로그인</h2><input id="password" type="password" placeholder="비밀번호 입력" autocomplete="off"><p id="loginError" class="wrong" aria-live="polite"></p><button id="loginSubmit" type="button">로그인</button> <button id="loginCancel" class="cancel" type="button">취소</button></div></div><div id="successModal" class="modal hidden" role="status" aria-live="polite"><div class="dialog"><h2>🎉 모두 정답입니다!</h2><p>잠시 후 자동평가 페이지로 이동합니다.</p></div></div><script>
const quiz=[
{q:'여행지에서 발표 자료를 만들려고 한다. 전원 콘센트가 없는 곳에서도 사용하기 편리한 컴퓨터는?',o:['데스크톱 컴퓨터','노트북 컴퓨터','서버 컴퓨터','슈퍼컴퓨터'],a:1},
{q:'온라인 게임에서 여러 사람이 동시에 접속하고 게임 정보를 주고받도록 서비스를 제공하는 컴퓨터는?',o:['태블릿 컴퓨터','데스크톱 컴퓨터','서버 컴퓨터','스마트폰'],a:2},
{q:'기상청에서 복잡한 계산을 많이 하여 날씨를 예측할 때 가장 알맞은 컴퓨터는?',o:['슈퍼컴퓨터','노트북 컴퓨터','스마트폰','태블릿 컴퓨터'],a:0},
{q:'컴퓨터의 발전 과정을 옛날부터 오늘날까지 바르게 나열한 것은?',o:['전자식 컴퓨터 → 주판 → 개인용 컴퓨터 → 인공지능','주판 → 기계식 계산기 → 전자식 컴퓨터 → 개인용 컴퓨터','개인용 컴퓨터 → 기계식 계산기 → 주판 → 전자식 컴퓨터','기계식 계산기 → 인공지능 → 주판 → 전자식 컴퓨터'],a:1},
{q:'1642년에 파스칼이 만든 계산기에 대한 설명으로 알맞은 것은?',o:['손가락으로 화면을 터치해 계산했다','인공지능으로 사람의 말을 이해했다','톱니바퀴를 이용하여 덧셈과 뺄셈을 했다','인터넷에 연결하여 정보를 검색했다'],a:2},
{q:'1940년대에 등장한 에니악(ENIAC)의 특징으로 알맞은 것은?',o:['주머니에 넣고 다닐 만큼 작았다','전기 없이 손으로 구슬을 움직였다','처음부터 집집마다 널리 사용되었다','방 하나를 채울 만큼 크지만 복잡한 계산을 빠르게 했다'],a:3},
{q:'1970~1980년대에 컴퓨터를 집과 학교에서도 사용할 수 있게 된 주된 까닭은?',o:['컴퓨터가 작아지고 가격이 낮아졌기 때문이다','컴퓨터가 모두 슈퍼컴퓨터로 바뀌었기 때문이다','컴퓨터가 전기를 전혀 사용하지 않게 되었기 때문이다','모든 컴퓨터에 전화 기능이 생겼기 때문이다'],a:0},
{q:'컴퓨터로 글을 입력하고, 그 글을 화면에서 확인한 다음, 종이로 출력하려고 한다. 알맞은 장치의 순서는?',o:['모니터 → 키보드 → 스피커','키보드 → 모니터 → 프린터','마우스 → 스피커 → 키보드','프린터 → 본체 → 마우스'],a:1},
{q:'컴퓨터의 본체에 대한 설명으로 가장 알맞은 것은?',o:['종이에 그림을 인쇄하는 장치이다','화면의 화살표를 움직이는 장치이다','CPU, 메모리, 저장 장치 등이 있어 정보를 처리하고 저장한다','음악과 목소리를 들려주는 장치이다'],a:2},
{q:'다음 중 컴퓨터의 종류와 사용 예가 바르게 연결되지 않은 것은?',o:['태블릿 컴퓨터 — 화면을 터치하며 전자책 읽기','스마트폰 — 사진을 찍고 길 찾기','서버 컴퓨터 — 여러 사용자에게 웹사이트 서비스 제공','슈퍼컴퓨터 — 주로 자판으로 짧은 문자 보내기'],a:3}
];
const selected=Array(quiz.length).fill(-1);let teacher=false;let completed=false;
const questions=document.getElementById('questions');
function render(){questions.innerHTML='';quiz.forEach((item,i)=>{const section=document.createElement('section');section.className='card';const heading=document.createElement('div');heading.className='question';heading.textContent=`${i+1}. ${item.q}`;section.append(heading);const choices=document.createElement('div');choices.className='choices';item.o.forEach((option,j)=>{const label=document.createElement('label');label.className='choice';const radio=document.createElement('input');radio.type='radio';radio.name=`q${i}`;radio.value=j;radio.checked=selected[i]===j;radio.addEventListener('change',()=>{selected[i]=j;document.getElementById(`feedback${i}`).textContent='';document.getElementById('result').textContent='';});const span=document.createElement('span');span.textContent=`${['①','②','③','④'][j]} ${option}`;label.append(radio,span);choices.append(label)});section.append(choices);const feedback=document.createElement('div');feedback.id=`feedback${i}`;feedback.className='feedback';feedback.setAttribute('aria-live','polite');section.append(feedback);questions.append(section)})}
function check(){if(completed)return;let correct=0;quiz.forEach((item,i)=>{const f=document.getElementById(`feedback${i}`);if(selected[i]===item.a){correct++;f.textContent='✓ 정답';f.className='feedback right'}else{f.textContent=selected[i]===-1?'⚠ 답을 선택하세요.':'✕ 틀렸습니다. 다시 생각해 보세요.';f.className='feedback wrong'}});document.getElementById('result').textContent=`${correct} / ${quiz.length}문제 정답`;if(correct===quiz.length){completed=true;document.getElementById('successModal').classList.remove('hidden');setTimeout(()=>{document.getElementById('successModal').classList.add('hidden');showAutoEvaluation()},2000)}}
function showAutoEvaluation(){document.getElementById('quiz').classList.add('hidden');document.getElementById('eval').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('check').addEventListener('click',check);const loginModal=document.getElementById('loginModal');document.getElementById('teacherBtn').addEventListener('click',()=>{if(teacher){teacher=false;selected.fill(-1);render();document.getElementById('teacherBtn').textContent='교사 로그인';return}loginModal.classList.remove('hidden');document.getElementById('password').focus()});document.getElementById('loginCancel').addEventListener('click',()=>loginModal.classList.add('hidden'));
async function login(){const input=document.getElementById('password').value;const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(input));const hash=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');if(hash==='d283fc7ed27a618f0d8e673ffbd01c18ba8d472f095f375f93576d3ed40c4782'){teacher=true;quiz.forEach((item,i)=>selected[i]=item.a);render();document.getElementById('teacherBtn').textContent='교사 로그아웃';loginModal.classList.add('hidden');document.getElementById('loginError').textContent='';document.getElementById('password').value=''}else{document.getElementById('loginError').textContent='비밀번호가 올바르지 않습니다.';document.getElementById('password').value=''}}document.getElementById('loginSubmit').addEventListener('click',login);document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});render();
</script></body></html>
