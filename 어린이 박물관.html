<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>어린이박물관 누리집 탐험</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fb;color:#18263b;font-family:'Malgun Gothic',sans-serif;line-height:1.65}header{background:linear-gradient(120deg,#2458ad,#168f9c);color:white;padding:32px 18px;text-align:center}h1{margin:0;font-size:clamp(24px,4vw,36px)}header p{margin:9px 0}.wrap{max-width:850px;margin:auto;padding:20px 14px 70px}.intro,.question,.result{background:white;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 4px 18px #15335a12}.intro a{display:inline-block;background:#fff;border:2px solid #2458ad;color:#2458ad;padding:10px 15px;border-radius:10px;text-decoration:none;font-weight:bold}.path{font-size:14px;color:#146b81;font-weight:700;margin-bottom:9px}.question h2{font-size:19px;margin:0 0 13px}.option{display:flex;gap:11px;align-items:flex-start;border:1px solid #dbe4ef;border-radius:11px;padding:11px 13px;margin:8px 0;cursor:pointer}.option:has(input:checked){background:#eaf3ff;border-color:#3776d6}.option input{width:20px;height:20px;flex-shrink:0;margin-top:3px;accent-color:#2467bc}.answer{width:100%;max-width:270px;padding:12px;border:1px solid #aebfd3;border-radius:10px;font-size:17px}.feedback{margin-top:10px;font-weight:bold}.correct{color:#147b46}.wrong{color:#c0392b}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}button{background:#2458ad;color:white;border:0;border-radius:12px;padding:14px 24px;font-size:17px;font-weight:bold;cursor:pointer}button.secondary{background:#64748b}.result{text-align:center;font-size:20px;font-weight:bold}.muted{color:#53647b;font-size:14px}.small{font-size:14px}header{position:relative;padding-top:65px}.teacher-entry{position:absolute;right:14px;top:12px;background:#ffffff20;border:1px solid #ffffff80;padding:7px 12px;font-size:13px}.teacher-dialog{border:0;border-radius:18px;padding:24px;width:min(90vw,360px);box-shadow:0 12px 50px #0004}.teacher-dialog::backdrop{background:#15243b88}.teacher-dialog h2{margin-top:0}.teacher-dialog input{width:100%;padding:12px;font-size:18px;border:1px solid #aebfd3;border-radius:8px;margin:8px 0}.teacher-dialog .actions button{font-size:14px;padding:10px 15px}.evaluation-modal{border:0;border-radius:22px;padding:32px;text-align:center;width:min(90vw,420px);box-shadow:0 12px 50px #0004}.evaluation-modal::backdrop{background:#15243b99}.evaluation-modal h2{color:#147b46;margin:0 0 12px}[hidden]{display:none!important}.question.is-wrong{outline:2px solid #c0392b}.question.is-correct{outline:2px solid #147b46}</style></head><body><header><button type="button" class="teacher-entry" id="teacherEntry">교사 로그인</button><h1>🔎 어린이박물관 누리집 탐험</h1><p>국어 · 누리집에서 필요한 정보 찾기</p></header><main class="wrap" id="quizPage"><section class="intro"><p>안내된 <b>정보를 찾을 곳</b>을 따라 누리집을 살펴보고 문제를 풀어 보세요.</p><a href="https://www.museum.go.kr/CHILD/" target="_blank" rel="noopener noreferrer">어린이박물관 누리집 열기 ↗</a><p class="muted">총 10문제 · 객관식, OX, 복수 선택, 빈칸 채우기</p></section><div id="questions"></div><div class="actions"><button id="grade">정답 확인하기</button><button class="secondary" id="reset">처음부터 다시 풀기</button></div><section class="result" id="result" hidden aria-live="polite"></section></main><main class="wrap" id="evaluationPage" hidden><section class="intro"><h2>자동평가</h2><p>모든 문제를 맞혔습니다. 아래에서 과제 참여 여부를 확인하세요.</p><button type="button" class="secondary" id="backToQuiz">문제로 돌아가기</button></section>
<!-- 자동평가: 6-7.친숙한 매체와 매체 자료에 흥미와 관심 가지기(박물관 누리집) -->
<div id="auto-evaluation-act-1795474377006" hidden style="margin:24px auto;max-width:1050px;">
<iframe title="과제 참여 여부 확인하기" src="https://eyeholder83-commits.github.io/sh0201/%ED%95%99%EA%B8%89%ED%86%B5%ED%95%A9%EA%B4%80%EB%A6%AC.html?autoActivity=act-1795474377006" loading="lazy" style="display:block;width:100%;height:650px;border:0;border-radius:16px;background:#f8fafc;" referrerpolicy="strict-origin-when-cross-origin"></iframe></div></main>
<dialog class="evaluation-modal" id="evaluationModal"><h2>🎉 축하합니다!</h2><p>10문제를 모두 맞혔습니다!</p><p>자동평가 페이지로 이동합니다.</p></dialog><dialog class="teacher-dialog" id="teacherDialog"><form id="teacherForm"><h2>교사 로그인</h2><label for="teacherPassword">비밀번호</label><input id="teacherPassword" type="password" inputmode="numeric" autocomplete="off" required><p id="teacherError" class="wrong" role="alert"></p><div class="actions"><button type="submit">로그인</button><button type="button" class="secondary" id="teacherCancel">취소</button></div></form></dialog><script>
const questions=[
{path:'「관람예약」 버튼',text:'어린이박물관을 단체로 예약하려면 최소 몇 명이 있어야 하나요?',options:['5명','10명','15명','20명','30명'],answer:[1]},
{path:'누리집의 맨 아래',text:'어린이박물관의 주소로 알맞은 것은 무엇인가요?',options:['서울특별시 종로구 사직로 161','서울특별시 용산구 서빙고로 137','서울특별시 중구 세종대로 99','서울특별시 송파구 올림픽로 300','서울특별시 성동구 왕십리로 222'],answer:[1]},
{path:'관람 → 자주하는 질문',text:'어린이박물관의 입장료는 얼마인가요?',options:['무료','1,000원','3,000원','5,000원','10,000원'],answer:[0]},
{path:'관람 → 자주하는 질문',text:'어린이박물관에서 사진을 찍을 수 있나요?',options:['O','X'],answer:[0]},
{path:'관람 → 시설안내',text:'어린이박물관은 3층까지 관람할 수 있습니다.',options:['O','X'],answer:[0]},
{path:'전시 → 상설전시',text:'다음 중 상설전시 안내에서 소개하는 유물이 아닌 것은 무엇인가요?',options:['앙부일구','휴대용 앙부일구','천상열차분야지도','경천사 십층석탑','앙부일구와 휴대용 앙부일구 모두'],answer:[3]},
{path:'교육 → 전체프로그램',text:'다음 중 어린이(6~13세)가 참여 대상으로 안내된 교육 프로그램을 모두 고르세요.',options:['어린이박물관 현장 이해와 대화','2026 문화다양성 교육매개자 밋업','튼튼먹거리 탐험대','2026년 어린이박물관 심포지엄','문화다양성 「모두! ABCD」 플랫폼 활용 자율 교육'],answer:[2,4],multi:true},
{path:'자료 → 동영상',text:'경천사 십층석탑에 대한 설명으로 옳지 않은 것은 무엇인가요?',options:['높이가 13.5m이다.','대리석으로 만들어졌다.','일본에 빼앗겼다가 되찾았다.','현재 경복궁 앞마당에 있다.','현재 국립중앙박물관에 전시되어 있다.'],answer:[3]},
{path:'자료 → 동영상',text:'경천사 십층석탑을 일본에서 되찾을 수 있었던 이유는 무엇인가요?',options:['일본이 새로운 탑을 만들었기 때문이다.','우리나라 국민과 언론인들이 약탈 사실을 알리고 반환을 요구했기 때문이다.','탑이 너무 무거워서 일본이 보관할 수 없었기 때문이다.','일본이 탑을 다른 나라에 팔았기 때문이다.','일본이 탑을 스스로 버렸기 때문이다.'],answer:[1]},
{path:'소개 → 어린이박물관 소개',text:'다음 문장의 빈칸에 들어갈 말을 각각 쓰세요. 어린이박물관은 어린이들이 우리의 역사·문화를 바탕으로 다양한 ( ㉠ )과 ( ㉡ )를 할 수 있는 공간이다.',blanks:['체험','놀이']}
];
const host=document.getElementById('questions');questions.forEach((q,i)=>{const sec=document.createElement('section');sec.className='question';sec.id='q'+i;let html=`<div class="path">🔎 정보를 찾을 곳: ${q.path}</div><h2>${i+1}. ${q.text}</h2>`;if(q.options){if(q.multi)html+='<p class="small muted">정답을 모두 선택하세요. (복수 선택)</p>';q.options.forEach((opt,j)=>{const mark=q.options.length===2?['O','X'][j]:['①','②','③','④','⑤'][j];html+=`<label class="option"><input type="${q.multi?'checkbox':'radio'}" name="q${i}" value="${j}"><span>${mark} ${opt}</span></label>`})}else{html+='<p><label>㉠ <input class="answer" data-blank="0" placeholder="첫 번째 낱말" autocomplete="off"></label></p><p><label>㉡ <input class="answer" data-blank="1" placeholder="두 번째 낱말" autocomplete="off"></label></p>'}html+='<div class="feedback" aria-live="polite"></div>';sec.innerHTML=html;host.appendChild(sec)});
function grade(){let correct=0,firstWrong=null;questions.forEach((q,i)=>{const sec=document.getElementById('q'+i);let ok;if(q.options){const picked=[...sec.querySelectorAll('input:checked')].map(x=>Number(x.value)).sort((a,b)=>a-b);ok=JSON.stringify(picked)===JSON.stringify(q.answer)}else{const inputs=[...sec.querySelectorAll('[data-blank]')];ok=inputs.every((x,j)=>x.value.replace(/\s/g,'')===q.blanks[j])}const feedback=sec.querySelector('.feedback');feedback.className='feedback '+(ok?'correct':'wrong');feedback.textContent=ok?'✓ 정답':'✗ 오답';sec.classList.toggle('is-correct',ok);sec.classList.toggle('is-wrong',!ok);if(ok)correct++;else if(firstWrong===null)firstWrong=sec});const result=document.getElementById('result');result.hidden=false;result.textContent=correct===questions.length?'🎉 축하합니다! 10문제를 모두 맞혔습니다!':`10문제 중 ${correct}문제를 맞혔습니다. 틀린 문제를 다시 확인해 보세요.`;if(correct===questions.length){showAutoEvaluation();}else if(firstWrong){firstWrong.scrollIntoView({behavior:'smooth',block:'center'});}}
document.getElementById('grade').addEventListener('click',grade);document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('#questions input').forEach(x=>{if(x.type==='checkbox'||x.type==='radio')x.checked=false;else x.value=''});document.querySelectorAll('.feedback').forEach(x=>{x.textContent='';x.className='feedback'});document.getElementById('result').hidden=true;window.scrollTo({top:0,behavior:'smooth'})});

let evaluationTimer;
function hideAutoEvaluation(){clearTimeout(evaluationTimer);const modal=document.getElementById('evaluationModal');if(modal.open)modal.close();document.getElementById('evaluationPage').hidden=true;document.getElementById('auto-evaluation-act-1795474377006').hidden=true;document.getElementById('quizPage').hidden=false;}
function showAutoEvaluation(){document.getElementById('quizPage').hidden=true;document.getElementById('evaluationPage').hidden=false;const area=document.getElementById('auto-evaluation-act-1795474377006');area.hidden=false;window.scrollTo({top:0,behavior:'instant'});const modal=document.getElementById('evaluationModal');if(!modal.open)modal.showModal();clearTimeout(evaluationTimer);evaluationTimer=setTimeout(()=>{if(modal.open)modal.close();},2000);}
document.getElementById('evaluationModal').addEventListener('cancel',e=>e.preventDefault());
document.getElementById('backToQuiz').addEventListener('click',()=>{hideAutoEvaluation();window.scrollTo({top:0,behavior:'smooth'});});
document.getElementById('reset').addEventListener('click',()=>{hideAutoEvaluation();clearFeedback();});
const teacherEntry=document.getElementById('teacherEntry');
const teacherDialog=document.getElementById('teacherDialog');
const teacherPassword=document.getElementById('teacherPassword');
const teacherError=document.getElementById('teacherError');
let teacherMode=false;
function clearFeedback(){document.querySelectorAll('.question').forEach(x=>x.classList.remove('is-correct','is-wrong'));document.querySelectorAll('.feedback').forEach(x=>{x.textContent='';x.className='feedback'});document.getElementById('result').hidden=true;}
function fillTeacherAnswers(){hideAutoEvaluation();questions.forEach((q,i)=>{const sec=document.getElementById('q'+i);if(q.options){sec.querySelectorAll('input').forEach(x=>{x.checked=q.answer.includes(Number(x.value))})}else{sec.querySelectorAll('[data-blank]').forEach((x,j)=>{x.value=q.blanks[j]})}});clearFeedback();}
teacherEntry.addEventListener('click',()=>{if(teacherMode){teacherMode=false;teacherEntry.textContent='교사 로그인';document.getElementById('reset').click();return;}teacherPassword.value='';teacherError.textContent='';teacherDialog.showModal();teacherPassword.focus();});
document.getElementById('teacherCancel').addEventListener('click',()=>teacherDialog.close());
teacherDialog.addEventListener('close',()=>{teacherPassword.value='';teacherError.textContent='';});
document.getElementById('teacherForm').addEventListener('submit',async e=>{e.preventDefault();try{const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(teacherPassword.value));const digest=Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');if(digest!=='d283fc7ed27a618f0d8e673ffbd01c18ba8d472f095f375f93576d3ed40c4782'){teacherError.textContent='비밀번호가 올바르지 않습니다.';teacherPassword.select();return;}teacherMode=true;teacherEntry.textContent='교사 모드 · 로그아웃';teacherDialog.close();fillTeacherAnswers();}catch(err){teacherError.textContent='HTTPS 환경에서 페이지를 열어 주세요.';}});
</script></body></html>
