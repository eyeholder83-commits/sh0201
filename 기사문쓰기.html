function newAttempt() {
  return pages.map(({ questions }) => {
    const shuffled = [...questions];
    for (let index = shuffled.length - 1; index > 0; index--) {
      const other = Math.floor(Math.random() * (index + 1));
      [shuffled[index], shuffled[other]] = [shuffled[other], shuffled[index]];
    }
    return { questions: shuffled, current: 0, correct: false };
  });
}

function isComplete(index) {
  return teacherSelections
    ? teacherCompleted.has(index)
    : saved[index].current === saved[index].questions.length;
}

function updateCompletion() {
  for (const button of pageButtons) {
    const index = Number(button.dataset.page);
    const complete = isComplete(index);
    button.toggleAttribute("data-complete", complete);
    button.setAttribute("aria-label", button.textContent + (complete ? " 완료" : ""));
  }
  evaluationButton.hidden = !pages.every((_, index) => isComplete(index));
  if (evaluationButton.hidden) evaluationFrame.removeAttribute("src");
}

function showAutoEvaluation(announce = false) {
  if (!pages.every((_, index) => isComplete(index))) return;
  quiz.hidden = finish.hidden = teacherTest.hidden = heading.hidden = true;
  notice.textContent = "";
  for (const button of pageButtons) button.removeAttribute("aria-current");
  evaluation.hidden = false;
  if (!evaluationFrame.hasAttribute("src")) evaluationFrame.src = evaluationFrame.dataset.src;
  const title = document.querySelector("#evaluation-heading");
  title.focus();
  if (announce) {
    completionDialog.showModal();
    setTimeout(() => {
      if (completionDialog.open) completionDialog.close();
    }, 2000);
  }
}

evaluationButton.addEventListener("click", () => showAutoEvaluation());
document.querySelector("#close-completion").addEventListener("click", () => completionDialog.close());

function showQuestion(moveFocus) {
  const [situation, titles, answer, explanation] = questions[current];
  count.textContent = (current + 1) + " / " + questions.length + " 문제";
  progress.value = current;
  story.textContent = pages[page].prompt ?? situation;
  choices.replaceChildren();
  choices.classList.toggle("long", page >= 2);
  feedback.textContent = "";
  next.hidden = true;
  next.textContent = current === questions.length - 1 ? "결과 보기" : "다음 문제";
  const state = saved[page];

  titles.forEach((title, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "choice";
    const label = ["①", "②", "③"][index];
    if (page >= 2) {
      const number = document.createElement("span");
      number.textContent = label;
      const passage = document.createElement("span");
      passage.textContent = title;
      button.append(number, passage);
    } else {
      button.textContent = label + " " + title;
    }
    button.addEventListener("click", () => {
      if (index !== answer) {
        saved = newAttempt();
        showPage(0, true);
        notice.textContent = "틀렸어요. 모든 페이지의 풀이가 초기화됐어요. 처음부터 다시 풀어 보세요.";
        return;
      }
      notice.textContent = "";
      state.correct = true;
      button.classList.add("right");
      for (const choice of choices.children) choice.disabled = true;
      progress.value = current + 1;
      feedback.textContent = "맞았어요! " + explanation;
      next.hidden = false;
      next.focus();
    });
    choices.append(button);
  });
  if (state.correct) {
    choices.children[answer].classList.add("right");
    for (const choice of choices.children) choice.disabled = true;
    feedback.textContent = "맞았어요! " + explanation;
    progress.value = current + 1;
    next.hidden = false;

  }
  if (moveFocus) story.focus();
}

next.addEventListener("click", () => {
  saved[page].current = ++current;
  saved[page].correct = false;
  if (current < questions.length) {
    showQuestion(true);
    return;
  }
  updateCompletion();
  if (!evaluationButton.hidden) showAutoEvaluation(true);
  else showResult(true);
});

function showResult(moveFocus) {
  quiz.hidden = true;
  finish.hidden = false;
  score.textContent = "완료한 페이지 " + pages.filter((_, index) => isComplete(index)).length + " / " + pages.length;
  openNext.hidden = page === pages.length - 1;
  if (!openNext.hidden) openNext.textContent = pageButtons[page + 1].textContent + " 풀기";
  const resultTitle = document.querySelector("#done");
  resultTitle.textContent = questions.length + "문제를 모두 맞혔어요!";
  if (moveFocus) resultTitle.focus();
}

function showPage(index, moveFocus) {
  page = index;
  questions = saved[page].questions;
  progress.max = questions.length;
  ({ current } = saved[page]);
  evaluation.hidden = true;
  heading.hidden = false;
  updateCompletion();
  document.querySelector("#page-number").textContent = (page + 1) + "페이지";
  document.querySelector("#page-title").textContent = pages[page].title;
  document.querySelector("#page-guide").textContent = pages[page].guide;
  for (const button of pageButtons) {
    if (Number(button.dataset.page) === page) button.setAttribute("aria-current", "page");
    else button.removeAttribute("aria-current");
  }
  teacherTest.hidden = !teacherSelections;
  if (teacherSelections) {
    quiz.hidden = true;
    finish.hidden = true;
    showTeacherQuestions();
    if (moveFocus) teacherQuestions.querySelector("input").focus();
    return;
  }
  if (current === questions.length) {
    showResult(moveFocus);
    return;
  }
  finish.hidden = true;
  quiz.hidden = false;
  showQuestion(moveFocus);
}

for (const button of pageButtons) {
  button.addEventListener("click", () => showPage(Number(button.dataset.page), true));
}
openNext.addEventListener("click", () => showPage(page + 1, true));
document.querySelector("#restart").addEventListener("click", () => {
  saved[page] = newAttempt()[page];
  showPage(page, true);
});

function showTeacherQuestions() {
  teacherQuestions.replaceChildren();
  teacherResult.textContent = teacherCompleted.has(page) ? "이 페이지를 완료했어요." : "";
  questions.forEach(([situation, options], questionIndex) => {
    const group = document.createElement("fieldset");
    const legend = document.createElement("legend");
    legend.textContent = (questionIndex + 1) + ". " + (pages[page].prompt ?? situation);
    group.append(legend);
    options.forEach((option, optionIndex) => {
      const label = document.createElement("label");
      const input = document.createElement("input");
      input.type = "radio";
      input.name = "question-" + questionIndex;
      input.checked = teacherSelections[page][questionIndex] === optionIndex;
      input.addEventListener("change", () => {
        teacherSelections[page][questionIndex] = optionIndex;
        teacherCompleted.delete(page);
        updateCompletion();
        teacherResult.textContent = "";
      });
      label.append(input, document.createTextNode(option));
      group.append(label);
    });
    teacherQuestions.append(group);
  });
}

teacherForm.addEventListener("submit", (event) => {
  event.preventDefault();
  const wrong = questions.flatMap((question, index) =>
    teacherSelections[page][index] === question[2] ? [] : [index + 1]
  );
  if (wrong.length) {
    teacherCompleted.clear();
    const message = "틀린 문제 " + wrong.join(", ") + "번. 모든 페이지의 완료 표시가 초기화됐어요.";
    updateCompletion();
    teacherResult.textContent = message;
    return;
  }
  teacherCompleted.add(page);
  updateCompletion();
  teacherResult.textContent = questions.length + "문제를 모두 맞혔어요!";
  if (!evaluationButton.hidden) showAutoEvaluation(true);
});

teacherButton.addEventListener("click", () => {
  if (teacherSelections) {
    teacherSelections = null;
    teacherCompleted.clear();
    teacherQuestions.replaceChildren();
    teacherButton.textContent = "교사 로그인";
    showPage(page, false);
    return;
  }
  password.value = "";
  loginError.textContent = "";
  loginDialog.showModal();
});

document.querySelector("#login-cancel").addEventListener("click", () => loginDialog.close());
loginDialog.addEventListener("close", () => { password.value = ""; });
document.querySelector("#login-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const bytes = new TextEncoder().encode("news-quiz:" + password.value);
  if (!globalThis.crypto?.subtle) {
    loginError.textContent = "파일을 브라우저에서 직접 열거나 HTTPS 주소에서 열어 주세요.";
    return;
  }
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  if (!loginDialog.open) return;
  const hash = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, "0")).join("");
  if (hash !== "b942fb30efb8a95c55ac56be30c6043d55afe86d8526255bbfa827ab046a652e") {
    loginError.textContent = "비밀번호를 다시 확인해 주세요.";
    password.select();
    return;
  }
  teacherSelections = saved.map(({ questions }) => questions.map(question => question[2]));
  teacherButton.textContent = "로그아웃";
  loginDialog.close();
  showPage(page, true);
});

showPage(0, false);
</script>
</body>
</html>
